/* ============================================================================
 * Pocket GM — Hockey
 * Sibling of ~/soccer-gm and ~/baseball-gm. One file, one `G` state object.
 * The engine is deliberately NOT the soccer xG model: shots are generated per
 * forward-line vs defence-pair matchup across a 60-minute shift budget, which
 * is what makes line construction, matchups and last change matter.
 * ========================================================================== */

/* --------------------------------- world ---------------------------------- */

const TEAMS = [

  { city:"Madison",     name:"Mallards",    abbr:"MAD", conf:1, div:2, mkt:2 },

  { city:"Fargo",       name:"Frost",       abbr:"FAR", conf:1, div:2, mkt:1 },
  { city:"Tulsa",       name:"Twisters",    abbr:"TUL", conf:1, div:2, mkt:2 },
  { city:"Kansas City", name:"Monarchs",    abbr:"KC",  conf:1, div:2, mkt:3 },
  // West / Pacific
  { city:"Boise",       name:"Bighorns",    abbr:"BOI", conf:1, div:3, mkt:2 },
  { city:"Spokane",     name:"Summit",      abbr:"SPO", conf:1, div:3, mkt:2 },
  { city:"Reno",        name:"Silver",      abbr:"RNO", conf:1, div:3, mkt:2 },
  { city:"Fresno",      name:"Falcons",     abbr:"FRE", conf:1, div:3, mkt:2 },
  { city:"Bakersfield", name:"Bandits",     abbr:"BAK", conf:1, div:3, mkt:1 },
  { city:"Victoria",    name:"Vipers",      abbr:"VIC", conf:1, div:3, mkt:3 },
  { city:"Anchorage",   name:"Aurora",      abbr:"ANC", conf:1, div:3, mkt:1 },
  { city:"Eugene",      name:"Emeralds",    abbr:"EUG", conf:1, div:3, mkt:2 },
];
const CONFS = ["East", "West"];
const DIVS  = ["Atlantic", "Metro", "Central", "Pacific"];
const DIV_CONF = [0, 0, 1, 1];

const FIRST = ["Alex","Mikko","Nathan","Elias","Cole","Tomas","Jakob","Rasmus","Liam","Dylan",
  "Anton","Nikita","Marcus","Owen","Brady","Sebastian","Viktor","Emil","Connor","Trevor",
  "Hugo","Patrik","Lucas","Mason","Kirill","Joel","Adam","Simon","Ryan","Felix","Otto",
  "Dawson","Casey","Jonas","Andrei","Tage","Wyatt","Lars","Miles","Quinn","Rory","Beau",
  "Matias","Teddy","Zach","Nolan","Isak","Gustav","Sam","Denis","Brock","Kaden","Petr","Levi"];
const LAST = ["Hedman","Barlow","Voss","Lindqvist","Bergeron","Novak","Kessel","Rahkonen","Mackey",
  "Turcotte","Strand","Petrov","Halloran","Sundin","Kane","Duchesne","Rask","Nilsson","O'Hara",
  "Belanger","Larkin","Sokolov","Beaumont","Vasko","Hagen","Trudeau","Kaplan","Forsberg","Delisle",
  "Kovac","Ahlberg","Marchand","Riis","Denault","Volkov","Steen","Bouchard","Lehto","Grimaldi",
  "Ackerman","Poulin","Wallin","Cormier","Radulov","Fennell","Sorenson","Dubois","Malkov","Tanev",
  "Aho","Brodeur","Vlasic","Kubina","Renaud","Salo","Whitaker","Zima","Gagne","Holt","Sandberg"];

/* skater positions and how many of each a roster carries */
const POS = ["C", "LW", "RW", "D", "G"];
const ROSTER_SHAPE = { C: 4, LW: 4, RW: 4, D: 7, G: 2 };  // 21 dressed + scratches from depth
const ROSTER_MAX = 23;
const FARM_MAX = 12;

/* ------------------------------ rules & money ----------------------------- */

const RULES_DEFAULT = {
  seasonLen: 82,        // 82 | 56 | 41
  otLoserPoint: true,   // the loser point
  otFormat: "3on3",     // 3on3 | 5on5 | none  (none => ties)
  shootout: true,
  playoffFormat: "divisional", // divisional (3+3+2 wildcards) | seeded (1-8)
  seriesLen: 7,         // 7 | 5
  hardCap: true,
  capAmount: 88,        // $M
  retainedSalary: true,
  injuries: "normal",   // low | normal | high
  fighting: true,
};
// Knobs that change the shape of a season must wait for the rollover.
const STRUCTURAL_RULES = ["seasonLen", "playoffFormat", "seriesLen"];

const DIFFICULTIES = {
  casual:    { label:"Casual",    budget:1.15, askPrice:0.9,  injury:0.75, patience:2.0 },
  normal:    { label:"Normal",    budget:1.0,  askPrice:1.0,  injury:1.0,  patience:1.0 },
  cutthroat: { label:"Cutthroat", budget:0.9,  askPrice:1.15, injury:1.25, patience:0.55 },
};

const CAP_FLOOR_PCT = 0.76;
const MIN_SALARY = 0.78;
const ELC_SALARY = 0.95;   // entry-level contract
const MAX_SALARY_PCT = 0.20;

function rules(G) { return Object.assign({}, RULES_DEFAULT, (G && G.rules) || {}); }
function ruleValue(G, k) {
  if (G && G.pendingRules && k in G.pendingRules) return G.pendingRules[k];
  return rules(G)[k];
}
function setRule(G, k, v) {
  if (STRUCTURAL_RULES.includes(k)) { G.pendingRules = G.pendingRules || {}; G.pendingRules[k] = v; }
  else { G.rules = Object.assign({}, G.rules); G.rules[k] = v; }
  return G;
}
function applyPendingRules(G) {
  if (!G.pendingRules) return;
  G.rules = Object.assign({}, rules(G), G.pendingRules);
  G.pendingRules = null;
}
function diff(G) { return DIFFICULTIES[(G && G.difficulty) || "normal"]; }

/* --------------------------------- random --------------------------------- */
// Seeded so the headless harness reproduces a season exactly.
function rnd(G) {
  G.seed = (G.seed + 0x6d2b79f5) | 0;
  let t = G.seed;
  t = Math.imul(t ^ (t >>> 15), t | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
const ri = (G, a, b) => a + Math.floor(rnd(G) * (b - a + 1));
const pick = (G, arr) => arr[Math.floor(rnd(G) * arr.length)];
// Roughly normal, clamped — used for ratings and game variance.
function gauss(G, mean, sd) {
  const u = Math.max(1e-9, rnd(G)), v = rnd(G);
  return mean + sd * Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
}
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const round1 = (v) => Math.round(v * 10) / 10;

/* -------------------------------- players --------------------------------- */
/* Skater ratings: sht shooting, pss passing, hnd hands, spd skating,
   dfn defence, phy physical, fo faceoffs (C only), sta stamina, dur durability.
   Goalie ratings: rfx reflexes, pos positioning, reb rebound control, sta, dur. */

const SKATER_KEYS = ["sht", "pss", "hnd", "spd", "dfn", "phy", "fo", "sta", "dur"];
const GOALIE_KEYS = ["rfx", "pos", "reb", "sta", "dur"];

function ovrOf(p) {
  const r = p.r;
  if (p.pos === "G") return Math.round(0.42 * r.rfx + 0.4 * r.pos + 0.18 * r.reb);
  if (p.pos === "D") return Math.round(0.34 * r.dfn + 0.16 * r.phy + 0.16 * r.spd + 0.14 * r.pss + 0.12 * r.hnd + 0.08 * r.sht);
  // forwards
  const fo = p.pos === "C" ? 0.06 : 0;
  return Math.round((0.3 * r.sht + 0.22 * r.pss + 0.18 * r.hnd + 0.14 * r.spd + 0.1 * r.dfn + fo * r.fo) / (0.94 + fo) );
}

function genPlayer(G, pos, tier, age) {
  const base = clamp(gauss(G, tier, 7), 24, 96);
  const p = {
    id: G.nextPid++,
    fn: pick(G, FIRST), ln: pick(G, LAST),
    pos,
    age: age != null ? age : ri(G, 19, 35),
    teamId: null, farm: false,
    r: {}, pot: 0, ovr: 0,
    contract: { amt: MIN_SALARY, yrs: 1 },
    stats: blankStats(pos), season: blankStats(pos), career: [],
    inj: 0, injDesc: "", fatigue: 0,
    shoots: "L",
    trophies: [],
  };
  // The league is roughly 62% left-shooting, and that mix is the stated reason
  // goalies concede more glove side.
  p.shoots = rnd(G) < 0.62 ? "L" : "R";
  const keys = pos === "G" ? GOALIE_KEYS : SKATER_KEYS;
  keys.forEach((k) => { p.r[k] = Math.round(clamp(gauss(G, base, 8), 20, 99)); });
  if (pos !== "C") p.r.fo = Math.round(clamp(p.r.fo * 0.6, 15, 70));
  if (pos === "D") { p.r.dfn = Math.round(clamp(p.r.dfn + 8, 20, 99)); p.r.sht = Math.round(clamp(p.r.sht - 8, 15, 99)); }
  p.ovr = ovrOf(p);
  // Younger players carry upside; a 30-year-old is what he is.
  p.pot = Math.round(clamp(p.ovr + Math.max(0, (26 - p.age)) * gauss(G, 1.5, 1.1), p.ovr, 99));
  return p;
}

/* Where a player's shots come from, and how many of them go in. Skaters record
   shots/goals per zone, goalies record shots faced/saved — the same three
   buckets from both sides of the puck. */
const ZONE_KEYS = ["rush", "cycle", "point"];
function blankZones(pos) {
  const z = {};
  ZONE_KEYS.forEach((k) => { z[k] = pos === "G" ? { sa: 0, sv: 0 } : { s: 0, g: 0 }; });
  return z;
}

/* Where in the net the puck went. Nine cells seen from the shooter's side, the
   same shape as a penalty-placement chart: the corners are the hard ones to
   stop, centre mass is the easy one, and the five-hole is its own answer.
   `save` is added to the goalie's save percentage for a shot placed there. */
/* Calibrated against public NHL shot-target work rather than invented. Two facts
   drive the whole table, and they pull in opposite directions:
     - most SHOTS are low — along the ice, the 3/4/5 holes;
     - most GOALS are high — about 67% of 5v5 goals go in above the pads, with
       top glove alone worth ~21% and high blocker ~15%, five-hole ~14%.
   So `w` (how often it's aimed at) is low-heavy while `save` (how stoppable it
   is once it gets there) makes the top corners lethal. Goalies genuinely concede
   more glove side, which is why GH is the softest cell in the net. */
const NET_CELLS = [
  { key: "GH", col: 0, row: 0, label: "glove high",   corner: true,  w: 0.06, save: -0.205 },
  { key: "MH", col: 1, row: 0, label: "top shelf",    corner: false, w: 0.06, save: -0.030 },
  { key: "BH", col: 2, row: 0, label: "blocker high", corner: true,  w: 0.06, save: -0.140 },
  { key: "GM", col: 0, row: 1, label: "glove side",   corner: false, w: 0.08, save: -0.010 },
  { key: "MM", col: 1, row: 1, label: "centre mass",  corner: false, w: 0.14, save: +0.066 },
  { key: "BM", col: 2, row: 1, label: "blocker side", corner: false, w: 0.08, save: -0.005 },
  { key: "GL", col: 0, row: 2, label: "glove low",    corner: true,  w: 0.15, save: +0.036 },
  { key: "FH", col: 1, row: 2, label: "five-hole",    corner: false, w: 0.22, save: +0.038 },
  { key: "BL", col: 2, row: 2, label: "blocker low",  corner: true,  w: 0.15, save: +0.042 },
];
const NET_KEYS = NET_CELLS.map((c) => c.key);
function blankNet(pos) {
  const n = {};
  NET_KEYS.forEach((k) => { n[k] = pos === "G" ? { sa: 0, ga: 0 } : { a: 0, g: 0 }; });
  return n;
}
// Every goalie has one spot he doesn't cover as well, fixed for his career so a
// scouting report on him means something.
function goalieHole(p) { return NET_CELLS[(p.id * 7919) % NET_CELLS.length]; }
// Every shooter has a spot he goes back to, fixed for his career — it's what
// makes one winger's chart look different from another's.
function shooterSpot(p) { return NET_CELLS[(p.id * 6151) % NET_CELLS.length]; }

/* Where he's trying to put it. The league-wide base is `w`; a player bends it
   three ways — hands (can he elevate at all?), handedness (a left shot coming
   off the right wing opens up the glove side, which is the stated cause of the
   real glove-side bias), and his own favourite corner. */
function pickCell(G, shooter) {
  const acc = clamp((shooter.r.hnd * 0.6 + shooter.r.sht * 0.4 - 38) / 55, 0, 1);
  const fav = shooterSpot(shooter);
  const lefty = shooter.shoots !== "R";
  const w = NET_CELLS.map((c) => {
    let x = c.w;
    // Hands decide whether the puck gets up at all: a sniper lifts it, a
    // grinder puts it into the chest and the pads.
    if (c.row === 0) x *= 0.45 + acc * 1.25;
    else if (c.key === "MM") x *= 1.55 - acc * 0.95;
    else if (c.row === 2 && !c.corner) x *= 1.2 - acc * 0.35;
    // Off-wing angle.
    if (c.col === 0) x *= lefty ? 1.12 : 0.94;
    if (c.col === 2) x *= lefty ? 0.94 : 1.12;
    if (c.key === fav.key) x *= 1.55;
    return x;
  });
  const tot = w.reduce((a, b) => a + b, 0);
  let x = rnd(G) * tot;
  for (let i = 0; i < NET_CELLS.length; i++) { x -= w[i]; if (x <= 0) return NET_CELLS[i]; }
  return NET_CELLS[4];
}
function blankStats(pos) {
  return pos === "G"
    ? { gp:0, w:0, l:0, otl:0, sa:0, sv:0, ga:0, so:0, toi:0, sow:0, sol:0, sosa:0, sosv:0, starts:0,
        z: blankZones("G"), net: blankNet("G") }
    : { gp:0, g:0, a:0, pim:0, sog:0, hit:0, blk:0, toi:0, pm:0, fow:0, fol:0, ppg:0, shg:0, gwg:0,
        eng:0, fights:0, sos:0, soa:0, att:0, miss:0, blkd:0,
        z: blankZones("S"), net: blankNet("S") };
}
// Merge a per-game bucket map (zones or net cells) into a season total.
function addBuckets(dest, src, field, keys, kind) {
  if (!src) return;
  if (!dest[field]) dest[field] = field === "z" ? blankZones(kind) : blankNet(kind);
  keys.forEach((k) => {
    if (!src[k]) return;
    Object.keys(src[k]).forEach((f) => { dest[field][k][f] = (dest[field][k][f] || 0) + src[k][f]; });
  });
}
const addZones = (dest, src) => addBuckets(dest, src, "z", ZONE_KEYS, dest.sa != null ? "G" : "S");
const addNet = (dest, src) => addBuckets(dest, src, "net", NET_KEYS, dest.sa != null ? "G" : "S");
const pts = (s) => (s.g || 0) + (s.a || 0);
const svPct = (s) => (s.sa ? s.sv / s.sa : 0);
const gaa = (s) => (s.toi ? (s.ga * 60) / s.toi : 0);

const fullName = (p) => `${p.fn} ${p.ln}`;
const shortName = (p) => `${p.fn[0]}. ${p.ln}`;

/* --------------------------- contracts & the cap --------------------------- */

function marketValue(G, p) {
  const o = p.ovr, y = p.pot - p.ovr;
  let v = Math.pow(Math.max(0, o - 45) / 22, 2.35) * 1.05 + MIN_SALARY;
  if (p.pos === "G") v *= 0.92;
  if (p.age < 24) v *= 0.88 + y * 0.012;
  if (p.age > 32) v *= Math.max(0.45, 1 - (p.age - 32) * 0.11);
  return round1(clamp(v, MIN_SALARY, rules(G).capAmount * MAX_SALARY_PCT));
}
/* Retained salary. A club can keep part of a contract it trades away, which is
   what lets a cap-strapped buyer take on a star — and it stays on the seller's
   books for the full remaining term, which is the cost. */
const MAX_RETAINED = 3;
const RETAIN_MAX_PCT = 0.5;
const retainedBy = (G, teamId) => (G.retained || []).filter((r) => r.from === teamId);
const retainedOn = (G, pid) => (G.retained || []).filter((r) => r.pid === pid);
// What a player actually costs the club that rosters him.
function effectiveCap(G, p) {
  return Math.max(0, round1(p.contract.amt - retainedOn(G, p.id).reduce((s, r) => s + r.amt, 0)));
}
function capHit(G, teamId) {
  const roster = rosterOf(G, teamId, true).reduce((s, p) => s + effectiveCap(G, p), 0);
  const dead = retainedBy(G, teamId).reduce((s, r) => s + r.amt, 0);
  return round1(roster + dead);
}
function capSpace(G, teamId) { return round1(rules(G).capAmount - capHit(G, teamId)); }
function capFloor(G) { return round1(rules(G).capAmount * CAP_FLOOR_PCT); }

/* --------------------------------- rosters -------------------------------- */

const playersOf = (G) => Object.values(G.players);
function rosterOf(G, teamId, includeFarm) {
  return playersOf(G).filter((p) => p.teamId === teamId && (includeFarm || !p.farm));
}
const activeRoster = (G, teamId) => rosterOf(G, teamId).filter((p) => p.inj <= 0);
const teamOf = (G, teamId) => G.teams[teamId];

/* ----------------------------- lines & pairings ---------------------------- */
/* lines.F : 4 lines of [LW, C, RW] player ids
   lines.D : 3 pairs of [LD, RD]
   lines.G : [starter, backup]
   lines.PP: 2 units of 5, lines.PK: 2 units of 4 */

const LINE_TOI = [0.30, 0.27, 0.24, 0.19];   // share of even-strength forward ice time
const PAIR_TOI = [0.38, 0.34, 0.28];

function autoLines(G, teamId) {
  const r = activeRoster(G, teamId).slice().sort((a, b) => b.ovr - a.ovr);
  const byPos = (pos) => r.filter((p) => p.pos === pos);
  const cs = byPos("C"), lws = byPos("LW"), rws = byPos("RW"), ds = byPos("D");
  // If both goaltenders are hurt, somebody still has to stand in the crease:
  // recall from the farm, then dress the least-injured body available.
  let gs = byPos("G");
  if (!gs.length) gs = rosterOf(G, teamId, true).filter((p) => p.pos === "G").sort((a, b) => a.inj - b.inj);
  if (!gs.length) gs = r.slice(-1);
  // A short bench borrows from the nearest position rather than icing an empty slot.
  const spare = r.filter((p) => p.pos !== "G" && p.pos !== "D");
  const take = (arr, i) => arr[i] || spare[i + 8] || spare[spare.length - 1] || r[0];
  const F = [0, 1, 2, 3].map((i) => [take(lws, i), take(cs, i), take(rws, i)].map((p) => (p ? p.id : null)));
  const D = [0, 1, 2].map((i) => [ds[i * 2], ds[i * 2 + 1]].map((p) => (p ? p.id : (ds[0] ? ds[0].id : null))));
  const Gk = [gs[0] ? gs[0].id : null, gs[1] ? gs[1].id : null];
  const skaters = r.filter((p) => p.pos !== "G");
  const PP = [skaters.slice(0, 5).map((p) => p.id), skaters.slice(5, 10).map((p) => p.id)];
  const pkPool = skaters.slice().sort((a, b) => b.r.dfn - a.r.dfn);
  const PK = [pkPool.slice(0, 4).map((p) => p.id), pkPool.slice(4, 8).map((p) => p.id)];
  return { F, D, G: Gk, PP, PK };
}
function ensureLines(G, teamId) {
  const t = G.teams[teamId];
  const ids = new Set(activeRoster(G, teamId).map((p) => p.id));
  const valid = t.lines && t.lines.F.every((ln) => ln.every((id) => id != null && ids.has(id)))
    && t.lines.D.every((pr) => pr.every((id) => id != null && ids.has(id)))
    && t.lines.G[0] != null && ids.has(t.lines.G[0]);
  if (!valid) t.lines = autoLines(G, teamId);
  return t.lines;
}

const LINE_CHEM_MAX_GAMES = 10;    // games together before the chemistry bonus caps out
const LINE_CHEM_PER_GAME = 0.006;  // lineOff multiplier per game of continuity

/* Rewards keeping a forward line intact from game to game: each consecutive
   game together nudges its offence up, capped at LINE_CHEM_MAX_GAMES, so
   shuffling the lines every week has a real cost. Called once per side per
   game, which both reads the current streak and advances it for next time. */
function lineChemistry(t, lines) {
  if (!t.lineChem) t.lineChem = [0, 0, 0, 0];
  if (!t.lineSig) t.lineSig = [null, null, null, null];
  return lines.F.map((ln, li) => {
    const sig = ln.join(",");
    const games = t.lineSig[li] === sig ? Math.min(LINE_CHEM_MAX_GAMES, t.lineChem[li] + 1) : 0;
    t.lineChem[li] = games;
    t.lineSig[li] = sig;
    return games;
  });
}

/* Offensive and defensive strength of a unit, on a ~0.7–1.4 scale. */
function lineOff(G, ids) {
  const ps = ids.map((id) => G.players[id]).filter(Boolean);
  if (!ps.length) return 1;
  const v = ps.reduce((s, p) => s + 0.44 * p.r.sht + 0.32 * p.r.pss + 0.24 * p.r.hnd, 0) / ps.length;
  return 0.55 + v / 110;
}
function unitDef(G, fIds, dIds) {
  const ps = fIds.concat(dIds).map((id) => G.players[id]).filter(Boolean);
  if (!ps.length) return 1;
  const v = ps.reduce((s, p) => s + 0.7 * p.r.dfn + 0.3 * p.r.spd, 0) / ps.length;
  return 0.55 + v / 110;
}
function goalieQuality(G, id) {
  const g = G.players[id];
  if (!g) return 0.9;
  return 0.42 * g.r.rfx + 0.4 * g.r.pos + 0.18 * g.r.reb;
}
function teamStrength(G, teamId) {
  const r = rosterOf(G, teamId).slice().sort((a, b) => b.ovr - a.ovr);
  if (!r.length) return 50;
  const top = r.slice(0, 18);
  return Math.round(top.reduce((s, p) => s + p.ovr, 0) / top.length);
}

/* ------------------------------- the schedule ------------------------------ */
/* Circle-method round robin over all 32 clubs, repeated until the season length
   is met, with the home side alternating so home/away stays balanced. */

const CAL_DAYS_PER_ROUND = 2.15;   // an 82-game season runs ~176 calendar days

function buildSchedule(G) {
  const n = TEAMS.length;
  const len = ruleValue(G, "seasonLen");
  const arr = TEAMS.map((_, i) => i);
  const half = n / 2;
  // The circle method decides WHO plays; a running home count decides WHERE, so
  // the split stays even however many times the cycle repeats.
  const homeCount = new Array(n).fill(0);
  const fixtures = [];
  let round = 0;
  while (round < len) {
    for (let r = 0; r < n - 1 && round < len; r++) {
      const rf = [];
      for (let i = 0; i < half; i++) {
        const a = arr[i], b = arr[n - 1 - i];
        const aHome = homeCount[a] < homeCount[b] || (homeCount[a] === homeCount[b] && (r + i) % 2 === 0);
        const home = aHome ? a : b, away = aHome ? b : a;
        homeCount[home]++;
        rf.push({ home, away, round, played: false });
      }
      // Shuffle within the round. The circle method has a fixed point — club 0
      // never moves — so without this every club lands in the same slot every
      // round and every gap between games comes out identical.
      for (let i = rf.length - 1; i > 0; i--) {
        const j = Math.floor(rnd(G) * (i + 1));
        const t = rf[i]; rf[i] = rf[j]; rf[j] = t;
      }
      rf.forEach((fx) => fixtures.push(fx));
      round++;
      arr.splice(1, 0, arr.pop());   // rotate all but the first
    }
  }

  // Spread the fixtures over a real calendar instead of playing all 32 clubs
  // every single night. Rest days are what make back-to-backs mean anything.
  let days = Math.max(len + 1, Math.round(len * CAL_DAYS_PER_ROUND));
  const cal = Array.from({ length: days }, () => []);
  const busy = Array.from({ length: days }, () => new Set());
  // Three nights off in midwinter for the All-Star break — a real gap in the
  // calendar rather than a cosmetic label.
  const breakStart = Math.floor(days * 0.55);
  const onBreak = new Set([breakStart, breakStart + 1, breakStart + 2]);
  const place = (fx, idx) => {
    // Spread by position in the whole fixture list, not by round. Anchoring on
    // the round would drop all sixteen of a round's games on one night, which is
    // exactly the every-club-plays-every-day calendar this replaced.
    const target = Math.min(days - 1, Math.floor((idx * days) / fixtures.length));
    for (let d = target; d < days; d++) {
      if (onBreak.has(d) || busy[d].has(fx.home) || busy[d].has(fx.away)) continue;
      cal[d].push(fx); busy[d].add(fx.home); busy[d].add(fx.away); return true;
    }
    for (let d = 0; d < target; d++) {
      if (onBreak.has(d) || busy[d].has(fx.home) || busy[d].has(fx.away)) continue;
      cal[d].push(fx); busy[d].add(fx.home); busy[d].add(fx.away); return true;
    }
    return false;
  };
  fixtures.forEach((fx, idx) => {
    if (place(fx, idx)) return;
    // Should never happen at these ratios, but a fixture must never be dropped.
    cal.push([fx]); busy.push(new Set([fx.home, fx.away])); days++;
  });

  G.schedule = cal;
  G.day = 0;
  G.allStarDay = breakStart + 1;
  G.lastPlayed = new Array(n).fill(-9);
  return cal;
}

// Days off since a club last played. 0 means a genuine back-to-back.
function restFor(G, teamId) {
  const last = (G.lastPlayed && G.lastPlayed[teamId] != null) ? G.lastPlayed[teamId] : -9;
  return last < 0 ? 3 : Math.max(0, G.day - last - 1);
}

/* -------------------------------- new game -------------------------------- */

function newGame(userTeam, opts) {
  opts = opts || {};
  const G = {
    v: 1,
    seed: (opts.seed != null ? opts.seed : Math.floor(Math.random() * 1e9)) | 0,
    nextPid: 1,
    year: opts.year || 2026,
    userTeam: userTeam || 0,
    difficulty: opts.difficulty || "normal",
    rules: Object.assign({}, RULES_DEFAULT, opts.rules || {}),
    pendingRules: null,
    phase: "regular",
    day: 0,
    players: {},
    teams: [],
    schedule: [],
    results: [],
    playoffs: null,
    draftClass: [],
    freeAgents: [],
    picks: [],
    history: [],
    log: [],
    awards: null,
    boardConfidence: 62,
    news: [],
    retained: [],
    waivers: [],
    shotLog: {},
    gameLog: {},
    records: null,
  };

  G.teams = TEAMS.map((t, i) => ({
    id: i, ...t,
    w:0, l:0, otl:0, pts:0, gf:0, ga:0, gp:0, streak:0, l10:[],
    lines: null, lineChem: [0, 0, 0, 0], lineSig: [null, null, null, null],
    cupWins: 0, playoffApps: 0,
    revenue: 0, budget: 0,
  }));

  // Roster generation. Team tier spreads the league from contender to lottery.
  const tiers = G.teams.map(() => clamp(gauss(G, 56, 6), 42, 70));
  G.teams.forEach((t, i) => {
    const tier = tiers[i];
    Object.entries(ROSTER_SHAPE).forEach(([pos, count]) => {
      for (let k = 0; k < count; k++) {
        // Top-line talent sits well above roster filler.
        const slot = 1 - k / (count + 1);
        const p = genPlayer(G, pos, tier + slot * 16 - 6);
        p.teamId = i;
        G.players[p.id] = p;
      }
    });
    // A few depth bodies on the farm.
    for (let k = 0; k < 5; k++) {
      const p = genPlayer(G, pick(G, ["C","LW","RW","D","G"]), tier - 14, ri(G, 19, 24));
      p.teamId = i; p.farm = true;
      G.players[p.id] = p;
    }
  });

  // Contracts, sized to market with a little noise, then squeezed under the cap.
  G.teams.forEach((t) => {
    rosterOf(G, t.id, true).forEach((p) => {
      p.contract = {
        amt: round1(clamp(marketValue(G, p) * (0.85 + rnd(G) * 0.35), MIN_SALARY, rules(G).capAmount * MAX_SALARY_PCT)),
        yrs: p.age < 23 ? ri(G, 1, 3) : ri(G, 1, 5),
      };
      if (p.farm) p.contract.amt = MIN_SALARY;
      p.ntc = eligibleForNtc(p) && p.contract.yrs >= 3 && rnd(G) < 0.55;
    });
    let guard = 0;
    while (capHit(G, t.id) > rules(G).capAmount && guard++ < 60) {
      const worst = rosterOf(G, t.id).sort((a, b) => b.contract.amt / Math.max(1, b.ovr) - a.contract.amt / Math.max(1, a.ovr))[0];
      if (!worst) break;
      worst.contract.amt = round1(Math.max(MIN_SALARY, worst.contract.amt * 0.85));
    }
    t.lines = autoLines(G, t.id);
    t.budget = round1(20 + t.mkt * 6);
  });

  // Free agent pool and this year's draft picks.
  for (let k = 0; k < 40; k++) {
    const p = genPlayer(G, pick(G, ["C","LW","RW","D","G"]), 46, ri(G, 24, 36));
    G.players[p.id] = p;
    G.freeAgents.push(p.id);
  }
  seedPicks(G, G.year + 1, 3);

  buildSchedule(G);
  return G;
}

function seedPicks(G, fromYear, years) {
  for (let y = 0; y < years; y++) {
    for (let rd = 1; rd <= 2; rd++) {
      G.teams.forEach((t) => G.picks.push({ year: fromYear + y, round: rd, owner: t.id, orig: t.id }));
    }
  }
}

/* --------------------------- migrating old saves --------------------------- */
function migrate(G) {
  if (!G) return G;
  G.rules = Object.assign({}, RULES_DEFAULT, G.rules || {});
  if (!G.picks) G.picks = [];
  if (!G.news) G.news = [];
  if (!G.history) G.history = [];
  if (!G.log) G.log = [];
  if (!G.freeAgents) G.freeAgents = [];
  if (!G.draftClass) G.draftClass = [];
  if (G.boardConfidence == null) G.boardConfidence = 62;
  if (!G.lastPlayed) G.lastPlayed = new Array((G.teams || []).length || TEAMS.length).fill(-9);
  if (!G.retained) G.retained = [];
  if (!G.waivers) G.waivers = [];
  if (!G.shotLog) G.shotLog = {};
  if (!G.gameLog) G.gameLog = {};
  playersOf(G).forEach((p) => {
    if (!p.stats) p.stats = blankStats(p.pos);
    if (!p.season) p.season = blankStats(p.pos);
    if (!p.career) p.career = [];
    if (!p.trophies) p.trophies = [];
    if (p.fatigue == null) p.fatigue = 0;
    if (!p.shoots) p.shoots = (p.id % 100) < 62 ? "L" : "R";
    const kind = p.pos === "G" ? "G" : "S";
    [p.stats, p.season].forEach((s) => {
      if (!s) return;
      if (!s.z) s.z = blankZones(kind);
      if (!s.net) s.net = blankNet(kind);
      if (kind === "S") {
        // Older saves predate attempt tracking; seed it from shots on goal so
        // the on-goal share doesn't read as zero.
        if (s.att == null) s.att = s.sog || 0;
        if (s.miss == null) s.miss = 0;
        if (s.blkd == null) s.blkd = 0;
      }
    });
    p.ovr = ovrOf(p);
  });
  G.teams.forEach((t) => {
    if (!t.l10) t.l10 = [];
    if (!t.lineChem) t.lineChem = [0, 0, 0, 0];
    if (!t.lineSig) t.lineSig = [null, null, null, null];
  });
  return G;
}

/* ============================ THE GAME ENGINE ==============================
 * A game is 60 minutes of shift time split across line-vs-line matchups.
 * For each matchup we work out a shot rate from the offensive unit against the
 * defensive unit, roll shots, then resolve each shot against the goalie. The
 * home side gets last change: a small bias toward putting its top line against
 * the opponent's weaker pairs.
 * ========================================================================== */

const ES_MINUTES = 47;      // even strength
const PP_MIN_PER = 1.7;     // ice time per power play

function emptyBox(G, teamId) {
  const box = { teamId, g: 0, sog: 0, pim: 0, pp: 0, ppg: 0, hits: 0, blk: 0, fow: 0, fol: 0, players: {}, goalie: null, scorers: [] };
  // Farm and injured players are included so a stray id can never miss — only
  // players who actually take ice time are credited in applyGame.
  rosterOf(G, teamId, true).forEach((p) => {
    box.players[p.id] = p.pos === "G"
      ? { sa: 0, sv: 0, ga: 0, toi: 0, sosa: 0, sosv: 0, starts: 0, z: blankZones("G"), net: blankNet("G") }
      : { g: 0, a: 0, sog: 0, pim: 0, hit: 0, blk: 0, toi: 0, pm: 0, fow: 0, fol: 0, ppg: 0, shg: 0,
          eng: 0, fights: 0, sos: 0, soa: 0, att: 0, miss: 0, blkd: 0,
          z: blankZones("S"), net: blankNet("S") };
  });
  return box;
}

/* Not every shot is the same shot. A point blast from a defenceman and a rush
   chance off the wing arrive at the goalie with very different odds, so the zone
   is picked first and it decides both who shoots and how stoppable it is. */
const SHOT_ZONES = [
  { key: "rush",  p: 0.22, save: -0.034, dBias: 0.22 },
  { key: "cycle", p: 0.52, save:  0.000, dBias: 0.50 },
  { key: "point", p: 0.26, save:  0.055, dBias: 3.40 },
];
function pickZone(G) {
  const x = rnd(G);
  let acc = 0;
  for (const z of SHOT_ZONES) { acc += z.p; if (x <= acc) return z; }
  return SHOT_ZONES[1];
}

// Who takes the shot in a given unit — weighted by shooting and hands, with
// defencemen far likelier to be the one firing from the point.
function shooterFrom(G, ids, dBias) {
  const ps = ids.map((id) => G.players[id]).filter(Boolean);
  if (!ps.length) return null;
  const bias = dBias == null ? 0.55 : dBias;
  const wts = ps.map((p) => Math.pow(Math.max(1, p.r.sht * 0.7 + p.r.hnd * 0.3 - 20), 1.6) * (p.pos === "D" ? bias : 1));
  const tot = wts.reduce((a, b) => a + b, 0);
  let x = rnd(G) * tot;
  for (let i = 0; i < ps.length; i++) { x -= wts[i]; if (x <= 0) return ps[i]; }
  return ps[ps.length - 1];
}
// Assists go to the linemates who actually move the puck.
function assistsFrom(G, ids, scorerId) {
  const ps = ids.map((id) => G.players[id]).filter((p) => p && p.id !== scorerId);
  const out = [];
  if (!ps.length) return out;
  const roll = rnd(G);
  const n = roll < 0.24 ? 0 : roll < 0.62 ? 1 : 2;
  const pool = ps.slice();
  for (let i = 0; i < n && pool.length; i++) {
    const wts = pool.map((p) => Math.pow(Math.max(1, p.r.pss - 15), 1.7));
    const tot = wts.reduce((a, b) => a + b, 0);
    let x = rnd(G) * tot, chosen = pool[pool.length - 1];
    for (let k = 0; k < pool.length; k++) { x -= wts[k]; if (x <= 0) { chosen = pool[k]; break; } }
    out.push(chosen.id);
    pool.splice(pool.indexOf(chosen), 1);
  }
  return out;
}

function resolveShots(G, ctx, shots, offIds, defIds, gid, strength) {
  const gq = goalieQuality(G, gid);
  // Save percentage lives in a believable band; a great goalie is ~.925. A tired
  // goalie leaks: a full fatigue load is worth about fifteen points of save
  // percentage, which is roughly what a goalie on his third start in four nights
  // actually looks like.
  const gp = G.players[gid];
  const tired = gp ? clamp(gp.fatigue, 0, 100) / 100 : 0;
  let base = 0.9032 + (gq - 55) * 0.0016 - tired * 0.015;
  if (strength === "pp") base -= 0.028;
  const gBox = ctx.gBox, sBox = ctx.sBox;
  if (!gBox.players[gid]) return;   // no dressed goaltender — nothing to resolve against
  const hole = gp ? goalieHole(gp) : null;
  const blockers = defIds.map((id) => G.players[id]).filter((p) => p && p.pos === "D");

  /* One attempt, one outcome. Each attempt is an independent event that either
     hits a shin pad, sails wide, or reaches the goalie — it is NOT one shot on
     goal with a blocked and a missed sibling invented around it, which is what
     this used to do and which meant a single chance produced up to three
     records. `shots` is the number expected to REACH the net, so the loop runs
     over the attempts needed to produce that many. */
  const canBlock = blockers.length > 0;
  const pBlock = canBlock ? 0.24 : 0;
  const pMiss = 0.21;
  const pOnGoal = 1 - pBlock - pMiss;
  const attempts = Math.round(shots / pOnGoal);

  for (let s = 0; s < attempts; s++) {
    const zone = pickZone(G);
    const shooter = shooterFrom(G, offIds, zone.dBias);
    if (!shooter || !sBox.players[shooter.id]) continue;
    const sh = sBox.players[shooter.id];

    // A record per attempt, kept only when somebody is going to look at it (the
    // user's club). The clock time is invented the same way the play-by-play's
    // is; the game, the opponent and the outcome are real.
    const log = ctx.shots;
    const rec = (r, cell) => {
      if (!log) return;
      log.push({ p: shooter.id, g: gid, off: sBox.teamId, def: gBox.teamId,
        t: rnd(G) * 60, z: zone.key, c: cell, r, st: strength });
    };

    sh.att++;
    const roll = rnd(G);
    if (roll < pBlock) {
      const b = blockers[Math.floor(rnd(G) * blockers.length)];
      if (ctx.oppBox.players[b.id]) { sh.blkd++; ctx.oppBox.players[b.id].blk++; rec("b", null); }
      else { sh.miss++; rec("m", null); }
      continue;
    }
    if (roll < pBlock + pMiss) { sh.miss++; rec("m", null); continue; }

    const cell = pickCell(G, shooter);
    const exposed = hole && cell.key === hole.key ? 0.032 : 0;
    const quality = (shooter.r.sht - 55) * 0.0013 + (rnd(G) - 0.5) * 0.02;
    const saveP = clamp(base + zone.save + cell.save - exposed - quality, 0.55, 0.99);
    sBox.sog++; sh.sog++;
    gBox.players[gid].sa++;
    sh.z[zone.key].s++;
    sh.net[cell.key].a++;
    gBox.players[gid].z[zone.key].sa++;
    gBox.players[gid].net[cell.key].sa++;
    if (rnd(G) > saveP) {
      rec("g", cell.key);
      sh.z[zone.key].g++;
      sh.net[cell.key].g++;
      gBox.players[gid].net[cell.key].ga++;
      if (ctx.events) ctx.events.push({ t: rnd(G) * 60, kind: "goal", team: sBox.teamId, pid: shooter.id, zone: zone.key, cell: cell.key, strength });
      sBox.g++; sBox.players[shooter.id].g++;
      gBox.players[gid].ga++; gBox.ga = (gBox.ga || 0) + 1;
      if (strength === "pp") { sBox.ppg++; sBox.players[shooter.id].ppg++; }
      if (strength === "sh") sBox.players[shooter.id].shg++;
      const helpers = assistsFrom(G, offIds, shooter.id);
      helpers.forEach((id) => { if (sBox.players[id]) sBox.players[id].a++; });
      sBox.scorers.push({ id: shooter.id, a: helpers, strength });
      if (strength === "es") {
        offIds.forEach((id) => { if (sBox.players[id]) sBox.players[id].pm++; });
        defIds.forEach((id) => { if (ctx.oppBox.players[id]) ctx.oppBox.players[id].pm--; });
      }
    } else {
      rec("s", cell.key);
      gBox.players[gid].sv++;
      gBox.players[gid].z[zone.key].sv++;
      // Only the dangerous ones are worth narrating.
      if (ctx.events && zone.key === "rush" && rnd(G) < 0.28)
        ctx.events.push({ t: rnd(G) * 60, kind: "save", team: gBox.teamId, pid: gid, shooter: shooter.id, zone: zone.key });
    }
  }
}

/* Who starts in goal. A back-to-back, or a starter who's been run into the
   ground, is what gets the backup into a game — the depth chart alone never
   would. A backup much worse than the starter still doesn't play. */
function pickStarter(G, lines, rest) {
  const s = G.players[lines.G[0]], b = G.players[lines.G[1]];
  if (!s) return lines.G[1] != null ? lines.G[1] : lines.G[0];
  if (!b) return s.id;
  const restDays = rest == null ? 2 : rest;
  // A backup much worse than the starter still gets games — just later, when the
  // starter is genuinely run down rather than merely tired.
  const gap = s.ovr - b.ovr;
  const limit = gap > 14 ? 78 : 55;
  const worn = s.fatigue > limit || (restDays === 0 && s.fatigue > limit - 30);
  return worn ? b.id : s.id;
}

/* Three rounds and then sudden death, hands against reflexes. Shootout goals
   never count toward a skater's season total — only the team's score moves —
   so they're tracked separately as `sos`/`soa`. */
function runShootout(G, a, b, aLines, bLines, aGid, bGid) {
  const order = (lines) => lines.F.flat().map((id) => G.players[id]).filter(Boolean)
    .sort((x, y) => (y.r.hnd * 0.6 + y.r.sht * 0.4) - (x.r.hnd * 0.6 + x.r.sht * 0.4));
  const aS = order(aLines), bS = order(bLines);
  if (!aS.length || !bS.length) return rnd(G) < 0.5 ? a : b;
  const attempt = (sh, gid, box, gBox) => {
    const g = G.players[gid];
    const skill = sh.r.hnd * 0.6 + sh.r.sht * 0.4;
    const stop = g ? g.r.rfx * 0.6 + g.r.pos * 0.4 : 40;
    const scored = rnd(G) < clamp(0.33 + (skill - stop) * 0.006, 0.08, 0.72);
    if (box.players[sh.id]) { box.players[sh.id].soa++; if (scored) box.players[sh.id].sos++; }
    if (gBox.players[gid]) { gBox.players[gid].sosa++; if (!scored) gBox.players[gid].sosv++; }
    return scored;
  };
  let ag = 0, bg = 0;
  for (let r = 0; r < 3; r++) {
    if (attempt(aS[r % aS.length], bGid, a, b)) ag++;
    if (attempt(bS[r % bS.length], aGid, b, a)) bg++;
  }
  let r = 3, guard = 0;
  while (ag === bg && guard++ < 15) {
    const x = attempt(aS[r % aS.length], bGid, a, b);
    const y = attempt(bS[r % bS.length], aGid, b, a);
    if (x && !y) ag++; else if (y && !x) bg++;
    r++;
  }
  return ag === bg ? (rnd(G) < 0.5 ? a : b) : (ag > bg ? a : b);
}

function simGame(G, homeId, awayId, opts) {
  opts = opts || {};
  const R = rules(G);
  const hl = ensureLines(G, homeId), al = ensureLines(G, awayId);
  const home = emptyBox(G, homeId), away = emptyBox(G, awayId);
  const hG = pickStarter(G, hl, opts.homeRest), aG = pickStarter(G, al, opts.awayRest);
  home.goalie = hG; away.goalie = aG;
  // Events are only recorded when somebody is going to watch. The engine works
  // in aggregate per matchup, so each event gets a clock time and the whole log
  // is sorted at the end — the ordering is invented, the events are not.
  const ev = opts.events ? [] : null;
  // A per-shot record, kept only for the user's club so the log stays bounded.
  const shotLog = opts.log ? [] : null;

  const sides = [
    { box: home, opp: away, lines: hl, gid: hG, oppGid: aG, oppLines: al, isHome: true },
    { box: away, opp: home, lines: al, gid: aG, oppGid: hG, oppLines: hl, isHome: false },
  ];

  // ---- fighting ----
  // A fight is five minutes each and a small, real swing in who carries the play
  // afterwards. It never touches the scoreboard directly.
  const momentum = { [homeId]: 1, [awayId]: 1 };
  if (R.fighting && rnd(G) < 0.22) {
    const enforcer = (tid) => {
      const pool = activeRoster(G, tid).filter((p) => p.pos !== "G")
        .sort((x, y) => y.r.phy - x.r.phy).slice(0, 5);
      return pool.length ? pool[Math.floor(rnd(G) * pool.length)] : null;
    };
    const hf = enforcer(homeId), af = enforcer(awayId);
    if (hf && af && home.players[hf.id] && away.players[af.id]) {
      home.players[hf.id].pim += 5; away.players[af.id].pim += 5;
      home.players[hf.id].fights++; away.players[af.id].fights++;
      home.pim += 5; away.pim += 5;
      const hWon = rnd(G) < clamp(0.5 + (hf.r.phy - af.r.phy) * 0.01, 0.15, 0.85);
      momentum[hWon ? homeId : awayId] = 1.07;
      home.fight = { home: hf.id, away: af.id, winner: hWon ? hf.id : af.id };
      if (ev) ev.push({ t: rnd(G) * 60, kind: "fight", team: hWon ? homeId : awayId, pid: hWon ? hf.id : af.id, other: hWon ? af.id : hf.id });
    }
  }

  // ---- rest ----
  // The second night of a back-to-back costs a few percent of everything.
  const legs = { [homeId]: 1 - Math.max(0, 2 - (opts.homeRest == null ? 2 : opts.homeRest)) * 0.025,
                 [awayId]: 1 - Math.max(0, 2 - (opts.awayRest == null ? 2 : opts.awayRest)) * 0.025 };

  // ---- even strength, line matchup by line matchup ----
  sides.forEach((side) => {
    const chem = lineChemistry(G.teams[side.box.teamId], side.lines);
    side.lines.F.forEach((fLine, li) => {
      const mins = ES_MINUTES * LINE_TOI[li];
      // Last change: at home, the top line sees soft matchups more often.
      side.oppLines.D.forEach((pair, pi) => {
        let share = PAIR_TOI[pi];
        if (side.isHome) share *= li === 0 ? (pi === 2 ? 1.28 : pi === 1 ? 1.05 : 0.78) : 1;
        const m = mins * share;
        const oppF = side.oppLines.F[Math.min(3, li)];
        // The unit on the ice is five skaters, not three. Which of our own pairs
        // is out there is drawn by ice-time share — that's what puts defencemen
        // on the scoresheet at all, and it evens out across a season.
        let x = rnd(G), di = 0;
        for (let k = 0; k < PAIR_TOI.length; k++) { x -= PAIR_TOI[k]; if (x <= 0) { di = k; break; } }
        const myPair = side.lines.D[di] || side.lines.D[0];
        const unit = fLine.concat(myPair);
        const off = lineOff(G, fLine) * (1 + chem[li] * LINE_CHEM_PER_GAME);
        const def = unitDef(G, oppF, pair);
        // ~30 shots per 60 at even strength for an average team.
        const rate = (30.5 / 60) * (off / def) * momentum[side.box.teamId] * legs[side.box.teamId];
        const shots = Math.max(0, Math.round(gauss(G, rate * m, Math.sqrt(Math.max(0.4, rate * m)) * 0.9)));
        resolveShots(G,
          { off, ppOff: off, sBox: side.box, gBox: side.opp, oppBox: side.opp, events: ev, shots: shotLog },
          shots, unit, pair.concat(oppF), side.oppGid, "es");
        // Everyone on the ice is on the ice for the whole shift — the minutes
        // are not split between linemates.
        fLine.forEach((id) => { if (side.box.players[id]) side.box.players[id].toi += m; });
        pair.forEach((id) => { if (side.opp.players[id]) side.opp.players[id].toi += m; });
      });
    });
  });

  // ---- penalties and special teams ----
  sides.forEach((side) => {
    const drawn = Math.max(0, Math.round(gauss(G, 3.1, 1.2)));
    side.opp.pim += drawn * 2;
    side.box.pp += drawn;
    const skaters = activeRoster(G, side.opp.teamId).filter((p) => p.pos !== "G");
    for (let i = 0; i < drawn && skaters.length; i++) {
      const off = skaters[Math.floor(rnd(G) * skaters.length)];
      if (side.opp.players[off.id]) side.opp.players[off.id].pim += 2;
      if (ev) ev.push({ t: rnd(G) * 60, kind: "penalty", team: side.opp.teamId, pid: off.id });
    }
    const unit = side.lines.PP[0].length ? side.lines.PP[0] : side.lines.F[0];
    const pkUnit = side.oppLines.PK[0].length ? side.oppLines.PK[0] : side.oppLines.D[0];
    const m = drawn * PP_MIN_PER;
    const rate = (52 / 60) * (lineOff(G, unit) / unitDef(G, pkUnit, side.oppLines.D[0]));
    const shots = Math.max(0, Math.round(gauss(G, rate * m, Math.sqrt(Math.max(0.4, rate * m)))));
    resolveShots(G, { off: 1, ppOff: 1, sBox: side.box, gBox: side.opp, oppBox: side.opp, events: ev, shots: shotLog },
      shots, unit, pkUnit, side.oppGid, "pp");
    unit.forEach((id) => { if (side.box.players[id]) side.box.players[id].toi += m; });
    pkUnit.forEach((id) => { if (side.opp.players[id]) side.opp.players[id].toi += m; });
    // Shorthanded chances are rare but real.
    if (rnd(G) < 0.16 * drawn) {
      resolveShots(G, { off: 1, ppOff: 1, sBox: side.opp, gBox: side.box, oppBox: side.box, events: ev, shots: shotLog },
        1, pkUnit, unit, side.gid, "sh");
    }
  });

  // ---- faceoffs, hits, blocks ----
  sides.forEach((side) => {
    const cs = side.lines.F.map((l) => G.players[l[1]]).filter(Boolean);
    const oppCs = side.oppLines.F.map((l) => G.players[l[1]]).filter(Boolean);
    const my = cs.reduce((s, p) => s + p.r.fo, 0) / Math.max(1, cs.length);
    const th = oppCs.reduce((s, p) => s + p.r.fo, 0) / Math.max(1, oppCs.length);
    const total = 30;
    const winP = clamp(0.5 + (my - th) * 0.006, 0.3, 0.7);
    let won = 0;
    for (let i = 0; i < total; i++) if (rnd(G) < winP) won++;
    side.box.fow += won; side.box.fol += total - won;
    cs.forEach((p, i) => {
      const share = Math.round(total * LINE_TOI[i]);
      const w = Math.round(share * winP);
      side.box.players[p.id].fow += w; side.box.players[p.id].fol += share - w;
    });
    // Hits are their own thing. Blocks are NOT generated here — they come out of
    // real shot attempts in resolveShots, so a shot-blocking defenceman's total
    // reflects shots that were actually taken at him.
    activeRoster(G, side.box.teamId).filter((p) => p.pos !== "G").forEach((p) => {
      const h = Math.round(Math.max(0, gauss(G, p.r.phy / 34, 1)));
      side.box.players[p.id].hit += h;
      side.box.hits += h;
    });
  });

  // ---- the last two minutes ----
  // Down one, the trailing side pulls its goalie. Six on five is a genuine
  // chance to tie and a bigger chance to concede into the empty net — and an
  // empty-net goal has no goalie behind it, so no save opportunity is charged.
  if (Math.abs(home.g - away.g) === 1) {
    const trailing = home.g < away.g ? home : away;
    const leading = trailing === home ? away : home;
    const tLines = trailing === home ? hl : al;
    const lLines = leading === home ? hl : al;
    const roll = rnd(G);
    if (roll < 0.17) {
      const unit = tLines.PP[0].length ? tLines.PP[0] : tLines.F[0];
      resolveShots(G, { sBox: trailing, gBox: leading, oppBox: leading, events: ev, shots: shotLog },
        1, unit, [], leading.goalie, "en6");
    } else if (roll < 0.45) {
      const sc = shooterFrom(G, lLines.F[0], 0.3);
      if (sc && leading.players[sc.id]) {
        leading.g++; leading.sog++;
        // No goalie, so no placement is recorded — an empty net has no corners.
        leading.players[sc.id].g++; leading.players[sc.id].sog++;
        leading.players[sc.id].eng++; leading.players[sc.id].att++;
        const helpers = assistsFrom(G, lLines.F[0], sc.id);
        helpers.forEach((id) => { if (leading.players[id]) leading.players[id].a++; });
        leading.scorers.push({ id: sc.id, a: helpers, strength: "en" });
        leading.eng = (leading.eng || 0) + 1;
        if (ev) ev.push({ t: 58 + rnd(G) * 2, kind: "goal", team: leading.teamId, pid: sc.id, zone: "empty", strength: "en" });
        // Its own outcome code: a real attempt, but at a net nobody was in.
        if (shotLog) shotLog.push({ p: sc.id, g: null, off: leading.teamId, def: trailing.teamId,
          t: 58 + rnd(G) * 2, z: "empty", c: null, r: "e", st: "en" });
      }
    }
  }

  // ---- overtime ----
  let ot = false, so = false;
  if (home.g === away.g) {
    if (R.otFormat === "none") { /* a tie stands */ }
    else {
      ot = true;
      const hS = lineOff(G, hl.F[0]) / unitDef(G, al.F[0], al.D[0]);
      const aS = lineOff(G, al.F[0]) / unitDef(G, hl.F[0], hl.D[0]);
      const pHome = clamp(0.5 + (hS - aS) * 0.55 + 0.02, 0.2, 0.8);
      // In the playoffs, and whenever there's no shootout to fall back on, OT
      // runs until somebody actually scores.
      const decided = opts.playoff || !R.shootout ? true : rnd(G) < 0.62;
      const homeWins = rnd(G) < pHome;
      const winner = homeWins ? home : away, loser = homeWins ? away : home;
      if (decided) {
        const lines = homeWins ? hl : al;
        let guard = 0;
        const otEv = ev ? [] : null;
        while (winner.g <= loser.g && guard++ < 60) {
          resolveShots(G, { off: 1, ppOff: 1, sBox: winner, gBox: loser, oppBox: loser, events: otEv, shots: shotLog },
            1, lines.F[0], [], homeWins ? aG : hG, "es");
        }
        // Whatever it took to end it, only the winner is on the clock in OT.
        if (ev && otEv) otEv.filter((e) => e.kind === "goal").slice(-1)
          .forEach((e) => ev.push({ ...e, t: 60 + rnd(G) * 5, ot: true }));
      }
      if (winner.g <= loser.g) {
        // The shootout is the one goal nobody is credited with, exactly as in
        // real bookkeeping: the team's score goes up, no skater's total does.
        so = true;
        const soWinner = R.shootout ? runShootout(G, home, away, hl, al, hG, aG) : winner;
        soWinner.g++;
      }
    }
  }

  // Goalie minutes and the decision.
  if (home.players[hG]) home.players[hG].toi += 60;
  if (away.players[aG]) away.players[aG].toi += 60;
  if (ev && so) ev.push({ t: 65, kind: "shootout", team: home.g > away.g ? homeId : awayId });
  const res = {
    home: homeId, away: awayId, hg: home.g, ag: away.g, ot, so,
    boxes: { [homeId]: home, [awayId]: away },
    events: ev ? ev.sort((a, b) => a.t - b.t) : null,
    shots: shotLog,
  };
  return res;
}

/* --------------------------- writing a result down ------------------------- */

function applyGame(G, res, opts) {
  opts = opts || {};
  const R = rules(G);
  const H = G.teams[res.home], A = G.teams[res.away];
  const homeWon = res.hg > res.ag;
  const tie = res.hg === res.ag;

  [res.home, res.away].forEach((tid) => {
    const t = G.teams[tid];
    const box = res.boxes[tid];
    const gf = tid === res.home ? res.hg : res.ag;
    const ga = tid === res.home ? res.ag : res.hg;
    if (!opts.playoff) {
      t.gp++; t.gf += gf; t.ga += ga;
      const won = gf > ga;
      if (tie) { t.otl++; t.pts += 1; }
      else if (won) { t.w++; t.pts += 2; t.streak = t.streak >= 0 ? t.streak + 1 : 1; }
      else if ((res.ot || res.so) && R.otLoserPoint) { t.otl++; t.pts += 1; t.streak = t.streak <= 0 ? t.streak - 1 : -1; }
      else { t.l++; t.streak = t.streak <= 0 ? t.streak - 1 : -1; }
      t.l10.push(won ? "W" : (res.ot || res.so) ? "O" : "L");
      if (t.l10.length > 10) t.l10.shift();
    }

    Object.entries(box.players).forEach(([pid, s]) => {
      const p = G.players[pid];
      if (!p) return;
      // The box carries the whole organisation so lookups can't miss; only the
      // players who took a shift are credited with a game.
      if (s.toi <= 0) return;
      const dest = opts.playoff ? (p.po = p.po || blankStats(p.pos)) : p.season;
      dest.gp++; dest.toi += s.toi;
      if (p.pos === "G") {
        dest.sa += s.sa; dest.sv += s.sv; dest.ga += s.ga; dest.starts++;
        dest.sosa += s.sosa || 0; dest.sosv += s.sosv || 0;
        if (s.ga === 0 && s.sa > 0) dest.so++;
        const won = gf > ga;
        if (res.so) { if (won) dest.sow++; else dest.sol++; }
        if (won) dest.w++;
        else if ((res.ot || res.so) && R.otLoserPoint) dest.otl++;
        else dest.l++;
      } else {
        dest.g += s.g; dest.a += s.a; dest.sog += s.sog; dest.pim += s.pim;
        dest.hit += s.hit; dest.blk += s.blk; dest.pm += s.pm;
        dest.fow += s.fow; dest.fol += s.fol; dest.ppg += s.ppg; dest.shg += s.shg;
        dest.eng += s.eng || 0; dest.fights += s.fights || 0;
        dest.sos += s.sos || 0; dest.soa += s.soa || 0;
        dest.att += s.att || 0; dest.miss += s.miss || 0; dest.blkd += s.blkd || 0;
      }
      addZones(dest, s.z);
      addNet(dest, s.net);
      // A goalie's night costs far more than a skater's shift — that's what
      // eventually forces the backup into the net. For skaters it's minutes
      // above a normal night that wear them down; a fourth-liner recovers.
      p.fatigue = clamp(p.fatigue + (p.pos === "G" ? 14 : (s.toi - 12) / 60 * 10), 0, 100);
    });
  });

  rollInjuries(G, res);
  recordLogs(G, res, opts);
  G.results.push({
    day: G.day, home: res.home, away: res.away, hg: res.hg, ag: res.ag,
    ot: res.ot, so: res.so, playoff: !!opts.playoff,
    scorers: [].concat(res.boxes[res.home].scorers.map((s) => ({ ...s, t: res.home })),
                       res.boxes[res.away].scorers.map((s) => ({ ...s, t: res.away }))),
  });
  if (G.results.length > 1400) G.results.splice(0, 400);
  return res;
}

/* --------------------------------- the logs -------------------------------
 * A record of every shot and every game — but only for the user's club, which
 * is the only one anybody inspects. Doing it league-wide would add roughly a
 * megabyte and a half to a save for data nobody opens.
 * ------------------------------------------------------------------------- */

const SHOT_LOG_MAX = 1400;
const GAME_LOG_MAX = 220;

function recordLogs(G, res, opts) {
  G.shotLog = G.shotLog || {};
  G.gameLog = G.gameLog || {};
  const day = G.day, po = !!(opts && opts.playoff);

  (res.shots || []).forEach((s) => {
    const shooter = G.players[s.p], keeper = G.players[s.g];
    const push = (pid, role, opp) => {
      const arr = (G.shotLog[pid] = G.shotLog[pid] || []);
      arr.push({ d: day, o: opp, t: Math.round(s.t * 10) / 10, z: s.z, c: s.c, r: s.r, st: s.st, role, po });
      if (arr.length > SHOT_LOG_MAX) arr.splice(0, arr.length - SHOT_LOG_MAX);
    };
    if (shooter && shooter.teamId === G.userTeam) push(s.p, "s", s.def);
    // A goalie only ever faced the ones that got to him.
    if (s.c && keeper && keeper.teamId === G.userTeam) push(s.g, "g", s.off);
  });

  [res.home, res.away].forEach((tid) => {
    if (tid !== G.userTeam) return;
    const box = res.boxes[tid];
    const opp = tid === res.home ? res.away : res.home;
    const gf = tid === res.home ? res.hg : res.ag;
    const ga = tid === res.home ? res.ag : res.hg;
    Object.entries(box.players).forEach(([pid, s]) => {
      if (s.toi <= 0) return;
      const p = G.players[pid];
      if (!p) return;
      const arr = (G.gameLog[pid] = G.gameLog[pid] || []);
      arr.push(p.pos === "G"
        ? { d: day, o: opp, gf, ga, sa: s.sa, sv: s.sv, toi: Math.round(s.toi), po }
        : { d: day, o: opp, gf, ga, g: s.g, a: s.a, sog: s.sog, pm: s.pm, toi: Math.round(s.toi * 10) / 10, po });
      if (arr.length > GAME_LOG_MAX) arr.splice(0, arr.length - GAME_LOG_MAX);
    });
  });
  return G;
}

const INJURIES = [
  ["upper body", 3, 12], ["lower body", 4, 16], ["groin", 6, 22], ["concussion", 10, 40],
  ["shoulder", 12, 45], ["knee", 20, 70], ["broken hand", 14, 35], ["ankle", 8, 26],
];
function rollInjuries(G, res) {
  const R = rules(G);
  const mult = ({ low: 0.55, normal: 1, high: 1.6 })[R.injuries] * diff(G).injury;
  [res.home, res.away].forEach((tid) => {
    rosterOf(G, tid).forEach((p) => {
      if (p.inj > 0) return;
      const risk = 0.0022 * mult * (1 + (70 - p.r.dur) / 90) * (1 + p.fatigue / 240);
      if (rnd(G) < risk) {
        const [desc, lo, hi] = pick(G, INJURIES);
        p.inj = ri(G, lo, hi);
        p.injDesc = desc;
        if (tid === G.userTeam) news(G, `${fullName(p)} is out ~${p.inj} games (${desc}).`, "bad");
        G.teams[tid].lines = null;
      }
    });
  });
}

function news(G, text, kind) {
  G.news.unshift({ day: G.day, year: G.year, text, kind: kind || "info" });
  if (G.news.length > 120) G.news.pop();
}

/* --------------------------------- one day -------------------------------- */

function simDay(G) {
  if (G.phase !== "regular") return G;
  const day = G.schedule[G.day];
  if (!day) { endRegularSeason(G); return G; }
  if (!G.lastPlayed) G.lastPlayed = new Array(G.teams.length).fill(-9);
  const playedToday = new Set();
  day.forEach((fx) => {
    if (fx.played) return;
    const mine = fx.home === G.userTeam || fx.away === G.userTeam;
    const res = simGame(G, fx.home, fx.away, {
      homeRest: restFor(G, fx.home), awayRest: restFor(G, fx.away), events: mine, log: mine,
    });
    applyGame(G, res);
    fx.played = true; fx.hg = res.hg; fx.ag = res.ag; fx.ot = res.ot; fx.so = res.so;
    playedToday.add(fx.home); playedToday.add(fx.away);
    // Only the latest of the user's games is kept — a full season of play-by-play
    // would dwarf everything else in the save.
    if (mine) G.lastGame = { day: G.day, home: fx.home, away: fx.away, hg: res.hg, ag: res.ag,
      ot: res.ot, so: res.so, events: res.events || [], boxes: res.boxes };
  });
  playedToday.forEach((tid) => { G.lastPlayed[tid] = G.day; });
  processWaivers(G);
  playedToday.forEach((tid) => simFarmDay(G, tid));
  checkMilestones(G);
  if (G.day === deadlineDay(G)) { aiDeadlineMoves(G); news(G, "The trade deadline has passed.", "info"); }
  if (G.day === G.allStarDay && !G.allStar) runAllStar(G);

  // Recovery. Injuries are quoted in GAMES, so they only tick down for clubs
  // that actually played — an injury doesn't heal on an off day. Fatigue does.
  playersOf(G).forEach((p) => {
    if (p.inj > 0 && p.teamId != null && playedToday.has(p.teamId)) {
      p.inj--;
      if (p.inj === 0) { p.injDesc = ""; G.teams[p.teamId].lines = null; }
    }
    p.fatigue = clamp(p.fatigue - (p.pos === "G" ? 4.2 : 0.8), 0, 100);
  });
  G.day++;
  if (G.day >= G.schedule.length) endRegularSeason(G);
  return G;
}
function simDays(G, n) { for (let i = 0; i < n && G.phase === "regular"; i++) simDay(G); return G; }

/* ------------------------------- standings -------------------------------- */

function standings(G, filterFn) {
  return G.teams
    .filter(filterFn || (() => true))
    .slice()
    .sort((a, b) => b.pts - a.pts || (b.w - a.w) || (b.gf - b.ga) - (a.gf - a.ga) || b.gf - a.gf);
}
function divStandings(G, div) { return standings(G, (t) => t.div === div); }
function confStandings(G, conf) { return standings(G, (t) => t.conf === conf); }

/* Playoff field. Divisional format is the interesting one: three from each
   division plus two conference wildcards. */
function playoffField(G, conf) {
  if (ruleValue(G, "playoffFormat") === "seeded") {
    return confStandings(G, conf).slice(0, 8).map((t, i) => ({ team: t, seed: i + 1 }));
  }
  const divs = DIVS.map((_, i) => i).filter((d) => DIV_CONF[d] === conf);
  const top = [], rest = [];
  divs.forEach((d) => {
    const s = divStandings(G, d);
    s.slice(0, 3).forEach((t, i) => top.push({ team: t, div: d, divRank: i + 1 }));
    s.slice(3).forEach((t) => rest.push(t));
  });
  const wc = rest.sort((a, b) => b.pts - a.pts || b.w - a.w).slice(0, 2);
  return { top, wc, divs };
}

/* -------------------------------- playoffs -------------------------------- */

function seriesLen(G) { return ruleValue(G, "seriesLen"); }
function winsNeeded(G) { return Math.ceil(seriesLen(G) / 2); }

function buildBracket(G) {
  const R = ruleValue(G, "playoffFormat");
  const rounds = [];
  const matchups = [];
  [0, 1].forEach((conf) => {
    if (R === "seeded") {
      const f = playoffField(G, conf);
      for (let i = 0; i < 4; i++) matchups.push(mkSeries(G, f[i].team.id, f[7 - i].team.id, conf));
    } else {
      const { top, wc, divs } = playoffField(G, conf);
      // Each division's winner meets a wildcard; 2 vs 3 inside the division.
      const winners = divs.map((d) => top.find((x) => x.div === d && x.divRank === 1).team);
      const better = winners[0].pts >= winners[1].pts ? 0 : 1;
      const pairs = [
        [winners[better], wc[1] || wc[0]],
        [winners[1 - better], wc[0]],
      ];
      pairs.forEach(([a, b]) => { if (a && b) matchups.push(mkSeries(G, a.id, b.id, conf)); });
      divs.forEach((d) => {
        const two = top.find((x) => x.div === d && x.divRank === 2);
        const three = top.find((x) => x.div === d && x.divRank === 3);
        if (two && three) matchups.push(mkSeries(G, two.team.id, three.team.id, conf));
      });
    }
  });
  rounds.push(matchups);
  G.playoffs = { round: 0, rounds, champion: null };
  return G.playoffs;
}
function mkSeries(G, hi, lo, conf) {
  return { hi, lo, conf, w: [0, 0], games: [], done: false, winner: null };
}

function simSeriesGame(G, s) {
  if (s.done) return s;
  const gameNo = s.w[0] + s.w[1];
  // 2-2-1-1-1 home ice.
  const homeIsHi = [0, 1, 4, 6].includes(gameNo);
  const home = homeIsHi ? s.hi : s.lo, away = homeIsHi ? s.lo : s.hi;
  const res = simGame(G, home, away, { playoff: true });
  applyGame(G, res, { playoff: true });
  const hiWon = (res.hg > res.ag) === homeIsHi;
  s.w[hiWon ? 0 : 1]++;
  s.games.push({ home, away, hg: res.hg, ag: res.ag, ot: res.ot });
  const need = winsNeeded(G);
  if (s.w[0] >= need || s.w[1] >= need) {
    s.done = true;
    s.winner = s.w[0] >= need ? s.hi : s.lo;
    const loser = s.winner === s.hi ? s.lo : s.hi;
    if (s.winner === G.userTeam) news(G, `You beat ${G.teams[loser].name} ${s.w[0]}–${s.w[1]}.`, "good");
    if (loser === G.userTeam) news(G, `Eliminated by ${G.teams[s.winner].name}.`, "bad");
  }
  return s;
}

function simPlayoffRound(G) {
  if (!G.playoffs) return G;
  const P = G.playoffs;
  const cur = P.rounds[P.round];
  let guard = 0;
  while (cur.some((s) => !s.done) && guard++ < 60) cur.forEach((s) => simSeriesGame(G, s));
  const winners = cur.map((s) => s.winner);
  if (winners.length === 1) {
    P.champion = winners[0];
    const t = G.teams[P.champion];
    t.cupWins++;
    news(G, `${t.city} ${t.name} win the Cup.`, "good");
    finishSeason(G);
    return G;
  }
  // Reseed inside the conference, then cross over for the final.
  const next = [];
  if (winners.length === 8 || winners.length === 4) {
    [0, 1].forEach((conf) => {
      const cw = cur.filter((s) => s.conf === conf).map((s) => s.winner);
      for (let i = 0; i < cw.length; i += 2) {
        const a = cw[i], b = cw[i + 1];
        if (b == null) { next.push(mkSeries(G, a, a, conf)); continue; }
        const hi = G.teams[a].pts >= G.teams[b].pts ? a : b;
        const lo = hi === a ? b : a;
        next.push(mkSeries(G, hi, lo, conf));
      }
    });
  } else {
    const [a, b] = winners;
    const hi = G.teams[a].pts >= G.teams[b].pts ? a : b;
    next.push(mkSeries(G, hi, hi === a ? b : a, -1));
  }
  P.rounds.push(next);
  P.round++;
  return G;
}

function endRegularSeason(G) {
  G.phase = "playoffs";
  updateRecords(G);
  computeAwards(G);
  buildBracket(G);
  const field = new Set();
  G.playoffs.rounds[0].forEach((s) => { field.add(s.hi); field.add(s.lo); });
  field.forEach((id) => G.teams[id].playoffApps++);
  if (!field.has(G.userTeam)) news(G, "You missed the playoffs.", "bad");
  else news(G, "You're in the playoffs.", "good");
  return G;
}

/* ------------------------------ record book -------------------------------
 * League records survive across seasons, and a player closing on one is worth
 * a line on the wire while it's still in doubt.
 * ------------------------------------------------------------------------- */

const RECORD_DEFS = [
  { key: "goals",   label: "Goals in a season",   pos: "S", get: (s) => s.g },
  { key: "points",  label: "Points in a season",  pos: "S", get: (s) => pts(s) },
  { key: "assists", label: "Assists in a season", pos: "S", get: (s) => s.a },
  { key: "pim",     label: "Penalty minutes",     pos: "S", get: (s) => s.pim },
  { key: "wins",    label: "Wins by a goalie",    pos: "G", get: (s) => s.w },
  { key: "shutouts", label: "Shutouts",           pos: "G", get: (s) => s.so },
];
const MILESTONES = { goals: [40, 50, 60], points: [80, 100, 120] };

function updateRecords(G) {
  G.records = G.records || {};
  RECORD_DEFS.forEach((def) => {
    playersOf(G).forEach((p) => {
      const isG = p.pos === "G";
      if ((def.pos === "G") !== isG) return;
      if (!p.season.gp) return;
      const v = def.get(p.season);
      const cur = G.records[def.key];
      if (!cur || v > cur.v) G.records[def.key] = { v, pid: p.id, name: fullName(p), year: G.year, team: p.teamId };
    });
  });
  return G.records;
}
// Fires while the season is still running, for the user's players only. The
// marks are quoted for an 82-game year and scaled to whatever's being played,
// so a 41-game season still has a fifty-goal equivalent worth chasing.
function checkMilestones(G) {
  const scale = ruleValue(G, "seasonLen") / 82;
  rosterOf(G, G.userTeam).forEach((p) => {
    if (p.pos === "G") return;
    p.marks = p.marks || {};
    Object.entries(MILESTONES).forEach(([k, marks]) => {
      const v = k === "goals" ? p.season.g : pts(p.season);
      marks.forEach((m) => {
        const tag = `${k}${m}`;
        const target = Math.max(5, Math.round(m * scale));
        if (v >= target && !p.marks[tag]) {
          p.marks[tag] = true;
          news(G, `${fullName(p)} reached ${target} ${k} on the season.`, "good");
        }
      });
    });
  });
}

/* ------------------------------ the All-Star break ------------------------ */

function allStarRosters(G) {
  const pickSide = (conf) => {
    const pool = playersOf(G).filter((p) => p.teamId != null && G.teams[p.teamId].conf === conf && p.season.gp > 5);
    const fwd = pool.filter((p) => p.pos !== "D" && p.pos !== "G").sort((a, b) => pts(b.season) - pts(a.season)).slice(0, 6);
    const d = pool.filter((p) => p.pos === "D").sort((a, b) => pts(b.season) - pts(a.season)).slice(0, 3);
    const g = pool.filter((p) => p.pos === "G").sort((a, b) => svPct(b.season) - svPct(a.season)).slice(0, 1);
    return fwd.concat(d, g).map((p) => p.id);
  };
  return { east: pickSide(0), west: pickSide(1) };
}
function runAllStar(G) {
  const rosters = allStarRosters(G);
  const rate = (ids) => ids.map((id) => G.players[id]).filter(Boolean)
    .reduce((s, p) => s + (p.pos === "G" ? 0 : p.r.sht + p.r.hnd), 0);
  const e = rate(rosters.east), w = rate(rosters.west);
  const eastScore = Math.round(6 + gauss(G, (e - w) / 400, 2.2));
  const westScore = Math.round(6 + gauss(G, (w - e) / 400, 2.2));
  const mvpPool = (eastScore >= westScore ? rosters.east : rosters.west).map((id) => G.players[id]).filter(Boolean);
  const mvp = mvpPool.sort((a, b) => pts(b.season) - pts(a.season))[0];
  // Snapshot the club each player was picked for. A selection is a fact about
  // the moment it was made — a deadline trade to the other conference must not
  // retroactively put him on the wrong bench.
  const at = {};
  rosters.east.concat(rosters.west).forEach((id) => { at[id] = G.players[id].teamId; });
  G.allStar = {
    year: G.year, day: G.day, ...rosters,
    east: rosters.east, west: rosters.west, at,
    eastScore: Math.max(0, eastScore), westScore: Math.max(0, westScore),
    mvp: mvp ? mvp.id : null,
  };
  const mine = rosters.east.concat(rosters.west).filter((id) => G.players[id] && G.players[id].teamId === G.userTeam);
  if (mine.length) news(G, `All-Star selections: ${mine.map((id) => fullName(G.players[id])).join(", ")}.`, "good");
  return G.allStar;
}

/* --------------------------------- awards --------------------------------- */

function computeAwards(G) {
  const sk = playersOf(G).filter((p) => p.pos !== "G" && p.season.gp > 10);
  const gs = playersOf(G).filter((p) => p.pos === "G" && p.season.gp > 15);
  const byPts = sk.slice().sort((a, b) => pts(b.season) - pts(a.season) || b.season.g - a.season.g);
  const byGoals = sk.slice().sort((a, b) => b.season.g - a.season.g);
  const byDef = sk.filter((p) => p.pos === "D").sort((a, b) => (b.season.blk + b.season.pm * 3) - (a.season.blk + a.season.pm * 3));
  const byGoalie = gs.slice().sort((a, b) => svPct(b.season) - svPct(a.season));
  const rookies = playersOf(G).filter((p) => p.rookie && p.season.gp > 10)
    .sort((a, b) => pts(b.season) - pts(a.season));
  const A = {
    year: G.year,
    scoring: byPts[0] ? byPts[0].id : null,
    goals: byGoals[0] ? byGoals[0].id : null,
    mvp: byPts[0] ? byPts[0].id : null,
    defence: byDef[0] ? byDef[0].id : null,
    goalie: byGoalie[0] ? byGoalie[0].id : null,
    rookie: rookies[0] ? rookies[0].id : null,
  };
  Object.entries(A).forEach(([k, id]) => {
    if (k === "year" || id == null) return;
    const p = G.players[id];
    if (p) p.trophies.push({ year: G.year, award: k });
  });
  G.awards = A;
  return A;
}

/* ------------------------------ end of season ----------------------------- */

function finishSeason(G) {
  G.phase = "offseason";
  G.offseasonStep = "review";
  const champ = G.playoffs && G.playoffs.champion;
  G.history.push({
    year: G.year,
    champion: champ,
    standings: G.teams.map((t) => ({ id: t.id, w: t.w, l: t.l, otl: t.otl, pts: t.pts })),
    awards: G.awards,
    userRecord: { w: G.teams[G.userTeam].w, l: G.teams[G.userTeam].l, otl: G.teams[G.userTeam].otl, pts: G.teams[G.userTeam].pts },
  });
  // Board reaction: making the playoffs is the baseline expectation.
  const me = G.teams[G.userTeam];
  const made = G.playoffs && G.playoffs.rounds[0].some((s) => s.hi === G.userTeam || s.lo === G.userTeam);
  let swing = made ? 6 : -12;
  if (champ === G.userTeam) swing = 30;
  G.boardConfidence = clamp(G.boardConfidence + (swing < 0 ? swing / diff(G).patience : swing * diff(G).patience), 0, 100);

  // Ageing, progression and contract expiry all happen HERE rather than at the
  // rollover, so that the offseason screens show next year's ratings and a real
  // free-agent class instead of last year's leftovers.
  playersOf(G).forEach((p) => {
    if (p.season.gp) {
      // The shot maps are a this-season view; carrying nine net cells and three
      // ice zones into every career row for every player is what pushes a long
      // save past the storage ceiling.
      const { z, net, ...totals } = p.season;
      p.career.push({ year: G.year, teamId: p.teamId, ...totals });
    }
    p.stats = p.season;
    p.season = blankStats(p.pos);
    p.po = null;
    p.rookie = false;
    p.age++;
    p.inj = 0; p.injDesc = ""; p.fatigue = 0;
    progress(G, p);
    if (p.contract.yrs > 0) p.contract.yrs--;
  });
  playersOf(G).forEach((p) => {
    if (p.retired || p.teamId == null) return;
    if (rnd(G) < retirementChance(G, p)) {
      if (p.teamId === G.userTeam) news(G, `${fullName(p)} retires at ${p.age}.`, "info");
      // A long server who was genuinely good gets his number hung up by the club
      // he gave the most seasons to.
      const byClub = {};
      (p.career || []).forEach((c) => { if (c.teamId != null) byClub[c.teamId] = (byClub[c.teamId] || 0) + 1; });
      const home = Object.keys(byClub).sort((a, b) => byClub[b] - byClub[a])[0];
      const careerPts = (p.career || []).reduce((s, c) => s + (c.g || 0) + (c.a || 0), 0);
      const careerGp = (p.career || []).reduce((s, c) => s + (c.gp || 0), 0);
      // A rate, not a total — otherwise a short-season league never honours
      // anybody and an 82-game one honours half the roster.
      const ppg = careerGp ? careerPts / careerGp : 0;
      if (home != null && byClub[home] >= 4 && (ppg >= 0.65 || p.trophies.length >= 1)) {
        const t = G.teams[+home];
        t.honours = t.honours || [];
        t.honours.push({ pid: p.id, name: fullName(p), pos: p.pos, seasons: byClub[home], pts: careerPts, year: G.year });
        news(G, `${G.teams[+home].name} will honour ${fullName(p)} after ${byClub[home]} seasons.`, "good");
      }
      p.teamId = null; p.retired = true;
      const i = G.freeAgents.indexOf(p.id); if (i >= 0) G.freeAgents.splice(i, 1);
      return;
    }
    if (p.contract.yrs <= 0) {
      p.teamId = null; p.farm = false;
      if (!G.freeAgents.includes(p.id)) G.freeAgents.push(p.id);
    }
  });
  G.teams.forEach((t) => { t.lines = null; });

  // Every club keeps its own season-by-season record, which is what a franchise
  // history page is made of.
  const champ2 = G.playoffs && G.playoffs.champion;
  const madeIt = (id) => G.playoffs && G.playoffs.rounds[0].some((s) => s.hi === id || s.lo === id);
  const roundsWon = (id) => (G.playoffs ? G.playoffs.rounds.filter((rd) => rd.some((s) => s.winner === id)).length : 0);
  G.teams.forEach((t) => {
    t.seasons = t.seasons || [];
    t.seasons.push({
      year: G.year, w: t.w, l: t.l, otl: t.otl, pts: t.pts, gf: t.gf, ga: t.ga,
      playoffs: madeIt(t.id), rounds: roundsWon(t.id), cup: champ2 === t.id,
    });
    t.honours = t.honours || [];
  });

  // Retained salary burns down with the contract it came from; waivers and
  // waived no-trade clauses don't carry over.
  G.retained = (G.retained || []).map((r) => ({ ...r, yrs: r.yrs - 1 })).filter((r) => r.yrs > 0);
  G.waivers = [];
  playersOf(G).forEach((p) => {
    p.ntcWaived = false;
    if (p.farmSeason) {
      p.farmCareer = (p.farmCareer || []).concat([{ year: G.year, ...p.farmSeason }]);
      p.farmSeason = null;
    }
  });

  buildDraftClass(G);
  return G;
}

/* Nobody should start a season unable to ice a legal lineup. After free agency
   has run its course, any club still short is topped up with depth bodies. */
function fillRosters(G) {
  const need = { G: 2, D: 6, C: 4, LW: 3, RW: 3 };
  G.teams.forEach((t) => {
    Object.entries(need).forEach(([pos, n]) => {
      let have = rosterOf(G, t.id, true).filter((p) => p.pos === pos).length;
      while (have < n) {
        const p = genPlayer(G, pos, 40, ri(G, 20, 27));
        p.teamId = t.id;
        p.contract = { amt: MIN_SALARY, yrs: ri(G, 1, 2) };
        G.players[p.id] = p;
        have++;
      }
    });
    // Recall from the farm first, and only then sign bodies off the street.
    const short = 20 - rosterOf(G, t.id).length;
    if (short > 0) {
      rosterOf(G, t.id, true).filter((p) => p.farm).sort((a, b) => b.ovr - a.ovr)
        .slice(0, short).forEach((p) => { p.farm = false; });
    }
    let guard = 0;
    while (rosterOf(G, t.id).length < 20 && guard++ < 12) {
      const p = genPlayer(G, pick(G, ["C", "LW", "RW", "D"]), 40, ri(G, 20, 27));
      p.teamId = t.id;
      p.contract = { amt: MIN_SALARY, yrs: 1 };
      G.players[p.id] = p;
    }
    t.lines = null;
  });
  return G;
}

/* --------------------------------- draft ---------------------------------- */

function buildDraftClass(G) {
  G.draftClass = [];
  for (let i = 0; i < 64; i++) {
    const p = genPlayer(G, pick(G, ["C", "C", "LW", "RW", "D", "D", "G"]), 44 + (64 - i) * 0.16, 18);
    p.pot = Math.round(clamp(p.ovr + gauss(G, 18, 7), p.ovr + 2, 99));
    p.rookie = true;
    G.players[p.id] = p;
    G.draftClass.push(p.id);
  }
  // Lottery order: non-playoff teams worst-first, with a real lottery on top.
  const nonPlayoff = G.teams.filter((t) => !inPlayoffs(G, t.id)).sort((a, b) => a.pts - b.pts);
  const playoffTeams = G.teams.filter((t) => inPlayoffs(G, t.id)).sort((a, b) => a.pts - b.pts);
  const order = nonPlayoff.map((t) => t.id);
  // Weighted lottery for the top pick among the bottom ten.
  const pool = order.slice(0, 10);
  if (pool.length) {
    const wts = pool.map((_, i) => Math.pow(pool.length - i, 1.6));
    const tot = wts.reduce((a, b) => a + b, 0);
    let x = rnd(G) * tot, winner = pool[0];
    for (let i = 0; i < pool.length; i++) { x -= wts[i]; if (x <= 0) { winner = pool[i]; break; } }
    order.splice(order.indexOf(winner), 1);
    order.unshift(winner);
  }
  G.draftOrder = order.concat(playoffTeams.map((t) => t.id));
  G.draftPick = 0;
  return G.draftClass;
}
function inPlayoffs(G, teamId) {
  if (!G.playoffs) return false;
  return G.playoffs.rounds[0].some((s) => s.hi === teamId || s.lo === teamId);
}
// Whose turn it is, following traded picks.
function pickOwner(G, index) {
  const round = Math.floor(index / G.teams.length) + 1;
  const orig = G.draftOrder[index % G.teams.length];
  const rec = G.picks.find((pk) => pk.year === G.year && pk.round === round && pk.orig === orig);
  return rec ? rec.owner : orig;
}
function draftPlayer(G, pid) {
  // draftPick counts picks made overall; the class shrinks as it goes, so the
  // two must never be compared against each other.
  if (!G.draftClass.length || G.draftPick >= G.teams.length * 2) return false;
  const team = pickOwner(G, G.draftPick);
  const p = G.players[pid];
  if (!p || !G.draftClass.includes(pid)) return false;
  p.teamId = team;
  p.farm = true;
  p.contract = { amt: ELC_SALARY, yrs: 3 };
  G.draftClass.splice(G.draftClass.indexOf(pid), 1);
  G.draftPick++;
  if (team === G.userTeam) news(G, `Drafted ${fullName(p)} (${p.pos}, ${p.ovr} ovr / ${p.pot} pot).`, "good");
  return true;
}
function autoDraft(G, stopAtUser) {
  let guard = 0;
  while (G.draftPick < G.teams.length * 2 && G.draftClass.length && guard++ < 200) {
    const team = pickOwner(G, G.draftPick);
    if (stopAtUser && team === G.userTeam) return false;
    const best = G.draftClass
      .map((id) => G.players[id])
      .sort((a, b) => (b.pot * 0.7 + b.ovr * 0.3) - (a.pot * 0.7 + a.ovr * 0.3))[0];
    draftPlayer(G, best.id);
  }
  return true;
}

/* ------------------------------ free agency ------------------------------- */

function contractOffer(G, p, amt, yrs) {
  const want = marketValue(G, p) * diff(G).askPrice;
  const yearBonus = yrs >= 4 ? 0.94 : yrs === 1 ? 1.08 : 1;
  return amt >= want * yearBonus * (0.92 + rnd(G) * 0.16);
}
function signPlayer(G, pid, teamId, amt, yrs) {
  const p = G.players[pid];
  if (!p) return { ok: false, why: "no such player" };
  const R = rules(G);
  if (R.hardCap && capHit(G, teamId) + amt > R.capAmount) return { ok: false, why: "no cap space" };
  if (rosterOf(G, teamId, true).length >= ROSTER_MAX + FARM_MAX) return { ok: false, why: "roster full" };
  p.teamId = teamId; p.farm = rosterOf(G, teamId).length >= ROSTER_MAX;
  p.contract = { amt: round1(amt), yrs };
  p.ntc = eligibleForNtc(p) && yrs >= 3 && rnd(G) < 0.55;
  p.ntcWaived = false;
  const i = G.freeAgents.indexOf(pid);
  if (i >= 0) G.freeAgents.splice(i, 1);
  G.teams[teamId].lines = null;
  return { ok: true };
}
function aiFreeAgency(G) {
  const order = G.teams.map((t) => t.id).filter((id) => id !== G.userTeam)
    .sort((a, b) => capSpace(G, b) - capSpace(G, a));
  let guard = 0;
  while (G.freeAgents.length && guard++ < 400) {
    let signedAny = false;
    for (const tid of order) {
      const roster = rosterOf(G, tid);
      if (roster.length >= ROSTER_MAX) continue;
      const needG = roster.filter((p) => p.pos === "G").length < 2;
      const needD = roster.filter((p) => p.pos === "D").length < 6;
      const cands = G.freeAgents.map((id) => G.players[id]).filter((p) => {
        if (needG) return p.pos === "G";
        if (needD) return p.pos === "D";
        return true;
      });
      const best = cands.sort((a, b) => b.ovr - a.ovr)[0];
      if (!best) continue;
      const yrs = ri(G, 1, 5);
      const ask = askingPrice(G, best.id, tid, yrs);
      if (rules(G).hardCap && capHit(G, tid) + ask > rules(G).capAmount) continue;
      signPlayer(G, best.id, tid, ask, yrs);
      signedAny = true;
    }
    if (!signedAny) break;
  }
  // Anyone left goes on a minimum deal somewhere with room, or stays unsigned.
  return G;
}

/* --------------------------------- trades --------------------------------- */

function tradeValue(G, p) {
  const age = p.age;
  let v = Math.pow(Math.max(0, p.ovr - 40) / 10, 2.2);
  v += Math.max(0, p.pot - p.ovr) * (age < 24 ? 0.55 : 0.15);
  if (age > 31) v *= Math.max(0.35, 1 - (age - 31) * 0.13);
  // A contract well above market is a liability, not an asset.
  const mv = marketValue(G, p);
  v *= clamp(1 + (mv - p.contract.amt) * 0.09, 0.35, 1.6);
  return Math.max(0.2, v);
}
function pickValue(G, pk) {
  const base = pk.round === 1 ? 9 : 2.5;
  const yearsOut = pk.year - G.year;
  return base * Math.pow(0.88, Math.max(0, yearsOut));
}
/* The deadline. Trades run from the offseason through roughly three quarters of
   the schedule, then the rosters are locked for the run-in and the playoffs. */
function deadlineDay(G) { return Math.floor(G.schedule.length * 0.74); }
function tradesOpen(G) {
  if (G.phase === "playoffs") return false;
  if (G.phase !== "regular") return true;
  return G.day <= deadlineDay(G);
}
function daysToDeadline(G) {
  return G.phase === "regular" ? deadlineDay(G) - G.day : null;
}

/* A no-trade clause is the price of signing a star in his prime. It can be
   waived, but only if the player has a reason to want out. */
function eligibleForNtc(p) { return p.ovr >= 76 && p.age >= 26; }
function hasNtc(p) { return !!p.ntc && !p.ntcWaived; }
function requestNtcWaiver(G, pid) {
  const p = G.players[pid];
  if (!p || !p.ntc) return { ok: false, why: "no clause to waive" };
  if (p.ntcWaived) return { ok: true, why: "already waived" };
  const t = G.teams[p.teamId];
  // A player on a sinking club, or one who's been here a while, is likelier to
  // accept a move. A contender in first place is not somewhere you leave.
  const pos = standings(G).findIndex((x) => x.id === t.id);
  let chance = 0.18 + (pos / G.teams.length) * 0.5 + Math.max(0, p.age - 31) * 0.04;
  if (p.contract.yrs <= 1) chance += 0.18;
  chance = clamp(chance, 0.05, 0.9);
  if (rnd(G) < chance) {
    p.ntcWaived = true;
    news(G, `${fullName(p)} has agreed to waive his no-trade clause.`, "info");
    return { ok: true, why: "he'll go" };
  }
  return { ok: false, why: "he won't waive it" };
}

function evalTrade(G, aId, aPlayers, aPicks, bId, bPlayers, bPicks, opts) {
  opts = opts || {};
  const R = rules(G);
