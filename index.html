  const aOut = aPlayers.map((id) => G.players[id]);
  const bOut = bPlayers.map((id) => G.players[id]);
  if (aOut.some((p) => !p || p.teamId !== aId) || bOut.some((p) => !p || p.teamId !== bId))
    return { ok: false, why: "a player isn't on that roster" };
  if (!tradesOpen(G)) return { ok: false, why: G.phase === "playoffs" ? "the roster is frozen for the playoffs" : "the trade deadline has passed" };
  const locked = aOut.concat(bOut).find((p) => hasNtc(p));
  if (locked) return { ok: false, why: `${fullName(locked)} has a no-trade clause` };

  // Retained salary: the sending club keeps a share of an outgoing contract.
  const retain = opts.retain || {};
  const retainAmt = (p, from) => {
    const pct = clamp(retain[p.id] || 0, 0, R.retainedSalary ? RETAIN_MAX_PCT : 0);
    return round1(p.contract.amt * pct);
  };
  const aRetain = aOut.reduce((s, p) => s + retainAmt(p, aId), 0);
  const bRetain = bOut.reduce((s, p) => s + retainAmt(p, bId), 0);
  if (aRetain > 0 && retainedBy(G, aId).length + aOut.filter((p) => retain[p.id]).length > MAX_RETAINED)
    return { ok: false, why: `${G.teams[aId].abbr} can only retain ${MAX_RETAINED} contracts` };
  if (bRetain > 0 && retainedBy(G, bId).length + bOut.filter((p) => retain[p.id]).length > MAX_RETAINED)
    return { ok: false, why: `${G.teams[bId].abbr} can only retain ${MAX_RETAINED} contracts` };

  const aSalOut = aOut.reduce((s, p) => s + effectiveCap(G, p), 0) - aRetain;
  const bSalOut = bOut.reduce((s, p) => s + effectiveCap(G, p), 0) - bRetain;
  if (R.hardCap) {
    if (capHit(G, aId) - aSalOut + bSalOut > R.capAmount) return { ok: false, why: `${G.teams[aId].abbr} would be over the cap` };
    if (capHit(G, bId) - bSalOut + aSalOut > R.capAmount) return { ok: false, why: `${G.teams[bId].abbr} would be over the cap` };
  }
  const aSize = rosterOf(G, aId, true).length - aOut.length + bOut.length;
  const bSize = rosterOf(G, bId, true).length - bOut.length + aOut.length;
  if (aSize > ROSTER_MAX + FARM_MAX || bSize > ROSTER_MAX + FARM_MAX) return { ok: false, why: "roster limit" };

  // Salary a club keeps is salary it paid for nothing, so retaining sweetens
  // the deal for the side receiving the player.
  const aVal = aOut.reduce((s, p) => s + tradeValue(G, p), 0) + aPicks.reduce((s, pk) => s + pickValue(G, pk), 0) + aRetain * 0.5;
  const bVal = bOut.reduce((s, p) => s + tradeValue(G, p), 0) + bPicks.reduce((s, pk) => s + pickValue(G, pk), 0) + bRetain * 0.5;
  // The AI wants a margin, and wants more of one on Cutthroat.
  const margin = aId === G.userTeam ? diff(G).askPrice : 1;
  const accepted = aVal >= bVal * margin * 0.97;
  return { ok: accepted, aVal: round1(aVal), bVal: round1(bVal), aRetain, bRetain,
    why: accepted ? "accepted" : "they want more back" };
}
function doTrade(G, aId, aPlayers, aPicks, bId, bPlayers, bPicks, opts) {
  opts = opts || {};
  const ev = evalTrade(G, aId, aPlayers, aPicks, bId, bPlayers, bPicks, opts);
  if (!ev.ok) return ev;
  const retain = opts.retain || {};
  G.retained = G.retained || [];
  const bank = (p, from) => {
    const pct = clamp(retain[p.id] || 0, 0, rules(G).retainedSalary ? RETAIN_MAX_PCT : 0);
    if (pct <= 0) return;
    G.retained.push({ pid: p.id, from, amt: round1(p.contract.amt * pct), yrs: p.contract.yrs });
  };
  aPlayers.forEach((id) => { bank(G.players[id], aId); G.players[id].teamId = bId; G.players[id].farm = false; });
  bPlayers.forEach((id) => { bank(G.players[id], bId); G.players[id].teamId = aId; G.players[id].farm = false; });
  aPicks.forEach((pk) => { const r = G.picks.find((x) => x.year === pk.year && x.round === pk.round && x.orig === pk.orig); if (r) r.owner = bId; });
  bPicks.forEach((pk) => { const r = G.picks.find((x) => x.year === pk.year && x.round === pk.round && x.orig === pk.orig); if (r) r.owner = aId; });
  G.teams[aId].lines = null; G.teams[bId].lines = null;
  news(G, `Trade with ${G.teams[bId].name}: out ${aPlayers.length} / in ${bPlayers.length}.`, "info");
  return ev;
}

/* ---------------------------------- waivers -------------------------------
 * A young player can be shuttled to the farm freely. Once he's established, he
 * has to clear waivers first — and a rival with room can simply take him.
 * ------------------------------------------------------------------------- */

const WAIVER_EXEMPT_GAMES = 40;
function nhlGames(p) {
  return (p.season.gp || 0) + (p.career || []).reduce((s, c) => s + (c.gp || 0), 0);
}
function needsWaivers(G, p) {
  return !p.farm && p.age >= 22 && nhlGames(p) >= WAIVER_EXEMPT_GAMES;
}
function sendDown(G, pid) {
  const p = G.players[pid];
  if (!p || p.teamId == null) return { ok: false, why: "not on your roster" };
  if (p.farm) return { ok: false, why: "already on the farm" };
  if (!needsWaivers(G, p)) {
    p.farm = true;
    G.teams[p.teamId].lines = null;
    return { ok: true, waivers: false };
  }
  G.waivers = G.waivers || [];
  if (G.waivers.some((w) => w.pid === pid)) return { ok: false, why: "already on waivers" };
  G.waivers.push({ pid, from: p.teamId, day: G.day, year: G.year });
  return { ok: true, waivers: true };
}
function recall(G, pid) {
  const p = G.players[pid];
  if (!p || !p.farm) return { ok: false, why: "not on the farm" };
  if (rosterOf(G, p.teamId).length >= ROSTER_MAX) return { ok: false, why: "NHL roster is full" };
  p.farm = false;
  G.teams[p.teamId].lines = null;
  return { ok: true };
}
// Anyone placed before today gets picked over, worst club first.
function processWaivers(G) {
  if (!G.waivers || !G.waivers.length) return G;
  const ready = G.waivers.filter((w) => w.day < G.day);
  G.waivers = G.waivers.filter((w) => w.day >= G.day);
  ready.forEach((w) => {
    const p = G.players[w.pid];
    if (!p || p.teamId !== w.from) return;
    const order = G.teams.filter((t) => t.id !== w.from)
      .sort((a, b) => a.pts - b.pts || a.gf - b.gf);
    for (const t of order) {
      if (rosterOf(G, t.id).length >= ROSTER_MAX) continue;
      if (rules(G).hardCap && capHit(G, t.id) + effectiveCap(G, p) > rules(G).capAmount) continue;
      // A club claims when the player would genuinely improve it.
      const worst = rosterOf(G, t.id).filter((x) => x.pos === p.pos).sort((a, b) => a.ovr - b.ovr)[0];
      if (!worst || p.ovr <= worst.ovr + 2) continue;
      if (rnd(G) > 0.55) continue;
      p.teamId = t.id; p.farm = false;
      G.teams[w.from].lines = null; G.teams[t.id].lines = null;
      if (w.from === G.userTeam) news(G, `${fullName(p)} was claimed on waivers by ${G.teams[t.id].name}.`, "bad");
      if (t.id === G.userTeam) news(G, `Claimed ${fullName(p)} on waivers.`, "good");
      return;
    }
    // Cleared.
    p.farm = true;
    G.teams[w.from].lines = null;
    if (w.from === G.userTeam) news(G, `${fullName(p)} cleared waivers and reported to the farm.`, "info");
  });
  return G;
}

/* ------------------------------- negotiation ------------------------------
 * A free agent has a number in mind. Term moves it, the club's situation moves
 * it, and lowballing gets you a counter rather than a signature.
 * ------------------------------------------------------------------------- */

function askingPrice(G, pid, teamId, yrs) {
  const p = G.players[pid];
  if (!p) return 0;
  let want = marketValue(G, p) * diff(G).askPrice;
  // Long term is security, so it comes a little cheaper per year; a one-year
  // "prove it" deal costs a premium.
  want *= yrs >= 5 ? 0.9 : yrs === 4 ? 0.95 : yrs === 1 ? 1.12 : 1;
  if (teamId != null) {
    const t = G.teams[teamId];
    const pos = standings(G).findIndex((x) => x.id === teamId);
    // Winners get a discount; a club at the bottom has to overpay.
    want *= 1 + (pos / G.teams.length - 0.5) * 0.16;
    want *= 1 - (t.cupWins > 0 ? 0.03 : 0);
  }
  return round1(Math.max(MIN_SALARY, want));
}
function negotiate(G, pid, teamId, amt, yrs) {
  const p = G.players[pid];
  if (!p) return { ok: false, why: "no such player" };
  const want = askingPrice(G, pid, teamId, yrs);
  if (amt >= want) return { ok: true, want };
  // Close offers get one counter; insulting ones get a flat no.
  if (amt >= want * 0.82) return { ok: false, counter: want, counterYrs: yrs, why: `he wants $${want}M × ${yrs}` };
  return { ok: false, want, why: "not interested at that number" };
}

/* --------------------------- prospect development -------------------------
 * Draftees don't just sit in a warehouse. They play a farm season, produce a
 * stat line, and develop faster than they would riding an NHL bench.
 * ------------------------------------------------------------------------- */

const FARM_READY = 4;   // within this of his ceiling, he's knocking on the door
function isProspect(p) { return !!p.farm && p.age <= 23 && !p.retired; }
function prospectReady(G, p) {
  return p.farm && (p.ovr >= 58 || p.pot - p.ovr <= FARM_READY);
}
// Farm production, worked out once per game day rather than simulated shift by
// shift — the farm is a development track, not a league you manage.
function simFarmDay(G, teamId) {
  rosterOf(G, teamId, true).filter((p) => p.farm && p.pos !== "G" && p.inj <= 0).forEach((p) => {
    if (!p.farmSeason) p.farmSeason = { gp: 0, g: 0, a: 0 };
    p.farmSeason.gp++;
    const rate = clamp((p.ovr - 30) / 100, 0.05, 0.95);
    if (rnd(G) < rate * 0.32) p.farmSeason.g++;
    if (rnd(G) < rate * 0.46) p.farmSeason.a++;
  });
  rosterOf(G, teamId, true).filter((p) => p.farm && p.pos === "G" && p.inj <= 0).forEach((p) => {
    if (!p.farmSeason) p.farmSeason = { gp: 0, g: 0, a: 0 };
    if (rnd(G) < 0.5) p.farmSeason.gp++;
  });
}

/* ----------------------------- deadline trading ---------------------------
 * On deadline day the league sorts itself into buyers and sellers: clubs out of
 * the race move expiring veterans to contenders for picks.
 * ------------------------------------------------------------------------- */

function aiDeadlineMoves(G) {
  const table = standings(G);
  const cut = Math.floor(G.teams.length / 2);
  const buyers = table.slice(0, cut).map((t) => t.id).filter((id) => id !== G.userTeam);
  const sellers = table.slice(cut).map((t) => t.id).filter((id) => id !== G.userTeam);
  let done = 0;
  sellers.forEach((sid) => {
    if (done >= 6) return;
    const rental = rosterOf(G, sid)
      .filter((p) => p.contract.yrs <= 1 && p.age >= 27 && p.ovr >= 62 && !hasNtc(p))
      .sort((a, b) => b.ovr - a.ovr)[0];
    if (!rental) return;
    for (const bid of buyers) {
      const pick = (G.picks || []).find((pk) => pk.owner === bid && pk.year > G.year && pk.round === (rental.ovr >= 72 ? 1 : 2));
      if (!pick) continue;
      const ev = doTrade(G, sid, [rental.id], [], bid, [], [pick]);
      if (ev.ok) {
        done++;
        news(G, `${G.teams[sid].abbr} sent ${fullName(rental)} to ${G.teams[bid].abbr} for a pick.`, "info");
        break;
      }
    }
  });
  return G;
}

/* ------------------------------ the rollover ------------------------------ */

function progress(G, p) {
  const peak = p.pos === "G" ? 28 : 26;
  const keys = p.pos === "G" ? GOALIE_KEYS : SKATER_KEYS;
  let delta;
  if (p.age < peak) delta = gauss(G, 2.6 + (p.pot - p.ovr) * 0.09, 1.7);
  else if (p.age < peak + 4) delta = gauss(G, 0.2, 1.4);
  else delta = gauss(G, -(p.age - peak - 3) * 0.95, 1.5);
  // A young player developing on the farm improves faster than one riding an
  // NHL bench for eight minutes a night.
  if (p.farm && p.age <= 23) delta += 1.5;
  keys.forEach((k) => {
    if (p.r[k] == null) return;
    p.r[k] = Math.round(clamp(p.r[k] + delta + gauss(G, 0, 1.1), 15, 99));
  });
  p.ovr = ovrOf(p);
  p.pot = Math.max(p.ovr, p.pot - (p.age > peak ? 2 : 0));
}
function retirementChance(G, p) {
  if (p.age < 32) return 0;
  const decline = (p.age - 32) * 0.09 + Math.max(0, (55 - p.ovr)) * 0.012;
  return clamp(decline, 0, 0.95);
}

function startNextSeason(G) {
  applyPendingRules(G);
  G.year++;
  // Ageing and contract expiry already happened at the end of the playoffs.
  // What's left is to fill out the league and rebuild the calendar.
  aiFreeAgency(G);
  fillRosters(G);
  // Reset the league.
  G.teams.forEach((t) => {
    t.w = 0; t.l = 0; t.otl = 0; t.pts = 0; t.gf = 0; t.ga = 0; t.gp = 0; t.streak = 0; t.l10 = [];
    t.lines = null;
  });
  G.results = [];
  G.playoffs = null;
  G.awards = null;
  G.allStar = null;
  G.lastGame = null;
  // The logs are a this-season view; a career's worth would dwarf the save.
  G.shotLog = {};
  G.gameLog = {};
  G.phase = "regular";
  G.offseasonStep = null;
  playersOf(G).forEach((p) => { p.marks = null; });
  pruneSave(G);
  seedPicks(G, G.year + 2, 1);
  G.picks = G.picks.filter((pk) => pk.year >= G.year);
  buildSchedule(G);
  G.teams.forEach((t) => ensureLines(G, t.id));
  return G;
}

/* -------------------------------- persistence -----------------------------
 * A save grows by roughly a tenth of a megabyte a season, so a long career would
 * eventually walk into the storage ceiling. Retired players keep a career total
 * rather than a row per season, and nobody who has left the league entirely is
 * carried forever.
 * ------------------------------------------------------------------------- */

function pruneSave(G) {
  const keep = [];
  playersOf(G).forEach((p) => {
    if (!p.retired) return;
    // Collapse a retired player's season-by-season line into one total.
    if (p.career && p.career.length > 1) {
      const tot = p.career.reduce((acc, c) => {
        Object.keys(c).forEach((k) => {
          if (k === "year" || k === "teamId" || k === "z") return;
          acc[k] = (acc[k] || 0) + (c[k] || 0);
        });
        return acc;
      }, { year: p.career[0].year, to: p.career[p.career.length - 1].year, teamId: p.career[0].teamId, total: true });
      p.career = [tot];
    }
    // Blank rather than null: plenty of code walks every player and reads these.
    p.season = blankStats(p.pos); p.stats = blankStats(p.pos);
    p.po = null; p.farmSeason = null; p.farmCareer = null; p.marks = null;
    // Anyone with no trophies and no honours is not history, just clutter.
    const honoured = G.teams.some((t) => (t.honours || []).some((h) => h.pid === p.id));
    if (!honoured && !(p.trophies || []).length) keep.push(p.id);
  });
  // Keep the most recent departures around so history pages can still name them.
  keep.slice(0, Math.max(0, keep.length - 250)).forEach((id) => { delete G.players[id]; });
  if (G.results.length > 900) G.results.splice(0, G.results.length - 900);
  if (G.news.length > 80) G.news.length = 80;
  return G;
}

/* -------------------------------- storage --------------------------------- */

/* Saves live in IndexedDB, which has room to spare; localStorage is the fallback
   when IndexedDB isn't there or refuses. Slot metadata always goes to
   localStorage so the splash screen can list careers synchronously. */
const SAVE_PREFIX = "pgmh:";
const DB_NAME = "pgmh", DB_STORE = "saves";
const saveKey = (slot) => `${SAVE_PREFIX}slot${slot}`;
const metaKey = (slot) => `${SAVE_PREFIX}meta${slot}`;

let _db = null, _dbDead = false;
function openDb() {
  return new Promise((res, rej) => {
    if (_db) return res(_db);
    if (_dbDead || typeof indexedDB === "undefined") return rej(new Error("no indexeddb"));
    let req;
    try { req = indexedDB.open(DB_NAME, 1); } catch (e) { _dbDead = true; return rej(e); }
    req.onupgradeneeded = () => { try { req.result.createObjectStore(DB_STORE); } catch (e) {} };
    req.onsuccess = () => { _db = req.result; res(_db); };
    req.onerror = () => { _dbDead = true; rej(req.error); };
  });
}
function idbPut(key, val) {
  return openDb().then((db) => new Promise((res, rej) => {
    const tx = db.transaction(DB_STORE, "readwrite");
    tx.objectStore(DB_STORE).put(val, key);
    tx.oncomplete = () => res(true);
    tx.onerror = () => rej(tx.error);
  }));
}
function idbGet(key) {
  return openDb().then((db) => new Promise((res, rej) => {
    const tx = db.transaction(DB_STORE, "readonly");
    const r = tx.objectStore(DB_STORE).get(key);
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  }));
}
function idbDel(key) {
  return openDb().then((db) => new Promise((res) => {
    const tx = db.transaction(DB_STORE, "readwrite");
    tx.objectStore(DB_STORE).delete(key);
    tx.oncomplete = () => res(true);
    tx.onerror = () => res(false);
  }));
}

/* Both stores get every save, wrapped with a timestamp, and a load takes
   whichever is newer. localStorage is written synchronously so a save can never
   be lost to an in-flight IndexedDB transaction; IndexedDB is the one with room
   to spare if the save outgrows the 5MB quota. */
function saveGame(G, slot) {
  const t = G.teams[G.userTeam];
  const at = Date.now();
  let payload;
  try { payload = JSON.stringify({ at, data: G }); } catch (e) { return false; }
  let wroteLocal = false;
  try {
    localStorage.setItem(saveKey(slot), payload);
    wroteLocal = true;
  } catch (e) { /* quota — IndexedDB has to carry it */ }
  try {
    localStorage.setItem(metaKey(slot), JSON.stringify({
      team: t.name, city: t.city, year: G.year, phase: G.phase, cups: t.cupWins,
      record: `${t.w}-${t.l}-${t.otl}`, at,
    }));
  } catch (e) {}
  idbPut(saveKey(slot), payload).catch(() => {});
  return wroteLocal;
}
// Accepts both the wrapped format and the bare game object older saves used.
function unwrap(raw) {
  if (!raw) return null;
  try {
    const v = JSON.parse(raw);
    if (v && v.data && v.at) return { at: v.at, g: v.data };
    return { at: 0, g: v };
  } catch (e) { return null; }
}
function loadGame(slot) {
  const local = unwrap(localStorage.getItem(saveKey(slot)));
  return idbGet(saveKey(slot))
    .catch(() => null)
    .then((v) => {
      const remote = unwrap(v);
      const best = !remote ? local : !local ? remote : (remote.at > local.at ? remote : local);
      return best ? migrate(best.g) : null;
    })
    .catch(() => (local ? migrate(local.g) : null));
}
function slotMeta(slot) {
  try { const m = localStorage.getItem(metaKey(slot)); return m ? JSON.parse(m) : null; }
  catch (e) { return null; }
}
function deleteSlot(slot) {
  try { localStorage.removeItem(saveKey(slot)); localStorage.removeItem(metaKey(slot)); } catch (e) {}
  idbDel(saveKey(slot)).catch(() => {});
}

/* One sortable table used everywhere, so every column header in the game sorts
   without each screen reinventing it. */
function SortTable({ cols, rows, initial, asc, rowKey, rowCls, onRow, min, empty }) {
  const [sk, setSk] = useState(initial || cols[0].key);
  const [dir, setDir] = useState(asc ? -1 : 1);   // 1 = descending
  const col = cols.find((c) => c.key === sk) || cols[0];
  const sorted = useMemo(() => rows.slice().sort((a, b) => {
    const va = col.get(a), vb = col.get(b);
    if (typeof va === "string" || typeof vb === "string")
      return dir * String(vb || "").localeCompare(String(va || ""));
    return dir * ((vb || 0) - (va || 0));
  }), [rows, sk, dir]);
  const click = (c) => {
    if (c.key === sk) setDir(-dir);
    else { setSk(c.key); setDir(c.asc ? -1 : 1); }
  };
  if (!rows.length) return <div className="px-3 py-4 text-sm text-slate-500">{empty || "Nothing here yet."}</div>;
  return (
    <div className="overflow-x-auto">
      <table className="w-full" style={{ minWidth: min || 640 }}>
        <thead>
          <tr className="border-b border-[#1e2b45]">
            {cols.map((c) => (
              <th key={c.key} onClick={() => click(c)}
                className={`text-left font-medium text-[11px] uppercase tracking-wide px-2 py-1.5 cursor-pointer select-none whitespace-nowrap
                  ${sk === c.key ? "text-sky-300" : "text-slate-400 hover:text-slate-200"} ${c.thCls || ""}`}>
                {c.label}{sk === c.key ? (dir === 1 ? " ↓" : " ↑") : ""}
              </th>
            ))}
          </tr>
        </thead>
        <tbody>
          {sorted.map((r, i) => (
            <tr key={rowKey ? rowKey(r) : i}
              onClick={onRow ? () => onRow(r) : undefined}
              className={`border-b border-[#16223a] ${onRow ? "cursor-pointer" : ""} hover:bg-[#16223a] ${rowCls ? rowCls(r) : ""}`}>
              {cols.map((c) => <Td key={c.key} className={c.cls}>{c.cell ? c.cell(r, i) : c.get(r)}</Td>)}
            </tr>
          ))}
        </tbody>
      </table>
    </div>
  );
}

function Modal({ title, onClose, children, wide }) {
  useEffect(() => {
    const k = (e) => { if (e.key === "Escape") onClose(); };
    document.addEventListener("keydown", k);
    return () => document.removeEventListener("keydown", k);
  }, [onClose]);
  return (
    <div className="fixed inset-0 bg-black/70 flex items-start sm:items-center justify-center p-2 sm:p-4 z-50 overflow-y-auto"
      onClick={onClose}>
      <div className={`${card} p-4 w-full ${wide ? "max-w-3xl" : "max-w-lg"} my-4 max-h-[90vh] overflow-y-auto`}
        onClick={(e) => e.stopPropagation()}>
        <div className="flex items-center justify-between gap-3 mb-3">
          <div className="font-semibold">{title}</div>
          <button className={btnGhost} onClick={onClose}>Close</button>
        </div>
        {children}
      </div>
    </div>
  );
}

/* ---------------------------- the shot breakdown ---------------------------
 * Where a player's shots come from. The rink is the offensive zone seen from
 * above: the point along the blue line, the cycle out on the walls, the rush
 * into the slot. Each region is shaded by how often he shoots from there and
 * labelled with what happens when he does.
 * ------------------------------------------------------------------------- */

function ShotRink({ z, mode }) {
  const keys = ZONE_KEYS;
  const vol = keys.map((k) => (mode === "G" ? z[k].sa : z[k].s));
  const total = vol.reduce((a, b) => a + b, 0);
  const pct = keys.map((k, i) => {
    if (mode === "G") return z[k].sa ? z[k].sv / z[k].sa : 0;
    return z[k].s ? z[k].g / z[k].s : 0;
  });
  const share = vol.map((v) => (total ? v / total : 0));
  // Heat runs on volume; the number in the middle is the rate.
  const fill = (i, hue) => `hsla(${hue}, 78%, 55%, ${0.12 + share[i] * 0.72})`;
  const hue = mode === "G" ? 150 : 205;
  const label = (i) => (mode === "G"
    ? `${(pct[i] * 100).toFixed(1)}%`
    : `${(pct[i] * 100).toFixed(1)}%`);

  if (!total) return <div className="text-sm text-slate-500 px-1 py-3">No shots recorded yet.</div>;
  return (
    <div className="space-y-2">
      <svg viewBox="0 0 200 170" className="w-full max-w-xs mx-auto block">
        {/* rink outline: offensive zone, net at the bottom */}
        <rect x="6" y="6" width="188" height="158" rx="26" fill="#0d1728" stroke="#243250" strokeWidth="2" />
        {/* point — the strip inside the blue line */}
        <path d="M8 34 H192 V64 H8 Z" fill={fill(2, hue)} stroke="#243250" />
        {/* cycle — the walls and corners */}
        <path d="M8 64 H62 V150 H8 Z M138 64 H192 V150 H138 Z" fill={fill(1, hue)} stroke="#243250" />
        {/* rush — the slot, straight at the net */}
        <path d="M62 64 H138 V150 H62 Z" fill={fill(0, hue)} stroke="#243250" />
        <line x1="8" y1="34" x2="192" y2="34" stroke="#3b82f6" strokeWidth="3" opacity="0.7" />
        <line x1="8" y1="150" x2="192" y2="150" stroke="#ef4444" strokeWidth="2" opacity="0.6" />
        <rect x="84" y="150" width="32" height="9" fill="#1e2b45" stroke="#64748b" />
        <circle cx="100" cy="105" r="21" fill="none" stroke="#243250" />
        <text x="100" y="52" textAnchor="middle" className="fill-slate-200" fontSize="11" fontWeight="600">{label(2)}</text>
        <text x="100" y="62" textAnchor="middle" className="fill-slate-400" fontSize="7">POINT · {vol[2]}</text>
        <text x="35" y="105" textAnchor="middle" className="fill-slate-200" fontSize="11" fontWeight="600">{label(1)}</text>
        <text x="35" y="115" textAnchor="middle" className="fill-slate-400" fontSize="7">CYCLE · {vol[1]}</text>
        <text x="165" y="105" textAnchor="middle" className="fill-slate-200" fontSize="11" fontWeight="600">{label(1)}</text>
        <text x="165" y="115" textAnchor="middle" className="fill-slate-400" fontSize="7">CYCLE</text>
        <text x="100" y="104" textAnchor="middle" className="fill-slate-100" fontSize="12" fontWeight="700">{label(0)}</text>
        <text x="100" y="114" textAnchor="middle" className="fill-slate-300" fontSize="7">RUSH · {vol[0]}</text>
      </svg>
      <div className="space-y-1">
        {keys.map((k, i) => (
          <div key={k} className="flex items-center gap-2 text-xs">
            <div className="w-12 text-slate-400 capitalize">{k}</div>
            <div className="flex-1 h-2.5 bg-[#0d1728] rounded overflow-hidden border border-[#1e2b45]">
              <div className="h-full" style={{ width: `${share[i] * 100}%`, background: `hsl(${hue}, 70%, 52%)` }} />
            </div>
            <div className="w-28 text-right tnum text-slate-300">
              {mode === "G"
                ? `${z[k].sv}/${z[k].sa} saved`
                : `${z[k].g}G on ${z[k].s}`}
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

/* ------------------------------ the net grid -------------------------------
 * The goal seen from the shooter's side, nine cells, the same idea as a penalty
 * placement chart. For a skater the shading is where he puts the puck and the
 * number is how often it goes in from there. For a goalie the shading is where
 * he gets beaten and the number is what he stops.
 * ------------------------------------------------------------------------- */

/* Deterministic scatter so dots don't jump around between renders. Same PRNG as
   the engine, but pure — it takes a seed instead of mutating one. */
function jitter(seed) {
  let t = (seed + 0x6d2b79f5) | 0;
  t = Math.imul(t ^ (t >>> 15), t | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
// Place n dots inside a box, at genuinely random positions rather than on a
// grid. Two reasons: a lattice reads as fake, and laying dots out in index
// order would put every goal in the top-left corner of its cell, since the
// records arrive grouped. `spill` lets a shot sit across a gridline — the cell
// is only how the shot was counted, not a wall the puck can't cross — and
// `bounds` keeps it inside the net. Overlap is fine and expected.
function scatter(n, x0, y0, w, h, seed, spill, bounds) {
  const out = [];
  if (n <= 0) return out;
  const o = spill || 0;
  for (let i = 0; i < n; i++) {
    let x = x0 - o + jitter(seed + i * 2) * (w + o * 2);
    let y = y0 - o + jitter(seed + i * 2 + 1) * (h + o * 2);
    if (bounds) { x = clamp(x, bounds[0], bounds[2]); y = clamp(y, bounds[1], bounds[3]); }
    out.push([x, y]);
  }
  return out;
}
// The net opening, so a spilled dot can straddle a line but not leave the goal.
const NET_BOUNDS = [42, 32, 218, 148];

const CELL_LABEL = {};
NET_CELLS.forEach((c) => { CELL_LABEL[c.key] = c.label; });
const OUTCOME_LABEL = { g: "goal", s: "saved", m: "off target", b: "blocked", e: "empty net" };
const DOT_FILL = { g: "#fb7185", s: "#38bdf8", e: "#c084fc", b: "#f59e0b" };

function NetGrid({ net, mode, hole, view, extra, seed, shots, teams }) {
  // Heat is volume: where a skater shoots, or where a goalie gets beaten.
  const vol = NET_CELLS.map((c) => (mode === "G" ? net[c.key].ga : net[c.key].a));
  const total = vol.reduce((a, b) => a + b, 0);
  // The footer is the outcome, which is a different number from the heat for a
  // skater — his shots are the volume, his goals are the result.
  const faced = NET_CELLS.reduce((s, c) => s + (mode === "G" ? net[c.key].sa : net[c.key].a), 0);
  const scored = NET_CELLS.reduce((s, c) => s + (mode === "G" ? net[c.key].ga : net[c.key].g), 0);
  if (!faced) return <div className="text-sm text-slate-500 px-1 py-3">Nothing on net yet.</div>;

  const dots = view === "dots";
  // The net sits inside a margin so off-target shots have somewhere to land.
  const X = [40, 100, 160, 220], Y = [30, 70, 110, 150];
  const hue = mode === "G" ? 6 : 205;   // beaten = red, scoring = blue
  const sd = (seed || 1) * 977;

  // One dot per shot until a cell gets crowded, then one dot per k.
  const cellShots = NET_CELLS.map((c) => (mode === "G" ? net[c.key].sa : net[c.key].a));
  const perDot = Math.max(1, Math.ceil(Math.max(...cellShots) / 42));
  const miss = (extra && extra.miss) || 0;
  const blkd = (extra && extra.blkd) || 0;

  // A real per-shot log beats the synthesized cloud whenever we have one.
  const real = shots && shots.length ? shots : null;
  const clock = (t) => {
    const per = Math.min(3, Math.floor(t / 20)), inPer = t - per * 20;
    const m = Math.floor(inPer), s = Math.round((inPer - m) * 60);
    return t >= 60 ? `OT ${Math.floor(t - 60)}:${String(s).padStart(2, "0")}`
      : `P${per + 1} ${m}:${String(s).padStart(2, "0")}`;
  };
  const tip = (r) => [
    teams && r.o != null ? `vs ${teams[r.o].abbr}` : null,
    `day ${r.d + 1}`, clock(r.t), r.z !== "empty" ? r.z : null,
    r.c ? CELL_LABEL[r.c] : null,
    OUTCOME_LABEL[r.r] + (r.st === "pp" ? " (PP)" : r.st === "sh" ? " (SH)" : ""),
  ].filter(Boolean).join(" · ");

  const Dot = ({ p, fill, stroke, r, title }) => (
    <circle cx={p[0]} cy={p[1]} r={r || 2.6} fill={fill || "none"}
      stroke={stroke || "none"} strokeWidth="0.9" opacity={fill ? 0.82 : 1}>
      {title ? <title>{title}</title> : null}
    </circle>
  );

  // Bucket the log so each record lands where it actually went.
  const buckets = {};
  const offNet = [], blocked = [], emptied = [];
  if (real) {
    NET_KEYS.forEach((k) => { buckets[k] = []; });
    real.forEach((r) => {
      if (r.r === "m") offNet.push(r);
      else if (r.r === "b") blocked.push(r);
      else if (r.r === "e") emptied.push(r);
      else if (r.c && buckets[r.c]) buckets[r.c].push(r);
    });
  }

  return (
    <div className="space-y-2">
      <svg viewBox="0 0 260 214" className="w-full max-w-sm mx-auto block">
        <rect x="0" y="0" width="260" height="214" rx="6" fill="#0d1728" />
        {/* mesh inside the opening */}
        {[...Array(10)].map((_, i) => (
          <line key={`v${i}`} x1={40 + i * 20} y1="30" x2={40 + i * 20} y2="150" stroke="#1b2942" strokeWidth="1" />
        ))}
        {[...Array(7)].map((_, i) => (
          <line key={`h${i}`} x1="40" y1={30 + i * 20} x2="220" y2={30 + i * 20} stroke="#1b2942" strokeWidth="1" />
        ))}

        {NET_CELLS.map((c, i) => {
          const share = total ? vol[i] / total : 0;
          const shots = mode === "G" ? net[c.key].sa : net[c.key].a;
          const goals = mode === "G" ? net[c.key].ga : net[c.key].g;
          const rate = shots ? (mode === "G" ? (shots - goals) / shots : goals / shots) : null;
          const isHole = hole && hole.key === c.key;
          const x0 = X[c.col], y0 = Y[c.row], w = X[c.col + 1] - x0, h = Y[c.row + 1] - y0;
          const recs = real ? buckets[c.key] : null;
          const nG = Math.round(goals / perDot), nS = Math.round((shots - goals) / perDot);
          const count = recs ? recs.length : nG + nS;
          const pts = dots ? scatter(count, x0, y0, w, h, sd + i * 131, 5, NET_BOUNDS) : [];
          return (
            <g key={c.key}>
              <rect x={x0} y={y0} width={w} height={h}
                fill={dots ? "rgba(13,23,40,0.35)" : `hsla(${hue}, 80%, 55%, ${0.08 + share * 0.75})`}
                stroke={isHole ? "#f59e0b" : "#243250"} strokeWidth={isHole ? 2 : 1} />
              {dots ? pts.map((p, k) => (
                <Dot key={k} p={p} r={2.4}
                  fill={recs ? DOT_FILL[recs[k].r] : (k < nG ? "#fb7185" : "#38bdf8")}
                  title={recs ? tip(recs[k]) : null} />
              )) : (
                <>
                  <text x={x0 + w / 2} y={y0 + h / 2 - 1} textAnchor="middle" fontSize="13"
                    fontWeight="700" className="fill-slate-100">
                    {rate == null ? "—" : `${(rate * 100).toFixed(0)}%`}
                  </text>
                  <text x={x0 + w / 2} y={y0 + h / 2 + 10} textAnchor="middle" fontSize="7" className="fill-slate-400">
                    {goals} of {shots}
                  </text>
                </>
              )}
            </g>
          );
        })}

        {/* off target: over the bar and wide of the posts */}
        {dots && (real ? offNet.length : miss) ? (() => {
          const n = real ? offNet.length : Math.round(miss / perDot);
          const over = Math.round(n * 0.4), side = n - over;
          const a = scatter(over, 44, 5, 172, 16, sd + 991, 3);
          const b = scatter(Math.ceil(side / 2), 5, 32, 26, 116, sd + 992, 3);
          const c2 = scatter(Math.floor(side / 2), 228, 32, 26, 116, sd + 993, 3);
          return [...a, ...b, ...c2].map((p, k) => (
            <Dot key={`m${k}`} p={p} r={2.2} stroke="#64748b"
              title={real && offNet[k] ? tip(offNet[k]) : null} />
          ));
        })() : null}

        {/* empty-netters: no goalie, so no corner to pick */}
        {dots && real && emptied.length
          ? scatter(emptied.length, 96, 76, 68, 48, sd + 995, 4, NET_BOUNDS).map((p, k) => (
            <Dot key={`e${k}`} p={p} r={2.6} fill="#c084fc" title={tip(emptied[k])} />
          )) : null}

        {/* blocked: never got there at all */}
        {dots && (real ? blocked.length : blkd) ? (
          <>
            <text x="130" y="176" textAnchor="middle" fontSize="7" className="fill-slate-500">BLOCKED</text>
            {scatter(real ? blocked.length : Math.round(blkd / perDot), 30, 180, 200, 26, sd + 994, 3)
              .map((p, k) => (
                <Dot key={`b${k}`} p={p} r={2.2} fill="#f59e0b"
                  title={real && blocked[k] ? tip(blocked[k]) : null} />
              ))}
          </>
        ) : null}

        {/* posts, crossbar and goal line */}
        <rect x="34" y="24" width="6" height="132" fill="#dc2626" />
        <rect x="220" y="24" width="6" height="132" fill="#dc2626" />
        <rect x="34" y="24" width="192" height="6" fill="#dc2626" />
        <rect x="30" y="156" width="200" height="4" fill="#1e2b45" />
      </svg>

      {dots ? (
        <div className="flex flex-wrap items-center gap-x-4 gap-y-1 text-xs px-1">
          <span className="flex items-center gap-1.5"><span className="w-2.5 h-2.5 rounded-full bg-rose-400 inline-block" />
            <span className="text-slate-300">Goal</span></span>
          <span className="flex items-center gap-1.5"><span className="w-2.5 h-2.5 rounded-full bg-sky-400 inline-block" />
            <span className="text-slate-300">Saved</span></span>
          {miss ? <span className="flex items-center gap-1.5">
            <span className="w-2.5 h-2.5 rounded-full border border-slate-500 inline-block" />
            <span className="text-slate-300">Off target</span></span> : null}
          {blkd ? <span className="flex items-center gap-1.5"><span className="w-2.5 h-2.5 rounded-full bg-amber-500 inline-block" />
            <span className="text-slate-300">Blocked</span></span> : null}
          {real && emptied.length ? <span className="flex items-center gap-1.5">
            <span className="w-2.5 h-2.5 rounded-full bg-purple-400 inline-block" />
            <span className="text-slate-300">Empty net</span></span> : null}
          {real
            ? <span className="text-slate-500">{real.length} shots · hover for the game</span>
            : perDot > 1 ? <span className="text-slate-500">1 dot = {perDot} shots</span> : null}
        </div>
      ) : null}

      <div className="flex items-center justify-between text-xs text-slate-400 px-1">
        <span>{dots ? (real ? "every shot, as it happened" : "every shot, placed") : mode === "G" ? "shaded where goals get through" : "shaded by shot volume"}</span>
        <span className="tnum">{mode === "G" ? `${scored} allowed on ${faced}` : `${scored} goals on ${faced}`}</span>
      </div>
      {hole ? (
        <div className="text-xs text-amber-400 px-1">Scouting report: beatable {hole.label}.</div>
      ) : null}
    </div>
  );
}

/* On goal, wide, or into a shin pad. */
function AttemptBar({ s }) {
  const total = s.att || 0;
  if (!total) return null;
  const parts = [
    { label: "On goal", v: s.sog, c: "bg-sky-500" },
    { label: "Missed", v: s.miss, c: "bg-slate-500" },
    { label: "Blocked", v: s.blkd, c: "bg-amber-600" },
  ];
  return (
    <div className="space-y-1.5">
      <div className="flex h-3 rounded overflow-hidden border border-[#1e2b45]">
        {parts.map((p) => (
          <div key={p.label} className={p.c} style={{ width: `${(p.v / total) * 100}%` }} title={`${p.label}: ${p.v}`} />
        ))}
      </div>
      <div className="flex justify-between text-xs">
        {parts.map((p) => (
          <span key={p.label} className="text-slate-400">
            {p.label} <span className="text-slate-200 tnum">{p.v}</span>
            <span className="text-slate-500"> ({total ? Math.round((p.v / total) * 100) : 0}%)</span>
          </span>
        ))}
      </div>
      <div className="text-xs text-slate-500">{total} attempts</div>
    </div>
  );
}

/* A bar per game, so a hot streak and a cold one look different at a glance. */
function FormBars({ log, mode }) {
  if (!log || !log.length) return null;
  const val = (r) => (mode === "G" ? (r.sa ? r.sv / r.sa : 0) : (r.g || 0) + (r.a || 0));
  const vals = log.map(val);
  const max = Math.max(...vals, mode === "G" ? 1 : 1);
  const min = mode === "G" ? Math.min(...vals.filter((v) => v > 0), 0.8) : 0;
  const recent = log.slice(-40);
  return (
    <div className="space-y-1.5">
      <div className="flex items-end gap-[2px] h-12">
        {recent.map((r, i) => {
          const v = val(r);
          const h = mode === "G"
            ? clamp(((v - min) / Math.max(0.001, max - min)) * 100, 6, 100)
            : clamp((v / Math.max(1, max)) * 100, 4, 100);
          const win = r.gf > r.ga;
          return (
            <div key={i} className="flex-1 rounded-t"
              style={{ height: `${h}%`, background: win ? "#38bdf8" : "#475569", minWidth: 3 }}
              title={`day ${r.d + 1} · ${mode === "G" ? `${r.sv}/${r.sa}` : `${r.g}G ${r.a}A`} · ${r.gf}–${r.ga}`} />
          );
        })}
      </div>
      <div className="text-xs text-slate-500">
        last {recent.length} games · {mode === "G" ? "save percentage" : "points"} · blue is a win
      </div>
    </div>
  );
}

}

            <Stat label="Overall" value={p.ovr} sub={`ceiling ${p.pot}`} />
            <Stat label="Age" value={p.age} sub={t ? `${t.city} ${t.name}` : "free agent"} />
            <Stat label="Cap hit" value={`$${effectiveCap(G, p)}M`} sub={`${p.contract.yrs} yr${p.contract.yrs === 1 ? "" : "s"} left`} />
            <Stat label="Condition" value={`${Math.round(100 - p.fatigue)}%`} sub={p.farm ? "on the farm" : "on the roster"} />
          </div>
          <Section title="Ratings" className="p-3 space-y-1.5">
            <div className="space-y-1.5 pt-1">
              {keys.map((k) => p.r[k] != null ? <RatingBar key={k} label={k} v={p.r[k]} /> : null)}
            </div>
          </Section>
          {p.trophies && p.trophies.length ? (
            <Section title="Honours" className="p-3">
              <div className="text-sm text-slate-300 space-y-0.5 pt-1">
                {p.trophies.slice(-8).reverse().map((tr, i) => (
                  <div key={i}>{tr.year} — {AWARD_LABEL[tr.award] || tr.award}</div>
                ))}
              </div>
            </Section>
          ) : null}
        </div>

        <div className="space-y-3">
          <Section title={isG ? "Where the shots come from" : "Where he shoots from"} className="p-3">
            <ShotRink z={(p.season && p.season.z) || blankZones(isG ? "G" : "S")} mode={isG ? "G" : "S"} />
          </Section>
          <Section title={isG ? "Where he gets beaten" : "Where he puts it"} className="p-3"
            right={
              <div className="flex gap-1">
                {[["dots", "Shots"], ["pct", "Rates"]].map(([k, l]) => (
                  <button key={k} onClick={() => setNetView(k)}
                    className={`px-2 py-0.5 rounded text-xs ${netView === k ? "bg-sky-600 text-white" : "text-slate-400 hover:bg-[#18243c]"}`}>{l}</button>
                ))}
              </div>
            }>
            <div className="pt-2">
              <NetGrid net={(p.season && p.season.net) || blankNet(isG ? "G" : "S")} mode={isG ? "G" : "S"}
                hole={isG ? goalieHole(p) : null} view={netView} seed={p.id}
                shots={(G.shotLog || {})[p.id]} teams={G.teams}
                extra={isG ? null : { miss: p.season.miss, blkd: p.season.blkd }} />
            </div>
          </Section>
          {!isG && p.season.att ? (
            <Section title="Shot attempts" className="p-3">
              <div className="pt-1"><AttemptBar s={p.season} /></div>
            </Section>
          ) : null}
          <Section title="This season" className="p-3">
            {isG ? (
              <div className="grid grid-cols-3 gap-2 text-sm pt-1">
                <div><span className="text-slate-400">GP </span>{p.season.gp}</div>
                <div><span className="text-slate-400">W-L-OTL </span>{p.season.w}-{p.season.l}-{p.season.otl}</div>
                <div><span className="text-slate-400">SO </span>{p.season.so}</div>
                <div><span className="text-slate-400">SV% </span>{(svPct(p.season) * 100).toFixed(1)}</div>
                <div><span className="text-slate-400">GAA </span>{gaa(p.season).toFixed(2)}</div>
                <div><span className="text-slate-400">Shootout </span>{p.season.sosv}/{p.season.sosa}</div>
              </div>
            ) : (
              <div className="grid grid-cols-3 gap-2 text-sm pt-1">
                <div><span className="text-slate-400">GP </span>{p.season.gp}</div>
                <div><span className="text-slate-400">G </span>{p.season.g}</div>
                <div><span className="text-slate-400">A </span>{p.season.a}</div>
                <div><span className="text-slate-400">P </span>{pts(p.season)}</div>
                <div><span className="text-slate-400">+/- </span>{p.season.pm > 0 ? "+" : ""}{p.season.pm}</div>
                <div><span className="text-slate-400">PIM </span>{p.season.pim}</div>
                <div><span className="text-slate-400">SOG </span>{p.season.sog}</div>
                <div><span className="text-slate-400">Hits </span>{p.season.hit}</div>
                <div><span className="text-slate-400">Blocks </span>{p.season.blk}</div>
                <div><span className="text-slate-400">PPG </span>{p.season.ppg}</div>
                <div><span className="text-slate-400">EN </span>{p.season.eng}</div>
                <div><span className="text-slate-400">Fights </span>{p.season.fights}</div>
              </div>
            )}
          </Section>
          {(G.gameLog || {})[p.id] && G.gameLog[p.id].length ? (
            <Section title="Form" className="p-3">
              <div className="pt-1"><FormBars log={G.gameLog[p.id]} mode={isG ? "G" : "S"} /></div>
            </Section>
          ) : null}
          {(G.gameLog || {})[p.id] && G.gameLog[p.id].length ? (
            <Section title="Game by game">
              <SortTable min={380} initial="d" rows={G.gameLog[p.id]} rowKey={(r) => r.d}
                cols={isG ? [
                  { key: "d", label: "Day", get: (r) => r.d, cell: (r) => r.d + 1 },
                  { key: "o", label: "Opp", get: (r) => G.teams[r.o].abbr },
                  { key: "res", label: "Result", get: (r) => r.gf - r.ga,
                    cell: (r) => <span className={r.gf > r.ga ? "text-emerald-400" : "text-rose-400"}>{r.gf}–{r.ga}</span> },
                  { key: "sv", label: "SV", get: (r) => r.sv, cell: (r) => `${r.sv}/${r.sa}` },
                  { key: "svp", label: "SV%", get: (r) => (r.sa ? r.sv / r.sa : 0),
                    cell: (r) => (r.sa ? ((r.sv / r.sa) * 100).toFixed(1) : "—") },
                ] : [
                  { key: "d", label: "Day", get: (r) => r.d, cell: (r) => r.d + 1 },
                  { key: "o", label: "Opp", get: (r) => G.teams[r.o].abbr },
                  { key: "res", label: "Result", get: (r) => r.gf - r.ga,
                    cell: (r) => <span className={r.gf > r.ga ? "text-emerald-400" : "text-rose-400"}>{r.gf}–{r.ga}</span> },
                  { key: "g", label: "G", get: (r) => r.g },
                  { key: "a", label: "A", get: (r) => r.a },
                  { key: "p", label: "P", get: (r) => r.g + r.a, cls: "font-semibold" },
                  { key: "sog", label: "SOG", get: (r) => r.sog },
                  { key: "toi", label: "TOI", get: (r) => r.toi, cell: (r) => r.toi.toFixed(1) },
                ]} />
            </Section>
          ) : null}
          {p.farmSeason ? (
            <Section title="On the farm" className="p-3">
              <div className="text-sm pt-1 text-slate-300">
                {p.farmSeason.gp} games · {p.farmSeason.g}G {p.farmSeason.a}A
                {prospectReady(G, p) ? <span className="ml-2 text-emerald-400">ready for a call-up</span> : null}
              </div>
            </Section>
          ) : null}
          {career.length ? (
            <Section title="Career">
              <SortTable min={340} initial="year" asc
                rows={career.map((c, i) => ({ ...c, _i: i }))}
                rowKey={(r) => r._i}
                cols={isG ? [
                  { key: "year", label: "Yr", get: (r) => (r.total ? `${r.year}–${r.to}` : r.year) },
                  { key: "gp", label: "GP", get: (r) => r.gp || 0 },
                  { key: "w", label: "W", get: (r) => r.w || 0 },
                  { key: "so", label: "SO", get: (r) => r.so || 0 },
                  { key: "sv", label: "SV%", get: (r) => (r.sa ? r.sv / r.sa : 0), cell: (r) => (r.sa ? (r.sv / r.sa * 100).toFixed(1) : "—") },
                ] : [
                  { key: "year", label: "Yr", get: (r) => (r.total ? `${r.year}–${r.to}` : r.year) },
                  { key: "gp", label: "GP", get: (r) => r.gp || 0 },
                  { key: "g", label: "G", get: (r) => r.g || 0 },
                  { key: "a", label: "A", get: (r) => r.a || 0 },
                  { key: "p", label: "P", get: (r) => (r.g || 0) + (r.a || 0) },
                  { key: "pim", label: "PIM", get: (r) => r.pim || 0 },
                ]} />
              <div className="px-3 py-2 text-xs text-slate-400 border-t border-[#1e2b45] tnum">
                Career: {totals.gp || 0} GP
                {isG ? ` · ${totals.w || 0}W · ${totals.so || 0} SO`
                     : ` · ${totals.g || 0}G ${totals.a || 0}A · ${(totals.g || 0) + (totals.a || 0)} P`}
              </div>
            </Section>
          ) : null}
        </div>
      </div>
    </Modal>
  );
}

};

  return (
    <div className="bg-[#0d1728] border border-[#1e2b45] rounded-lg p-3">
      <div className="font-medium">{meta.city} {meta.team}</div>
      <div className="text-xs text-slate-400">{meta.year} · {meta.record} · {meta.cups} cup{meta.cups === 1 ? "" : "s"}</div>

        <button className={btnPri} onClick={() => onLoad(slot)}>Continue</button>

    <div className="space-y-3">

        <Stat label="Goals" value={`${t.gf}–${t.ga}`} sub={`${t.gf - t.ga > 0 ? "+" : ""}${t.gf - t.ga} diff`} />
        <Stat label="Cap space" value={`$${capSpace(G, G.userTeam)}M`}

/* -------------------------------- roster ---------------------------------- */

// Points in the last stretch, used for the hot/cold flag.
function formOf(G, p) {
  if (!p.season.gp) return 0;
  return pts(p.season) / p.season.gp;
}
function HotCold({ G, p }) {
  const rate = formOf(G, p);
  if (!p.season.gp || p.season.gp < 5) return null;
  if (rate >= 0.9) return <span className="ml-1.5 text-[10px] text-orange-300" title="on a tear">🔥</span>;
  if (rate <= 0.18) return <span className="ml-1.5 text-[10px] text-sky-300" title="ice cold">❄</span>;
  return null;
}

function RosterTab({ G, setG, openPlayer, notify }) {
  const [showFarm, setShowFarm] = useState(false);
  const upd = (fn) => { const g2 = migrate(JSON.parse(JSON.stringify(G))); const r = fn(g2); setG(g2); return r; };
  const roster = rosterOf(G, G.userTeam, true).filter((p) => (showFarm ? p.farm : !p.farm));
  const hit = capHit(G, G.userTeam), space = capSpace(G, G.userTeam);
  const dead = retainedBy(G, G.userTeam);

  const move = (p) => {
    if (p.farm) {
      const r = upd((g) => recall(g, p.id));
      notify(r.ok ? `${fullName(p)} recalled.` : r.why);
    } else {
      const r = upd((g) => sendDown(g, p.id));
      notify(!r.ok ? r.why : r.waivers
        ? `${fullName(p)} has been placed on waivers.`
        : `${fullName(p)} sent to the farm.`);
    }
  };

  const cols = [
    { key: "name", label: "Player", get: (p) => p.ln, min: 1,
      cell: (p) => (
        <span className="whitespace-nowrap">
          {fullName(p)}
          <HotCold G={G} p={p} />
          {hasNtc(p) ? <span className="ml-1.5 text-[10px] text-amber-300" title="no-trade clause">NTC</span> : null}
          {p.inj > 0 ? <span className="ml-1.5 text-[10px] text-rose-400">INJ {p.inj}</span> : null}
          {(G.waivers || []).some((w) => w.pid === p.id) ? <span className="ml-1.5 text-[10px] text-sky-300">on waivers</span> : null}
        </span>
      ) },
    { key: "pos", label: "Pos", get: (p) => POS.indexOf(p.pos), cell: (p) => <PosBadge pos={p.pos} /> },
    { key: "age", label: "Age", get: (p) => p.age },
    { key: "ovr", label: "Ovr", get: (p) => p.ovr, cls: "font-semibold" },
    { key: "pot", label: "Pot", get: (p) => p.pot, cls: "text-slate-400" },
    { key: "gp", label: "GP", get: (p) => p.season.gp },
    { key: "g", label: "G", get: (p) => (p.pos === "G" ? p.season.w : p.season.g),
      cell: (p) => (p.pos === "G" ? p.season.w : p.season.g) },
    { key: "a", label: "A", get: (p) => (p.pos === "G" ? p.season.so : p.season.a),
      cell: (p) => (p.pos === "G" ? p.season.so : p.season.a) },
    { key: "p", label: "P / SV%", get: (p) => (p.pos === "G" ? svPct(p.season) * 100 : pts(p.season)),
      cls: "font-semibold",
      cell: (p) => (p.pos === "G" ? (p.season.sa ? (svPct(p.season) * 100).toFixed(1) : "—") : pts(p.season)) },
    { key: "pm", label: "+/-", get: (p) => (p.pos === "G" ? 0 : p.season.pm),
      cell: (p) => (p.pos === "G" ? "—" : `${p.season.pm > 0 ? "+" : ""}${p.season.pm}`) },
    { key: "cap", label: "Cap", get: (p) => effectiveCap(G, p), cell: (p) => `$${effectiveCap(G, p)}M` },
    { key: "yrs", label: "Yrs", get: (p) => p.contract.yrs },
    { key: "act", label: "", get: () => 0, cell: (p) => (
      <button className="text-xs text-sky-400 hover:underline"
        onClick={(e) => { e.stopPropagation(); move(p); }}>
        {p.farm ? "Recall" : "Send down"}
      </button>
    ) },
  ];

  return (
    <div className="space-y-3">
      <div className="grid grid-cols-2 sm:grid-cols-4 gap-2">
        <Stat label="Cap hit" value={`$${hit}M`} sub={`of $${rules(G).capAmount}M`} />
        <Stat label="Cap space" value={`$${space}M`} tone={space < 0 ? "text-rose-400" : ""}
          sub={dead.length ? `$${round1(dead.reduce((s, r) => s + r.amt, 0))}M retained` : "available"} />
        <Stat label="Roster" value={rosterOf(G, G.userTeam).length} sub={`max ${ROSTER_MAX}`} />
        <Stat label="Team rating" value={teamStrength(G, G.userTeam)} sub="top 18 average" />
      </div>
      <div className="flex gap-2 flex-wrap">
        <button className={showFarm ? btnGhost : btnPri} onClick={() => setShowFarm(false)}>NHL roster</button>
        <button className={showFarm ? btnPri : btnGhost} onClick={() => setShowFarm(true)}>
          Farm{rosterOf(G, G.userTeam, true).filter((p) => p.farm && prospectReady(G, p)).length

/* --------------------------------- lines ---------------------------------- */

function LinesTab({ G, setG }) {
  const lines = ensureLines(G, G.userTeam);
  const bench = activeRoster(G, G.userTeam);
  const used = new Set([].concat(...lines.F, ...lines.D, lines.G).filter(Boolean));
  const scratches = bench.filter((p) => !used.has(p.id));

  function swap(kind, li, si, newId) {
    const g2 = { ...G, teams: G.teams.slice() };
    const t = { ...g2.teams[G.userTeam] };
    const L = JSON.parse(JSON.stringify(t.lines || lines));
    const old = kind === "F" ? L.F[li][si] : kind === "D" ? L.D[li][si] : L.G[si];
    const findSlot = (id) => {
      for (let i = 0; i < L.F.length; i++) for (let j = 0; j < 3; j++) if (L.F[i][j] === id) return ["F", i, j];
      for (let i = 0; i < L.D.length; i++) for (let j = 0; j < 2; j++) if (L.D[i][j] === id) return ["D", i, j];
      for (let j = 0; j < L.G.length; j++) if (L.G[j] === id) return ["G", 0, j];
      return null;
    };
    const at = findSlot(newId);
    if (at) {
      const [k2, i2, j2] = at;
      if (k2 === "F") L.F[i2][j2] = old; else if (k2 === "D") L.D[i2][j2] = old; else L.G[j2] = old;
    }
    if (kind === "F") L.F[li][si] = newId; else if (kind === "D") L.D[li][si] = newId; else L.G[si] = newId;
    t.lines = L;
    g2.teams[G.userTeam] = t;
    setG(g2);
  }

  const Slot = ({ kind, li, si, id, filter }) => (
    <select className="bg-[#0d1728] border border-[#243250] rounded px-2 py-1 text-sm w-full min-w-0"
      value={id || ""} onChange={(e) => swap(kind, li, si, +e.target.value)}>
      {bench.filter(filter).map((p) => (
        <option key={p.id} value={p.id}>{shortName(p)} ({p.ovr})</option>
      ))}
    </select>
  );
  const starter = G.players[lines.G[0]];

  return (
    <div className="space-y-3">
      <div className="flex gap-2 flex-wrap items-center">
        <button className={btnGhost} onClick={() => {
          const g2 = { ...G, teams: G.teams.slice() };
          g2.teams[G.userTeam] = { ...g2.teams[G.userTeam], lines: autoLines(G, G.userTeam) };
          setG(g2);
        }}>Auto lines</button>
        <div className="text-xs text-slate-400">
          Line 1 takes {Math.round(LINE_TOI[0] * 100)}% of even-strength ice; at home your top line sees soft matchups more often.
          Keeping a line together builds a small chemistry bonus — swapping it resets that line's streak.
        </div>
      </div>

      <Section title="Forwards" className="p-3">
        <div className="space-y-2 pt-1">
          {lines.F.map((ln, i) => {
            const games = (G.teams[G.userTeam].lineChem || [])[i] || 0;
            return (
              <div key={i} className="grid grid-cols-[2rem_1fr_1fr_1fr] gap-1.5 sm:gap-2 items-center">
                <div className="text-xs text-slate-500" title={games > 0 ? `Together ${games} game${games === 1 ? "" : "s"} running — a small chemistry bonus` : "Just set — no chemistry yet"}>
                  L{i + 1}{games >= LINE_CHEM_MAX_GAMES ? <span className="text-emerald-400"> ●</span> : null}
                </div>
                {[0, 1, 2].map((si) => (
                  <Slot key={si} kind="F" li={i} si={si} id={ln[si]} filter={(p) => p.pos !== "G" && p.pos !== "D"} />
                ))}
              </div>
            );
          })}
        </div>
      </Section>

      <Section title="Defence" className="p-3">
        <div className="space-y-2 pt-1">
          {lines.D.map((pr, i) => (
            <div key={i} className="grid grid-cols-[2rem_1fr_1fr] gap-1.5 sm:gap-2 items-center">
              <div className="text-xs text-slate-500">D{i + 1}</div>
              {[0, 1].map((si) => <Slot key={si} kind="D" li={i} si={si} id={pr[si]} filter={(p) => p.pos === "D"} />)}
            </div>
          ))}
        </div>
      </Section>

      <Section title="Goaltenders" className="p-3">
        <div className="grid grid-cols-[2rem_1fr_1fr] gap-1.5 sm:gap-2 items-center pt-1">
          <div className="text-xs text-slate-500">G</div>
          {[0, 1].map((si) => <Slot key={si} kind="G" li={0} si={si} id={lines.G[si]} filter={(p) => p.pos === "G"} />)}
        </div>
        {starter ? (
          <div className="text-xs text-slate-400 mt-2">
            {starter.fatigue > 55
              ? `${shortName(starter)} is worn down (${Math.round(100 - starter.fatigue)}% fresh) — the backup will get the next start.`
              : `${shortName(starter)} is ${Math.round(100 - starter.fatigue)}% fresh.`}
          </div>
        ) : null}
      </Section>

      {scratches.length ? (
        <Section title="Healthy scratches" className="p-3">
          <div className="text-sm text-slate-400 pt-1">{scratches.map((p) => `${shortName(p)} (${p.ovr})`).join(" · ")}</div>
        </Section>
      ) : null}
    </div>
  );
}

function ScheduleTab({ G, openTeam }) {
  const [scope, setScope] = useState("mine");
  const rows = [];
  G.schedule.forEach((day, d) => {
    day.forEach((f) => {
      if (scope === "mine" && f.home !== G.userTeam && f.away !== G.userTeam) return;
      rows.push({ ...f, d });
    });
  });
  const upcoming = rows.filter((r) => !r.played);
  const done = rows.filter((r) => r.played).reverse();
  const Row = ({ r }) => {
    const home = r.home === G.userTeam;
    const opp = G.teams[home ? r.away : r.home];
    const mine = r.home === G.userTeam || r.away === G.userTeam;
    const win = r.played && mine && ((home && r.hg > r.ag) || (!home && r.ag > r.hg));
    return (
      <div className="flex items-center gap-2 text-sm px-3 py-1.5 border-b border-[#16223a] last:border-0">
        <span className="w-14 text-slate-500 tnum">Day {r.d + 1}</span>
        {mine ? (
          <span className="flex-1">
            <span className="text-slate-500">{home ? "vs" : "at"} </span>
            <button className="hover:text-sky-300" onClick={() => openTeam(opp.id)}>{opp.city} {opp.name}</button>
          </span>
        ) : (
          <span className="flex-1">
            <button className="hover:text-sky-300" onClick={() => openTeam(r.away)}>{G.teams[r.away].abbr}</button>
            <span className="text-slate-500"> @ </span>
            <button className="hover:text-sky-300" onClick={() => openTeam(r.home)}>{G.teams[r.home].abbr}</button>
          </span>
        )}
        {r.played ? (
          <span className={`tnum ${mine ? (win ? "text-emerald-400" : "text-rose-400") : "text-slate-300"}`}>
            {r.ag}–{r.hg}{r.so ? " SO" : r.ot ? " OT" : ""}
          </span>
        ) : <span className="text-slate-600 text-xs">—</span>}
      </div>
    );
  };
  return (
    <div className="space-y-3">
      <div className="flex gap-2">
        <button className={scope === "mine" ? btnPri : btnGhost} onClick={() => setScope("mine")}>My club</button>

      </div>
      <div className="text-xs text-slate-400">
        The break is days {G.allStarDay}–{G.allStarDay + 1}. The trade deadline is day {deadlineDay(G) + 1}.
      </div>
      <Section title={`Upcoming (${upcoming.length})`}>
        <div className="max-h-[26rem] overflow-y-auto">
          {upcoming.slice(0, 120).map((r, i) => <Row key={i} r={r} />)}
          {!upcoming.length ? <div className="px-3 py-4 text-sm text-slate-500">The season is over.</div> : null}
        </div>
      </Section>
      <Section title={`Played (${done.length})`}>
        <div className="max-h-[26rem] overflow-y-auto">
          {done.slice(0, 120).map((r, i) => <Row key={i} r={r} />)}
          {!done.length ? <div className="px-3 py-4 text-sm text-slate-500">No games yet.</div> : null}
        </div>
      </Section>
    </div>
  );
}

/* -------------------------------- analytics --------------------------------
 * The same two charts as a player page, aggregated for a whole club — what it
 * generates, and what it gives up. Built from the players currently on the
 * roster, so a deadline departure takes his shots with him.
 * ------------------------------------------------------------------------- */

function teamShotProfile(G, teamId) {
  const forZ = blankZones("S"), forNet = blankNet("S");
  const agZ = blankZones("G"), agNet = blankNet("G");
  const tot = { att: 0, sog: 0, miss: 0, blkd: 0, g: 0, sa: 0, ga: 0 };
  rosterOf(G, teamId, true).forEach((p) => {
    const s = p.season;
    if (!s || !s.z || !s.net) return;
    if (p.pos === "G") {
      ZONE_KEYS.forEach((k) => { agZ[k].sa += s.z[k].sa; agZ[k].sv += s.z[k].sv; });
      NET_KEYS.forEach((k) => { agNet[k].sa += s.net[k].sa; agNet[k].ga += s.net[k].ga; });
      tot.sa += s.sa; tot.ga += s.ga;
    } else {
      ZONE_KEYS.forEach((k) => { forZ[k].s += s.z[k].s; forZ[k].g += s.z[k].g; });
      NET_KEYS.forEach((k) => { forNet[k].a += s.net[k].a; forNet[k].g += s.net[k].g; });
      tot.att += s.att || 0; tot.sog += s.sog; tot.miss += s.miss || 0;
      tot.blkd += s.blkd || 0; tot.g += s.g;
    }
  });
  return { forZ, forNet, agZ, agNet, tot };
}

            { key: "shp", label: "SH%", get: (t) => (t.p.sog ? t.p.g / t.p.sog : 0), cls: "font-semibold",
              cell: (t) => (t.p.sog ? ((t.p.g / t.p.sog) * 100).toFixed(1) : "—") },
            { key: "svp", label: "SV%", get: (t) => (t.p.sa ? (t.p.sa - t.p.ga) / t.p.sa : 0),
              cell: (t) => (t.p.sa ? (((t.p.sa - t.p.ga) / t.p.sa) * 100).toFixed(1) : "—") },
            { key: "blk", label: "Blkd", get: (t) => t.p.blkd },
          ]} />
      </Section>
    </div>
  );
}

/* ------------------------------ the game viewer --------------------------- */

const clockOf = (t) => {
  const per = Math.min(3, Math.floor(t / 20));
  const inPer = t - per * 20;
  const m = Math.floor(inPer), s = Math.floor((inPer - m) * 60);
  return t >= 60 ? `OT ${Math.floor(t - 60)}:${String(s).padStart(2, "0")}` : `P${per + 1} ${m}:${String(s).padStart(2, "0")}`;
};

function GameTab({ G, openPlayer }) {
  const lg = G.lastGame;
  const [upTo, setUpTo] = useState(1e9);
  const [tab, setTab] = useState("play");
  if (!lg) return <div className="text-slate-400 text-sm">No game to watch yet — play a day first.</div>;
  const H = G.teams[lg.home], A = G.teams[lg.away];
  const events = (lg.events || []).filter((e) => e.t <= upTo);
  const running = events.reduce((acc, e) => {
    if (e.kind === "goal") acc[e.team === lg.home ? 0 : 1]++;
    if (e.kind === "shootout") acc[e.team === lg.home ? 0 : 1]++;
    return acc;
  }, [0, 0]);
  const nm = (id) => (G.players[id] ? shortName(G.players[id]) : "—");
  const line = (e) => {
    if (e.kind === "goal") {
      const cell = e.cell ? (NET_CELLS.find((c) => c.key === e.cell) || null) : null;
      return `${nm(e.pid)} scores${e.strength === "pp" ? " on the power play" : e.strength === "sh" ? " shorthanded" : e.strength === "en" ? " into the empty net" : ""}`
        + `${e.zone && e.zone !== "empty" ? ` from the ${e.zone}` : ""}`
        + `${cell ? `, ${cell.label}` : ""}.`;
    }
    if (e.kind === "save") return `${nm(e.pid)} turns aside ${nm(e.shooter)} on the rush.`;
    if (e.kind === "penalty") return `${nm(e.pid)} to the box, two minutes.`;
    if (e.kind === "fight") return `${nm(e.pid)} and ${nm(e.other)} drop the gloves.`;
    if (e.kind === "shootout") return `Shootout won by ${G.teams[e.team].name}.`;
    return e.kind;
  };
  const boxRows = (tid) => {
    const b = lg.boxes[tid];
    if (!b) return [];
    return Object.entries(b.players)
      .map(([pid, s]) => ({ p: G.players[pid], s }))
      .filter((r) => r.p && r.s.toi > 0)
      .sort((a, b2) => (b2.s.g || 0) + (b2.s.a || 0) - ((a.s.g || 0) + (a.s.a || 0)) || b2.s.toi - a.s.toi);
  };

  return (
    <div className="space-y-3">
      <div className={`${card} p-4 text-center`}>
        <div className="flex items-center justify-center gap-6">
          <div className="flex-1 text-right">
            <div className="text-sm text-slate-400">{A.city}</div>
            <div className="font-semibold">{A.name}</div>
          </div>
          <div className="text-3xl font-bold tnum">
            {upTo >= 1e9 ? lg.ag : running[1]}<span className="text-slate-600 mx-2">–</span>{upTo >= 1e9 ? lg.hg : running[0]}
          </div>
          <div className="flex-1 text-left">
            <div className="text-sm text-slate-400">{H.city}</div>
            <div className="font-semibold">{H.name}</div>
          </div>
        </div>
        <div className="text-xs text-slate-500 mt-1">{lg.so ? "Decided in a shootout" : lg.ot ? "Overtime" : "Regulation"}</div>
      </div>

      <div className="flex gap-2 flex-wrap">
        <button className={tab === "play" ? btnPri : btnGhost} onClick={() => setTab("play")}>Play-by-play</button>
        <button className={tab === "box" ? btnPri : btnGhost} onClick={() => setTab("box")}>Box score</button>
        {tab === "play" ? (
          <>
            <div className="flex-1" />
            <button className={btnGhost} onClick={() => setUpTo(0)}>Rewind</button>
            <button className={btnGhost} onClick={() => {
              const next = (lg.events || []).find((e) => e.t > upTo);
              setUpTo(next ? next.t : 1e9);
            }}>Next event</button>
            <button className={btnGhost} onClick={() => setUpTo(1e9)}>Show all</button>
          </>
        ) : null}
      </div>

      {tab === "play" ? (
        <Section title={`${events.length} of ${(lg.events || []).length} events`}>
          <div className="max-h-[30rem] overflow-y-auto">
            {events.map((e, i) => (
              <div key={i} className={`flex items-start gap-3 px-3 py-1.5 border-b border-[#16223a] text-sm
                ${e.kind === "goal" ? "bg-[#16223a]" : ""}`}>
                <span className="w-20 shrink-0 text-slate-500 tnum text-xs pt-0.5">{clockOf(e.t)}</span>
                <span className="w-10 shrink-0 text-slate-400 text-xs pt-0.5">{G.teams[e.team].abbr}</span>
                <span className={`flex-1 ${e.kind === "goal" ? "font-medium" : "text-slate-300"}`}>{line(e)}</span>
                <button className="text-xs text-sky-400 hover:underline shrink-0" onClick={() => openPlayer(e.pid)}>view</button>
              </div>
            ))}
            {!events.length ? <div className="px-3 py-4 text-sm text-slate-500">Puck drop. Step through with “Next event”.</div> : null}
          </div>
        </Section>
      ) : (
        <div className="grid md:grid-cols-2 gap-3">
          {[lg.away, lg.home].map((tid) => (
            <Section key={tid} title={`${G.teams[tid].city} ${G.teams[tid].name}`}>
              <SortTable min={320} rowKey={(r) => r.p.id} onRow={(r) => openPlayer(r.p.id)}
                rows={boxRows(tid)} initial="p"
                cols={[
                  { key: "name", label: "Player", get: (r) => r.p.ln, cell: (r) => <span className="whitespace-nowrap">{shortName(r.p)}</span> },
                  { key: "g", label: "G", get: (r) => r.s.g || 0 },
                  { key: "a", label: "A", get: (r) => r.s.a || 0 },
                  { key: "p", label: "P", get: (r) => (r.s.g || 0) + (r.s.a || 0), cls: "font-semibold" },
                  { key: "sog", label: "SOG", get: (r) => r.s.sog != null ? r.s.sog : (r.s.sa || 0),
                    cell: (r) => (r.p.pos === "G" ? `${r.s.sv}/${r.s.sa}` : r.s.sog) },
                  { key: "toi", label: "TOI", get: (r) => r.s.toi, cell: (r) => r.s.toi.toFixed(1) },
                ]} />
            </Section>
          ))}
        </div>
      )}
    </div>
  );
}
