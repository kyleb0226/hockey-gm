}
const CLINCH_LABEL = {
  z: "has won the division",
  y: "has clinched a top-three place in the division",
  x: "has clinched a playoff berth",
};

/* -------------------------------- playoffs -------------------------------- */

function seriesLen(G) { return ruleValue(G, "seriesLen"); }
function winsNeeded(G) { return Math.ceil(seriesLen(G) / 2); }

function buildBracket(G) {
  const R = ruleValue(G, "playoffFormat");
  const rounds = [];
  const matchups = [];
  [0, 1].forEach((conf) => {
    /* ORDER IS THE BRACKET. `advancePlayoffRound` pairs adjacent survivors —
       slots 0-1 and 2-3 — so round one has to be pushed with the series that
       are meant to meet sitting next to each other. Pushing them in any other
       order silently ruins the seeding: listing all four 1-vs-8 style openers
       first put the 1 and 2 seeds in the SAME half, so they met in round two
       instead of the conference final. */
    if (R === "seeded") {
      const f = playoffField(G, conf);
      // 1/8 with 4/5, 2/7 with 3/6 — so the 1 seed's half is the soft one.
      [[0, 7], [3, 4], [1, 6], [2, 5]].forEach(([a, b]) => {
        if (f[a] && f[b]) matchups.push(mkSeries(G, f[a].team.id, f[b].team.id, conf));
      });
    } else {
      const { top, wc, divs } = playoffField(G, conf);
      const winnerOf = (d) => (top.find((x) => x.div === d && x.divRank === 1) || {}).team;
      const winners = divs.map(winnerOf);
      // The cross-division part of the format: the conference's stronger
      // division winner draws the LOWER wildcard, the weaker one the higher.
      const better = winners[0] && winners[1] && winners[0].pts >= winners[1].pts ? 0 : 1;
      const wcFor = {};
      wcFor[divs[better]] = wc[1] || wc[0];
      wcFor[divs[1 - better]] = wc[0];
      // Each division's two series go in ADJACENT slots, so their winners meet
      // in round two — that's what makes it a divisional bracket at all.
      divs.forEach((d) => {
        const one = winnerOf(d), w = wcFor[d];
        const two = top.find((x) => x.div === d && x.divRank === 2);
        const three = top.find((x) => x.div === d && x.divRank === 3);
        if (one && w) matchups.push(mkSeries(G, one.id, w.id, conf));
        if (two && three) matchups.push(mkSeries(G, two.team.id, three.team.id, conf));
      });
    }
  });
  rounds.push(matchups);
  G.playoffs = { round: 0, rounds, champion: null };
  return G.playoffs;
}
function mkSeries(G, hi, lo, conf) {
  return { hi, lo, conf, w: [0, 0], games: [], done: false, winner: null };
}

function simSeriesGame(G, s) {
  if (s.done) return s;
  const gameNo = s.w[0] + s.w[1];
  // 2-2-1-1-1 home ice.
  const homeIsHi = [0, 1, 4, 6].includes(gameNo);
  const home = homeIsHi ? s.hi : s.lo, away = homeIsHi ? s.lo : s.hi;
  // The user's playoff games get the same play-by-play and shot log his regular
  // season games get — a spring run is the part you most want to look back at.
  const mine = home === G.userTeam || away === G.userTeam;
  const res = simGame(G, home, away, { playoff: true, events: mine, log: mine });
  applyGame(G, res, { playoff: true });
  if (mine) {
    G.lastGame = { day: G.day, home, away, hg: res.hg, ag: res.ag,
      ot: res.ot, so: res.so, playoff: true, events: res.events || [], boxes: res.boxes };
  }
  const hiWon = (res.hg > res.ag) === homeIsHi;
  s.w[hiWon ? 0 : 1]++;
  // The DAY is what ties this game to its row in `G.results`, which is where
  // the scoring summary lives. Without it a series game is only a scoreline.
  s.games.push({ home, away, hg: res.hg, ag: res.ag, ot: res.ot, so: res.so, d: G.day });
  const need = winsNeeded(G);
  if (s.w[0] >= need || s.w[1] >= need) {
    s.done = true;
    s.winner = s.w[0] >= need ? s.hi : s.lo;
    const loser = s.winner === s.hi ? s.lo : s.hi;
    if (s.winner === G.userTeam) news(G, `You beat ${G.teams[loser].name} ${s.w[0]}–${s.w[1]}.`, "good");
    if (loser === G.userTeam) news(G, `Eliminated by ${G.teams[s.winner].name}.`, "bad");
  }
  return s;
}

/* One night of playoff hockey: a game in every series that's still alive. This
   is the default way to move through the postseason — a seven-game series is
   worth watching game by game, not resolving in a single click. `G.day` ticks
   so shot-log records still carry a day that increases. */
function simPlayoffDay(G) {
  if (!G.playoffs || G.playoffs.champion != null) return G;
  const cur = G.playoffs.rounds[G.playoffs.round];
  const live = cur.filter((s) => !s.done);
  if (!live.length) return advancePlayoffRound(G);
  live.forEach((s) => simSeriesGame(G, s));
  G.day++;
  playersOf(G).forEach((p) => {
    if (p.inj > 0) { p.inj--; if (p.inj === 0) { p.injDesc = ""; if (p.teamId != null) G.teams[p.teamId].lines = null; } }
    p.fatigue = clamp(p.fatigue - (p.pos === "G" ? 4.2 : 0.8), 0, 100);
  });
  if (cur.every((s) => s.done)) advancePlayoffRound(G);
  return G;
}

/* Every series in the round is finished — crown a champion or build the next
   bracket. Shared by the game-by-game path and the whole-round fast-forward, so
   the two can never disagree about how the postseason advances. */
function advancePlayoffRound(G) {
  const P = G.playoffs;
  const cur = P.rounds[P.round];
  if (cur.some((s) => !s.done)) return G;
  const winners = cur.map((s) => s.winner);
  if (winners.length === 1) {
    P.champion = winners[0];
    const t = G.teams[P.champion];
    t.cupWins++;
    // Rings go on the players, not just the club — a career is measured in them.
    rosterOf(G, P.champion).forEach((p) => {
      p.rings = p.rings || [];
      p.rings.push({ year: G.year, t: P.champion });
    });
    news(G, `${t.city} ${t.name} win the Cup.`, "good");
    finishSeason(G);
    return G;
  }
  // Reseed inside the conference, then cross over for the final.
  const next = [];
  if (winners.length === 8 || winners.length === 4) {
    [0, 1].forEach((conf) => {
      const cw = cur.filter((s) => s.conf === conf).map((s) => s.winner);
      for (let i = 0; i < cw.length; i += 2) {
        const a = cw[i], b = cw[i + 1];
        if (b == null) { next.push(mkSeries(G, a, a, conf)); continue; }
        const hi = G.teams[a].pts >= G.teams[b].pts ? a : b;
        const lo = hi === a ? b : a;
        next.push(mkSeries(G, hi, lo, conf));
      }
    });
  } else {
    const [a, b] = winners;
    const hi = G.teams[a].pts >= G.teams[b].pts ? a : b;
    next.push(mkSeries(G, hi, hi === a ? b : a, -1));
  }
  P.rounds.push(next);
  P.round++;
  return G;
}

// Fast-forward: play the current round out in one go.
function simPlayoffRound(G) {
  if (!G.playoffs || G.playoffs.champion != null) return G;
  const cur = G.playoffs.rounds[G.playoffs.round];
  let guard = 0;
  while (cur.some((s) => !s.done) && guard++ < 60) simPlayoffDay(G);
  return G;
}

function endRegularSeason(G) {
  G.phase = "playoffs";
  updateRecords(G);
  computeAwards(G);
  // The affiliates settle their own championship before the Cup gets going.
  runFarmPlayoffs(G);
  buildBracket(G);
  const field = new Set();
  G.playoffs.rounds[0].forEach((s) => { field.add(s.hi); field.add(s.lo); });
  field.forEach((id) => G.teams[id].playoffApps++);
  if (!field.has(G.userTeam)) news(G, "You missed the playoffs.", "bad");
  else news(G, "You're in the playoffs.", "good");
  return G;
}

/* ----------------------------- the Hall of Fame ----------------------------
 * Rings, trophies and honoured numbers all accumulate; this is what they were
 * for. Eligible three years after retiring, judged on a career score, and the
 * class is capped so induction stays worth something.
 * ------------------------------------------------------------------------- */
const HOF_WAIT = 3;         // years after retirement before he's on the ballot
const HOF_CLASS_MAX = 3;    // inducted per year
const HOF_BAR = 62;         // career score needed

function hofScore(G, p) {
  const c = p.career || [];
  const gp = c.reduce((s, x) => s + (x.gp || 0), 0);
  if (!gp) return 0;
  if (p.pos === "G") {
    const sv = c.reduce((s, x) => s + (x.sv || 0), 0);
    const sa = c.reduce((s, x) => s + (x.sa || 0), 0);
    const w = c.reduce((s, x) => s + (x.w || 0), 0);
    const so = c.reduce((s, x) => s + (x.so || 0), 0);
    return w * 0.16 + so * 1.1 + (sa ? (sv / sa - 0.9) * 900 : 0)
      + (p.trophies || []).length * 9 + (p.rings || []).length * 7 + (p.allStars || []).length * 2;
  }
  const g = c.reduce((s, x) => s + (x.g || 0), 0);
  const a = c.reduce((s, x) => s + (x.a || 0), 0);
  return (g + a) * 0.11 + g * 0.05
    + (p.trophies || []).length * 9 + (p.rings || []).length * 7 + (p.allStars || []).length * 2;
}
function runHallOfFame(G) {
  G.hall = G.hall || [];
  const inducted = new Set(G.hall.map((h) => h.pid));
  const ballot = playersOf(G)
    .filter((p) => p.retired && !inducted.has(p.id))
    .filter((p) => p.retiredYear == null || G.year - p.retiredYear >= HOF_WAIT)
    .map((p) => ({ p, score: hofScore(G, p) }))
    .filter((x) => x.score >= HOF_BAR)
    .sort((a, b) => b.score - a.score)
    .slice(0, HOF_CLASS_MAX);
  ballot.forEach(({ p, score }) => {
    const c = p.career || [];
    G.hall.push({
      pid: p.id, name: fullName(p), pos: p.pos, year: G.year,
      score: Math.round(score),
      gp: c.reduce((s, x) => s + (x.gp || 0), 0),
      g: c.reduce((s, x) => s + (x.g || 0), 0),
      a: c.reduce((s, x) => s + (x.a || 0), 0),
      w: c.reduce((s, x) => s + (x.w || 0), 0),
      rings: (p.rings || []).length,
      trophies: (p.trophies || []).length,
      teamId: c.length ? c[c.length - 1].teamId : null,
    });
    p.hof = G.year;
    news(G, `${fullName(p)} has been elected to the Hall of Fame.`, "good");
  });
  return G.hall;
}

/* ------------------------------ record book -------------------------------
 * League records survive across seasons, and a player closing on one is worth
 * a line on the wire while it's still in doubt.
 * ------------------------------------------------------------------------- */

const RECORD_DEFS = [
  { key: "goals",   label: "Goals in a season",   pos: "S", get: (s) => s.g },
  { key: "points",  label: "Points in a season",  pos: "S", get: (s) => pts(s) },
  { key: "assists", label: "Assists in a season", pos: "S", get: (s) => s.a },
  { key: "pim",     label: "Penalty minutes",     pos: "S", get: (s) => s.pim },
  { key: "wins",    label: "Wins by a goalie",    pos: "G", get: (s) => s.w },
  { key: "shutouts", label: "Shutouts",           pos: "G", get: (s) => s.so },
];
const MILESTONES = { goals: [40, 50, 60], points: [80, 100, 120] };

/* Who led each category THIS season. The record book only ever kept the
   all-time best, so a year in which somebody scored 54 goals left no trace
   anywhere once a later season beat it — the league had a record holder and no
   history. Captured at the rollover, while `p.season` is still the season that
   just finished, and stored with the NAME as well as the id because
   `pruneSave` eventually forgets the player. */
function seasonLeaders(G) {
  const out = {};
  RECORD_DEFS.forEach((def) => {
    let best = null;
    playersOf(G).forEach((p) => {
      if ((def.pos === "G") !== (p.pos === "G")) return;
      if (!p.season.gp) return;
      const v = def.get(p.season);
      if (v > 0 && (!best || v > best.v)) best = { v, pid: p.id, name: fullName(p) };
    });
    if (best) out[def.key] = best;
  });
  return out;
}

function updateRecords(G) {
  G.records = G.records || {};
  RECORD_DEFS.forEach((def) => {
    playersOf(G).forEach((p) => {
      const isG = p.pos === "G";
      if ((def.pos === "G") !== isG) return;
      if (!p.season.gp) return;
      const v = def.get(p.season);
      const cur = G.records[def.key];
      if (!cur || v > cur.v) G.records[def.key] = { v, pid: p.id, name: fullName(p), year: G.year, team: p.teamId };
    });
  });
  return G.records;
}
// Fires while the season is still running, for the user's players only. The
// marks are quoted for an 82-game year and scaled to whatever's being played,
// so a 41-game season still has a fifty-goal equivalent worth chasing.
function checkMilestones(G) {
  const scale = ruleValue(G, "seasonLen") / 82;
  rosterOf(G, G.userTeam).forEach((p) => {
    if (p.pos === "G") return;
    p.marks = p.marks || {};
    Object.entries(MILESTONES).forEach(([k, marks]) => {
      const v = k === "goals" ? p.season.g : pts(p.season);
      marks.forEach((m) => {
        const tag = `${k}${m}`;
        const target = Math.max(5, Math.round(m * scale));
        if (v >= target && !p.marks[tag]) {
          p.marks[tag] = true;
          news(G, `${fullName(p)} reached ${target} ${k} on the season.`, "good");
        }
      });
    });
  });
}

/* ------------------------------ the All-Star break ------------------------ */

function allStarRosters(G) {
  const pickSide = (conf) => {
    const pool = playersOf(G).filter((p) => p.teamId != null && G.teams[p.teamId].conf === conf && p.season.gp > 5);
    const fwd = pool.filter((p) => p.pos !== "D" && p.pos !== "G").sort((a, b) => pts(b.season) - pts(a.season)).slice(0, 6);
    const d = pool.filter((p) => p.pos === "D").sort((a, b) => pts(b.season) - pts(a.season)).slice(0, 3);
    const g = pool.filter((p) => p.pos === "G").sort((a, b) => svPct(b.season) - svPct(a.season)).slice(0, 1);
    return fwd.concat(d, g).map((p) => p.id);
  };
  return { east: pickSide(0), west: pickSide(1) };
}
function runAllStar(G) {
  const rosters = allStarRosters(G);
  const rate = (ids) => ids.map((id) => G.players[id]).filter(Boolean)
    .reduce((s, p) => s + (p.pos === "G" ? 0 : p.r.sht + p.r.hnd), 0);
  const e = rate(rosters.east), w = rate(rosters.west);
  const eastScore = Math.round(6 + gauss(G, (e - w) / 400, 2.2));
  const westScore = Math.round(6 + gauss(G, (w - e) / 400, 2.2));
  const mvpPool = (eastScore >= westScore ? rosters.east : rosters.west).map((id) => G.players[id]).filter(Boolean);
  const mvp = mvpPool.sort((a, b) => pts(b.season) - pts(a.season))[0];
  // Snapshot the club each player was picked for. A selection is a fact about
  // the moment it was made — a deadline trade to the other conference must not
  // retroactively put him on the wrong bench.
  const at = {};
  rosters.east.concat(rosters.west).forEach((id) => { at[id] = G.players[id].teamId; });
  G.allStar = {
    year: G.year, day: G.day, ...rosters,
    east: rosters.east, west: rosters.west, at,
    eastScore: Math.max(0, eastScore), westScore: Math.max(0, westScore),
    mvp: mvp ? mvp.id : null,
  };
  rosters.east.concat(rosters.west).forEach((id) => {
    const p = G.players[id];
    if (!p) return;
    p.allStars = p.allStars || [];
    if (!p.allStars.includes(G.year)) p.allStars.push(G.year);
  });
  const mine = rosters.east.concat(rosters.west).filter((id) => G.players[id] && G.players[id].teamId === G.userTeam);
  if (mine.length) news(G, `All-Star selections: ${mine.map((id) => fullName(G.players[id])).join(", ")}.`, "good");
  return G.allStar;
}

/* --------------------------------- awards --------------------------------- */

/* A ballot rather than a sort. `share` is the fraction of the vote each man
   got, so a runaway winner reads as one and a close race reads as one — which
   is most of what an awards page is for. Scores are shifted so the fifth-placed
   candidate sits near zero; otherwise every ballot comes out looking like a
   four-way tie, because the gap between first and fifth is small next to the
   absolute numbers. */
const BALLOT_SIZE = 5;
function ballot(cands, scoreFn, size) {
  const n = size || BALLOT_SIZE;
  const scored = cands.map((p) => ({ p, score: scoreFn(p) }))
    .filter((x) => isFinite(x.score))
    .sort((a, b) => b.score - a.score)
    .slice(0, n);
  if (!scored.length) return [];
  const floor = scored[scored.length - 1].score;
  const spread = scored.map((x) => Math.max(0, x.score - floor) + 0.12 * Math.abs(scored[0].score - floor || 1));
  const tot = spread.reduce((a, b) => a + b, 0) || 1;
  /* `val` is the RAW score, kept alongside the vote share. For the Hart or the
     Norris the share is the whole story and the raw number is an internal
     index nobody should see. For the scoring and goal-scoring titles it's the
     reverse: those are not votes at all, they're counts, and rendering "31% of
     the vote" next to a man who scored 54 goals was a made-up number sitting
     where the real one belonged. Storing both lets each award show the one
     that means something. */
  return scored.map((x, i) => ({ id: x.p.id, share: spread[i] / tot, val: x.score }));
}

/* The ballot's electorate: one entry per player, carrying the line the voters
 * are reading and the club record behind it.
 *
 * This is split out from `computeAwards` so the SAME vote can be run over a
 * season rebuilt from the career archive. A retroactive award and a live one
 * have to come out of one function — two implementations of "who was the MVP"
 * is two different records of the same season, and the one nobody is looking at
 * is always the one that drifts.
 * ------------------------------------------------------------------------- */
function awardPool(G, opts) {
  const o = opts || {};
  return playersOf(G).map((p) => {
    const s = o.lineOf ? o.lineOf(p) : p.season;
    if (!s || !s.gp) return null;
    return {
      id: p.id, p, s,
      clubPts: o.clubPtsOf ? o.clubPtsOf(p, s)
        : (p.teamId != null && G.teams[p.teamId] ? G.teams[p.teamId].pts : 0),
      rookie: o.rookieOf ? o.rookieOf(p) : !!p.rookie,
    };
  }).filter(Boolean);
}

function voteAwards(G, pool, year) {
  const sk = pool.filter((x) => x.p.pos !== "G" && x.s.gp > 10);
  const gs = pool.filter((x) => x.p.pos === "G" && x.s.gp > 15);
  const byPts = sk.slice().sort((a, b) => pts(b.s) - pts(a.s) || b.s.g - a.s.g);
  const byGoals = sk.slice().sort((a, b) => b.s.g - a.s.g);
  const rookiePool = pool.filter((x) => x.rookie && x.s.gp > 10);
  const clubPts = (x) => x.clubPts || 0;

  /* The MVP used to BE the scoring champion — the same id in two fields, so the
     two trophies could never disagree and the Hart meant nothing on its own.
     It's now its own argument: value on the ice, weighted by whether it carried
     a team anywhere. */
  /* Goalies are DISCOUNTED here, not boosted. Point shares systematically rate
     them above skaters — a starter's saves-over-replacement dwarfs a forward's
     goals-over-replacement — so scoring the Hart on raw shares handed it to a
     goaltender in every season tested. Real voters correct for exactly that,
     giving it to a netminder perhaps one year in ten. */
  const mvpScore = (x) => {
    const ps = pointShares(G, x.p, x.s);
    if (x.p.pos === "G") return ps.ps * 0.72 + clubPts(x) * 0.028;
    // For skaters, weight what he did WITH THE PUCK. Defensive shares come
    // mostly from ice time, so scoring the Hart on total shares handed it to a
    // defenceman five years in eight — the same flaw as the goalie case.
    return ps.ops * 1.5 + ps.dps * 0.3 + clubPts(x) * 0.028;
  };
  const votes = {
    mvp: ballot(sk.concat(gs), mvpScore),
    defence: ballot(sk.filter((x) => x.p.pos === "D"),
      (x) => pointShares(G, x.p, x.s).ps * 1.25 + x.s.blk * 0.012 + x.s.pm * 0.06
        + (x.s.toi / Math.max(1, x.s.gp)) * 0.18),
    goalie: ballot(gs.filter((x) => x.s.sa > 700),
      (x) => (svPct(x.s) - 0.885) * 240 + x.s.w * 0.09 + x.s.so * 0.35),
    // A rookie goaltender is eligible for the Calder, which sorting by points
    // quietly made impossible.
    rookie: ballot(rookiePool,
      (x) => (x.p.pos === "G"
        ? (svPct(x.s) - 0.885) * 200 + x.s.w * 0.08
        : pts(x.s) * 0.12 + pointShares(G, x.p, x.s).ps * 0.5)),
    scoring: ballot(sk, (x) => pts(x.s)),
    goals: ballot(sk, (x) => x.s.g),
  };
  const winner = (k) => (votes[k] && votes[k][0] ? votes[k][0].id : null);
  return {
    year,
    scoring: byPts[0] ? byPts[0].id : null,
    goals: byGoals[0] ? byGoals[0].id : null,
    mvp: winner("mvp"),
    defence: winner("defence"),
    goalie: winner("goalie"),
    rookie: winner("rookie"),
    votes,
  };
}

/* Hand the trophies out. Idempotent on (player, year, award), because the
   retroactive pass runs over seasons that may already have been settled — a
   save reloaded twice must not give the same man two of the same trophy. */
function awardTrophies(G, A) {
  Object.entries(A).forEach(([k, id]) => {
    if (k === "year" || k === "votes" || id == null) return;
    const p = G.players[id];
    if (!p) return;
    p.trophies = p.trophies || [];
    if (p.trophies.some((t) => t.year === A.year && t.award === k)) return;
    p.trophies.push({ year: A.year, award: k });
  });
  return A;
}

function computeAwards(G) {
  const A = voteAwards(G, awardPool(G), G.year);
  awardTrophies(G, A);
  G.awards = A;
  return A;
}

/* ---------------------------- awards, after the fact -----------------------
 * Awards arrived later than the seasons some careers had already played, so a
 * save carried years with no trophies at all and a player's bio was missing
 * silverware he had plainly earned. Two different holes, and this fills both:
 *
 *  1. A season that was never voted on. Rebuilt from the career archive and
 *     put through `voteAwards` — the same ballot the live season uses.
 *  2. A season that WAS voted on but whose trophies never reached the players.
 *     Cheap to fix and the more common of the two: the vote is already stored
 *     on the history row, so it just has to be handed out.
 *
 * Case 1 is only honest while the season is still reconstructible. `pruneSave`
 * collapses a retired man's seasons into one career total and eventually drops
 * him entirely, so an old enough year survives only as its stars — and electing
 * an MVP from forty surviving players is not a record, it's an invention. Below
 * `RETRO_MIN_POOL` skaters the year is left blank, which is the truthful
 * answer. Case 2 has no such problem: nothing is being decided, only delivered.
 * ------------------------------------------------------------------------- */
const RETRO_MIN_POOL = 220;   // skaters that must survive for a rebuilt vote to mean anything

/* One player's line for a finished season, rebuilt from his career rows. A
   traded year is stored one row per club, so the rows are summed back into the
   season the voters would actually have seen. A collapsed retired total is not
   a season and is ignored. */
function archivedLine(p, year) {
  const rows = (p.career || []).filter((c) => c.year === year && !c.total);
  if (!rows.length) return null;
  if (rows.length === 1) return rows[0];
  const line = {};
  rows.forEach((c) => Object.keys(c).forEach((k) => {
    if (k === "year" || k === "teamId" || k === "to" || typeof c[k] !== "number") return;
    line[k] = (line[k] || 0) + c[k];
  }));
  return line;
}

function backfillAwards(G) {
  let voted = 0, handed = 0;
  (G.history || []).forEach((h) => {
    if (!h || h.year == null) return;

    // Case 2 first — it's free, and it also covers the years case 1 just filled.
    if (h.awards) { awardTrophies(G, h.awards); handed++; return; }

    // Case 1: rebuild the season and put it to a vote.
    const ptsOf = {};
    (h.standings || []).forEach((s) => { ptsOf[s.id] = s.pts; });
    const lines = {};
    playersOf(G).forEach((p) => {
      const s = archivedLine(p, h.year);
      if (s && s.gp) lines[p.id] = s;
    });
    const pool = awardPool(G, {
      lineOf: (p) => lines[p.id],
      // The club he was with THAT year, not the one he plays for now.
      clubPtsOf: (p) => {
        const row = (p.career || []).find((c) => c.year === h.year && !c.total);
        return (row && ptsOf[row.teamId]) || 0;
      },
      // Nothing records who was a rookie, but a career's first season is one.
      // Wrong only for a man whose debut year has already been pruned away —
      // and he is not winning the Calder in a rebuilt vote anyway.
      rookieOf: (p) => {
        const first = (p.career || []).filter((c) => !c.total).map((c) => c.year).sort()[0];
        return first === h.year;
      },
    });
    if (pool.filter((x) => x.p.pos !== "G").length < RETRO_MIN_POOL) return;
    h.awards = awardTrophies(G, voteAwards(G, pool, h.year));
    h.retroAwards = true;   // so the history page can say the vote was reconstructed
    voted++;
  });
  return { voted, handed };
}

/* ------------------------------ end of season ----------------------------- */

function finishSeason(G) {
  G.phase = "offseason";
  G.offseasonStep = "review";
  const champ = G.playoffs && G.playoffs.champion;
  G.history.push({
    year: G.year,
    champion: champ,
    standings: G.teams.map((t) => ({ id: t.id, w: t.w, l: t.l, otl: t.otl, pts: t.pts })),
    awards: G.awards,
    // Captured here because `p.season` is blanked further down the rollover.
    leaders: seasonLeaders(G),
    userRecord: { w: G.teams[G.userTeam].w, l: G.teams[G.userTeam].l, otl: G.teams[G.userTeam].otl, pts: G.teams[G.userTeam].pts },
  });
  // Board reaction: making the playoffs is the baseline expectation.
  const me = G.teams[G.userTeam];
  const made = G.playoffs && G.playoffs.rounds[0].some((s) => s.hi === G.userTeam || s.lo === G.userTeam);
  // Judged against what the board actually asked for at the start of the year,
  // not against a flat "did you make the playoffs".
  const want = (G.mandate && G.mandate.need) || 1;
  const got = seasonAchievement(G);
  let swing = (got - want) * 9;
  if (champ === G.userTeam) swing = Math.max(swing, 30);
  if (got >= want) news(G, `The board is satisfied: ${(G.mandate && G.mandate.label) || "expectations met"}.`, "good");
  else news(G, `The board wanted more: ${(G.mandate && G.mandate.label) || "expectations"}.`, "bad");
  G.lastMandate = { ...(G.mandate || {}), got, met: got >= want };
  G.boardConfidence = clamp(G.boardConfidence + (swing < 0 ? swing / diff(G).patience : swing * diff(G).patience), 0, 100);

  /* And the board can act on it. Confidence has been tracked and displayed
     since the first build while nothing whatsoever depended on it, which made
     every mandate advisory — you could miss the playoffs for a decade and keep
     the job. Winning the Cup buys a year no matter what came before it. */
  if (champ !== G.userTeam && G.boardConfidence <= FIRING_LINE) {
    G.tenure = (G.tenure || []).concat([{
      teamId: G.userTeam,
      from: G.hiredYear != null ? G.hiredYear : G.year - (G.teams[G.userTeam].seasons || []).length + 1,
      to: G.year,
      cups: (G.teams[G.userTeam].cupWins || 0),
    }]);
    G.fired = { year: G.year, teamId: G.userTeam, mandate: (G.mandate && G.mandate.label) || "expectations" };
    news(G, `You have been relieved of your duties by the ${G.teams[G.userTeam].name}.`, "bad");
  }

  // Ageing, progression and contract expiry all happen HERE rather than at the
  // rollover, so that the offseason screens show next year's ratings and a real
  // free-agent class instead of last year's leftovers.
  playersOf(G).forEach((p) => {
    if (p.season.gp) {
      // The shot maps are a this-season view; carrying nine net cells and three
      // ice zones into every career row for every player is what pushes a long
      // save past the storage ceiling.
      const { z, net, ...totals } = p.season;
      const spells = (p.stints || []).filter((st) => st.s.gp);
      if (spells.length > 1) {
        // A traded year goes into the record as one row per club, which is how
        // a real career table reads it. Each spell's shares are computed from
        // that spell's own line, so the rows still sum to the season.
        spells.forEach((st) => p.career.push(stampShares(G, p, { year: G.year, teamId: st.t, ...st.s })));
      } else {
        p.career.push(stampShares(G, p, { year: G.year, teamId: spells.length ? spells[0].t : p.teamId, ...totals }));
      }
    }
    p.stints = null;
    /* Last season's line is kept for the UI, but WITHOUT the nine net cells and
       three ice zones — the shot maps are a current-season view and nothing
       reads `p.stats.z` or `p.stats.net`. Carrying them was ~240 bytes on every
       player in the league for a year, for data no screen ever showed. */
    const { z: _lz, net: _ln, ...lastYear } = p.season;
    p.stats = stampShares(G, p, lastYear);
    p.season = blankStats(p.pos);
    // A playoff run used to be thrown away at the rollover, which meant a
    // twenty-year career had no postseason record at all. Keep the running
    // total and a count of the springs he played.
    if (p.po && p.po.gp) {
      if (!p.careerPO) { p.careerPO = blankStats(p.pos); delete p.careerPO.z; delete p.careerPO.net; }
      Object.keys(p.careerPO).forEach((k) => {
        if (typeof p.careerPO[k] === "number" && typeof p.po[k] === "number") p.careerPO[k] += p.po[k];
      });
      p.poRuns = (p.poRuns || 0) + 1;
    }
    p.po = null;
    p.rookie = false;
    p.age++;
    // A summer is long enough to heal anything and shake off any rust.
    p.inj = 0; p.injDesc = ""; p.fatigue = 0;
    p.rust = 0; p.rustFrom = 0; p.rustKey = null; p.injGames = 0;
    progress(G, p);
    if (p.contract.yrs > 0) p.contract.yrs--;
  });
  playersOf(G).forEach((p) => {
    if (p.retired || p.teamId == null) return;
    if (rnd(G) < retirementChance(G, p)) {
      if (p.teamId === G.userTeam) news(G, `${fullName(p)} retires at ${p.age}.`, "info");
      // A long server who was genuinely good gets his number hung up by the club
      // he gave the most seasons to.
      const byClub = {};
      (p.career || []).forEach((c) => { if (c.teamId != null) byClub[c.teamId] = (byClub[c.teamId] || 0) + 1; });
      const home = Object.keys(byClub).sort((a, b) => byClub[b] - byClub[a])[0];
      const careerPts = (p.career || []).reduce((s, c) => s + (c.g || 0) + (c.a || 0), 0);
      const careerGp = (p.career || []).reduce((s, c) => s + (c.gp || 0), 0);
      // A rate, not a total — otherwise a short-season league never honours
      // anybody and an 82-game one honours half the roster.
      const ppg = careerGp ? careerPts / careerGp : 0;
      if (home != null && byClub[home] >= 4 && (ppg >= 0.65 || p.trophies.length >= 1)) {
        const t = G.teams[+home];
        t.honours = t.honours || [];
        t.honours.push({ pid: p.id, name: fullName(p), pos: p.pos, seasons: byClub[home], pts: careerPts, year: G.year });
        news(G, `The ${G.teams[+home].name} will raise ${fullName(p)}\u2019s number to the rafters — ${byClub[home]} seasons, ${careerPts} points.`, "good");
      }
      p.teamId = null; p.retired = true; p.retiredYear = G.year;
      const i = G.freeAgents.indexOf(p.id); if (i >= 0) G.freeAgents.splice(i, 1);
      return;
    }
    if (p.contract.yrs <= 0) {
      // The club that has him gets first refusal, exactly as it does in life.
      // The user makes his own call — his expiring players reach the market and
      // he can re-sign them there, or extend them before they ever get that far.
      if (p.teamId !== G.userTeam) {
        const offer = aiExtensionOffer(G, p);
        if (offer && rnd(G) < offer.want) {
          p.contract = { amt: offer.ask, yrs: offer.yrs };
          p.ntc = eligibleForNtc(p) && offer.yrs >= 3 && rnd(G) < 0.55;
          p.ntcWaived = false;
          return;
        }
      }
      p.teamId = null; p.farm = false;
      if (!G.freeAgents.includes(p.id)) G.freeAgents.push(p.id);
    }
  });
  G.teams.forEach((t) => { t.lines = null; });

  // Every club keeps its own season-by-season record, which is what a franchise
  // history page is made of.
  const champ2 = G.playoffs && G.playoffs.champion;
  const madeIt = (id) => G.playoffs && G.playoffs.rounds[0].some((s) => s.hi === id || s.lo === id);
  const roundsWon = (id) => (G.playoffs ? G.playoffs.rounds.filter((rd) => rd.some((s) => s.winner === id)).length : 0);
  G.teams.forEach((t) => {
    t.seasons = t.seasons || [];
    t.seasons.push({
      year: G.year, w: t.w, l: t.l, otl: t.otl, pts: t.pts, gf: t.gf, ga: t.ga,
      playoffs: madeIt(t.id), rounds: roundsWon(t.id), cup: champ2 === t.id,
    });
    t.honours = t.honours || [];
  });

  // Retained salary burns down with the contract it came from; waivers and
  // waived no-trade clauses don't carry over.
  G.retained = (G.retained || []).map((r) => ({ ...r, yrs: r.yrs - 1 })).filter((r) => r.yrs > 0);
  G.waivers = [];
  playersOf(G).forEach((p) => {
    p.ntcWaived = false;
    if (p.farmSeason) {
      p.farmCareer = (p.farmCareer || []).concat([{ year: G.year, ...p.farmSeason }]);
      p.farmSeason = null;
    }
  });

  /* Attrition. Seven rounds is 224 prospects a year and most late picks never
     become anything — without this they sit on farm rosters forever and the
     save grows by a thousand dead players a decade. A prospect who is old
     enough to have shown something and hasn't is released outright. */
  playersOf(G).forEach((p) => {
    if (p.retired) return;
    const nothingToShow = !(p.career || []).length && !(p.trophies || []).length && !(p.rings || []).length;
    if (!nothingToShow) return;
    // A prospect old enough to have shown something who hasn't.
    const stalled = p.farm && p.teamId != null && p.age >= 23 && p.ovr < 49 && p.pot < 57;
    /* Career farm filler. The pool cap only ever reached players nobody had
       signed, so once clubs started re-signing their own, depth bodies could
       stay under contract forever and never be pruned — a couple of hundred
       extra dead records a decade. A 26-year-old on a farm roster who has never
       played an NHL game and isn't good enough to is done. */
    const filler = p.farm && p.teamId != null && p.age >= 26 && p.ovr < 50;
    // And the bigger leak: an entry-level deal expires, nobody signs him, and
    // he sits in the free-agent pool forever. Most of a seven-round class ends
    // up here, which is a thousand dead records a decade.
    const unwanted = p.teamId == null && p.age >= 22 && p.ovr < 53;
    if (!stalled && !unwanted && !filler) return;
    if (stalled && p.teamId === G.userTeam && p.draft && p.draft.round <= 2) {
      news(G, `${fullName(p)} never developed and has been released.`, "bad");
    }
    const fi = G.freeAgents.indexOf(p.id);
    if (fi >= 0) G.freeAgents.splice(fi, 1);
    delete G.players[p.id];
  });

  /* And a hard cap on the pool, because thresholds alone can't hold it. Seven
     rounds puts 224 players a year into a league that only loses ~50 to
     retirement, so the free-agent list grows without bound whatever the quality
     bar. Everyone who can't get a contract eventually leaves the sport; here
     the ones with nothing on their record leave first. */
  /* Neither limit was enforced — nothing stopped a club stockpiling prospects
     it would never dress, and nothing counted the dressed side at all. A club
     now keeps its best twelve on the farm, its best twenty-three above it, and
     lets the rest go to the market like anyone else. */
  enforceRosterLimits(G);

  capFreeAgentPool(G);

  runHallOfFame(G);
  buildDraftClass(G);
  return G;
}

/* Nobody should start a season unable to ice a legal lineup. After free agency
   has run its course, any club still short is topped up with depth bodies. */
/* What a club must be able to dress. Shared, because `enforceRosterLimits`
   sends surplus players down and `fillRosters` calls them back up — if the two
   disagreed about the minimums they would fight each other every rollover, and
   the club would start the season a goaltender short. */
const DRESS_MIN = { G: 2, D: 6, C: 4, LW: 3, RW: 3 };
const ROSTER_MIN = 20;   // bodies a club has to have dressed

function fillRosters(G) {
  const need = DRESS_MIN;
  G.teams.forEach((t) => {
    // The minimums are for the DRESSED roster, not the organisation. Counting
    // the farm here once left clubs with their second goalie stuck in the minors
    // and nobody to back up the starter.
    Object.entries(need).forEach(([pos, n]) => {
      const atPos = () => rosterOf(G, t.id).filter((p) => p.pos === pos).length;
      // Recall from the farm before signing anyone off the street.
      rosterOf(G, t.id, true).filter((p) => p.farm && p.pos === pos)
        .sort((a, b) => b.ovr - a.ovr)
        .forEach((p) => { if (atPos() < n) p.farm = false; });
      while (atPos() < n) {
        const p = genPlayer(G, pos, 40, ri(G, 20, 27));
        p.teamId = t.id;
        p.contract = { amt: MIN_SALARY, yrs: ri(G, 1, 2) };
        G.players[p.id] = p;
      }
    });
    // Recall from the farm first, and only then sign bodies off the street.
    const short = ROSTER_MIN - rosterOf(G, t.id).length;
    if (short > 0) {
      rosterOf(G, t.id, true).filter((p) => p.farm).sort((a, b) => b.ovr - a.ovr)
        .slice(0, short).forEach((p) => { p.farm = false; });
    }
    let guard = 0;
    while (rosterOf(G, t.id).length < ROSTER_MIN && guard++ < 12) {
      const p = genPlayer(G, pick(G, ["C", "LW", "RW", "D"]), 40, ri(G, 20, 27));
      p.teamId = t.id;
      p.contract = { amt: MIN_SALARY, yrs: 1 };
      G.players[p.id] = p;
    }
    t.lines = null;
  });
  return G;
}

/* --------------------------------- draft ---------------------------------- */

/* ---------------------------------- the draft -----------------------------
 * Seven rounds, and a board you have to form an opinion about. Every prospect
 * carries FOG: what you see is his true rating pushed around by a bias you
 * can't observe, and the only way to shrink it is to spend scouting on him.
 * The AI drafts off its own noisy read, so the board is genuinely contestable
 * rather than a ranked list everyone agrees on.
 * ------------------------------------------------------------------------- */

const DRAFT_ROUNDS = 7;
const SCOUT_POINTS = 14;      // scouting visits per offseason
const FA_POOL_MAX = 150;      // players who can't get a contract leave the sport
const FOG_MAX_SWING = 13;     // how far an unscouted read can be off

const JUNIOR = ["major junior", "college", "European elite", "national program", "prep school"];
const STYLES = {
  C: ["two-way pivot", "playmaker", "faceoff specialist", "power forward"],
  LW: ["sniper", "grinder", "puck hound", "net-front presence"],
  RW: ["sniper", "rush threat", "agitator", "finisher"],
  D: ["shutdown", "puck mover", "offensive defenceman", "stay-at-home", "physical"],
  G: ["butterfly", "hybrid", "athletic scrambler", "positional"],
};

// The reading you get on a prospect, not the truth. Deterministic per player so
// it doesn't shimmer between renders — only scouting moves it.
function scoutedOvr(p) {
  const f = p.scout ? p.scout.fog : 0;
  return Math.round(clamp(p.ovr + (p.scout ? p.scout.bias : 0) * f * FOG_MAX_SWING, 20, 99));
}
function scoutedPot(p) {
  const f = p.scout ? p.scout.fog : 0;
  return Math.round(clamp(p.pot + (p.scout ? p.scout.bias2 : 0) * f * FOG_MAX_SWING * 1.3,
    scoutedOvr(p), 99));
}
const scoutBand = (p) => Math.round((p.scout ? p.scout.fog : 0) * FOG_MAX_SWING);
const scoutLabel = (p) => {
  const f = p.scout ? p.scout.fog : 0;
  return f > 0.75 ? "unseen" : f > 0.45 ? "one viewing" : f > 0.2 ? "well scouted" : "known quantity";
};
function scoutProspect(G, pid) {
  const p = G.players[pid];
  if (!p || !p.scout) return { ok: false, why: "not a prospect" };
  if ((G.scoutPoints || 0) <= 0) return { ok: false, why: "no scouting left this offseason" };
  if (p.scout.fog <= 0.06) return { ok: false, why: "you already know him" };
  G.scoutPoints--;
  p.scout.fog = Math.max(0.05, p.scout.fog * 0.45);
  return { ok: true, fog: p.scout.fog };
}
// What a club thinks he's worth: potential first, but only what it can see.
const draftValue = (p) => scoutedPot(p) * 0.68 + scoutedOvr(p) * 0.32;

function buildDraftClass(G) {
  G.draftClass = [];
  const total = DRAFT_ROUNDS * G.teams.length;
  for (let i = 0; i < total; i++) {
    const p = genPlayer(G, pick(G, ["C", "C", "LW", "RW", "D", "D", "G"]), 42 + (total - i) * 0.055, 18);
    p.pot = Math.round(clamp(p.ovr + gauss(G, 18, 7), p.ovr + 2, 99));
    p.rookie = true;
    // The top of the board is public knowledge; nobody has seen the late kids.
    const known = clamp(0.35 + i / total * 0.75, 0.35, 1);
    p.scout = {
      fog: known,
      bias: clamp(gauss(G, 0, 0.55), -1, 1),
      bias2: clamp(gauss(G, 0, 0.6), -1, 1),
    };
    p.junior = pick(G, JUNIOR);
    p.style = pick(G, STYLES[p.pos] || STYLES.C);
    G.players[p.id] = p;
    G.draftClass.push(p.id);
  }
  G.scoutPoints = SCOUT_POINTS;
  G.draftLog = [];
  // Lottery order: non-playoff teams worst-first, with a real lottery on top.
  /* A career that STARTS in the offseason has no season behind it, so every
     club sits on zero points and the sort falls back to club id — the draft
     order would be the alphabet. Weakest roster picks first instead, which is
     what last year's table would have said anyway. */
  const played = G.teams.some((t) => t.gp > 0);
  const rank = played ? (t) => t.pts : (t) => teamStrength(G, t.id);
  const nonPlayoff = G.teams.filter((t) => !inPlayoffs(G, t.id)).sort((a, b) => rank(a) - rank(b));
  const playoffTeams = G.teams.filter((t) => inPlayoffs(G, t.id)).sort((a, b) => rank(a) - rank(b));
  const order = nonPlayoff.map((t) => t.id);
  // Weighted lottery for the top pick among the bottom ten.
  const pool = order.slice(0, 10);
  if (pool.length) {
    const wts = pool.map((_, i) => Math.pow(pool.length - i, 1.6));
    const tot = wts.reduce((a, b) => a + b, 0);
    let x = rnd(G) * tot, winner = pool[0];
    for (let i = 0; i < pool.length; i++) { x -= wts[i]; if (x <= 0) { winner = pool[i]; break; } }
    order.splice(order.indexOf(winner), 1);
    order.unshift(winner);
  }
  G.draftOrder = order.concat(playoffTeams.map((t) => t.id));
  G.draftPick = 0;
  // Which year this order belongs to. Without it last June's order looks like
  // this June's for the whole offseason before the class is built.
  G.draftYear = G.year;
  return G.draftClass;
}
function inPlayoffs(G, teamId) {
  if (!G.playoffs) return false;
  return G.playoffs.rounds[0].some((s) => s.hi === teamId || s.lo === teamId);
}
// Whose turn it is, following traded picks.
function pickOwner(G, index) {
  const round = Math.floor(index / G.teams.length) + 1;
  const orig = G.draftOrder[index % G.teams.length];
  const rec = G.picks.find((pk) => pk.year === G.year && pk.round === round && pk.orig === orig);
  return rec ? rec.owner : orig;
}
const draftPicksTotal = (G) => G.teams.length * DRAFT_ROUNDS;

function draftPlayer(G, pid) {
  // draftPick counts picks made overall; the class shrinks as it goes, so the
  // two must never be compared against each other.
  if (!G.draftClass.length || G.draftPick >= draftPicksTotal(G)) return false;
  const team = pickOwner(G, G.draftPick);
  const p = G.players[pid];
  if (!p || !G.draftClass.includes(pid)) return false;
  const round = Math.floor(G.draftPick / G.teams.length) + 1;
  p.teamId = team;
  p.farm = true;
  p.contract = { amt: ELC_SALARY, yrs: 3 };
  // Where he went is part of who he is for the rest of his career.
  p.draft = { year: G.year, round, pick: G.draftPick + 1, teamId: team };
  // Drafting him is a viewing in itself.
  if (p.scout) p.scout.fog = Math.min(p.scout.fog, 0.3);
  G.draftLog = G.draftLog || [];
  G.draftLog.push({ round, pick: G.draftPick + 1, teamId: team, pid });
  G.draftClass.splice(G.draftClass.indexOf(pid), 1);
  G.draftPick++;
  if (team === G.userTeam) {
    news(G, `Drafted ${fullName(p)} — ${p.pos}, ${p.style}, out of ${p.junior}.`, "good");
  }
  return true;
}
/* --------------------------------- the list --------------------------------
 * Prospects you've starred, IN THE ORDER YOU STARRED THEM. It's a ranked
 * shortlist, not a set of bookmarks: when a pick is made for you — the "draft
 * best available" step, or auto-drafting the rest of the round — it goes down
 * this list first and only falls back to the board when none of your men are
 * left. Which is the point. A draft you sim through is otherwise a draft
 * somebody else's ranking made for you.
 * ------------------------------------------------------------------------- */
function starList(G) {
  return (G.draftStars || []).filter((id) => G.players[id] && G.draftClass.includes(id));
}
function toggleStar(G, pid) {
  G.draftStars = G.draftStars || [];
  const i = G.draftStars.indexOf(pid);
  if (i >= 0) G.draftStars.splice(i, 1); else G.draftStars.push(pid);
  return G;
}

/* Who a club takes with the pick in front of it. Your own picks consult your
   list; everyone else reads their own fogged board. The AI branch must stay
   exactly one `gauss` call — the harness replays seasons off the seed. */
function autoPickFor(G, team) {
  if (team === G.userTeam) {
    const want = starList(G)[0];
    if (want) return G.players[want];
  }
  // Clubs draft off their OWN read of the board, with a little extra noise, so
  // the same prospect isn't ranked identically by all thirty-two of them.
  const best = G.draftClass
    .map((id) => G.players[id])
    .map((p) => ({ p, v: draftValue(p) + gauss(G, 0, 3.2) }))
    .sort((a, b) => b.v - a.v)[0];
  return best ? best.p : null;
}

function autoDraft(G, stopAtUser) {
  let guard = 0;
  while (G.draftPick < draftPicksTotal(G) && G.draftClass.length && guard++ < 400) {
    const team = pickOwner(G, G.draftPick);
    if (stopAtUser && team === G.userTeam) return false;
    const best = autoPickFor(G, team);
    if (!best) break;
    draftPlayer(G, best.id);
  }
  if (!G.draftClass.length || G.draftPick >= draftPicksTotal(G)) closeDraft(G);
  return true;
}

/* ONE pick, then stop. "Sim to my pick" skips past the twelve selections that
   decide whether your man is still there, which is the part worth watching —
   you want to see the run happen, not be told how it ended. Nothing is
   duplicated: it makes the same draw `autoDraft` makes, one time.
   Returns false when it's your turn and there is nothing to advance. */
function draftOnePick(G) {
  if (!G.draftClass.length || G.draftPick >= draftPicksTotal(G)) return false;
  if (pickOwner(G, G.draftPick) === G.userTeam) return false;
  const best = autoPickFor(G, pickOwner(G, G.draftPick));
  if (!best) return false;
  draftPlayer(G, best.id);
  if (!G.draftClass.length || G.draftPick >= draftPicksTotal(G)) closeDraft(G);
  return true;
}

/* When a prospect is likely to come off the board.
 *
 * Sniping only means something if you can see the run coming, and the
 * information is all there: clubs draft off `draftValue` plus noise, so the
 * board sorted by that value IS the expected order. A prospect ranked fifth
 * among those left is expected to go five picks from now.
 *
 * It is an EXPECTATION, not a promise — the `gauss(0, 3.2)` each club adds is
 * real and routinely moves a man several slots either way. `risk` says how
 * close he is to the edge of your reach so the board can shade it rather than
 * printing a false certainty: 1 means he'll almost surely be gone, 0 that he
 * will almost surely last. `NOISE_PICKS` is how far that rating spreads him,
 * measured in picks, and it is the honest width of the guess.
 * ------------------------------------------------------------------------- */

  // Close offers get one counter; insulting ones get a flat no.
  if (amt >= want * 0.82) return { ok: false, counter: want, counterYrs: yrs, why: `he wants $${want}M × ${yrs}` };
  return { ok: false, want, why: "not interested at that number" };
}

/* --------------------------- prospect development -------------------------
 * Draftees don't just sit in a warehouse. They play a farm season, produce a
 * stat line, and develop faster than they would riding an NHL bench.
 * ------------------------------------------------------------------------- */

const FARM_READY = 4;   // within this of his ceiling, he's knocking on the door
function isProspect(p) { return !!p.farm && p.age <= 23 && !p.retired; }
function prospectReady(G, p) {
  if (!p.farm) return false;
  // Now that the farm is a real league, dominating it is itself a signal — a
  // prospect outscoring the affiliate is telling you he's finished learning
  // there, whatever his rating says.
  const f = p.farmSeason;
  const tearing = f && f.gp >= 20 && p.pos !== "G"
    && ((f.g || 0) + (f.a || 0)) / f.gp >= 0.85;
  const stealing = f && f.gp >= 15 && p.pos === "G" && f.sa >= 300 && f.sv / f.sa >= 0.915;
  return p.ovr >= 58 || p.pot - p.ovr <= FARM_READY || !!tearing || !!stealing;
}
/* ------------------------------- the farm league ---------------------------
 * Prospects used to accumulate a stat line in a vacuum: no opponent, no result,
 * nothing to win. Every club's affiliate now plays a real league with a table
 * and a championship.
 *
 * The affiliates MIRROR the parent schedule — when Hartford visit Boston, so do
 * their farm clubs. That's a deliberate simplification and it buys a lot: no
 * second calendar to build, store or keep in sync, no chance of the two drifting
 * apart, and every farm game still has a genuine opponent and a genuine result.
 *
 * The sim itself is deliberately coarse — a strength-vs-strength scoreline, not
 * the line-matchup engine. The farm is a development track you watch, not a
 * bench you set, and running the full engine 1,300 extra times a season would
 * cost more than it tells anyone. For the same reason a farm line carries no
 * zone or net buckets: those are what push a save past the storage ceiling.
 * ------------------------------------------------------------------------- */

const FARM_ROSTER_FLOOR = 6;   // below this a club ices borrowed depth
const FARM_DRESSED = 14;       // skaters an affiliate actually ices
const FARM_FILLER_OVR = 42;    // the affiliate's own depth, modelled as weight only
function blankFarmLine(pos) {
  return pos === "G"
    ? { gp: 0, w: 0, l: 0, sa: 0, sv: 0, ga: 0, so: 0 }
    : { gp: 0, g: 0, a: 0, pim: 0, pm: 0 };
}
function farmLine(p) {
  if (!p.farmSeason) p.farmSeason = blankFarmLine(p.pos);
  // An older save carries the slim {gp,g,a} shape; fill in the rest.
  const want = blankFarmLine(p.pos);
  Object.keys(want).forEach((k) => { if (p.farmSeason[k] == null) p.farmSeason[k] = want[k]; });
  return p.farmSeason;
}
const blankFarmRec = () => ({ w: 0, l: 0, otl: 0, pts: 0, gf: 0, ga: 0, gp: 0, l10: [] });
function farmRec(t) { if (!t.farmRec) t.farmRec = blankFarmRec(); return t.farmRec; }
function farmRoster(G, teamId) {
  return rosterOf(G, teamId, true).filter((p) => p.farm && !p.retired && p.inj <= 0);
}
/* How good the affiliate is. A club that has called everyone up ices a thin
   side rather than a phantom one — the floor keeps a short roster from
   producing absurd scorelines without pretending players exist. */
function farmStrength(G, teamId) {
  const r = farmRoster(G, teamId).filter((p) => p.pos !== "G").sort((a, b) => b.ovr - a.ovr).slice(0, 12);
  if (!r.length) return 38;
  const sum = r.reduce((s, p) => s + p.ovr, 0);
  return sum / Math.max(FARM_ROSTER_FLOOR, r.length);
}
function farmStarter(G, teamId) {
  return farmRoster(G, teamId).filter((p) => p.pos === "G").sort((a, b) => b.ovr - a.ovr)[0] || null;
}

function simFarmGame(G, home, away) {
  const hs = farmStrength(G, home), as = farmStrength(G, away);
  const hg0 = farmStarter(G, home), ag0 = farmStarter(G, away);
  // Goaltending swings a farm game more than anything else, because half these
  // clubs don't have one.
  const keep = (g) => (g ? clamp((g.ovr - 45) / 100, -0.1, 0.4) : -0.18);
  const rate = (off, defKeep) => clamp(2.9 * (off / 52) * (1 - defKeep * 0.7) + 0.25, 0.6, 7);
  const goals = (mu) => { let n = 0, l = Math.exp(-mu), p = 1; do { p *= rnd(G); n++; } while (p > l); return n - 1; };
  let hgls = goals(rate(hs, keep(ag0)) * 1.045);   // home ice
  let agls = goals(rate(as, keep(hg0)));
  let ot = false, so = false;
  if (hgls === agls) {
    ot = true;
    if (rnd(G) < 0.62) { if (rnd(G) < 0.5 + (hs - as) * 0.012) hgls++; else agls++; }
    else { so = true; if (rnd(G) < 0.5 + (hs - as) * 0.012) hgls++; else agls++; }
  }
  return { home, away, hg: hgls, ag: agls, ot, so };
}

/* Turn a scoreline into stat lines. Scorers are drawn by ability, so the best
   prospect on the roster leads the club — which is the whole point of giving
   them a league in the first place. */
function applyFarmGame(G, res) {
  const rec = (id, gf, ga, win, otl) => {
    const r = farmRec(G.teams[id]);
    r.gp++; r.gf += gf; r.ga += ga;
    if (win) { r.w++; r.pts += 2; } else if (otl) { r.otl++; r.pts += ruleValue(G, "otLoserPoint") ? 1 : 0; } else r.l++;
    r.l10 = (r.l10 || []).concat([win ? "W" : otl ? "O" : "L"]).slice(-10);
  };
  const decided = res.ot || res.so;
  const homeWon = res.hg > res.ag;
  rec(res.home, res.hg, res.ag, homeWon, !homeWon && decided);
  rec(res.away, res.ag, res.hg, !homeWon, homeWon && decided);

  [[res.home, res.hg, res.ag], [res.away, res.ag, res.hg]].forEach(([id, gf, ga]) => {
    const skaters = farmRoster(G, id).filter((p) => p.pos !== "G");
    skaters.forEach((p) => { farmLine(p).gp++; });
    const keeper = farmStarter(G, id);
    if (keeper) {
      const k = farmLine(keeper);
      const shots = 22 + Math.round(rnd(G) * 16) + ga;
      k.gp++; k.sa += shots; k.ga += ga; k.sv += shots - ga;
      const won = gf > ga;
      if (won) k.w++; else k.l++;
      if (ga === 0) k.so++;
    }
    if (!skaters.length) return;
    /* Weighted draw by ability — a 70 prospect scores far more than a 45.
       The base MUST be clamped at zero before the exponent: a negative number
       to a fractional power is NaN, which poisons the total, makes every
       comparison false, and quietly hands the whole draw to the last skater in
       the list. On a thin affiliate that gave one player all 154 of his club's
       goals and nobody a single assist. */
    /* A gentler curve than the NHL engine uses. A club fields two to five real
       prospects among a dozen notional team-mates, so a steep exponent hands
       the best of them an impossible share — one finished on 75 goals against
       an AHL leader's realistic 35-40. */
    const weight = (p) => 1 + Math.pow(Math.max(0, p.ovr - 32), 1.15);
    /* An affiliate ices a full side, but only the parent club's prospects are
       modelled as players — a club carries two to five of them. The rest of the
       bench is the affiliate's own signed depth, which we account for as
       PHANTOM weight rather than as records: giving each club ten more player
       objects would put three hundred dead rows back in the save for nobody's
       benefit. Without them, five prospects split every goal their club scored
       and the best of them finished on 138 in 82 games. A goal drawn to a
       phantom simply belongs to a player we don't track. */
    const real = skaters.reduce((s, p) => s + weight(p), 0);
    const phantomEach = 1 + Math.pow(FARM_FILLER_OVR - 32, 1.6);
    const phantoms = Math.max(0, FARM_DRESSED - skaters.length);
    const total = real + phantoms * phantomEach;
    const draw = () => {
      let r = rnd(G) * total;
      for (const p of skaters) { r -= weight(p); if (r <= 0) return p; }
      return null;   // one of the affiliate's own, not a prospect we follow
    };
    for (let i = 0; i < gf; i++) {
      const scorer = draw();
      // A goal scored by an untracked team-mate is still a goal a prospect can
      // assist on — skipping the whole event when the scorer was a phantom cut
      // league assists to a third of goals and quietly buried every playmaker.
      if (scorer) farmLine(scorer).g++;
      const helpers = rnd(G) < 0.82 ? (rnd(G) < 0.55 ? 2 : 1) : 0;
      const used = new Set(scorer ? [scorer.id] : []);
      for (let a = 0; a < helpers; a++) {
        const h = draw();
        if (!h || used.has(h.id)) continue;   // an untracked team-mate assisted
        used.add(h.id);
        farmLine(h).a++;
      }
    }
    // A little discipline, so the line isn't only offence.
    skaters.forEach((p) => { if (rnd(G) < 0.06) farmLine(p).pim += 2; });
    const swing = gf - ga;
    skaters.slice(0, 12).forEach((p) => { if (rnd(G) < 0.5) farmLine(p).pm += swing > 0 ? 1 : swing < 0 ? -1 : 0; });
  });
  return G;
}

/* Every affiliate whose parent club plays today plays the mirrored fixture.
 *
 * The scorelines used to be thrown away the instant they'd moved the table,
 * which is why the farm read as a spreadsheet that ticked over rather than a
 * league: your affiliate could win eleven straight and the only trace was the
 * points column. Two things are kept now, and deliberately only two:
 *
 *  - `G.farmDay`, last night's scoreboard across the league. One day, replaced
 *    every day, so it costs the same in March as in October.
 *  - `t.farmLog`, a full season of results — FOR YOUR CLUB ONLY. Nobody ever
 *    opens Calgary's affiliate's game log, and thirty-two of these would cost
 *    thirty-two times as much as the one that gets read.
 * ------------------------------------------------------------------------- */
const FARM_LOG_MAX = 120;
function simFarmDay(G, day) {
  const games = [];
  (G.schedule[day] || []).forEach((fx) => {
    const res = simFarmGame(G, fx.home, fx.away);
    applyFarmGame(G, res);
    games.push({ h: res.home, a: res.away, hg: res.hg, ag: res.ag, ot: !!res.ot, so: !!res.so });
  });
  G.farmDay = { day, games };
  const mine = games.find((g) => g.h === G.userTeam || g.a === G.userTeam);
  if (mine) {
    const t = G.teams[G.userTeam];
    const home = mine.h === G.userTeam;
    t.farmLog = (t.farmLog || []).concat([{
      d: day, o: home ? mine.a : mine.h, home,
      gf: home ? mine.hg : mine.ag, ga: home ? mine.ag : mine.hg,
      ot: mine.ot, so: mine.so,
    }]).slice(-FARM_LOG_MAX);
  }
  return G;
}

/* What the affiliate has coming. The farm mirrors the parent schedule, so the
   fixture list already exists and costs nothing to store — it just has to be
   read from the other side. */
function farmFixtures(G, teamId, n) {
  const out = [];
  for (let d = G.day; d < G.schedule.length && out.length < (n || 5); d++) {
    (G.schedule[d] || []).forEach((fx) => {
      if (fx.home !== teamId && fx.away !== teamId) return;
      out.push({ d, opp: fx.home === teamId ? fx.away : fx.home, home: fx.home === teamId });
    });
  }
  return out;
}

function farmStandings(G, filterFn) {
  return G.teams.filter(filterFn || (() => true)).slice().sort((a, b) => {
    const x = farmRec(a), y = farmRec(b);
    return y.pts - x.pts || y.w - x.w || (y.gf - y.ga) - (x.gf - x.ga) || y.gf - x.gf;
  });
}

/* The affiliates play for something too. Eight clubs, best-of-three, three
   rounds — enough to be a real trophy without a second postseason to sit
   through. It resolves in one go at the end of the regular season. */
const FARM_CUP_FIELD = 8;
function runFarmPlayoffs(G) {
  const field = farmStandings(G).filter((t) => farmRec(t).gp > 0).slice(0, FARM_CUP_FIELD);
  if (field.length < 2) return G;
  const rounds = [];
  let alive = field.map((t) => t.id);
  let guard = 0;
  while (alive.length > 1 && guard++ < 5) {
    const pairs = [];
    for (let i = 0; i < Math.floor(alive.length / 2); i++) pairs.push([alive[i], alive[alive.length - 1 - i]]);
    const survivors = [];
    pairs.forEach(([hi, lo]) => {
      let hw = 0, lw = 0, g = 0;
      while (hw < 2 && lw < 2 && g++ < 5) {
        const r = simFarmGame(G, g % 2 === 1 ? hi : lo, g % 2 === 1 ? lo : hi);
        const hiWon = (g % 2 === 1) === (r.hg > r.ag);
        if (hiWon) hw++; else lw++;
      }
      survivors.push(hw > lw ? hi : lo);
    });
    rounds.push(pairs.map(([hi, lo], i) => ({ hi, lo, winner: survivors[i] })));
    alive = survivors;
  }
  const champ = alive[0];
  G.farmCup = { year: G.year, champion: champ, rounds, field: field.map((t) => t.id) };
  const t = G.teams[champ];
  t.farmCups = (t.farmCups || 0) + 1;
  // The players who won it get it on their record, the same as a Cup ring.
  farmRoster(G, champ).forEach((p) => {
    p.farmTitles = (p.farmTitles || []).concat([G.year]);
  });
  if (champ === G.userTeam) news(G, `Your affiliate won the farm championship.`, "good");
  else news(G, `${t.city}'s affiliate won the farm championship.`, "info");
  return G;
}

/* ----------------------------- deadline trading ---------------------------
 * On deadline day the league sorts itself into buyers and sellers: clubs out of
 * the race move expiring veterans to contenders for picks.
 * ------------------------------------------------------------------------- */

/* Where the league stands as the deadline comes. Buyers, sellers, and the
   players actually available — which the engine already decides internally in
   `aiDeadlineMoves` and never showed anyone, so the deadline arrived as a line
   in the news feed rather than as a window you could work. */
const RENTAL_MIN_OVR = 62;
function deadlineBoard(G) {
  const table = standings(G);
  const cut = Math.floor(G.teams.length / 2);
  const buyers = new Set(table.slice(0, cut).map((t) => t.id));
  const isRental = (p) => p.contract.yrs <= 1 && p.age >= 27 && p.ovr >= RENTAL_MIN_OVR;
  /* What a contender would give up. The AI pays a first for a genuine top-line
     rental and a second for the rest, which is exactly the trade it makes in
     `aiDeadlineMoves` — so the price shown here is the price you'd actually
     face rather than a decorative estimate. */
  const priceOf = (p) => (p.ovr >= 72 ? 1 : 2);
  const rentals = [];
  G.teams.forEach((t) => {
    if (buyers.has(t.id)) return;
    rosterOf(G, t.id)
      .filter((p) => isRental(p) && p.teamId !== G.userTeam)
      .sort((a, b) => b.ovr - a.ovr)
      .slice(0, 2)
      .forEach((p) => rentals.push({ p, from: t.id, round: priceOf(p), blocked: hasNtc(p) }));
  });
  rentals.sort((a, b) => b.p.ovr - a.p.ovr);
  const mine = G.teams[G.userTeam];
  const myRank = table.findIndex((t) => t.id === G.userTeam) + 1;
  return {
    buyers: table.filter((t) => buyers.has(t.id)).map((t) => t.id),
    sellers: table.filter((t) => !buyers.has(t.id)).map((t) => t.id),
    rentals,
    // Which side of it you are on, which is the only question that matters.
    youBuy: buyers.has(G.userTeam),
    myRank,
    myRentals: rosterOf(G, G.userTeam).filter(isRental)
      .sort((a, b) => b.ovr - a.ovr)
      .map((p) => ({ p, round: priceOf(p), blocked: hasNtc(p) })),
    days: daysToDeadline(G),
    open: tradesOpen(G),
  };
}

function aiDeadlineMoves(G) {
  const table = standings(G);
  const cut = Math.floor(G.teams.length / 2);
  const buyers = table.slice(0, cut).map((t) => t.id).filter((id) => id !== G.userTeam);
  const sellers = table.slice(cut).map((t) => t.id).filter((id) => id !== G.userTeam);
  let done = 0;
  sellers.forEach((sid) => {
    if (done >= 6) return;
    const rental = rosterOf(G, sid)
      .filter((p) => p.contract.yrs <= 1 && p.age >= 27 && p.ovr >= 62 && !hasNtc(p))
      .sort((a, b) => b.ovr - a.ovr)[0];
    if (!rental) return;
    for (const bid of buyers) {
      const pick = (G.picks || []).find((pk) => pk.owner === bid && pk.year > G.year && pk.round === (rental.ovr >= 72 ? 1 : 2));
      if (!pick) continue;
      const ev = doTrade(G, sid, [rental.id], [], bid, [], [pick]);
      if (ev.ok) {
        done++;
        news(G, `${G.teams[sid].abbr} sent ${fullName(rental)} to ${G.teams[bid].abbr} for a pick.`, "info");
        break;
      }
    }
  });
  return G;
}

/* ------------------------------ development -------------------------------
 * What a season actually taught a young player. NHL minutes are the best
 * teacher the sport has — but only when he's genuinely playing them and holding
 * his own. A nineteen-year-old stapled to the fourth line learns less than he
 * would driving a farm team, and one thrown in over his head learns least of
 * all. The farm is the safe middle: steady, unspectacular, always positive.
 *
 * This used to be a flat "+1.5 if he's on the farm", which made the answer the
 * same for every prospect. Now it's a judgement call: a kid who can hold down
 * real minutes is better off in the NHL, and a kid who can't is better off
 * playing them somewhere else.
 *
 * A player who moves mid-season gets both, weighted by games in each league, so
 * a December callup is worth exactly the share of the year it covered.
 * ------------------------------------------------------------------------- */
const DEV_FARM = 1.5;      // a full season of top farm minutes
const DEV_NHL_HI = 3.4;    // thriving in a real NHL role
const DEV_NHL_LO = 0;      // dressed, but buried — the year taught him nothing
// Minutes that count as no role at all and as a full one, plus the production a
// regular at the position is expected to post. These are MEASURED off the sim,
// not invented: forwards run ~12.7 min a night at ~1.15 pts/60, defencemen
// ~16.2 and ~0.90, and goalies ~.907. Re-measure before retuning them.
const DEV_BANDS = {
  F: { floor: 9, full: 19, mid: 1.15, spread: 0.80 },
  D: { floor: 12, full: 22, mid: 0.90, spread: 0.50 },
  G: { floor: 5, full: 40, mid: 0.907, spread: 0.020 },
};
const devBand = (p) => (p.pos === "G" ? DEV_BANDS.G : p.pos === "D" ? DEV_BANDS.D : DEV_BANDS.F);

/* How an NHL season went, as two normalised numbers: was he playing (`role`,
   0–1) and did he hold his own (`perf`, -1–1). Null if he never dressed. */
function nhlDevRead(p, st) {
  if (!st || !st.gp) return null;
  const b = devBand(p);
  const role = (v) => clamp((v - b.floor) / (b.full - b.floor), 0, 1);
  if (p.pos === "G") {
    const sv = st.sa ? st.sv / st.sa : 0;
    return { role: role(st.gp), perf: clamp((sv - b.mid) / b.spread, -1, 1) };
  }
  const p60 = st.toi > 0 ? ((st.g + st.a) * 60) / st.toi : 0;
  return { role: role(st.toi / st.gp), perf: clamp((p60 - b.mid) / b.spread, -1, 1) };
}

/* The environment term, before the age taper: what this season was worth to
   him. Role GATES the whole thing — playing badly still teaches something, but
   not playing at all teaches nothing, so ice time is the part you can't fake.
   The two combine so that beating the farm takes roughly top-nine minutes AND
   above-average production; a fourth-liner is better off in the minors even if
   he's scoring there. */
/* ---------------------------- winning teaches -----------------------------
 * A farm season was worth a flat `DEV_FARM` whether the affiliate won the
 * championship or finished last by twenty points, which made the whole farm
 * league — its table, its playoffs, its trophy — decorative as far as the
 * prospects living in it were concerned. Playing meaningful games in a winning
 * room is a real part of how players come through, so it pays.
 *
 * SYMMETRIC ABOUT THE LEAGUE, not about zero. The bonus is measured against the
 * average affiliate, so a good room adds exactly as much as a bad one takes
 * away and the league-wide rate of development is unchanged. Centring it on a
 * guessed .500 instead would have quietly inflated everybody, because the
 * loser point puts the real mean nearer .530.
 * ------------------------------------------------------------------------- */
const DEV_WIN_SWING = 0.55;   // best-to-average affiliate, on top of DEV_FARM
const DEV_WIN_TITLE = 0.35;   // and winning the thing outright

/* The room a prospect spent the year in: how good his affiliate was, measured
   against the average one, and whether it won. Returns null when there's no
   farm season to judge, which is what keeps `devEnvironment` unchanged for
   everyone who never went down. */
function farmRoom(G, p) {
  if (!p || p.teamId == null || !G.teams[p.teamId]) return null;
  const mine = farmRec(G.teams[p.teamId]);
  if (!mine.gp) return null;
  let pts = 0, gp = 0;
  G.teams.forEach((t) => { const r = farmRec(t); pts += r.pts; gp += r.gp; });
  if (!gp) return null;
  return {
    pct: mine.pts / (2 * mine.gp),
    mean: pts / (2 * gp),
    title: (p.farmTitles || []).includes(G.year),
  };
}
/* How much that room was worth. Clamped, because a 20-game affiliate can post a
   points percentage no full season could and shouldn't out-earn a title. */
function farmRoomBonus(room) {
  if (!room) return 0;
  const edge = clamp((room.pct - room.mean) * 2, -1, 1);
  return edge * DEV_WIN_SWING + (room.title ? DEV_WIN_TITLE : 0);
}

function devEnvironment(p, st, farm, room) {
  const nGp = (st && st.gp) || 0;
  const fGp = (farm && farm.gp) || 0;
  if (!nGp && !fGp) return 0;                       // played nowhere, learned nothing
  const r = nhlDevRead(p, st);
  const nhl = r ? DEV_NHL_LO + (DEV_NHL_HI - DEV_NHL_LO) * r.role * (0.3 + 0.7 * ((r.perf + 1) / 2)) : 0;
  // The room only weighs on the part of the year he actually spent down there.
  const onFarm = DEV_FARM + farmRoomBonus(room);
  return (nhl * nGp + onFarm * fGp) / (nGp + fGp);
}
// Where he plays stops mattering once he's made. Ages are post-birthday.
function devAgeWeight(age) { return age <= 21 ? 1 : age <= 23 ? 0.75 : age <= 25 ? 0.4 : 0; }

/* ------------------------------ the rollover ------------------------------ */

function progress(G, p) {
  const peak = p.pos === "G" ? 28 : 26;
  const keys = p.pos === "G" ? GOALIE_KEYS : SKATER_KEYS;
  let delta;
  if (p.age < peak) delta = gauss(G, 2.6 + (p.pot - p.ovr) * 0.09, 1.7);
  else if (p.age < peak + 4) delta = gauss(G, 0.2, 1.4);
  else delta = gauss(G, -(p.age - peak - 3) * 0.95, 1.5);
  // Where he played and how it went. `p.stats` is the season that just ended —
  // `p.season` has already been blanked by this point in the rollover — and
  // `p.farmSeason` is still intact until it's archived further down.
  /* `farmRoom` reads `t.farmRec` and `p.farmTitles`, both of which are still
     intact here — the table is reset in `startNextSeason` and the title was
     awarded by `runFarmPlayoffs` back at the end of the regular season. */
  delta += devEnvironment(p, p.stats, p.farmSeason, farmRoom(G, p)) * devAgeWeight(p.age);
  // A coach who develops players is worth real progression on top of that.
  if (p.age <= 24 && p.teamId != null) {
    delta += (coachOf(G.teams[p.teamId]).dev - 55) * 0.035;
  }
  keys.forEach((k) => {
    if (p.r[k] == null) return;
    p.r[k] = Math.round(clamp(p.r[k] + delta + gauss(G, 0, 1.1), 15, 99));
  });
  p.ovr = ovrOf(p);
  p.pot = Math.max(p.ovr, p.pot - (p.age > peak ? 2 : 0));
}
function retirementChance(G, p) {
  if (p.age < 32) return 0;
  const decline = (p.age - 32) * 0.09 + Math.max(0, (55 - p.ovr)) * 0.012;
  return clamp(decline, 0, 0.95);
}

function startNextSeason(G) {
  applyPendingRules(G);
  G.year++;
  // Ageing and contract expiry already happened at the end of the playoffs.
  // What's left is to fill out the league and rebuild the calendar.
  aiFreeAgency(G);
  /* Shed illegal money BEFORE topping the roster up, so anything this opens up
     gets filled in the same pass rather than leaving a club a body short. */
  enforceCap(G);
  fillRosters(G);
  /* AFTER the market and the top-ups, because both add players — the draft has
     also just put seven more into every organisation. This is the point at
     which the roster about to play a season has to be a legal one. */
  enforceRosterLimits(G);
  // Bodies are legal; now the money has to be. The draft has just added seven
  // entry contracts per club and nothing else checks them against the cap.
  enforceCap(G);
  capFreeAgentPool(G);
  // Reset the league.
  G.teams.forEach((t) => {
    t.w = 0; t.l = 0; t.otl = 0; t.pts = 0; t.gf = 0; t.ga = 0; t.gp = 0; t.streak = 0; t.l10 = [];
    t.farmRec = blankFarmRec();
    t.farmLog = null;
    t.lines = null;
  });
  G.farmCup = null;
  G.farmDay = null;
  G.results = [];
  G.playoffs = null;
  G.awards = null;
  G.allStar = null;
  G.lastGame = null;
  // The logs are a this-season view; a career's worth would dwarf the save.
  G.shotLog = {};
  G.gameLog = {};
  G.phase = "regular";
  G.offseasonStep = null;
  playersOf(G).forEach((p) => { p.marks = null; });
  pruneSave(G);
  seedPicks(G, G.year + 2, 1);
  G.picks = G.picks.filter((pk) => pk.year >= G.year);
  buildSchedule(G);
  G.teams.forEach((t) => ensureLines(G, t.id));
  setMandate(G);
  return G;
}

/* -------------------------------- persistence -----------------------------
 * A save grows by roughly a tenth of a megabyte a season, so a long career would
 * eventually walk into the storage ceiling. Retired players keep a career total
 * rather than a row per season, and nobody who has left the league entirely is
 * carried forever.
 * ------------------------------------------------------------------------- */

function pruneSave(G) {
  const keep = [];
  playersOf(G).forEach((p) => {
    if (!p.retired) return;
    // Collapse a retired player's season-by-season line into one total.
    if (p.career && p.career.length > 1) {
      const tot = p.career.reduce((acc, c) => {
        Object.keys(c).forEach((k) => {
          if (k === "year" || k === "teamId" || k === "z") return;
          acc[k] = (acc[k] || 0) + (c[k] || 0);
        });
        return acc;
      }, { year: p.career[0].year, to: p.career[p.career.length - 1].year, teamId: p.career[0].teamId, total: true });
      p.career = [tot];
    }
    // Blank rather than null: plenty of code walks every player and reads these.
    p.season = blankStats(p.pos); p.stats = blankStats(p.pos);
    p.po = null; p.farmSeason = null; p.farmCareer = null; p.marks = null;
    // Anyone with no trophies and no honours is not history, just clutter.
    const honoured = p.hof != null
      || G.teams.some((t) => (t.honours || []).some((h) => h.pid === p.id))
      || (p.rings || []).length > 0;
    if (!honoured && !(p.trophies || []).length) keep.push(p.id);
  });
  // Keep the most recent departures around so history pages can still name them.
  keep.slice(0, Math.max(0, keep.length - 250)).forEach((id) => { delete G.players[id]; });
  if (G.results.length > 900) G.results.splice(0, G.results.length - 900);
  if (G.news.length > 80) G.news.length = 80;
  return G;
}

/* -------------------------------- storage --------------------------------- */

/* Saves live in IndexedDB, which has room to spare; localStorage is the fallback
   when IndexedDB isn't there or refuses. Slot metadata always goes to
   localStorage so the splash screen can list careers synchronously. */
const SAVE_PREFIX = "pgmh:";
const DB_NAME = "pgmh", DB_STORE = "saves";
const saveKey = (slot) => `${SAVE_PREFIX}slot${slot}`;
const metaKey = (slot) => `${SAVE_PREFIX}meta${slot}`;

let _db = null, _dbDead = false;
function openDb() {
  return new Promise((res, rej) => {
    if (_db) return res(_db);
    if (_dbDead || typeof indexedDB === "undefined") return rej(new Error("no indexeddb"));
    let req;
    try { req = indexedDB.open(DB_NAME, 1); } catch (e) { _dbDead = true; return rej(e); }
    req.onupgradeneeded = () => { try { req.result.createObjectStore(DB_STORE); } catch (e) {} };
    req.onsuccess = () => { _db = req.result; res(_db); };
    req.onerror = () => { _dbDead = true; rej(req.error); };
  });
}
function idbPut(key, val) {
  return openDb().then((db) => new Promise((res, rej) => {
    const tx = db.transaction(DB_STORE, "readwrite");
    tx.objectStore(DB_STORE).put(val, key);
    tx.oncomplete = () => res(true);
    tx.onerror = () => rej(tx.error);
  }));
}
function idbGet(key) {
  return openDb().then((db) => new Promise((res, rej) => {
    const tx = db.transaction(DB_STORE, "readonly");
    const r = tx.objectStore(DB_STORE).get(key);
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  }));
}
function idbDel(key) {
  return openDb().then((db) => new Promise((res) => {
    const tx = db.transaction(DB_STORE, "readwrite");
    tx.objectStore(DB_STORE).delete(key);
    tx.oncomplete = () => res(true);
    tx.onerror = () => res(false);
  }));
}

/* Both stores get every save, wrapped with a timestamp, and a load takes
   whichever is newer. localStorage is written synchronously so a save can never
   be lost to an in-flight IndexedDB transaction; IndexedDB is the one with room
   to spare if the save outgrows the 5MB quota. */
function saveGame(G, slot) {
  const t = G.teams[G.userTeam];
  const at = Date.now();
  let payload;
  try { payload = JSON.stringify({ at, data: G }); } catch (e) { return false; }
  let wroteLocal = false;
  try {
    localStorage.setItem(saveKey(slot), payload);
    wroteLocal = true;
  } catch (e) { /* quota — IndexedDB has to carry it */ }
  try {
    localStorage.setItem(metaKey(slot), JSON.stringify({
      team: t.name, city: t.city, year: G.year, phase: G.phase, cups: t.cupWins,
      record: `${t.w}-${t.l}-${t.otl}`, at,
    }));
  } catch (e) {}
  idbPut(saveKey(slot), payload).catch(() => {});
  return wroteLocal;
}
// Accepts both the wrapped format and the bare game object older saves used.
function unwrap(raw) {
  if (!raw) return null;
  try {
    const v = JSON.parse(raw);
    if (v && v.data && v.at) return { at: v.at, g: v.data };
    return { at: 0, g: v };
  } catch (e) { return null; }
}
function loadGame(slot) {
  const local = unwrap(localStorage.getItem(saveKey(slot)));
  return idbGet(saveKey(slot))
    .catch(() => null)
    .then((v) => {
      const remote = unwrap(v);
      const best = !remote ? local : !local ? remote : (remote.at > local.at ? remote : local);
      return best ? migrate(best.g) : null;
    })
    .catch(() => (local ? migrate(local.g) : null));
}
function slotMeta(slot) {
  try { const m = localStorage.getItem(metaKey(slot)); return m ? JSON.parse(m) : null; }
  catch (e) { return null; }
}
function deleteSlot(slot) {
  try { localStorage.removeItem(saveKey(slot)); localStorage.removeItem(metaKey(slot)); } catch (e) {}
  idbDel(saveKey(slot)).catch(() => {});
}
