function LinesTab({ G, setG }) {
  const lines = ensureLines(G, G.userTeam);
  const bench = activeRoster(G, G.userTeam);
  const used = new Set([].concat(...lines.F, ...lines.D, lines.G).filter(Boolean));
  const scratches = bench.filter((p) => !used.has(p.id));

  function swap(kind, li, si, newId) {
    const g2 = { ...G, teams: G.teams.slice() };
    const t = { ...g2.teams[G.userTeam] };
    const L = JSON.parse(JSON.stringify(t.lines || lines));
    const old = kind === "F" ? L.F[li][si] : kind === "D" ? L.D[li][si] : L.G[si];
    const findSlot = (id) => {
      for (let i = 0; i < L.F.length; i++) for (let j = 0; j < 3; j++) if (L.F[i][j] === id) return ["F", i, j];
      for (let i = 0; i < L.D.length; i++) for (let j = 0; j < 2; j++) if (L.D[i][j] === id) return ["D", i, j];
      for (let j = 0; j < L.G.length; j++) if (L.G[j] === id) return ["G", 0, j];
      return null;
    };
    const at = findSlot(newId);
    if (at) {
      const [k2, i2, j2] = at;
      if (k2 === "F") L.F[i2][j2] = old; else if (k2 === "D") L.D[i2][j2] = old; else L.G[j2] = old;
    }
    if (kind === "F") L.F[li][si] = newId; else if (kind === "D") L.D[li][si] = newId; else L.G[si] = newId;
    t.lines = L;
    g2.teams[G.userTeam] = t;
    setG(g2);
  }

  const Slot = ({ kind, li, si, id, filter }) => (
    <select className="bg-[#0d1728] border border-[#243250] rounded px-2 py-1 text-sm w-full min-w-0"
      value={id || ""} onChange={(e) => swap(kind, li, si, +e.target.value)}>
      {bench.filter(filter).map((p) => (
        <option key={p.id} value={p.id}>{shortName(p)} ({p.ovr})</option>
      ))}
    </select>
  );
  const starter = G.players[lines.G[0]];

  return (
    <div className="space-y-3">
      <div className="flex gap-2 flex-wrap items-center">
        <button className={btnGhost} onClick={() => {
          const g2 = { ...G, teams: G.teams.slice() };
          g2.teams[G.userTeam] = { ...g2.teams[G.userTeam], lines: autoLines(G, G.userTeam) };
          setG(g2);
        }}>Auto lines</button>
        <div className="text-xs text-slate-400">
          Line 1 takes {Math.round(LINE_TOI[0] * 100)}% of even-strength ice; at home your top line sees soft matchups more often.
          Keeping a line together builds a small chemistry bonus — swapping it resets that line's streak.
        </div>
      </div>

      <Section title="Deployment" className="p-3">
        <div className="space-y-3 pt-1">
          <div>
            <div className="text-xs text-slate-400 mb-1">
              Even-strength ice time. Ride a line hard and it wins you February and costs you April —
              minutes drive fatigue and injury risk.
            </div>
            {ensureLines(G, G.userTeam).F.map((_, i) => {
              const ice = iceTimeF(G.teams[G.userTeam]);
              return (
                <div key={i} className="flex items-center gap-2">
                  <span className="w-8 text-xs text-slate-500">L{i + 1}</span>
                  <input type="range" min="5" max="45" step="1" className="flex-1"
                    value={Math.round(ice[i] * 100)}
                    onChange={(e) => {
                      const g2 = { ...G, teams: G.teams.slice() };
                      const cur = iceTimeF(g2.teams[G.userTeam]).map((v) => v * 100);
                      cur[i] = +e.target.value;
                      g2.teams[G.userTeam] = { ...g2.teams[G.userTeam], iceF: cur };
                      setG(g2);
                    }} />
                  <span className="w-20 text-right text-xs tnum text-slate-300">
                    {(ice[i] * ES_MINUTES).toFixed(1)} min
                  </span>
                </div>
              );
            })}
            <button className={`${btnGhost} mt-1`} onClick={() => {
              const g2 = { ...G, teams: G.teams.slice() };
              g2.teams[G.userTeam] = { ...g2.teams[G.userTeam], iceF: null };
              setG(g2);
            }}>Reset to standard</button>
          </div>
          <div>
            <div className="text-xs text-slate-400 mb-1">
              Defence pair minutes. A top pair plays more of the game than any forward line —
              lean on it and it wears down by spring.
            </div>
            {ensureLines(G, G.userTeam).D.map((_, i) => {
              const ice = iceTimeD(G.teams[G.userTeam]);
              return (
                <div key={i} className="flex items-center gap-2">
                  <span className="w-8 text-xs text-slate-500">D{i + 1}</span>
                  <input type="range" min="10" max="60" step="1" className="flex-1"
                    value={Math.round(ice[i] * 100)}
                    onChange={(e) => {
                      const g2 = { ...G, teams: G.teams.slice() };
                      const cur = iceTimeD(g2.teams[G.userTeam]).map((v) => v * 100);
                      cur[i] = +e.target.value;
                      g2.teams[G.userTeam] = { ...g2.teams[G.userTeam], iceD: cur };
                      setG(g2);
                    }} />
                  <span className="w-20 text-right text-xs tnum text-slate-300">
                    {(ice[i] * ES_MINUTES).toFixed(1)} min
                  </span>
                </div>
              );
            })}
            <button className={`${btnGhost} mt-1`} onClick={() => {
              const g2 = { ...G, teams: G.teams.slice() };
              g2.teams[G.userTeam] = { ...g2.teams[G.userTeam], iceD: null };
              setG(g2);
            }}>Reset to standard</button>
          </div>
          <div>
            <div className="text-xs text-slate-400 mb-1">
              Checking line — the one you throw at their best. At home you get last change and
              usually win the matchup; on the road you can only ask.
            </div>
            <div className="flex gap-2 flex-wrap">
              {[null, 0, 1, 2, 3].map((k) => (
                <button key={String(k)}
                  className={(G.teams[G.userTeam].checkLine ?? null) === k ? btnPri : btnGhost}
                  onClick={() => {
                    const g2 = { ...G, teams: G.teams.slice() };
                    g2.teams[G.userTeam] = { ...g2.teams[G.userTeam], checkLine: k };
                    setG(g2);
                  }}>{k == null ? "No matching" : `Line ${k + 1}`}</button>
              ))}
            </div>
          </div>
        </div>
      </Section>

      <Section title="Forwards" className="p-3">
        <div className="space-y-2 pt-1">
          {lines.F.map((ln, i) => {
            const games = (G.teams[G.userTeam].lineChem || [])[i] || 0;
            return (
              <div key={i} className="grid grid-cols-[2rem_1fr_1fr_1fr] gap-1.5 sm:gap-2 items-center">
                <div className="text-xs text-slate-500" title={games > 0 ? `Together ${games} game${games === 1 ? "" : "s"} running — a small chemistry bonus` : "Just set — no chemistry yet"}>
                  L{i + 1}{games >= LINE_CHEM_MAX_GAMES ? <span className="text-emerald-400"> ●</span> : null}
                </div>
                {[0, 1, 2].map((si) => (
                  <Slot key={si} kind="F" li={i} si={si} id={ln[si]} filter={(p) => p.pos !== "G" && p.pos !== "D"} />
                ))}
              </div>
            );
          })}
        </div>
      </Section>

      <Section title="Defence" className="p-3">
        <div className="space-y-2 pt-1">
          {lines.D.map((pr, i) => {
            const games = (G.teams[G.userTeam].pairChem || [])[i] || 0;
            return (
              <div key={i} className="grid grid-cols-[2rem_1fr_1fr] gap-1.5 sm:gap-2 items-center">
                <div className="text-xs text-slate-500" title={games > 0 ? `Together ${games} game${games === 1 ? "" : "s"} running — a small chemistry bonus` : "Just set — no chemistry yet"}>
                  D{i + 1}{games >= PAIR_CHEM_MAX_GAMES ? <span className="text-emerald-400"> ●</span> : null}
                </div>
                {[0, 1].map((si) => <Slot key={si} kind="D" li={i} si={si} id={pr[si]} filter={(p) => p.pos === "D"} />)}
              </div>
            );
          })}
        </div>
      </Section>

      <Section title="Goaltenders" className="p-3">
        <div className="grid grid-cols-[2rem_1fr_1fr] gap-1.5 sm:gap-2 items-center pt-1">
          <div className="text-xs text-slate-500">G</div>
          {[0, 1].map((si) => <Slot key={si} kind="G" li={0} si={si} id={lines.G[si]} filter={(p) => p.pos === "G"} />)}
        </div>
        {starter ? (
          <div className="text-xs text-slate-400 mt-2">
            {starter.fatigue > 55
              ? `${shortName(starter)} is worn down (${Math.round(100 - starter.fatigue)}% fresh) — the backup will get the next start.`
              : `${shortName(starter)} is ${Math.round(100 - starter.fatigue)}% fresh.`}
          </div>
        ) : null}
      </Section>

      {scratches.length ? (
        <Section title="Healthy scratches" className="p-3">
          <div className="text-sm text-slate-400 pt-1">{scratches.map((p) => `${shortName(p)} (${p.ovr})`).join(" · ")}</div>
        </Section>
      ) : null}
    </div>
  );
}

/* -------------------------------- schedule -------------------------------- */

function ScheduleTab({ G, openTeam }) {
  const [scope, setScope] = useState("mine");
  const rows = [];
  G.schedule.forEach((day, d) => {
    day.forEach((f) => {
      if (scope === "mine" && f.home !== G.userTeam && f.away !== G.userTeam) return;
      rows.push({ ...f, d });
    });
  });
  const upcoming = rows.filter((r) => !r.played);
  const done = rows.filter((r) => r.played).reverse();
  const Row = ({ r }) => {
    const home = r.home === G.userTeam;
    const opp = G.teams[home ? r.away : r.home];
    const mine = r.home === G.userTeam || r.away === G.userTeam;
    const win = r.played && mine && ((home && r.hg > r.ag) || (!home && r.ag > r.hg));
    return (
      <div className="flex items-center gap-2 text-sm px-3 py-1.5 border-b border-[#16223a] last:border-0">
        <span className="w-14 text-slate-500 tnum">Day {r.d + 1}</span>
        {mine ? (
          <span className="flex-1">
            <span className="text-slate-500">{home ? "vs" : "at"} </span>
            <button className="hover:text-sky-300" onClick={() => openTeam(opp.id)}>{opp.city} {opp.name}</button>
          </span>
        ) : (
          <span className="flex-1">
            <button className="hover:text-sky-300" onClick={() => openTeam(r.away)}>{G.teams[r.away].abbr}</button>
            <span className="text-slate-500"> @ </span>
            <button className="hover:text-sky-300" onClick={() => openTeam(r.home)}>{G.teams[r.home].abbr}</button>
          </span>
        )}
        {r.played ? (
          <span className={`tnum ${mine ? (win ? "text-emerald-400" : "text-rose-400") : "text-slate-300"}`}>
            {r.ag}–{r.hg}{r.so ? " SO" : r.ot ? " OT" : ""}
          </span>
        ) : <span className="text-slate-600 text-xs">—</span>}
      </div>
    );
  };
  return (
    <div className="space-y-3">
      <div className="flex gap-2">
        <button className={scope === "mine" ? btnPri : btnGhost} onClick={() => setScope("mine")}>My club</button>
        <button className={scope === "all" ? btnPri : btnGhost} onClick={() => setScope("all")}>Whole league</button>
      </div>
      <div className="text-xs text-slate-400">
        The break is days {G.allStarDay}–{G.allStarDay + 1}. The trade deadline is day {deadlineDay(G) + 1}.
      </div>
      <Section title={`Upcoming (${upcoming.length})`}>
        <div className="max-h-[26rem] overflow-y-auto">
          {upcoming.slice(0, 120).map((r, i) => <Row key={i} r={r} />)}
          {!upcoming.length ? <div className="px-3 py-4 text-sm text-slate-500">The season is over.</div> : null}
        </div>
      </Section>
      <Section title={`Played (${done.length})`}>
        <div className="max-h-[26rem] overflow-y-auto">
          {done.slice(0, 120).map((r, i) => <Row key={i} r={r} />)}
          {!done.length ? <div className="px-3 py-4 text-sm text-slate-500">No games yet.</div> : null}
        </div>
      </Section>
    </div>
  );
}

/* ------------------------------- standings -------------------------------- */

function StandingsTab({ G, openTeam }) {
  const [mode, setMode] = useState("div");
  // Recomputed whenever the table is, so the line moves with the season.
  const berths = useMemo(() => playoffBerths(G), [G]);
  const clinch = useMemo(() => clinchState(G), [G]);
  const cols = [
    { key: "berth", label: "", thCls: "w-10",
      // Sorts by seed so "in the field" clusters at the top whichever column
      // the table is ordered by — an out-of-field club sorts below every berth.
      get: (t) => { const b = berths[t.id]; return b && b.in ? 20 - b.seed : 0; },
      cell: (t) => {
        const b = berths[t.id];
        if (!b) return null;
        if (!b.in) return (
          <span className={`text-[10px] tnum ${b.firstOut ? "text-amber-400" : "text-slate-600"}`}
            title={b.firstOut ? "first club out of the playoff field" : "outside the playoff field"}>
            {b.firstOut ? "1st out" : "—"}
          </span>
        );
        return (
          <span title={b.wildcard ? "wildcard berth" : "in the playoff field"}
            className={`inline-block text-[10px] font-semibold tnum px-1.5 py-0.5 rounded
              ${b.wildcard ? "bg-sky-500/20 text-sky-300" : "bg-emerald-500/20 text-emerald-300"}`}>
            {b.label}
          </span>
        );
      } },
    { key: "team", label: "Team", get: (t) => t.city, cell: (t) => {
      const c = clinch[t.id] || {};
      return (
        <span className="whitespace-nowrap font-medium flex items-center gap-2">
          <span className="w-2.5 h-4 rounded-sm inline-block shrink-0"
            style={{ background: clubColour(t)[0], borderLeft: `2px solid ${clubColour(t)[1]}` }} />
          {t.city} {t.name}
          {/* The letter goes next to the name, where a real table puts it. */}
          {c.mark ? (
            <span className={`text-[11px] font-bold ${c.mark === "z" ? "text-amber-300" : "text-emerald-400"}`}
              title={CLINCH_LABEL[c.mark]}>{c.mark}</span>
          ) : c.eliminated ? (
            <span className="text-[11px] font-bold text-rose-500" title="eliminated from the playoffs">e</span>
          ) : null}
          {t.id === G.userTeam ? null : t.rivalId === G.userTeam
            ? <span className="text-[10px] text-rose-400" title="your rival">rival</span> : null}
        </span>
      );
    } },
    { key: "gp", label: "GP", get: (t) => t.gp },
    { key: "w", label: "W", get: (t) => t.w },
    { key: "l", label: "L", get: (t) => t.l },
    { key: "otl", label: "OTL", get: (t) => t.otl },
    { key: "pts", label: "PTS", get: (t) => t.pts, cls: "font-semibold" },
    { key: "gf", label: "GF", get: (t) => t.gf },
    { key: "ga", label: "GA", get: (t) => t.ga },
    { key: "diff", label: "Diff", get: (t) => t.gf - t.ga,
      cell: (t) => <span className={t.gf - t.ga > 0 ? "text-emerald-400" : "text-rose-400"}>{t.gf - t.ga > 0 ? "+" : ""}{t.gf - t.ga}</span> },
    { key: "l10", label: "L10", get: (t) => (t.l10 || []).filter((x) => x === "W").length,
      cell: (t) => <span className="text-xs text-slate-400">{(t.l10 || []).join("")}</span> },
  ];
  /* The cutoff is drawn UNDER the last club holding a berth, which is what
     makes it a line rather than a colour: everything above it is in, and the
     club immediately below it is the one that would take the place. */
  const Table = ({ title, list }) => (
    <Section title={title}>
      <SortTable min={680} cols={cols} rows={list} initial="pts" rowKey={(t) => t.id}
        onRow={(t) => openTeam(t.id)}
        rowCls={(t) => {
          const b = berths[t.id] || {};
          /* Both marks are inset box-shadows in ONE class. They can't be two
             classes — each would set `box-shadow` and the loser would simply
             vanish — and the cutoff can't be a border, because the row already
             has one from SortTable and overriding it means fighting
             specificity. */
          const edge = b.in && b.bubble
            ? "shadow-[inset_3px_0_0_0_rgb(16,185,129),inset_0_-2px_0_0_rgb(16,185,129)]"
            : b.in ? "shadow-[inset_3px_0_0_0_rgb(16,185,129)]" : "";
          return [t.id === G.userTeam ? "bg-sky-950/40" : "", edge].filter(Boolean).join(" ");
        }} />
    </Section>
  );
  return (
    <div className="space-y-3">
      <div className="flex gap-2 flex-wrap">
        {[["div", "Division"], ["conf", "Conference"], ["league", "League"]].map(([k, l]) => (
          <button key={k} className={mode === k ? btnPri : btnGhost} onClick={() => setMode(k)}>{l}</button>
        ))}
      </div>
      <div className="flex flex-wrap items-center gap-x-4 gap-y-1 text-[11px] text-slate-400 px-1">
        <span className="flex items-center gap-1.5">
          <span className="inline-block w-6 h-3 rounded-sm bg-emerald-500/20 border-l-2 border-emerald-500" />
          {ruleValue(G, "playoffFormat") === "seeded" ? "top eight" : "top three in the division"}
        </span>
        {ruleValue(G, "playoffFormat") === "seeded" ? null : (
          <span className="flex items-center gap-1.5">
            <span className="inline-block w-6 h-3 rounded-sm bg-sky-500/20" />wildcard
          </span>
        )}
        <span className="flex items-center gap-1.5">
          <span className="inline-block w-6 border-b-2 border-emerald-500/60" />the cutoff
        </span>
        <span className="text-amber-400">1st out — next in line</span>
        {Object.keys(clinch).length ? (
          <span className="flex items-center gap-2">
            <span className="text-slate-600">|</span>
            <span><b className="text-amber-300">z</b> division</span>
            <span><b className="text-emerald-400">y</b> top three</span>
            <span><b className="text-emerald-400">x</b> berth</span>
            <span><b className="text-rose-500">e</b> eliminated</span>
          </span>
        ) : null}
      </div>
      {mode === "div" && DIVS.map((d, i) => <Table key={i} title={`${CONFS[DIV_CONF[i]]} · ${d}`} list={divStandings(G, i)} />)}
      {mode === "conf" && CONFS.map((c, i) => <Table key={i} title={c} list={confStandings(G, i)} />)}
      {mode === "league" && <Table title="League" list={standings(G)} />}
    </div>
  );
}

/* ---------------------------------- stats --------------------------------- */

function StatsTab({ G, openPlayer }) {
  const [mode, setMode] = useState("skaters");
  const [scope, setScope] = useState("league");
  const pool = (p) => (scope === "mine" ? p.teamId === G.userTeam : true);
  const skaters = playersOf(G).filter((p) => p.pos !== "G" && p.season.gp > 0 && pool(p));
  const goalies = playersOf(G).filter((p) => p.pos === "G" && p.season.gp >= 3 && pool(p));
  // A traded player shows where he is now, with the full path on hover.
  const teamCell = (p) => {
    const spells = (p.stints || []).filter((st) => st.s.gp);
    const path = spells.map((st) => G.teams[st.t].abbr).join(" → ");
    return (
      <span className="text-slate-400" title={spells.length > 1 ? path : undefined}>
        {p.teamId != null ? G.teams[p.teamId].abbr : "FA"}
        {spells.length > 1 ? <span className="text-amber-400/70">*</span> : null}
      </span>
    );
  };
  const nameCell = (p) => (
    <span className="whitespace-nowrap">{fullName(p)}<HotCold G={G} p={p} /><HonourMark G={G} p={p} /></span>
  );

  /* Computed ONCE per render, not per cell. `pointShares` was already being
     called inside a sort comparator over every skater in the league; three
     columns reading it independently would have run it thousands of times a
     keystroke. The peak is the league leader, so every bar in the table is on
     the same scale — which is the only scale that answers "is that a lot?". */
  const shares = useMemo(() => {
    const m = {};
    skaters.concat(goalies).forEach((p) => { m[p.id] = pointShares(G, p); });
    return m;
  }, [G, scope]);
  const sh = (p) => shares[p.id] || { ops: 0, dps: 0, gps: 0, ps: 0 };
  const psPeak = useMemo(
    () => Math.max(4, ...Object.values(shares).map((s) => s.ps)), [shares]);

  const skaterCols = [
    { key: "name", label: "Player", get: (p) => p.ln, cell: nameCell },
    { key: "team", label: "Tm", get: (p) => (p.teamId != null ? G.teams[p.teamId].abbr : "FA"), cell: teamCell },
    { key: "pos", label: "Pos", get: (p) => POS.indexOf(p.pos), cell: (p) => <PosBadge pos={p.pos} /> },
    { key: "gp", label: "GP", get: (p) => p.season.gp },
    { key: "g", label: "G", get: (p) => p.season.g },
    { key: "a", label: "A", get: (p) => p.season.a },
    { key: "p", label: "P", get: (p) => pts(p.season), cls: "font-semibold" },
    { key: "pm", label: "+/-", get: (p) => p.season.pm, cell: (p) => `${p.season.pm > 0 ? "+" : ""}${p.season.pm}` },
    { key: "pim", label: "PIM", get: (p) => p.season.pim },
    { key: "sog", label: "SOG", get: (p) => p.season.sog },
    { key: "shp", label: "SH%", get: (p) => (p.season.sog ? p.season.g / p.season.sog : 0),
      cell: (p) => (p.season.sog ? (p.season.g / p.season.sog * 100).toFixed(1) : "—") },
    { key: "ppg", label: "PPG", get: (p) => p.season.ppg },
    { key: "hit", label: "Hits", get: (p) => p.season.hit },
    { key: "blk", label: "Blk", get: (p) => p.season.blk },
    { key: "ops", label: "OPS", get: (p) => sh(p).ops, cls: "text-sky-300",
      cell: (p) => sh(p).ops.toFixed(1) },
    { key: "dps", label: "DPS", get: (p) => sh(p).dps, cls: "text-emerald-300",
      cell: (p) => sh(p).dps.toFixed(1) },
    { key: "ps", label: "PS", get: (p) => sh(p).ps, cls: "font-semibold",
      cell: (p) => <ShareBar v={sh(p).ps} max={psPeak} split={[sh(p).ops, sh(p).dps]} /> },
  ];
  const goalieCols = [
    { key: "name", label: "Goalie", get: (p) => p.ln, cell: nameCell },
    { key: "team", label: "Tm", get: (p) => (p.teamId != null ? G.teams[p.teamId].abbr : "FA"), cell: teamCell },
    { key: "gp", label: "GP", get: (p) => p.season.gp },
    { key: "w", label: "W", get: (p) => p.season.w },
    { key: "l", label: "L", get: (p) => p.season.l },
    { key: "otl", label: "OTL", get: (p) => p.season.otl },
    { key: "sv", label: "SV%", get: (p) => svPct(p.season), cls: "font-semibold",
      cell: (p) => (svPct(p.season) * 100).toFixed(1) },
    { key: "gaa", label: "GAA", get: (p) => -gaa(p.season), cell: (p) => gaa(p.season).toFixed(2) },
    { key: "so", label: "SO", get: (p) => p.season.so },
    { key: "sa", label: "SA", get: (p) => p.season.sa },
    { key: "sosv", label: "SO SV", get: (p) => p.season.sosa ? p.season.sosv / p.season.sosa : 0,
      cell: (p) => (p.season.sosa ? `${p.season.sosv}/${p.season.sosa}` : "—") },
    { key: "ps", label: "PS", get: (p) => sh(p).ps, cls: "font-semibold",
      cell: (p) => <ShareBar v={sh(p).ps} max={psPeak} /> },
  ];
  return (
    <div className="space-y-3">
      <div className="flex gap-2 flex-wrap">
        <button className={mode === "skaters" ? btnPri : btnGhost} onClick={() => setMode("skaters")}>Skaters</button>
        <button className={mode === "goalies" ? btnPri : btnGhost} onClick={() => setMode("goalies")}>Goalies</button>
        <div className="flex-1" />
        <button className={scope === "league" ? btnPri : btnGhost} onClick={() => setScope("league")}>League</button>
        <button className={scope === "mine" ? btnPri : btnGhost} onClick={() => setScope("mine")}>My club</button>
      </div>
      <Section>
        <SortTable min={mode === "skaters" ? 1040 : 900} rowKey={(p) => p.id} onRow={(p) => openPlayer(p.id)}
          rowCls={(p) => (p.teamId === G.userTeam ? "bg-sky-950/30" : "")}
          cols={mode === "skaters" ? skaterCols : goalieCols}
          rows={mode === "skaters" ? skaters : goalies}
          initial={mode === "skaters" ? "p" : "sv"} />
      </Section>
    </div>
  );
}

/* -------------------------------- analytics --------------------------------
 * The same two charts as a player page, aggregated for a whole club — what it
 * generates, and what it gives up. Built from the players currently on the
 * roster, so a deadline departure takes his shots with him.
 * ------------------------------------------------------------------------- */

function teamShotProfile(G, teamId) {
  const forZ = blankZones("S"), forNet = blankNet("S");
  const agZ = blankZones("G"), agNet = blankNet("G");
  const tot = { att: 0, sog: 0, miss: 0, blkd: 0, g: 0, sa: 0, ga: 0 };
  rosterOf(G, teamId, true).forEach((p) => {
    const s = p.season;
    if (!s || !s.z || !s.net) return;
    if (p.pos === "G") {
      ZONE_KEYS.forEach((k) => { agZ[k].sa += s.z[k].sa; agZ[k].sv += s.z[k].sv; });
      NET_KEYS.forEach((k) => { agNet[k].sa += s.net[k].sa; agNet[k].ga += s.net[k].ga; });
      tot.sa += s.sa; tot.ga += s.ga;
    } else {
      ZONE_KEYS.forEach((k) => { forZ[k].s += s.z[k].s; forZ[k].g += s.z[k].g; });
      NET_KEYS.forEach((k) => { forNet[k].a += s.net[k].a; forNet[k].g += s.net[k].g; });
      tot.att += s.att || 0; tot.sog += s.sog; tot.miss += s.miss || 0;
      tot.blkd += s.blkd || 0; tot.g += s.g;
    }
  });
  return { forZ, forNet, agZ, agNet, tot };
}

function AnalyticsTab({ G, openTeam }) {
  const [teamId, setTeamId] = useState(G.userTeam);
  const [side, setSide] = useState("for");
  const [netView, setNetView] = useState("pct");
  const prof = useMemo(() => teamShotProfile(G, teamId), [G, teamId]);
  const { tot } = prof;
  const shPct = tot.sog ? (tot.g / tot.sog) * 100 : 0;
  const svP = tot.sa ? ((tot.sa - tot.ga) / tot.sa) * 100 : 0;
  const onShare = tot.att ? (tot.sog / tot.att) * 100 : 0;

  return (
    <div className="space-y-3">
      <div className="flex gap-2 flex-wrap items-center">
        <select className={inputCls} value={teamId} onChange={(e) => setTeamId(+e.target.value)}>
          {G.teams.map((t) => <option key={t.id} value={t.id}>{t.city} {t.name}</option>)}
        </select>
        <button className={side === "for" ? btnPri : btnGhost} onClick={() => setSide("for")}>Shooting</button>
        <button className={side === "against" ? btnPri : btnGhost} onClick={() => setSide("against")}>Goaltending</button>
        <div className="flex-1" />
        <button className={btnGhost} onClick={() => openTeam(teamId)}>Club page</button>
      </div>

      <div className="grid grid-cols-2 sm:grid-cols-4 gap-2">
        <Stat label="Attempts" value={tot.att} sub={`${onShare.toFixed(0)}% on goal`} />
        <Stat label="Shooting" value={`${shPct.toFixed(1)}%`} sub={`${tot.g} goals on ${tot.sog}`} />
        <Stat label="Save pct" value={`${svP.toFixed(1)}%`} sub={`${tot.ga} allowed on ${tot.sa}`} />
        <Stat label="Blocked" value={tot.blkd} sub={`${tot.miss} missed the net`} />
      </div>

      <div className="grid md:grid-cols-2 gap-3">
        <Section title={side === "for" ? "Where this club shoots from" : "Where it gives up shots"} className="p-3">
          <ShotRink z={side === "for" ? prof.forZ : prof.agZ} mode={side === "for" ? "S" : "G"} />
        </Section>
        <Section title={side === "for" ? "Where it puts the puck" : "Where it gets beaten"} className="p-3"
          right={
            <div className="flex gap-1">
              {[["dots", "Shots"], ["pct", "Rates"]].map(([k, l]) => (
                <button key={k} onClick={() => setNetView(k)}
                  className={`px-2 py-0.5 rounded text-xs ${netView === k ? "bg-sky-600 text-white" : "text-slate-400 hover:bg-[#18243c]"}`}>{l}</button>
              ))}
            </div>
          }>
          <div className="pt-2">
            <NetGrid net={side === "for" ? prof.forNet : prof.agNet} mode={side === "for" ? "S" : "G"}
              view={netView} seed={teamId + 1}
              extra={side === "for" ? { miss: tot.miss, blkd: tot.blkd } : null} />
          </div>
        </Section>
      </div>

      {side === "for" ? (
        <Section title="Shot attempts" className="p-3">
          <div className="pt-1"><AttemptBar s={{ att: tot.att, sog: tot.sog, miss: tot.miss, blkd: tot.blkd }} /></div>
        </Section>
      ) : null}

      <Section title="League shooting">
        <SortTable min={620} rowKey={(t) => t.id} onRow={(t) => setTeamId(t.id)}
          rowCls={(t) => (t.id === teamId ? "bg-sky-950/40" : "")}
          rows={G.teams.map((t) => ({ ...t, p: teamShotProfile(G, t.id).tot }))} initial="shp"
          cols={[
            { key: "team", label: "Club", get: (t) => t.city, cell: (t) => `${t.city} ${t.name}` },
            { key: "att", label: "Att", get: (t) => t.p.att },
            { key: "sog", label: "SOG", get: (t) => t.p.sog },
            { key: "on", label: "On %", get: (t) => (t.p.att ? t.p.sog / t.p.att : 0),
              cell: (t) => (t.p.att ? ((t.p.sog / t.p.att) * 100).toFixed(0) : "—") },
            { key: "shp", label: "SH%", get: (t) => (t.p.sog ? t.p.g / t.p.sog : 0), cls: "font-semibold",
              cell: (t) => (t.p.sog ? ((t.p.g / t.p.sog) * 100).toFixed(1) : "—") },
            { key: "svp", label: "SV%", get: (t) => (t.p.sa ? (t.p.sa - t.p.ga) / t.p.sa : 0),
              cell: (t) => (t.p.sa ? (((t.p.sa - t.p.ga) / t.p.sa) * 100).toFixed(1) : "—") },
            { key: "blk", label: "Blkd", get: (t) => t.p.blkd },
          ]} />
      </Section>
    </div>
  );
}

/* ------------------------------ the game viewer --------------------------- */

const clockOf = (t) => {
  const per = Math.min(3, Math.floor(t / 20));
  const inPer = t - per * 20;
  const m = Math.floor(inPer), s = Math.floor((inPer - m) * 60);
  return t >= 60 ? `OT ${Math.floor(t - 60)}:${String(s).padStart(2, "0")}` : `P${per + 1} ${m}:${String(s).padStart(2, "0")}`;
};

function GameTab({ G, openPlayer }) {
  const lg = G.lastGame;
  const [upTo, setUpTo] = useState(1e9);
  const [tab, setTab] = useState("play");
  if (!lg) return <div className="text-slate-400 text-sm">No game to watch yet — play a day first.</div>;
  const H = G.teams[lg.home], A = G.teams[lg.away];
  const events = (lg.events || []).filter((e) => e.t <= upTo);
  const running = events.reduce((acc, e) => {
    if (e.kind === "goal") acc[e.team === lg.home ? 0 : 1]++;
    if (e.kind === "shootout") acc[e.team === lg.home ? 0 : 1]++;
    return acc;
  }, [0, 0]);
  const nm = (id) => (G.players[id] ? shortName(G.players[id]) : "—");
  const line = (e) => {
    if (e.kind === "goal") {
      const cell = e.cell ? (NET_CELLS.find((c) => c.key === e.cell) || null) : null;
      return `${nm(e.pid)} scores${e.strength === "pp" ? " on the power play" : e.strength === "sh" ? " shorthanded" : e.strength === "en" ? " into the empty net" : ""}`
        + `${e.zone && e.zone !== "empty" ? ` from the ${e.zone}` : ""}`
        + `${cell ? `, ${cell.label}` : ""}.`;
    }
    if (e.kind === "save") return `${nm(e.pid)} turns aside ${nm(e.shooter)} on the rush.`;
    if (e.kind === "penalty") return `${nm(e.pid)} to the box, two minutes.`;
    if (e.kind === "fight") return `${nm(e.pid)} and ${nm(e.other)} drop the gloves.`;
    if (e.kind === "shootout") return `Shootout won by ${G.teams[e.team].name}.`;
    return e.kind;
  };
  const boxRows = (tid) => {
    const b = lg.boxes[tid];
    if (!b) return [];
    return Object.entries(b.players)
      .map(([pid, s]) => ({ p: G.players[pid], s }))
      .filter((r) => r.p && r.s.toi > 0)
      .sort((a, b2) => (b2.s.g || 0) + (b2.s.a || 0) - ((a.s.g || 0) + (a.s.a || 0)) || b2.s.toi - a.s.toi);
  };

  return (
    <div className="space-y-3">
      <div className={`${card} p-4 text-center`}>
        <div className="flex items-center justify-center gap-6">
          <div className="flex-1 text-right">
            <div className="text-sm text-slate-400">{A.city}</div>
            <div className="font-semibold">{A.name}</div>
          </div>
          <div className="text-3xl font-bold tnum">
            {upTo >= 1e9 ? lg.ag : running[1]}<span className="text-slate-600 mx-2">–</span>{upTo >= 1e9 ? lg.hg : running[0]}
          </div>
          <div className="flex-1 text-left">
            <div className="text-sm text-slate-400">{H.city}</div>
            <div className="font-semibold">{H.name}</div>
          </div>
        </div>
        <div className="text-xs text-slate-500 mt-1">{lg.so ? "Decided in a shootout" : lg.ot ? "Overtime" : "Regulation"}</div>
      </div>

      <div className="flex gap-2 flex-wrap">
        <button className={tab === "play" ? btnPri : btnGhost} onClick={() => setTab("play")}>Play-by-play</button>
        <button className={tab === "box" ? btnPri : btnGhost} onClick={() => setTab("box")}>Box score</button>
        {tab === "play" ? (
          <>
            <div className="flex-1" />
            <button className={btnGhost} onClick={() => setUpTo(0)}>Rewind</button>
            <button className={btnGhost} onClick={() => {
              const next = (lg.events || []).find((e) => e.t > upTo);
              setUpTo(next ? next.t : 1e9);
            }}>Next event</button>
            <button className={btnGhost} onClick={() => setUpTo(1e9)}>Show all</button>
          </>
        ) : null}
      </div>

      {tab === "play" ? (
        <Section title={`${events.length} of ${(lg.events || []).length} events`}>
          <div className="max-h-[30rem] overflow-y-auto">
            {events.map((e, i) => (
              <div key={i} className={`flex items-start gap-3 px-3 py-1.5 border-b border-[#16223a] text-sm
                ${e.kind === "goal" ? "bg-[#16223a]" : ""}`}>
                <span className="w-20 shrink-0 text-slate-500 tnum text-xs pt-0.5">{clockOf(e.t)}</span>
                <span className="w-10 shrink-0 text-slate-400 text-xs pt-0.5">{G.teams[e.team].abbr}</span>
                <span className={`flex-1 ${e.kind === "goal" ? "font-medium" : "text-slate-300"}`}>{line(e)}</span>
                <button className="text-xs text-sky-400 hover:underline shrink-0" onClick={() => openPlayer(e.pid)}>view</button>
              </div>
            ))}
            {!events.length ? <div className="px-3 py-4 text-sm text-slate-500">Puck drop. Step through with “Next event”.</div> : null}
          </div>
        </Section>
      ) : (
        <div className="grid md:grid-cols-2 gap-3">
          {[lg.away, lg.home].map((tid) => (
            <Section key={tid} title={`${G.teams[tid].city} ${G.teams[tid].name}`}>
              <SortTable min={320} rowKey={(r) => r.p.id} onRow={(r) => openPlayer(r.p.id)}
                rows={boxRows(tid)} initial="p"
                cols={[
                  { key: "name", label: "Player", get: (r) => r.p.ln, cell: (r) => <span className="whitespace-nowrap">{shortName(r.p)}</span> },
                  { key: "g", label: "G", get: (r) => r.s.g || 0 },
                  { key: "a", label: "A", get: (r) => r.s.a || 0 },
                  { key: "p", label: "P", get: (r) => (r.s.g || 0) + (r.s.a || 0), cls: "font-semibold" },
                  { key: "sog", label: "SOG", get: (r) => r.s.sog != null ? r.s.sog : (r.s.sa || 0),
                    cell: (r) => (r.p.pos === "G" ? `${r.s.sv}/${r.s.sa}` : r.s.sog) },
                  { key: "toi", label: "TOI", get: (r) => r.s.toi, cell: (r) => r.s.toi.toFixed(1) },
                ]} />
            </Section>
          ))}
        </div>
      )}
    </div>
  );
}

/* --------------------------------- trades --------------------------------- */

function TradeTab({ G, setG, notify, openPlayer }) {
  const [other, setOther] = useState(G.userTeam === 0 ? 1 : 0);
  const [mine, setMine] = useState([]);
  const [theirs, setTheirs] = useState([]);
  const [myPicks, setMyPicks] = useState([]);
  const [theirPicks, setTheirPicks] = useState([]);
  const [retain, setRetain] = useState({});
  const myRoster = rosterOf(G, G.userTeam, true).sort((a, b) => b.ovr - a.ovr);
  const theirRoster = rosterOf(G, other, true).sort((a, b) => b.ovr - a.ovr);
  // Includes this year's unused picks while the draft is running, so you can
  // trade up or down on the clock.
  const picksOf = (tid) => tradablePicks(G, tid);
  const pkId = (pk) => `${pk.year}-${pk.round}-${pk.orig}`;
  const toggle = (list, set, id) => set(list.includes(id) ? list.filter((x) => x !== id) : list.concat(id));

  const selPicks = (tid, ids) => picksOf(tid).filter((pk) => ids.includes(pkId(pk)));
  const ev = useMemo(
    () => evalTrade(G, G.userTeam, mine, selPicks(G.userTeam, myPicks), other, theirs, selPicks(other, theirPicks), { retain }),
    [G, mine, theirs, myPicks, theirPicks, other, retain]);

  const Side = ({ tid, roster, sel, set, picks, pickSel, setPickSel, label, canRetain }) => (
    <Section title={label} className="max-h-[30rem] overflow-y-auto">
      <div className="p-2 space-y-0.5">
        {roster.map((p) => (
          <div key={p.id} className={`flex items-center gap-2 px-2 py-1 rounded text-sm
            ${sel.includes(p.id) ? "bg-sky-900/50" : "hover:bg-[#16223a]"}`}>
            <input type="checkbox" checked={sel.includes(p.id)} onChange={() => toggle(sel, set, p.id)} />
            <PosBadge pos={p.pos} />
            <button className="flex-1 text-left truncate hover:text-sky-300" onClick={() => openPlayer(p.id)}>
              {shortName(p)}
              {hasNtc(p) ? <span className="ml-1 text-[10px] text-amber-300">NTC</span> : null}
            </button>
            <span className="text-slate-400 tnum">{p.ovr}</span>
            <span className="text-slate-500 tnum text-xs w-14 text-right">${effectiveCap(G, p)}M</span>
            {tid === G.userTeam ? (
              <button className={`text-[10px] px-1 rounded ${onBlock(G, p.id) ? "bg-amber-500/25 text-amber-200" : "text-slate-500 hover:text-slate-300"}`}
                title={onBlock(G, p.id) ? "listed — clubs will call" : "list him and see who calls"}
                onClick={(e) => {
                  e.stopPropagation();
                  const g2 = migrate(JSON.parse(JSON.stringify(G)));
                  setBlock(g2, p.id, !onBlock(g2, p.id));
                  generateOffers(g2);
                  setG(g2);
                }}>{onBlock(G, p.id) ? "listed" : "list"}</button>
            ) : null}
            {canRetain && sel.includes(p.id) && rules(G).retainedSalary ? (
              <select className="bg-[#0d1728] border border-[#243250] rounded text-[11px] px-1 py-0.5"
                value={retain[p.id] || 0}
                onChange={(e) => setRetain({ ...retain, [p.id]: +e.target.value })}>
                <option value={0}>keep 0%</option>
                <option value={0.25}>keep 25%</option>
                <option value={0.5}>keep 50%</option>
              </select>
            ) : null}
          </div>
        ))}
        {picks.length ? (
          <div className="text-[11px] uppercase tracking-wide text-slate-500 px-2 pt-2">
            Draft picks <span className="normal-case tracking-normal text-slate-600">— pick one by where it lands</span>
          </div>
        ) : null}
        {picks.map((pk) => {
          const L = pickLabel(G, pk, tid);
          return (
            <label key={pkId(pk)} className={`flex items-center gap-2 px-2 py-1 rounded text-sm cursor-pointer
              ${pickSel.includes(pkId(pk)) ? "bg-sky-900/50" : "hover:bg-[#16223a]"}`}>
              <input type="checkbox" checked={pickSel.includes(pkId(pk))} onChange={() => toggle(pickSel, setPickSel, pkId(pk))} />
              <span className="flex-1 truncate">{L.text}</span>
              {L.note ? <span className={`text-[11px] tnum ${L.tone}`}>{L.note}</span> : null}
              <span className="text-slate-500 tnum text-xs w-10 text-right"
                title="what the AI values this pick at">{pickValue(G, pk).toFixed(1)}</span>
            </label>
          );
        })}
      </div>
    </Section>
  );

  const lockedIn = mine.concat(theirs).map((id) => G.players[id]).filter((p) => hasNtc(p));

  return (
    <div className="space-y-3">
      {!tradesOpen(G) ? (
        <div className={`${card} p-3 text-sm text-amber-300`}>
          {G.phase === "playoffs" ? "Rosters are frozen for the playoffs." : "The trade deadline has passed for this season."}
        </div>
      ) : null}
      <div className="flex gap-2 flex-wrap items-center">
        <select className={inputCls} value={other}
          onChange={(e) => { setOther(+e.target.value); setTheirs([]); setTheirPicks([]); }}>
          {G.teams.filter((t) => t.id !== G.userTeam).map((t) => (
            <option key={t.id} value={t.id}>{t.city} {t.name} — ${capSpace(G, t.id)}M space</option>
          ))}
        </select>
        {daysToDeadline(G) != null && daysToDeadline(G) > 0
          ? <span className="text-xs text-amber-300">{daysToDeadline(G)} days to the deadline</span> : null}
      </div>

      {(G.offers || []).length ? (
        <Section title={`Offers for your listed players (${G.offers.length})`}>
          <div className="max-h-72 overflow-y-auto">
            {G.offers.map((o, i) => {
              const p = G.players[o.want];
              if (!p) return null;
              return (
                <div key={i} className="flex flex-wrap items-center gap-2 px-3 py-2 border-b border-[#16223a] last:border-0 text-sm">
                  <span className="text-slate-400">{G.teams[o.from].abbr} want</span>
                  <span className="font-medium">{shortName(p)}</span>
                  <span className="text-slate-500">for</span>
                  <span className="flex-1">
                    {o.give.map((id) => (G.players[id] ? shortName(G.players[id]) : "?")).join(", ")}
                    {o.give.length && o.givePicks.length ? " + " : ""}
                    {o.givePicks.map((pk) => `${pk.year} R${pk.round}`).join(", ") || (o.give.length ? "" : "nothing")}
                  </span>
                  <span className={`text-xs ${o.value >= o.ask ? "text-emerald-400" : "text-amber-400"}`}>
                    {o.value >= o.ask ? "fair value" : "a little light"}
                  </span>
                  <button className={btnPri} onClick={() => {
                    const g2 = migrate(JSON.parse(JSON.stringify(G)));
                    const r = acceptOffer(g2, i);
                    if (r.ok) { setG(g2); notify(`Traded ${fullName(p)} to ${G.teams[o.from].name}.`); }
                    else notify(r.why);
                  }}>Accept</button>
                </div>
              );
            })}
          </div>
        </Section>
      ) : null}

      <div className="grid md:grid-cols-2 gap-3">
        <Side tid={G.userTeam} roster={myRoster} sel={mine} set={setMine}
          picks={picksOf(G.userTeam)} pickSel={myPicks} setPickSel={setMyPicks}
          label={`You send (${G.teams[G.userTeam].abbr})`} canRetain />
        <Side tid={other} roster={theirRoster} sel={theirs} set={setTheirs}
          picks={picksOf(other)} pickSel={theirPicks} setPickSel={setTheirPicks}
          label={`You get (${G.teams[other].abbr})`} />
      </div>

      {lockedIn.length ? (
        <div className={`${card} p-3 space-y-2`}>
          <div className="text-sm text-amber-300">
            {lockedIn.map((p) => fullName(p)).join(", ")} {lockedIn.length === 1 ? "has" : "have"} a no-trade clause.
          </div>
          <div className="flex gap-2 flex-wrap">
            {lockedIn.map((p) => (
              <button key={p.id} className={btnGhost} onClick={() => {
                const g2 = migrate(JSON.parse(JSON.stringify(G)));
                const r = requestNtcWaiver(g2, p.id);
                setG(g2);
                notify(r.ok ? `${fullName(p)} will waive it.` : `${fullName(p)} won't waive it.`);
              }}>Ask {shortName(p)} to waive</button>
            ))}
          </div>
        </div>
      ) : null}

      <div className={`${card} p-3 flex flex-wrap items-center gap-3`}>
        <div className="text-sm">
          <span className="text-slate-400">Their read: </span>
          {mine.length || theirs.length || myPicks.length || theirPicks.length
            ? <span className={ev.ok ? "text-emerald-400" : "text-amber-400"}>{ev.why}</span>
            : <span className="text-slate-500">pick some pieces</span>}
          {ev.aVal != null ? <span className="text-slate-500 ml-2 tnum">({ev.aVal} out / {ev.bVal} in)</span> : null}
        </div>
        <div className="flex-1" />
        <button className={btnPri} disabled={!ev.ok} onClick={() => {
          const g2 = migrate(JSON.parse(JSON.stringify(G)));
          const r = doTrade(g2, g2.userTeam, mine, selPicks(G.userTeam, myPicks), other, theirs, selPicks(other, theirPicks), { retain });
          if (r.ok) {
            setG(g2); setMine([]); setTheirs([]); setMyPicks([]); setTheirPicks([]); setRetain({});
            notify("Trade completed.");
          } else notify(r.why);
        }}>Propose</button>
      </div>
    </div>
  );
}

/* ------------------------------ free agency ------------------------------- */

function FreeAgencyTab({ G, setG, notify, openPlayer }) {
  const [target, setTarget] = useState(null);
  const [amt, setAmt] = useState(1);
  const [yrs, setYrs] = useState(3);
  const [counter, setCounter] = useState(null);
  const fas = G.freeAgents.map((id) => G.players[id]).filter(Boolean);

  const open = (p) => {
    setTarget(p.id);
    setYrs(3);
    setAmt(askingPrice(G, p.id, G.userTeam, 3));
    setCounter(null);
  };
  const p = target != null ? G.players[target] : null;

  return (
    <div className="space-y-3">
      <div className="grid grid-cols-3 gap-2">
        <Stat label="Cap space" value={`$${capSpace(G, G.userTeam)}M`} tone={capSpace(G, G.userTeam) < 0 ? "text-rose-400" : ""} />
        <Stat label="Roster" value={rosterOf(G, G.userTeam).length} sub={`max ${ROSTER_MAX}`} />
        <Stat label="Available" value={fas.length} />
      </div>

      {p ? (
        <Section title={`Negotiating with ${fullName(p)}`} className="p-3">
          <div className="space-y-3 pt-1">
            <div className="flex flex-wrap gap-4 text-sm">
              <div><PosBadge pos={p.pos} /> <span className="text-slate-400 ml-1">age {p.age}</span></div>
              <div><span className="text-slate-400">Overall </span>{p.ovr} <span className="text-slate-500">/ {p.pot}</span></div>
              <div><span className="text-slate-400">He's asking </span>${askingPrice(G, p.id, G.userTeam, yrs)}M × {yrs}</div>
            </div>
            <div className="grid sm:grid-cols-3 gap-3 items-end">
              <div>
                <div className="text-xs text-slate-400 mb-1">Salary ($M per year)</div>
                <input type="number" step="0.1" min="0.8" className={`${inputCls} w-full`}
                  value={amt} onChange={(e) => setAmt(+e.target.value)} />
              </div>
              <div>
                <div className="text-xs text-slate-400 mb-1">Term (years)</div>
                <select className={`${inputCls} w-full`} value={yrs} onChange={(e) => { setYrs(+e.target.value); setCounter(null); }}>
                  {[1, 2, 3, 4, 5, 6, 7].map((y) => <option key={y} value={y}>{y}</option>)}
                </select>
              </div>
              <div className="flex gap-2">
                <button className={btnPri} onClick={() => {
                  const g2 = migrate(JSON.parse(JSON.stringify(G)));
                  const r = negotiate(g2, p.id, g2.userTeam, amt, yrs);
                  if (!r.ok) {
                    setCounter(r.counter || null);
                    notify(r.why || "He turned it down.");
                    setG(g2);
                    return;
                  }
                  const s = signPlayer(g2, p.id, g2.userTeam, amt, yrs);
                  if (!s.ok) { notify(s.why); return; }
                  setG(g2); setTarget(null); setCounter(null);
                  notify(`Signed ${fullName(p)} — $${round1(amt)}M × ${yrs}.`);
                }}>Offer</button>
                <button className={btnGhost} onClick={() => { setTarget(null); setCounter(null); }}>Walk away</button>
              </div>
            </div>
            {counter ? (
              <div className="text-sm text-amber-300">
                He'd sign for ${counter}M × {yrs}.
                <button className="ml-2 text-sky-400 hover:underline" onClick={() => { setAmt(counter); setCounter(null); }}>
                  Meet it
                </button>
              </div>
            ) : null}
          </div>
        </Section>
      ) : null}

      <Section>
        <SortTable min={720} rowKey={(x) => x.id} rows={fas} initial="ovr"
          onRow={(x) => open(x)}
          cols={[
            { key: "name", label: "Player", get: (x) => x.ln, cell: (x) => <span className="whitespace-nowrap">{fullName(x)}</span> },
            { key: "pos", label: "Pos", get: (x) => POS.indexOf(x.pos), cell: (x) => <PosBadge pos={x.pos} /> },
            { key: "age", label: "Age", get: (x) => x.age },
            { key: "ovr", label: "Ovr", get: (x) => x.ovr, cls: "font-semibold" },
            { key: "pot", label: "Pot", get: (x) => x.pot, cls: "text-slate-400" },
            { key: "ask", label: "Asking", get: (x) => askingPrice(G, x.id, G.userTeam, 3),
              cell: (x) => `$${askingPrice(G, x.id, G.userTeam, 3)}M` },
            { key: "act", label: "", get: () => 0, cell: (x) => (
              <button className="text-xs text-sky-400 hover:underline"
                onClick={(e) => { e.stopPropagation(); open(x); }}>Negotiate</button>
            ) },
          ]} empty="Nobody available." />
      </Section>
    </div>
  );
}

/* -------------------------------- playoffs -------------------------------- */

function roundName(n) {
  if (n === 1) return "Cup Final";
  if (n === 2) return "Conference Finals";
  if (n === 4) return "Second Round";
  return "First Round";
}

/* The row in `G.results` a series game came from. Matched on the day it was
   played; a save from before series games carried one falls back to the
   scoreline, which is unambiguous enough for two named clubs on one night. */
function resultFor(G, g) {
  return (G.results || []).find((r) => r.playoff && r.home === g.home && r.away === g.away
    && (g.d != null ? r.day === g.d : (r.hg === g.hg && r.ag === g.ag))) || null;
}

const STRENGTH_LABEL = { pp: "PP", sh: "SH", en: "EN", en6: "6on5" };

/* Who scored. `G.results` has carried this for every game since the first
   build — regular season and playoffs alike — and only the regular season ever
   showed it, so a Cup run was seven rows of bare numbers. */
function ScoringSummary({ G, r, openPlayer }) {
  if (!r) return <div className="px-3 py-2 text-xs text-slate-500">No summary for this game.</div>;
  if (!r.scorers || !r.scorers.length) {
    return <div className="px-3 py-2 text-xs text-slate-500">
      {r.so ? "Decided in the shootout — no goal is credited to a skater." : "No goals."}
    </div>;
  }
  return (
    <div className="px-3 py-1.5 space-y-0.5">
      {r.scorers.map((s, i) => {
        const p = G.players[s.id];
        const helpers = (s.a || []).map((id) => G.players[id]).filter(Boolean);
        return (
          <div key={i} className="flex items-baseline gap-2 text-xs">
            <span className="w-8 shrink-0 text-slate-500">{G.teams[s.t] ? G.teams[s.t].abbr : ""}</span>
            <span className="cursor-pointer hover:text-sky-300 font-medium"
              onClick={() => p && openPlayer && openPlayer(p.id)}>
              {p ? fullName(p) : "unknown"}
            </span>
            {/* The engine's own codes: "es" is even strength and needs no
                label, "en6" is a six-on-five goal, and the rest read as-is. */}
            {STRENGTH_LABEL[s.strength] ? (
              <span className="text-[10px] uppercase text-amber-300">{STRENGTH_LABEL[s.strength]}</span>
            ) : null}
            {helpers.length ? (
              <span className="text-slate-500 truncate">
                ({helpers.map((h) => shortName(h)).join(", ")})
              </span>
            ) : <span className="text-slate-600">(unassisted)</span>}
          </div>
        );
      })}
    </div>
  );
}

function SeriesPage({ G, s, onClose, openPlayer }) {
  const hi = G.teams[s.hi], lo = G.teams[s.lo];
  const [openGame, setOpenGame] = useState(null);
  /* Who's actually driving THIS series, counted from its own scoring summaries.
     It used to read `p.po`, the whole-postseason line, which was wrong twice
     over: it credited a man's other rounds to this one, and `finishSeason`
     blanks it — so every series you opened after the Cup was handed out said
     "No games played" about seven games you had just watched. */
  const stars = useMemo(() => {
    const tally = {};
    s.games.forEach((g) => {
      const r = resultFor(G, g);
      if (!r) return;
      (r.scorers || []).forEach((sc) => {
        const add = (id, k) => {
          if (!G.players[id]) return;
          const t = tally[id] = tally[id] || { id, g: 0, a: 0 };
          t[k]++;
        };
        add(sc.id, "g");
        (sc.a || []).forEach((id) => add(id, "a"));
      });
    });
    return [s.hi, s.lo].map((tid) => Object.values(tally)
      .filter((t) => G.players[t.id] && G.players[t.id].teamId === tid)
      .sort((a, b) => (b.g + b.a) - (a.g + a.a) || b.g - a.g).slice(0, 5));
  }, [G, s]);
  return (
    <Modal wide title={`${hi.city} ${hi.name} vs ${lo.city} ${lo.name}`} onClose={onClose}>
      <div className="space-y-3">
        <div className={`${card} p-4 text-center`}>
          <div className="text-3xl font-bold tnum">{s.w[0]} – {s.w[1]}</div>
          <div className="text-xs text-slate-400 mt-1">
            {s.done ? `${G.teams[s.winner].name} advance` : `first to ${winsNeeded(G)}`}
          </div>
        </div>
        <Section title="Games"
          right={s.games.length ? <span className="text-xs text-slate-500">tap a game for the summary</span> : null}>
          <div>
            {s.games.map((g, i) => (
              <div key={i} className="border-b border-[#16223a] last:border-0">
                <button onClick={() => setOpenGame(openGame === i ? null : i)}
                  className={`w-full flex items-center gap-3 px-3 py-1.5 text-sm text-left hover:bg-[#16223a]
                    ${openGame === i ? "bg-[#16223a]" : ""}`}>
                  <span className="w-16 text-slate-500">Game {i + 1}</span>
                  <span className="flex-1">{G.teams[g.away].abbr} @ {G.teams[g.home].abbr}</span>
                  <span className="tnum">{g.ag}–{g.hg}{g.so ? " SO" : g.ot ? " OT" : ""}</span>
                  <span className="text-slate-600 text-xs w-3">{openGame === i ? "−" : "+"}</span>
                </button>
                {openGame === i ? (
                  <div className="bg-[#0b1424] border-t border-[#16223a]">
                    <ScoringSummary G={G} r={resultFor(G, g)} openPlayer={openPlayer} />
                  </div>
                ) : null}
              </div>
            ))}
            {!s.games.length ? <div className="px-3 py-4 text-sm text-slate-500">Not started.</div> : null}
          </div>
        </Section>
        <div className="grid sm:grid-cols-2 gap-3">
          {[0, 1].map((i) => (
            <Section key={i} title={`${G.teams[i === 0 ? s.hi : s.lo].name} leaders`} className="p-3">
              <div className="pt-1">
                {stars[i].length ? stars[i].map((t) => (
                  <div key={t.id} className="flex justify-between text-sm py-0.5 cursor-pointer hover:text-sky-300"
                    onClick={() => openPlayer(t.id)}>
                    <span>{shortName(G.players[t.id])}</span>
                    <span className="tnum text-slate-400">{t.g}G {t.a}A · {t.g + t.a}</span>
                  </div>
                )) : <div className="text-sm text-slate-500">No games played.</div>}
              </div>
            </Section>
          ))}
        </div>
        <Section title="Unavailable" className="p-3">
          <div className="text-sm text-slate-400 pt-1">
            {[s.hi, s.lo].flatMap((tid) => rosterOf(G, tid, true).filter((p) => p.inj > 0)
              .map((p) => `${G.teams[tid].abbr} ${shortName(p)} (${p.injDesc})`)).join(" · ") || "Everybody's healthy."}
          </div>
        </Section>
      </div>
    </Modal>
  );
}

function PlayoffsTab({ G, setG, openPlayer }) {
  const [open, setOpen] = useState(null);
  if (!G.playoffs) return <div className="text-slate-400 text-sm">The playoffs haven't started.</div>;
  const P = G.playoffs;
  return (
    <div className="space-y-3">
      {P.champion != null ? (
        <div className={`${card} p-4 text-center`}>
          <div className="text-xs uppercase tracking-wide text-slate-400">Champions</div>
          <div className="text-2xl font-bold text-sky-400">{G.teams[P.champion].city} {G.teams[P.champion].name}</div>
        </div>
      ) : null}
      {P.rounds.map((rd, i) => (
        <Section key={i} title={roundName(rd.length)} className="p-3">
          <div className="space-y-1 pt-1">
            {rd.map((s, j) => (
              <button key={j} onClick={() => setOpen(s)}
                className={`w-full flex items-center gap-3 text-sm px-2 py-1.5 rounded hover:bg-[#16223a]
                  ${s.hi === G.userTeam || s.lo === G.userTeam ? "bg-sky-950/40" : ""}`}>
                <span className="flex-1 text-left">{G.teams[s.hi].city} {G.teams[s.hi].name}</span>
                <span className="tnum font-semibold">{s.w[0]}–{s.w[1]}</span>
                <span className="flex-1 text-right">{G.teams[s.lo].city} {G.teams[s.lo].name}</span>
              </button>
            ))}
          </div>
        </Section>
      ))}
      {P.champion == null ? (
        <div className="flex gap-2">
          <button className={btnPri} onClick={() => {
            const g2 = migrate(JSON.parse(JSON.stringify(G)));
            simPlayoffDay(g2);
            setG(g2);
          }}>Play the next game</button>
          <button className={btnGhost} onClick={() => {
            const g2 = migrate(JSON.parse(JSON.stringify(G)));
            simPlayoffRound(g2);
            setG(g2);
          }}>Play out the round</button>
        </div>
      ) : null}
      {open ? <SeriesPage G={G} s={open} onClose={() => setOpen(null)} openPlayer={openPlayer} /> : null}
    </div>
  );
}

function AllStarTab({ G, openPlayer }) {
  const a = G.allStar;
  if (!a) return <div className="text-slate-400 text-sm">The All-Star break hasn't come round yet.</div>;
  const Side = ({ title, ids, score }) => (
    <Section title={title} className="p-3">
      <div className="text-3xl font-bold tnum text-center py-1">{score}</div>
      <div className="pt-1">
        {ids.map((id) => {
          const p = G.players[id];
          if (!p) return null;
          return (
            <div key={id} className="flex items-center gap-2 text-sm py-0.5 cursor-pointer hover:text-sky-300"
              onClick={() => openPlayer(id)}>
              <PosBadge pos={p.pos} />
              <span className="flex-1">{fullName(p)}</span>
              <span className="text-slate-500 text-xs">
                {G.teams[(a.at && a.at[id] != null) ? a.at[id] : p.teamId]

      <div className="grid md:grid-cols-2 gap-3">
        <Side title={CONFS[0]} ids={a.east} score={a.eastScore} />
        <Side title={CONFS[1]} ids={a.west} score={a.westScore} />
      </div>
    </div>
  );
}

/* ---------------------------------- the room ------------------------------- */

function RoomTab({ G, setG, openPlayer, notify }) {
  const upd = (fn) => { const g2 = migrate(JSON.parse(JSON.stringify(G))); fn(g2); setG(g2); };
  const t = G.teams[G.userTeam];
  const { captain, alternates } = letters(G, G.userTeam);
  const morale = roomMorale(G, G.userTeam);
  const coach = coachOf(t);
  const sys = systemOf(t);
  const roster = rosterOf(G, G.userTeam).filter((p) => p.pos !== "G")
    .sort((a, b) => leadership(G, b) - leadership(G, a));
  const rival = t.rivalId != null ? G.teams[t.rivalId] : null;

  return (
    <div className="space-y-3">
      <div className="grid grid-cols-2 sm:grid-cols-4 gap-2">
        <Stat label="Room" value={morale} sub="morale"
          tone={morale < 35 ? "text-rose-400" : morale > 65 ? "text-emerald-400" : ""} />
        <Stat label="Captain" value={captain ? shortName(captain) : "—"}
          sub={captain ? personalityOf(captain).label : ""} />
        <Stat label="Board" value={Math.round(G.boardConfidence)} sub="confidence"
          tone={G.boardConfidence < 30 ? "text-rose-400" : ""} />
        <Stat label="Rival" value={rival ? rival.abbr : "—"} sub={rival ? rival.name : ""} />
      </div>

      {G.mandate ? (
        <Section title="What the board is asking for" className="p-3">
          <div className="pt-1">
            <div className="text-lg font-semibold text-sky-300">{G.mandate.label}</div>
            <div className="text-sm text-slate-400">{G.mandate.blurb}</div>
            {G.lastMandate ? (
              <div className={`text-xs mt-2 ${G.lastMandate.met ? "text-emerald-400" : "text-rose-400"}`}>
                Last season they wanted: {G.lastMandate.label} — {G.lastMandate.met ? "delivered" : "not delivered"}.
              </div>
            ) : null}
          </div>
        </Section>
      ) : null}

      <Section title="Coaching staff" className="p-3">
        <div className="pt-1 space-y-3">
          <div className="flex flex-wrap items-baseline gap-x-3">
            <span className="font-medium">{coach.name}</span>
            <span className="text-sm text-slate-400">head coach</span>
          </div>
          <div>
            <div className="text-xs text-slate-400 mb-1">System</div>
            <select className={`${inputCls} w-full sm:w-72`} value={coach.system}
              onChange={(e) => upd((g) => {
                g.teams[g.userTeam].coach = { ...coachOf(g.teams[g.userTeam]), system: e.target.value };
              })}>
              {Object.entries(SYSTEMS).map(([k, v]) => <option key={k} value={k}>{v.label}</option>)}
            </select>
            <div className="text-xs text-slate-400 mt-1">{sys.blurb}</div>
          </div>
          <div className="grid grid-cols-3 gap-2">
            <Stat label="Power play" value={coach.pp} />
            <Stat label="Penalty kill" value={coach.pk} />
            <Stat label="Development" value={coach.dev} sub="prospects" />
          </div>
        </div>
      </Section>

      <Section title="Leadership">
        <div className="px-3 py-2 text-xs text-slate-400 border-b border-[#1e2b45]">
          The letter goes to whoever the room follows — years here, what he has won, and who he is.
          Name your own captain if you disagree.
        </div>
        <SortTable min={720} rows={roster} initial="lead" rowKey={(p) => p.id}
          onRow={(p) => openPlayer(p.id)}
          cols={[
            { key: "name", label: "Player", get: (p) => p.ln, cell: (p) => (
              <span className="whitespace-nowrap">
                {fullName(p)}
                {letterFor(G, p) ? <span className="ml-1.5 text-[10px] px-1 rounded bg-amber-500/20 text-amber-300 font-bold">
                  {letterFor(G, p)}</span> : null}
              </span>
            ) },
            { key: "pos", label: "Pos", get: (p) => POS.indexOf(p.pos), cell: (p) => <PosBadge pos={p.pos} /> },
            { key: "age", label: "Age", get: (p) => p.age },
            { key: "per", label: "Character", get: (p) => personalityOf(p).label, cls: "text-slate-300" },
            { key: "yrs", label: "Here", get: (p) => (p.career || []).filter((c) => c.teamId === p.teamId).length,
              cell: (p) => `${(p.career || []).filter((c) => c.teamId === p.teamId).length}y` },
            { key: "rings", label: "Cups", get: (p) => (p.rings || []).length, cls: "text-amber-300" },
            { key: "lead", label: "Leadership", get: (p) => leadership(G, p), cls: "font-semibold",
              cell: (p) => Math.round(leadership(G, p)) },
            { key: "act", label: "", get: () => 0, cell: (p) => (
              captain && captain.id === p.id ? <span className="text-xs text-slate-500">captain</span> : (
                <button className="text-xs text-sky-400 hover:underline" onClick={(e) => {
                  e.stopPropagation();
                  upd((g) => { g.teams[g.userTeam].captainId = p.id; });
                  notify(`${fullName(p)} named captain.`);
                }}>make captain</button>
              )
            ) },
          ]} />
      </Section>
    </div>
  );
}

      <div className={`${card} p-3 text-sm text-slate-400`}>

          cols={[

            { key: "name", label: "Player", get: (h) => h.name,
              cell: (h) => <span className="whitespace-nowrap">{h.name}</span> },
            { key: "pos", label: "Pos", get: (h) => POS.indexOf(h.pos), cell: (h) => <PosBadge pos={h.pos} /> },
            { key: "gp", label: "GP", get: (h) => h.gp },

function RecordsTab({ G, openPlayer }) {
  const recs = G.records || {};
  return (
    <div className="space-y-3">
      <Section title="League record book" className="p-3">
        <div className="space-y-1 pt-1">
          {RECORD_DEFS.map((d) => {
            const r = recs[d.key];
            return (
              <div key={d.key} className="flex items-center gap-3 text-sm py-0.5">
                <span className="flex-1 text-slate-400">{d.label}</span>
                {r ? (
                  <>
                    <button className="hover:text-sky-300" onClick={() => openPlayer(r.pid)}>{r.name}</button>
                    <span className="text-slate-500 text-xs w-12 text-right">{r.year}</span>
                    <span className="tnum font-semibold w-10 text-right">{r.v}</span>

                ) : <span className="text-slate-600">unset</span>}
              </div>
            );
          })}
        </div>
      </Section>
      {/* The record book keeps only the best ever, so a 54-goal season left no
          trace once somebody beat it. This is who actually led, year by year. */}
      <Section title="Season by season">
        <SortTable min={760} rows={(G.history || []).filter((h) => h.leaders || h.awards)}
          initial="year" rowKey={(h) => h.year}
          empty="No completed seasons yet — this fills in as the years go by."
          cols={[
            { key: "year", label: "Year", get: (h) => h.year, cls: "font-medium" },

                ? <span className="whitespace-nowrap text-amber-300">{G.teams[h.champion].abbr}</span> : "—") },
            ...RECORD_DEFS.map((d) => ({
              key: d.key,
              // Short headings: the full labels are spelled out in the book above.
              label: { goals: "Goals", points: "Points", assists: "Assists", pim: "PIM",
                       wins: "Wins", shutouts: "SO" }[d.key] || d.key,
              get: (h) => ((h.leaders && h.leaders[d.key]) ? h.leaders[d.key].v : 0),
              cell: (h) => {
                const L = h.leaders && h.leaders[d.key];
                if (!L) return <span className="text-slate-600">—</span>;
                /* A record that still stands gets marked. `G.records` holds the
                   all-time best, so this is "was this the year". */
                const rec = (G.records || {})[d.key];
                const standing = rec && rec.year === h.year && rec.pid === L.pid;
                return (
                  <span className="whitespace-nowrap">
                    <button className="hover:text-sky-300" onClick={() => openPlayer(L.pid)}>
                      {L.name || (G.players[L.pid] ? fullName(G.players[L.pid]) : "—")}
                    </button>
                    <span className={`ml-1 tnum ${standing ? "text-amber-300 font-semibold" : "text-slate-400"}`}
                      title={standing ? "still the league record" : undefined}>
                      {L.v}{standing ? "★" : ""}
                    </span>

              },
            })),
          ]} />
      </Section>
      <Section title="Cups won" className="p-3">
        <div className="grid sm:grid-cols-2 gap-x-6 pt-1">
          {G.teams.filter((t) => t.cupWins > 0).sort((a, b) => b.cupWins - a.cupWins).map((t) => (
            <div key={t.id} className="flex justify-between text-sm py-0.5">

        </div>
      </Section>
    </div>
  );
}
