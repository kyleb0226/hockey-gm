function TradeTab({ G, setG, notify, openPlayer }) {
  const [other, setOther] = useState(G.userTeam === 0 ? 1 : 0);
  const [mine, setMine] = useState([]);
  const [theirs, setTheirs] = useState([]);
  const [myPicks, setMyPicks] = useState([]);
  const [theirPicks, setTheirPicks] = useState([]);
  const [retain, setRetain] = useState({});
  const myRoster = rosterOf(G, G.userTeam, true).sort((a, b) => b.ovr - a.ovr);
  const theirRoster = rosterOf(G, other, true).sort((a, b) => b.ovr - a.ovr);
  const picksOf = (tid) => (G.picks || []).filter((pk) => pk.owner === tid && pk.year > G.year)
    .sort((a, b) => a.year - b.year || a.round - b.round);
  const pkId = (pk) => `${pk.year}-${pk.round}-${pk.orig}`;
  const toggle = (list, set, id) => set(list.includes(id) ? list.filter((x) => x !== id) : list.concat(id));

  const selPicks = (tid, ids) => picksOf(tid).filter((pk) => ids.includes(pkId(pk)));
  const ev = useMemo(
    () => evalTrade(G, G.userTeam, mine, selPicks(G.userTeam, myPicks), other, theirs, selPicks(other, theirPicks), { retain }),
    [G, mine, theirs, myPicks, theirPicks, other, retain]);

  const Side = ({ tid, roster, sel, set, picks, pickSel, setPickSel, label, canRetain }) => (
    <Section title={label} className="max-h-[30rem] overflow-y-auto">
      <div className="p-2 space-y-0.5">
        {roster.map((p) => (
          <div key={p.id} className={`flex items-center gap-2 px-2 py-1 rounded text-sm
            ${sel.includes(p.id) ? "bg-sky-900/50" : "hover:bg-[#16223a]"}`}>
            <input type="checkbox" checked={sel.includes(p.id)} onChange={() => toggle(sel, set, p.id)} />
            <PosBadge pos={p.pos} />
            <button className="flex-1 text-left truncate hover:text-sky-300" onClick={() => openPlayer(p.id)}>
              {shortName(p)}
              {hasNtc(p) ? <span className="ml-1 text-[10px] text-amber-300">NTC</span> : null}
            </button>
            <span className="text-slate-400 tnum">{p.ovr}</span>
            <span className="text-slate-500 tnum text-xs w-14 text-right">${effectiveCap(G, p)}M</span>
            {canRetain && sel.includes(p.id) && rules(G).retainedSalary ? (
              <select className="bg-[#0d1728] border border-[#243250] rounded text-[11px] px-1 py-0.5"
                value={retain[p.id] || 0}
                onChange={(e) => setRetain({ ...retain, [p.id]: +e.target.value })}>
                <option value={0}>keep 0%</option>
                <option value={0.25}>keep 25%</option>
                <option value={0.5}>keep 50%</option>
              </select>
            ) : null}
          </div>
        ))}
        {picks.length ? <div className="text-[11px] uppercase tracking-wide text-slate-500 px-2 pt-2">Draft picks</div> : null}
        {picks.map((pk) => (
          <label key={pkId(pk)} className={`flex items-center gap-2 px-2 py-1 rounded text-sm cursor-pointer
            ${pickSel.includes(pkId(pk)) ? "bg-sky-900/50" : "hover:bg-[#16223a]"}`}>
            <input type="checkbox" checked={pickSel.includes(pkId(pk))} onChange={() => toggle(pickSel, setPickSel, pkId(pk))} />
            <span className="flex-1">{pk.year} round {pk.round}
              {pk.orig !== tid ? <span className="text-slate-500"> (from {G.teams[pk.orig].abbr})</span> : null}</span>
          </label>
        ))}
      </div>
    </Section>
  );

  const lockedIn = mine.concat(theirs).map((id) => G.players[id]).filter((p) => hasNtc(p));

  return (
    <div className="space-y-3">
      {!tradesOpen(G) ? (
        <div className={`${card} p-3 text-sm text-amber-300`}>
          {G.phase === "playoffs" ? "Rosters are frozen for the playoffs." : "The trade deadline has passed for this season."}
        </div>
      ) : null}
      <div className="flex gap-2 flex-wrap items-center">
        <select className={inputCls} value={other}
          onChange={(e) => { setOther(+e.target.value); setTheirs([]); setTheirPicks([]); }}>
          {G.teams.filter((t) => t.id !== G.userTeam).map((t) => (
            <option key={t.id} value={t.id}>{t.city} {t.name} — ${capSpace(G, t.id)}M space</option>
          ))}
        </select>
        {daysToDeadline(G) != null && daysToDeadline(G) > 0
          ? <span className="text-xs text-amber-300">{daysToDeadline(G)} days to the deadline</span> : null}
      </div>

      <div className="grid md:grid-cols-2 gap-3">
        <Side tid={G.userTeam} roster={myRoster} sel={mine} set={setMine}
          picks={picksOf(G.userTeam)} pickSel={myPicks} setPickSel={setMyPicks}
          label={`You send (${G.teams[G.userTeam].abbr})`} canRetain />
        <Side tid={other} roster={theirRoster} sel={theirs} set={setTheirs}
          picks={picksOf(other)} pickSel={theirPicks} setPickSel={setTheirPicks}
          label={`You get (${G.teams[other].abbr})`} />
      </div>

      {lockedIn.length ? (
        <div className={`${card} p-3 space-y-2`}>
          <div className="text-sm text-amber-300">
            {lockedIn.map((p) => fullName(p)).join(", ")} {lockedIn.length === 1 ? "has" : "have"} a no-trade clause.
          </div>
          <div className="flex gap-2 flex-wrap">
            {lockedIn.map((p) => (
              <button key={p.id} className={btnGhost} onClick={() => {
                const g2 = migrate(JSON.parse(JSON.stringify(G)));
                const r = requestNtcWaiver(g2, p.id);
                setG(g2);
                notify(r.ok ? `${fullName(p)} will waive it.` : `${fullName(p)} won't waive it.`);
              }}>Ask {shortName(p)} to waive</button>
            ))}
          </div>
        </div>
      ) : null}

      <div className={`${card} p-3 flex flex-wrap items-center gap-3`}>
        <div className="text-sm">
          <span className="text-slate-400">Their read: </span>
          {mine.length || theirs.length || myPicks.length || theirPicks.length
            ? <span className={ev.ok ? "text-emerald-400" : "text-amber-400"}>{ev.why}</span>
            : <span className="text-slate-500">pick some pieces</span>}
          {ev.aVal != null ? <span className="text-slate-500 ml-2 tnum">({ev.aVal} out / {ev.bVal} in)</span> : null}
        </div>
        <div className="flex-1" />
        <button className={btnPri} disabled={!ev.ok} onClick={() => {
          const g2 = migrate(JSON.parse(JSON.stringify(G)));
          const r = doTrade(g2, g2.userTeam, mine, selPicks(G.userTeam, myPicks), other, theirs, selPicks(other, theirPicks), { retain });
          if (r.ok) {
            setG(g2); setMine([]); setTheirs([]); setMyPicks([]); setTheirPicks([]); setRetain({});
            notify("Trade completed.");
          } else notify(r.why);
        }}>Propose</button>
      </div>
    </div>
  );
}

/* ------------------------------ free agency ------------------------------- */

function FreeAgencyTab({ G, setG, notify, openPlayer }) {
  const [target, setTarget] = useState(null);
  const [amt, setAmt] = useState(1);
  const [yrs, setYrs] = useState(3);
  const [counter, setCounter] = useState(null);
  const fas = G.freeAgents.map((id) => G.players[id]).filter(Boolean);

  const open = (p) => {
    setTarget(p.id);
    setYrs(3);
    setAmt(askingPrice(G, p.id, G.userTeam, 3));
    setCounter(null);
  };
  const p = target != null ? G.players[target] : null;

  return (
    <div className="space-y-3">
      <div className="grid grid-cols-3 gap-2">
        <Stat label="Cap space" value={`$${capSpace(G, G.userTeam)}M`} tone={capSpace(G, G.userTeam) < 0 ? "text-rose-400" : ""} />
        <Stat label="Roster" value={rosterOf(G, G.userTeam).length} sub={`max ${ROSTER_MAX}`} />
        <Stat label="Available" value={fas.length} />
      </div>

      {p ? (
        <Section title={`Negotiating with ${fullName(p)}`} className="p-3">
          <div className="space-y-3 pt-1">
            <div className="flex flex-wrap gap-4 text-sm">
              <div><PosBadge pos={p.pos} /> <span className="text-slate-400 ml-1">age {p.age}</span></div>
              <div><span className="text-slate-400">Overall </span>{p.ovr} <span className="text-slate-500">/ {p.pot}</span></div>
              <div><span className="text-slate-400">He's asking </span>${askingPrice(G, p.id, G.userTeam, yrs)}M × {yrs}</div>
            </div>
            <div className="grid sm:grid-cols-3 gap-3 items-end">
              <div>
                <div className="text-xs text-slate-400 mb-1">Salary ($M per year)</div>
                <input type="number" step="0.1" min="0.8" className={`${inputCls} w-full`}
                  value={amt} onChange={(e) => setAmt(+e.target.value)} />
              </div>
              <div>
                <div className="text-xs text-slate-400 mb-1">Term (years)</div>
                <select className={`${inputCls} w-full`} value={yrs} onChange={(e) => { setYrs(+e.target.value); setCounter(null); }}>
                  {[1, 2, 3, 4, 5, 6, 7].map((y) => <option key={y} value={y}>{y}</option>)}
                </select>
              </div>
              <div className="flex gap-2">
                <button className={btnPri} onClick={() => {
                  const g2 = migrate(JSON.parse(JSON.stringify(G)));
                  const r = negotiate(g2, p.id, g2.userTeam, amt, yrs);
                  if (!r.ok) {
                    setCounter(r.counter || null);
                    notify(r.why || "He turned it down.");
                    setG(g2);
                    return;
                  }
                  const s = signPlayer(g2, p.id, g2.userTeam, amt, yrs);
                  if (!s.ok) { notify(s.why); return; }
                  setG(g2); setTarget(null); setCounter(null);
                  notify(`Signed ${fullName(p)} — $${round1(amt)}M × ${yrs}.`);
                }}>Offer</button>
                <button className={btnGhost} onClick={() => { setTarget(null); setCounter(null); }}>Walk away</button>
              </div>
            </div>
            {counter ? (
              <div className="text-sm text-amber-300">
                He'd sign for ${counter}M × {yrs}.
                <button className="ml-2 text-sky-400 hover:underline" onClick={() => { setAmt(counter); setCounter(null); }}>
                  Meet it
                </button>
              </div>
            ) : null}
          </div>
        </Section>
      ) : null}

      <Section>
        <SortTable min={720} rowKey={(x) => x.id} rows={fas} initial="ovr"
          onRow={(x) => open(x)}
          cols={[
            { key: "name", label: "Player", get: (x) => x.ln, cell: (x) => <span className="whitespace-nowrap">{fullName(x)}</span> },
            { key: "pos", label: "Pos", get: (x) => POS.indexOf(x.pos), cell: (x) => <PosBadge pos={x.pos} /> },
            { key: "age", label: "Age", get: (x) => x.age },
            { key: "ovr", label: "Ovr", get: (x) => x.ovr, cls: "font-semibold" },
            { key: "pot", label: "Pot", get: (x) => x.pot, cls: "text-slate-400" },
            { key: "ask", label: "Asking", get: (x) => askingPrice(G, x.id, G.userTeam, 3),
              cell: (x) => `$${askingPrice(G, x.id, G.userTeam, 3)}M` },
            { key: "act", label: "", get: () => 0, cell: (x) => (
              <button className="text-xs text-sky-400 hover:underline"
                onClick={(e) => { e.stopPropagation(); open(x); }}>Negotiate</button>
            ) },
          ]} empty="Nobody available." />
      </Section>
    </div>
  );
}

/* -------------------------------- playoffs -------------------------------- */

function roundName(n) {
  if (n === 1) return "Cup Final";
  if (n === 2) return "Conference Finals";
  if (n === 4) return "Second Round";
  return "First Round";
}

function SeriesPage({ G, s, onClose, openPlayer }) {
  const hi = G.teams[s.hi], lo = G.teams[s.lo];
  // Who's actually driving the series.
  const stars = [s.hi, s.lo].map((tid) => rosterOf(G, tid).filter((p) => p.po && p.po.gp)
    .sort((a, b) => pts(b.po) - pts(a.po)).slice(0, 5));
  return (
    <Modal wide title={`${hi.city} ${hi.name} vs ${lo.city} ${lo.name}`} onClose={onClose}>
      <div className="space-y-3">
        <div className={`${card} p-4 text-center`}>
          <div className="text-3xl font-bold tnum">{s.w[0]} – {s.w[1]}</div>
          <div className="text-xs text-slate-400 mt-1">
            {s.done ? `${G.teams[s.winner].name} advance` : `first to ${winsNeeded(G)}`}
          </div>
        </div>
        <Section title="Games">
          <div>
            {s.games.map((g, i) => (
              <div key={i} className="flex items-center gap-3 px-3 py-1.5 border-b border-[#16223a] last:border-0 text-sm">
                <span className="w-16 text-slate-500">Game {i + 1}</span>
                <span className="flex-1">{G.teams[g.away].abbr} @ {G.teams[g.home].abbr}</span>
                <span className="tnum">{g.ag}–{g.hg}{g.ot ? " OT" : ""}</span>
              </div>
            ))}
            {!s.games.length ? <div className="px-3 py-4 text-sm text-slate-500">Not started.</div> : null}
          </div>
        </Section>
        <div className="grid sm:grid-cols-2 gap-3">
          {[0, 1].map((i) => (
            <Section key={i} title={`${G.teams[i === 0 ? s.hi : s.lo].name} leaders`} className="p-3">
              <div className="pt-1">
                {stars[i].length ? stars[i].map((p) => (
                  <div key={p.id} className="flex justify-between text-sm py-0.5 cursor-pointer hover:text-sky-300"
                    onClick={() => openPlayer(p.id)}>
                    <span>{shortName(p)}</span>
                    <span className="tnum text-slate-400">{p.po.g}G {p.po.a}A · {pts(p.po)}</span>
                  </div>
                )) : <div className="text-sm text-slate-500">No games played.</div>}
              </div>
            </Section>
          ))}
        </div>
        <Section title="Unavailable" className="p-3">
          <div className="text-sm text-slate-400 pt-1">
            {[s.hi, s.lo].flatMap((tid) => rosterOf(G, tid, true).filter((p) => p.inj > 0)
              .map((p) => `${G.teams[tid].abbr} ${shortName(p)} (${p.injDesc})`)).join(" · ") || "Everybody's healthy."}
          </div>
        </Section>
      </div>
    </Modal>
  );
}

function CommandPalette({ G, onClose, go, openPlayer, openTeam }) {
  const [q, setQ] = useState("");
  const ref = useRef(null);
  useEffect(() => { if (ref.current && ref.current.focus) ref.current.focus(); }, []);
  const ql = q.trim().toLowerCase();
  const hits = useMemo(() => {
    const out = [];
    TABS.forEach((t) => {
      if (!ql || t.label.toLowerCase().includes(ql)) out.push({ kind: "tab", label: t.label, sub: t.group, go: () => go(t.key) });
    });
    if (ql.length >= 2) {
      G.teams.forEach((t) => {
        if (`${t.city} ${t.name} ${t.abbr}`.toLowerCase().includes(ql))
          out.push({ kind: "club", label: `${t.city} ${t.name}`, sub: `${CONFS[t.conf]} · ${DIVS[t.div]}`, go: () => openTeam(t.id) });
      });
      playersOf(G).forEach((p) => {
        if (out.length > 60 || p.retired) return;
        if (fullName(p).toLowerCase().includes(ql))
          out.push({ kind: "player", label: fullName(p), sub: `${p.pos} · ${p.ovr} ovr · ${p.teamId != null ? G.teams[p.teamId].abbr : "FA"}`, go: () => openPlayer(p.id) });
      });
    }
    return out.slice(0, 40);
  }, [ql, G]);

  return (
    <div className="fixed inset-0 bg-black/70 flex items-start justify-center p-4 pt-20 z-50" onClick={onClose}>
      <div className={`${card} w-full max-w-lg overflow-hidden`} onClick={(e) => e.stopPropagation()}>
        <input ref={ref} className="w-full bg-transparent px-4 py-3 outline-none border-b border-[#1e2b45]"
          placeholder="Jump to a screen, club or player…" value={q} onChange={(e) => setQ(e.target.value)}
          onKeyDown={(e) => { if (e.key === "Enter" && hits[0]) { hits[0].go(); onClose(); } }} />
        <div className="max-h-80 overflow-y-auto">
          {hits.map((h, i) => (
            <button key={i} className="w-full flex items-center gap-3 px-4 py-2 text-left text-sm hover:bg-[#16223a]"
              onClick={() => { h.go(); onClose(); }}>
              <span className="flex-1">{h.label}</span>
              <span className="text-xs text-slate-500">{h.sub}</span>
            </button>
          ))}
          {!hits.length ? <div className="px-4 py-4 text-sm text-slate-500">Nothing matches.</div> : null}
        </div>
      </div>
    </div>
  );
}

/* ----------------------------------- app ---------------------------------- */

function App() {
  const [G, setG] = useState(null);
  const [tab, setTab] = useState("home");
  const [group, setGroup] = useState("Club");
  const [slot, setSlot] = useState(0);
  const [showRules, setShowRules] = useState(false);
  const [showSlots, setShowSlots] = useState(false);
  const [palette, setPalette] = useState(false);
  const [player, setPlayer] = useState(null);
  const [club, setClub] = useState(null);
  const [toast, setToast] = useState(null);
  const [busy, setBusy] = useState(false);

  useEffect(() => { if (G) saveGame(G, slot); }, [G, slot]);
  useEffect(() => {
    if (!toast) return;
    const id = setTimeout(() => setToast(null), 3200);
    return () => clearTimeout(id);
  }, [toast]);

  const go = useCallback((k) => {
    setTab(k);
    const t = TABS.find((x) => x.key === k);
    if (t) setGroup(t.group);
  }, []);
  const notify = useCallback((m) => setToast(m), []);

  const start = (opts) => {
    if (opts.load != null) {
      Promise.resolve(loadGame(opts.load)).then((g) => { if (g) { setSlot(opts.load); setG(g); } });
      return;
    }
    const g = newGame(opts.team, { difficulty: opts.difficulty, rules: opts.rules });
    const free = [0, 1, 2].find((s) => !slotMeta(s));
    setSlot(free != null ? free : 0);
    setG(g);
  };

  const advance = useCallback((n) => {
    if (!G || busy) return;
    setBusy(true);
    const g2 = migrate(JSON.parse(JSON.stringify(G)));
    if (g2.phase === "regular") simDays(g2, n);
    else if (g2.phase === "playoffs") simPlayoffRound(g2);
    setG(g2);
    setBusy(false);
    if (g2.phase === "playoffs" && G.phase === "regular") go("playoffs");
    if (g2.phase === "offseason" && G.phase !== "offseason") go("offseason");
  }, [G, busy, go]);

  // Keyboard: d for a day, w for a week, ⌘K or ? for the palette.
  useEffect(() => {
    const onKey = (e) => {
      const el = e.target;
      const typing = el && (el.tagName === "INPUT" || el.tagName === "SELECT" || el.tagName === "TEXTAREA" || el.isContentEditable);
      if ((e.key === "k" || e.key === "K") && (e.metaKey || e.ctrlKey)) { e.preventDefault(); setPalette(true); return; }
      if (typing) return;
      if (e.key === "?") { e.preventDefault(); setPalette(true); return; }
      if (!G || G.phase !== "regular") return;
      if (e.key === "d") { e.preventDefault(); advance(1); }
      if (e.key === "w") { e.preventDefault(); advance(7); }
    };
    document.addEventListener("keydown", onKey);
    return () => document.removeEventListener("keydown", onKey);
  }, [G, advance]);

  if (!G) return <Splash onStart={start} />;
  const t = G.teams[G.userTeam];
  const visible = TABS.filter((x) => x.group === group);

  return (
    <div className="min-h-screen pb-10">
      <div className="sticky top-0 z-40 bg-[#0b1220]/95 backdrop-blur border-b border-[#1e2b45]">
        <div className="max-w-6xl mx-auto px-3 py-2 flex items-center gap-2 sm:gap-3 flex-wrap">
          <button className="font-semibold truncate hover:text-sky-300" onClick={() => setClub(G.userTeam)}>
            {t.city} <span className="text-sky-400">{t.name}</span>
          </button>
          <div className="text-xs text-slate-400 whitespace-nowrap">{G.year} · {t.w}-{t.l}-{t.otl} · {t.pts} pts</div>
          <div className="flex-1" />
          <div className="flex items-center gap-1.5 sm:gap-2 flex-wrap">
            {G.phase === "regular" ? (
              <>
                <button className={btnGhost} onClick={() => advance(1)} disabled={busy} title="d">Day</button>
                <button className={btnGhost} onClick={() => advance(7)} disabled={busy} title="w">Week</button>
                <button className={btnPri} onClick={() => advance(G.schedule.length)} disabled={busy}>Sim season</button>
              </>
            ) : null}
            {G.phase === "playoffs" ? <button className={btnPri} onClick={() => advance(1)} disabled={busy}>Play round</button> : null}
            <button className={btnGhost} onClick={() => setPalette(true)} title="⌘K">⌘K</button>
            <button className={btnGhost} onClick={() => setShowSlots(true)}>💾</button>
            <button className={btnGhost} onClick={() => setShowRules(true)}>📋</button>
          </div>
        </div>
        <div className="max-w-6xl mx-auto px-3 pb-1 flex gap-1 overflow-x-auto">
          {GROUPS.map((g) => (
            <button key={g} onClick={() => { setGroup(g); const first = TABS.find((x) => x.group === g); if (first) setTab(first.key); }}
              className={`px-3 py-1 rounded-lg text-xs uppercase tracking-wide whitespace-nowrap
                ${group === g ? "bg-[#22314f] text-slate-100" : "text-slate-500 hover:text-slate-300"}`}>{g}</button>
          ))}
        </div>
        <div className="max-w-6xl mx-auto px-3 pb-2 flex gap-1 overflow-x-auto">
          {visible.map((x) => (
            <button key={x.key} onClick={() => setTab(x.key)}
              className={`px-3 py-1 rounded-lg text-sm whitespace-nowrap ${tab === x.key ? "bg-sky-600 text-white" : "text-slate-300 hover:bg-[#18243c]"}`}>
              {x.label}
            </button>
          ))}
        </div>
      </div>

      <div className="max-w-6xl mx-auto p-3">
        {tab === "home" && <HomeTab G={G} setG={setG} go={go} openPlayer={setPlayer} />}
        {tab === "roster" && <RosterTab G={G} setG={setG} openPlayer={setPlayer} notify={notify} />}
        {tab === "lines" && <LinesTab G={G} setG={setG} />}
        {tab === "game" && <GameTab G={G} openPlayer={setPlayer} />}
        {tab === "schedule" && <ScheduleTab G={G} openTeam={setClub} />}
        {tab === "standings" && <StandingsTab G={G} openTeam={setClub} />}
        {tab === "stats" && <StatsTab G={G} openPlayer={setPlayer} />}
        {tab === "analytics" && <AnalyticsTab G={G} openTeam={setClub} />}
        {tab === "playoffs" && <PlayoffsTab G={G} setG={setG} openPlayer={setPlayer} />}
        {tab === "allstar" && <AllStarTab G={G} openPlayer={setPlayer} />}
        {tab === "trade" && <TradeTab G={G} setG={setG} notify={notify} openPlayer={setPlayer} />}
        {tab === "fa" && <FreeAgencyTab G={G} setG={setG} notify={notify} openPlayer={setPlayer} />}
        {tab === "offseason" && <OffseasonTab G={G} setG={setG} notify={notify} openPlayer={setPlayer} />}
        {tab === "records" && <RecordsTab G={G} openPlayer={setPlayer} />}
        {tab === "history" && <HistoryTab G={G} openPlayer={setPlayer} openTeam={setClub} />}
      </div>

      {toast ? (
        <div className="fixed bottom-4 left-1/2 -translate-x-1/2 bg-[#18243c] border border-[#243250] px-4 py-2 rounded-lg text-sm shadow-lg z-50">
          {toast}
        </div>
      ) : null}

      {showRules ? <RulesModal G={G} setG={setG} onClose={() => setShowRules(false)} /> : null}
      {palette ? <CommandPalette G={G} go={go} openPlayer={setPlayer} openTeam={setClub} onClose={() => setPalette(false)} /> : null}
      {player != null ? <PlayerModal G={G} pid={player} onClose={() => setPlayer(null)} /> : null}
      {club != null ? <ClubModal G={G} teamId={club} onClose={() => setClub(null)} openPlayer={(id) => { setClub(null); setPlayer(id); }} /> : null}
      {showSlots ? (
        <Modal title="Save slots" onClose={() => setShowSlots(false)}>
          <div className="space-y-2">
            <div className="text-sm text-slate-400">
              You're playing slot {slot + 1}. Saves live in IndexedDB and fall back to local storage.
            </div>
            {[0, 1, 2].map((s) => (
              <div key={s} className="flex items-center gap-2">
                <div className="flex-1"><SlotCard slot={s} meta={slotMeta(s)}
                  onLoad={(x) => { Promise.resolve(loadGame(x)).then((g) => { if (g) { setSlot(x); setG(g); setShowSlots(false); } }); }}
                  onDelete={(x) => { deleteSlot(x); setShowSlots(false); }} /></div>
                {s !== slot ? <button className={btnGhost} onClick={() => { setSlot(s); saveGame(G, s); notify(`Now saving to slot ${s + 1}.`); }}>Save here</button> : null}
              </div>
            ))}
          </div>
        </Modal>
      ) : null}
    </div>
  );
}

if (typeof document !== "undefined" && document.getElementById && document.getElementById("root")) {
  ReactDOM.createRoot(document.getElementById("root")).render(<App />);
}
</script>

<script>
  // The classic runtime is required — the default preset emits an ESM import
  // that breaks inside a non-module inline script.
  (function () {
    var src = document.getElementById("app-src").textContent;
    var out = Babel.transform(src, { presets: [["react", { runtime: "classic" }]] }).code;
    (0, eval)(out);
  })();
</script>
</body>
</html>
