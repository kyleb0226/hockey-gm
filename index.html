const DIFFICULTIES = {

/* ----------------------------- the board's ask -----------------------------
 * boardConfidence existed but nothing ever said what was expected, so a season
 * had no stated stakes. A mandate is set at the start of every year from where
 * the club actually is, and judged when the Cup is handed out.
 * ------------------------------------------------------------------------- */
/* Below this the board stops asking and starts looking. Deliberately low: a
   manager should be able to survive one bad year on a rebuild, and only a run
   of them should cost him the job. */
const FIRING_LINE = 12;

const MANDATES = {
  rebuild:   { label: "Develop the young players", need: 0,  blurb: "Nobody expects the playoffs. Bring the kids along." },
  compete:   { label: "Push for a playoff spot",   need: 1,  blurb: "Be in it in March." },
  playoffs:  { label: "Make the playoffs",         need: 1,  blurb: "Anything less is a failed season." },
  round:     { label: "Win a round",               need: 2,  blurb: "Getting in isn't the job any more." },
  contend:   { label: "Reach the Cup Final",       need: 3,  blurb: "This roster was built to go deep." },
  cup:       { label: "Win the Cup",               need: 4,  blurb: "It's the Cup or it's a wasted year." },
};
/* Taking the next job. The club you left keeps its history; you start again on
   a fresh board with a fresh mandate, which is the whole shape of the thing —
   a career is a sequence of tenures, not one club forever. */
function takeJob(G, teamId) {
  if (teamId == null || !G.teams[teamId]) return { ok: false, why: "no such club" };
  G.userTeam = teamId;
  G.hiredYear = G.year;
  G.fired = null;
  // A new board starts you around even, a touch below if you were just sacked.
  G.boardConfidence = 55;
  G.shotLog = {}; G.gameLog = {}; G.lastGame = null;
  G.block = []; G.offers = [];
  setMandate(G);
  news(G, `You have taken over at the ${G.teams[teamId].name}.`, "good");
  return { ok: true };
}

function setMandate(G) {
  const t = G.teams[G.userTeam];
  const strength = teamStrength(G, G.userTeam);
  const last = t.seasons && t.seasons.length ? t.seasons[t.seasons.length - 1] : null;
  const wonCup = last && last.cup;
  let key = "rebuild";
  if (wonCup || strength >= 66) key = "cup";
  else if (strength >= 63) key = "contend";
  else if (strength >= 60) key = "round";
  else if (strength >= 57) key = "playoffs";
  else if (strength >= 54) key = "compete";
  G.mandate = { key, year: G.year, ...MANDATES[key] };
  return G.mandate;
}
/* What the club actually achieved, on the mandate's own scale. */
function seasonAchievement(G) {
  const P = G.playoffs;
  if (!P) return 0;
  const made = P.rounds[0].some((s) => s.hi === G.userTeam || s.lo === G.userTeam);
  if (!made) return 0;
  if (P.champion === G.userTeam) return 4;
  const rounds = P.rounds.filter((rd) => rd.some((s) => s.winner === G.userTeam)).length;
  return Math.min(3, 1 + rounds);
}

/* -------------------------------- the room ---------------------------------
 * Hockey is the most dressing-room sport there is and the game had none of it.
 * A personality is derived from the player's id, so it's stable for his whole
 * career and an old save gets one without reshuffling anybody. It is pure
 * character — it never touches a rating — but it decides who wears the C, how
 * he takes a bad run, and how much the room sags when things go wrong.
 * ------------------------------------------------------------------------- */
const PERSONALITIES = [
  { key: "leader",    label: "Natural leader",  lead: 2.2, steady: 1.6 },
  { key: "quiet",     label: "Quiet pro",       lead: 1.1, steady: 1.5 },
  { key: "warrior",   label: "Warrior",         lead: 1.6, steady: 1.2 },
  { key: "sniper",    label: "Pure shooter",    lead: 0.7, steady: 0.9 },
  { key: "hothead",   label: "Hothead",         lead: 0.5, steady: 0.4 },
  { key: "joker",     label: "Room joker",      lead: 0.9, steady: 1.3 },
  { key: "workhorse", label: "Workhorse",       lead: 1.3, steady: 1.4 },
  { key: "moody",     label: "Moody",           lead: 0.4, steady: 0.5 },
];
const personalityOf = (p) => PERSONALITIES[(p.id * 2749) % PERSONALITIES.length];

/* ------------------------------- player roles -----------------------------
 * What a skater is FOR. Every rate stat used to come from a narrow curve around
 * one rating, which meant nobody specialised: the league's hits leader finished
 * on 152 and its penalty leader on 84, because a fourth-line agitator drew
 * roughly the same numbers as a first-line centre. Real hockey concentrates
 * these — one man leads the league in hits by a mile, another in penalty
 * minutes, and neither of them is the scoring champion.
 *
 * The role is DERIVED from a player's own ratings, not stored, so it costs no
 * save size, never drifts out of sync with his development, and an old save
 * gets one for free. It reads as a description of a player rather than a
 * setting, which is the point — you scout it, you don't choose it.
 * ------------------------------------------------------------------------- */
const ROLES = {
  sniper:    { label: "Sniper",        blurb: "Shoots first. Give him the puck in the circle.",
               hit: 0.72, pim: 0.80, blk: 0.70, pp: 1.45, fight: 0.25 },
  playmaker: { label: "Playmaker",     blurb: "Sees the pass before it exists.",
               hit: 0.70, pim: 0.85, blk: 0.75, pp: 1.40, fight: 0.20 },
  twoWay:    { label: "Two-way",       blurb: "Trusted in every situation, loud in none.",
               hit: 1.00, pim: 1.00, blk: 1.05, pp: 1.00, fight: 0.70 },
  shutdown:  { label: "Shutdown",      blurb: "Plays the hard minutes and eats shots.",
               hit: 1.20, pim: 1.10, blk: 1.15, pp: 0.45, fight: 0.90 },
  grinder:   { label: "Grinder",       blurb: "Finishes checks, wears people down.",
               hit: 1.70, pim: 1.45, blk: 1.15, pp: 0.35, fight: 1.60 },
  enforcer:  { label: "Enforcer",      blurb: "On the ice to answer for things.",
               hit: 2.30, pim: 2.90, blk: 0.90, pp: 0.15, fight: 4.00 },
};
const ROLE_KEYS = Object.keys(ROLES);

/* Which of his attributes stands furthest above his own average — a player is
   defined by what he does BEST relative to himself, not by raw quality, so a
   fourth-liner gets a real identity instead of "worse forward". */
function roleKeyOf(p) {
  if (!p || p.pos === "G") return null;
  const r = p.r || {};
  const v = (k) => r[k] || 0;
  const mean = (v("sht") + v("pss") + v("dfn") + v("phy") + v("hnd") + v("spd")) / 6;
  const score = {
    sniper: (v("sht") - mean) * 1.15 + (v("hnd") - mean) * 0.35,
    playmaker: (v("pss") - mean) * 1.15 + (v("hnd") - mean) * 0.4,
    shutdown: (v("dfn") - mean) * 1.2 + (p.pos === "D" ? 3 : 0),
    grinder: (v("phy") - mean) * 0.95 - (v("sht") - mean) * 0.35,
    // An enforcer is a grinder whose hands never caught up with his shoulders.
    enforcer: (v("phy") - mean) * 1.1 - (v("sht") - mean) * 0.7 - (v("hnd") - mean) * 0.6
      + (v("phy") >= 68 && v("sht") <= 52 ? 6 : -6),
    twoWay: 3.4,   // the default anyone unremarkable falls back to
  };
  let bestKey = "twoWay", bestVal = -Infinity;
  // Ties break on id so the answer is stable for a career, never random.
  ROLE_KEYS.forEach((k, i) => {
    const s = (score[k] || 0) + ((p.id * 31 + i * 7) % 5) * 0.01;
    if (s > bestVal) { bestVal = s; bestKey = k; }
  });
  return bestKey;
}
const roleOf = (p) => ROLES[roleKeyOf(p)] || ROLES.twoWay;
// A weight for "how likely is this player to be the one who does X".
const roleTrait = (p, k) => (p && p.pos !== "G" ? roleOf(p)[k] : 0);

/* Who deserves the letter: leadership is what he is, plus what he's done, plus
   how long he's been here. Age matters — a 21-year-old rarely gets the C. */
function leadership(G, p) {
  const per = personalityOf(p);
  const yrs = (p.career || []).filter((c) => c.teamId === p.teamId).length;
  return per.lead * 10
    + Math.max(0, p.age - 22) * 1.6
    + p.ovr * 0.22
    + yrs * 2.4
    + (p.rings || []).length * 3
    + (p.trophies || []).length * 2;
}
/* The captain and two alternates, recomputed when the roster changes rather
   than stored, so a trade can never leave a departed player wearing the C. */
function letters(G, teamId) {
  const r = rosterOf(G, teamId).filter((p) => p.pos !== "G")
    .sort((a, b) => leadership(G, b) - leadership(G, a));
  const t = G.teams[teamId];
  // A named captain is honoured as long as he's still here and healthy enough.
  const named = t.captainId != null ? r.find((p) => p.id === t.captainId) : null;
  const cap = named || r[0] || null;
  const alts = r.filter((p) => !cap || p.id !== cap.id).slice(0, 2);
  return { captain: cap, alternates: alts };
}
const letterFor = (G, p) => {
  if (p.teamId == null || p.pos === "G") return null;
  const { captain, alternates } = letters(G, p.teamId);
  if (captain && captain.id === p.id) return "C";
  return alternates.some((a) => a.id === p.id) ? "A" : null;
};

/* How settled the room is, 0-100. Winning and leadership hold it up; a losing
   run and a roster full of hotheads drag it down. It feeds the board's read of
   the season and nudges how a club performs when things are going badly. */
function roomMorale(G, teamId) {
  const t = G.teams[teamId];
  const r = rosterOf(G, teamId).filter((p) => p.pos !== "G");
  if (!r.length) return 50;
  const steady = r.reduce((s, p) => s + personalityOf(p).steady, 0) / r.length;
  const form = (t.l10 || []).reduce((s, x) => s + (x === "W" ? 1 : x === "O" ? 0.4 : -0.8), 0);
  const { captain } = letters(G, teamId);
  const capBonus = captain ? personalityOf(captain).lead * 2.2 : 0;
  return Math.round(clamp(50 + form * 3.4 + (steady - 1.1) * 18 + capBonus, 0, 100));
}

/* ------------------------------ the staff ---------------------------------
 * A head coach is a system and two competences. The system trades shot volume
 * against shots allowed — it multiplies in the same place `momentum` and `legs`
 * do — while the special-teams and development ratings move the power play, the
 * kill, and how fast prospects come along.
 * ------------------------------------------------------------------------- */
const SYSTEMS = {
  aggressive: { label: "Aggressive forecheck", off: 1.075, def: 1.055,
    blurb: "More chances both ways. Good with legs, punished by a slow defence." },
  balanced:   { label: "Balanced", off: 1.0, def: 1.0,
    blurb: "No edge and no hole. Whatever your roster is, that's what you get." },
  trap:       { label: "Neutral-zone trap", off: 0.935, def: 0.925,
    blurb: "Strangles the game. Wins you low-scoring nights, wastes a scoring line." },
};
const COACH_FIRST = ["Dale", "Barry", "Ken", "Mike", "Claude", "Rod", "Jon", "Bruce", "Pete", "Gerard",
  "Lindy", "Craig", "Sheldon", "Todd", "Andre", "Marc", "Randy", "Bob", "Rick", "Guy"];
const COACH_LAST = ["Hitchens", "Trotman", "Boudreault", "Quennel", "Julienne", "Tortora", "Maurer",
  "Cassidy", "Laviolette", "Gallantry", "Ruffe", "Berube", "Keefer", "McLellan", "Tocchetti", "Vigneau"];

function genCoach(G, tier) {
  const sysKeys = Object.keys(SYSTEMS);
  return {
    name: pick(G, COACH_FIRST) + " " + pick(G, COACH_LAST),
    system: pick(G, sysKeys),
    pp: Math.round(clamp(gauss(G, tier, 9), 25, 95)),   // power play
    pk: Math.round(clamp(gauss(G, tier, 9), 25, 95)),   // penalty kill
    dev: Math.round(clamp(gauss(G, tier, 9), 25, 95)),  // develops prospects
    years: ri(G, 1, 4),
  };
}
const coachOf = (t) => t.coach || { system: "balanced", pp: 55, pk: 55, dev: 55, name: "Interim" };
const systemOf = (t) => SYSTEMS[coachOf(t).system] || SYSTEMS.balanced;

/* A rivalry night is louder: both sides push, gloves come off more often, and
   the result moves the room further than an ordinary Tuesday would. */
const isRivalry = (G, a, b) => G.teams[a] && G.teams[a].rivalId === b;

const CAP_FLOOR_PCT = 0.76;
const MIN_SALARY = 0.78;
const ELC_SALARY = 0.95;   // entry-level contract
const MAX_SALARY_PCT = 0.20;

function rules(G) { return Object.assign({}, RULES_DEFAULT, (G && G.rules) || {}); }
function ruleValue(G, k) {
  if (G && G.pendingRules && k in G.pendingRules) return G.pendingRules[k];
  return rules(G)[k];
}
function setRule(G, k, v) {
  if (STRUCTURAL_RULES.includes(k)) { G.pendingRules = G.pendingRules || {}; G.pendingRules[k] = v; }
  else { G.rules = Object.assign({}, G.rules); G.rules[k] = v; }
  return G;
}
function applyPendingRules(G) {
  if (!G.pendingRules) return;
  G.rules = Object.assign({}, rules(G), G.pendingRules);
  G.pendingRules = null;
}
function diff(G) { return DIFFICULTIES[(G && G.difficulty) || "normal"]; }

/* --------------------------------- random --------------------------------- */
// Seeded so the headless harness reproduces a season exactly.
function rnd(G) {
  G.seed = (G.seed + 0x6d2b79f5) | 0;
  let t = G.seed;
  t = Math.imul(t ^ (t >>> 15), t | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
const ri = (G, a, b) => a + Math.floor(rnd(G) * (b - a + 1));
const pick = (G, arr) => arr[Math.floor(rnd(G) * arr.length)];
// Roughly normal, clamped — used for ratings and game variance.
function gauss(G, mean, sd) {
  const u = Math.max(1e-9, rnd(G)), v = rnd(G);
  return mean + sd * Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
}

  if (!r.length) return 50;
  const top = r.slice(0, 18);
  return Math.round(top.reduce((s, p) => s + p.ovr, 0) / top.length);
}

/* ------------------------------- the schedule ------------------------------ */
/* Circle-method round robin over all 32 clubs, repeated until the season length
   is met, with the home side alternating so home/away stays balanced. */

const CAL_DAYS_PER_ROUND = 2.15;   // an 82-game season runs ~176 calendar days

function buildSchedule(G) {
  const n = TEAMS.length;
  const len = ruleValue(G, "seasonLen");
  const arr = TEAMS.map((_, i) => i);
  const half = n / 2;
  // The circle method decides WHO plays; a running home count decides WHERE, so
  // the split stays even however many times the cycle repeats.
  const homeCount = new Array(n).fill(0);
  const fixtures = [];
  let round = 0;
  while (round < len) {
    for (let r = 0; r < n - 1 && round < len; r++) {
      const rf = [];
      for (let i = 0; i < half; i++) {
        const a = arr[i], b = arr[n - 1 - i];
        const aHome = homeCount[a] < homeCount[b] || (homeCount[a] === homeCount[b] && (r + i) % 2 === 0);
        const home = aHome ? a : b, away = aHome ? b : a;
        homeCount[home]++;
        rf.push({ home, away, round, played: false });
      }
      // Shuffle within the round. The circle method has a fixed point — club 0
      // never moves — so without this every club lands in the same slot every
      // round and every gap between games comes out identical.
      for (let i = rf.length - 1; i > 0; i--) {
        const j = Math.floor(rnd(G) * (i + 1));
        const t = rf[i]; rf[i] = rf[j]; rf[j] = t;
      }
      rf.forEach((fx) => fixtures.push(fx));
      round++;
      arr.splice(1, 0, arr.pop());   // rotate all but the first
    }
  }

  // Spread the fixtures over a real calendar instead of playing all 32 clubs
  // every single night. Rest days are what make back-to-backs mean anything.
  let days = Math.max(len + 1, Math.round(len * CAL_DAYS_PER_ROUND));
  const cal = Array.from({ length: days }, () => []);
  const busy = Array.from({ length: days }, () => new Set());
  // Three nights off in midwinter for the All-Star break — a real gap in the
  // calendar rather than a cosmetic label.
  const breakStart = Math.floor(days * 0.55);
  const onBreak = new Set([breakStart, breakStart + 1, breakStart + 2]);
  const place = (fx, idx) => {
    // Spread by position in the whole fixture list, not by round. Anchoring on
    // the round would drop all sixteen of a round's games on one night, which is
    // exactly the every-club-plays-every-day calendar this replaced.
    const target = Math.min(days - 1, Math.floor((idx * days) / fixtures.length));
    for (let d = target; d < days; d++) {
      if (onBreak.has(d) || busy[d].has(fx.home) || busy[d].has(fx.away)) continue;
      cal[d].push(fx); busy[d].add(fx.home); busy[d].add(fx.away); return true;
    }
    for (let d = 0; d < target; d++) {
      if (onBreak.has(d) || busy[d].has(fx.home) || busy[d].has(fx.away)) continue;
      cal[d].push(fx); busy[d].add(fx.home); busy[d].add(fx.away); return true;
    }
    return false;
  };
  fixtures.forEach((fx, idx) => {
    if (place(fx, idx)) return;
    // Should never happen at these ratios, but a fixture must never be dropped.
    cal.push([fx]); busy.push(new Set([fx.home, fx.away])); days++;
  });

  G.schedule = cal;
  G.day = 0;
  G.allStarDay = breakStart + 1;
  G.lastPlayed = new Array(n).fill(-9);
  return cal;
}

// Days off since a club last played. 0 means a genuine back-to-back.
function restFor(G, teamId) {
  const last = (G.lastPlayed && G.lastPlayed[teamId] != null) ? G.lastPlayed[teamId] : -9;
  return last < 0 ? 3 : Math.max(0, G.day - last - 1);
}

/* -------------------------------- new game -------------------------------- */

function newGame(userTeam, opts) {
  opts = opts || {};
  const G = {
    v: 1,
    seed: (opts.seed != null ? opts.seed : Math.floor(Math.random() * 1e9)) | 0,
    nextPid: 1,
    year: opts.year || 2026,
    userTeam: userTeam || 0,
    hiredYear: opts.year || 2026,
    tenure: [],
    fired: null,
    difficulty: opts.difficulty || "normal",
    rules: Object.assign({}, RULES_DEFAULT, opts.rules || {}),
    pendingRules: null,
    phase: "regular",
    day: 0,
    players: {},
    teams: [],
    schedule: [],
    results: [],
    playoffs: null,
    draftClass: [],
    freeAgents: [],
    picks: [],
    history: [],
    log: [],
    awards: null,
    boardConfidence: 62,
    news: [],
    retained: [],
    waivers: [],
    mandate: null,
    lastMandate: null,
    hall: [],
    block: [],
    offers: [],
    shotLog: {},
    gameLog: {},
    records: null,
  };

  G.teams = TEAMS.map((t, i) => ({
    id: i, ...t,
    w:0, l:0, otl:0, pts:0, gf:0, ga:0, gp:0, streak:0, l10:[],
    lines: null, lineChem: [0, 0, 0, 0], lineSig: [null, null, null, null],
    pairChem: [0, 0, 0], pairSig: [null, null, null],
    cupWins: 0, playoffApps: 0,
    revenue: 0, budget: 0,
  }));

  // Roster generation. Team tier spreads the league from contender to lottery.
  /* How far apart the clubs are. A wide spread reads as exciting but it makes
     the league unrecognisable: the bottom club finished on 43 points against a
     real-world floor around 55, and the resulting blowouts inflated everything
     downstream — shutouts, 30-goal scorers, +/- extremes. Real NHL rosters sit
     closer together than instinct suggests. */
  const tiers = G.teams.map(() => clamp(gauss(G, 56, 4.4), 44, 68));
  G.teams.forEach((t, i) => {
    const tier = tiers[i];
    Object.entries(ROSTER_SHAPE).forEach(([pos, count]) => {
      for (let k = 0; k < count; k++) {
        // Top-line talent sits well above roster filler.
        const slot = 1 - k / (count + 1);
        const p = genPlayer(G, pos, tier + slot * 16 - 6);
        p.teamId = i;
        G.players[p.id] = p;
      }
    });
    // A few depth bodies on the farm.
    for (let k = 0; k < 5; k++) {
      const p = genPlayer(G, pick(G, ["C","LW","RW","D","G"]), tier - 14, ri(G, 19, 24));
      p.teamId = i; p.farm = true;
      G.players[p.id] = p;
    }
  });

  // Contracts, sized to market with a little noise, then squeezed under the cap.
  G.teams.forEach((t) => {
    rosterOf(G, t.id, true).forEach((p) => {
      p.contract = {
        amt: round1(clamp(marketValue(G, p) * (0.85 + rnd(G) * 0.35), MIN_SALARY, rules(G).capAmount * MAX_SALARY_PCT)),
        yrs: p.age < 23 ? ri(G, 1, 3) : ri(G, 1, 5),
      };
      if (p.farm) p.contract.amt = MIN_SALARY;
      p.ntc = eligibleForNtc(p) && p.contract.yrs >= 3 && rnd(G) < 0.55;
    });
    let guard = 0;
    while (capHit(G, t.id) > rules(G).capAmount && guard++ < 60) {
      const worst = rosterOf(G, t.id).sort((a, b) => b.contract.amt / Math.max(1, b.ovr) - a.contract.amt / Math.max(1, a.ovr))[0];
      if (!worst) break;
      worst.contract.amt = round1(Math.max(MIN_SALARY, worst.contract.amt * 0.85));
    }
    t.lines = autoLines(G, t.id);
    t.budget = round1(20 + t.mkt * 6);
    t.coach = genCoach(G, 50 + t.mkt * 3);
  });

  /* Rivalries, paired inside each division so they're always mutual. Eight
     clubs a division makes four pairs; nobody is left without one. */
  DIVS.forEach((_, d) => {
    const ids = G.teams.filter((t) => t.div === d).map((t) => t.id);
    for (let i = 0; i + 1 < ids.length; i += 2) {
      G.teams[ids[i]].rivalId = ids[i + 1];
      G.teams[ids[i + 1]].rivalId = ids[i];
    }
  });

  // Free agent pool and this year's draft picks.
  for (let k = 0; k < 40; k++) {
    const p = genPlayer(G, pick(G, ["C","LW","RW","D","G"]), 46, ri(G, 24, 36));
    G.players[p.id] = p;
    G.freeAgents.push(p.id);
  }
  seedPicks(G, G.year, 4);

  /* The founding league. Nobody generated here was ever drafted — the world
     starts with them already in it — so their bios must not claim they went
     undrafted, which is a different and much less flattering thing. One integer
     draws the line: anyone with a higher id arrived later, and a later arrival
     with no draft record really is an undrafted signing. Stamped BEFORE the
     draft class is built, or an offseason start would file its prospects on the
     wrong side of it. */
  G.foundingMaxPid = G.nextPid - 1;

  buildSchedule(G);
  setMandate(G);

  /* Where the career begins. Dropping straight into game one is the default and
     what every save did before, but the offseason is where a GM job actually
     starts: you inherit a roster, and the first things you do are a draft and a
     free-agent market. Starting there means your first season is one you built.
     It is a genuine offseason, not a cutscene — the same `offseasonStage` /
     `doOffseasonStep` sequence the game runs every other year, so the draft
     board, the scouting budget and the market all behave exactly as they will
     in year two. The season that follows is `G.year + 1`, because the draft you
     are about to run is this year's. */
  if (opts.start === "offseason") {
    G.phase = "offseason";
    G.offseasonStep = "review";
    buildDraftClass(G);
  }
  return G;
}

/* Tradeable pick records. Rounds beyond `PICK_ROUNDS` still exist in the draft —
   `pickOwner` falls back to the original club — they just can't be traded, which
   keeps the record count bounded. Seeding starts at the CURRENT year so this
   year's picks can move on draft day; seeding only future years meant the very
   first draft had no tradeable picks at all. */
const PICK_ROUNDS = 3;
function seedPicks(G, fromYear, years) {
  for (let y = 0; y < years; y++) {
    for (let rd = 1; rd <= PICK_ROUNDS; rd++) {
      G.teams.forEach((t) => G.picks.push({ year: fromYear + y, round: rd, owner: t.id, orig: t.id }));
    }
  }
}

/* --------------------------- migrating old saves --------------------------- */
function migrate(G) {
  if (!G) return G;
  G.rules = Object.assign({}, RULES_DEFAULT, G.rules || {});
  if (!G.picks) G.picks = [];
  if (!G.news) G.news = [];
  if (!G.history) G.history = [];
  if (!G.log) G.log = [];
  if (!G.freeAgents) G.freeAgents = [];
  if (!G.draftClass) G.draftClass = [];
  if (G.boardConfidence == null) G.boardConfidence = 62;
  // A save that predates the firing rule keeps its job and its start date.
  if (!G.tenure) G.tenure = [];
  if (G.fired === undefined) G.fired = null;
  if (G.hiredYear == null) G.hiredYear = G.year - (G.teams[G.userTeam].seasons || []).length;
  if (!G.lastPlayed) G.lastPlayed = new Array((G.teams || []).length || TEAMS.length).fill(-9);
  if (!G.retained) G.retained = [];
  if (!G.waivers) G.waivers = [];
  if (!G.shotLog) G.shotLog = {};
  if (G.scoutPoints == null) G.scoutPoints = 0;
  if (!G.draftLog) G.draftLog = [];
  if (!G.draftStars) G.draftStars = [];
  /* A save from before the line was drawn can't know where it fell, and
     guessing would put "undrafted" on founding players. Null means "don't
     claim anything", which is the honest reading. */
  if (G.foundingMaxPid === undefined) G.foundingMaxPid = null;
  // A save from before the order was year-stamped: a class in hand means the
  // order on file is this year's, and anything else means there isn't one.
  if (G.draftYear === undefined) G.draftYear = (G.draftClass || []).length ? G.year : null;
  if (!G.block) G.block = [];
  if (!G.offers) G.offers = [];
  if (!G.hall) G.hall = [];
  if (!G.gameLog) G.gameLog = {};
  playersOf(G).forEach((p) => {
    if (!p.stats) p.stats = blankStats(p.pos);
    if (!p.season) p.season = blankStats(p.pos);
    if (!p.career) p.career = [];
    /* A save whose seasons were archived before shares were stored gets them
       derived from the raw line. That is the ONE case where recomputing an old
       year under today's constants is right — the alternative is a career table
       with a decade of blanks. A collapsed retired total is left alone: summing
       a career's worth of games and calling the result one season's shares
       would be badly wrong, not slightly.
       Gated on a SAVE-LEVEL flag, not on whether a given row looks stamped: a
       genuinely zero share stores nothing, so a per-row test can never tell
       "not done" from "done, and it was zero" and would re-run the whole league
       on every migrate — and migrate runs on every click of the trade screen. */
    if (!G.psBackfilled) {
      (p.career || []).forEach((c) => { if (!c.total) stampShares(G, p, c); });
      if (p.stats && p.stats.gp) stampShares(G, p, p.stats);
    }
    if (!p.trophies) p.trophies = [];
    if (!p.rings) p.rings = [];
    if (!p.allStars) p.allStars = [];
    if (p.fatigue == null) p.fatigue = 0;
    if (!p.shoots) p.shoots = (p.id % 100) < 62 ? "L" : "R";
    const kind = p.pos === "G" ? "G" : "S";
    // Only the LIVE season carries shot buckets; an older save that put them on
    // `p.stats` too gets that space back here.
    if (p.stats) { delete p.stats.z; delete p.stats.net; }
    [p.season].forEach((s) => {
      if (!s) return;
      if (!s.z) s.z = blankZones(kind);
      if (!s.net) s.net = blankNet(kind);
      if (kind === "S") {
        // Older saves predate attempt tracking; seed it from shots on goal so
        // the on-goal share doesn't read as zero.
        if (s.att == null) s.att = s.sog || 0;
        if (s.miss == null) s.miss = 0;
        if (s.blkd == null) s.blkd = 0;
      }
    });
    p.ovr = ovrOf(p);
  });
  G.teams.forEach((t) => {
    if (!t.l10) t.l10 = [];
    if (!t.lineChem) t.lineChem = [0, 0, 0, 0];
    if (!t.lineSig) t.lineSig = [null, null, null, null];
    if (!t.pairChem) t.pairChem = [0, 0, 0];
    if (!t.pairSig) t.pairSig = [null, null, null];
  });
  /* Runs LAST: it reads career lines and point shares, so everything above has
     to have been repaired first. It writes its results back onto the history
     rows, so the expensive half only ever happens once per save. */
  G.psBackfilled = 1;
  backfillAwards(G);
  return G;
}

/* ============================ THE GAME ENGINE ==============================
 * A game is 60 minutes of shift time split across line-vs-line matchups.
 * For each matchup we work out a shot rate from the offensive unit against the
 * defensive unit, roll shots, then resolve each shot against the goalie. The
 * home side gets last change: a small bias toward putting its top line against
 * the opponent's weaker pairs.
 * ========================================================================== */

/* ------------------------------ deployment --------------------------------
 * Two levers the coach actually has: how the minutes are split, and who plays
 * against whom. Ice time is stored per club and normalised on read, so a save
 * that predates it still behaves exactly as before.
 * ------------------------------------------------------------------------- */

function normalise(arr, fallback) {
  if (!arr || arr.length !== fallback.length) return fallback.slice();
  const tot = arr.reduce((a, b) => a + Math.max(0, b), 0);
  if (tot <= 0) return fallback.slice();
  return arr.map((v) => Math.max(0, v) / tot);
}
const iceTimeF = (t) => normalise(t && t.iceF, LINE_TOI);
/* Defence pair minutes. Forwards had a coach's control over this from the
   start; pairs were a hard-coded constant, which is odd given a top pair plays
   more of the game than any forward line does. */
const iceTimeD = (t) => normalise(t && t.iceD, PAIR_TOI);

/* How often our line `li` sees each of their four. Line-for-line is the default
   because that's what happens when nobody is steering. With last change, the
   home coach gets to steer: his designated checking line chases their best, and
   his own top line is pushed away from it toward their depth. On the road he
   can only ask — the other bench answers. */
function matchupMix(G, side, li, oppT) {
  const mix = [0, 0, 0, 0];
  const base = Math.min(3, li);
  mix[base] = 1;
  const myT = G.teams[side.box.teamId];
  const check = myT.checkLine;
  if (check == null) return mix;
  // Away, the coach still tries, he just doesn't get the last word.
  const power = side.isHome ? 0.62 : 0.22;
  if (li === check) {
    // Throw this line at their top line.
    for (let k = 0; k < 4; k++) mix[k] *= (1 - power);
    mix[0] += power;
  } else if (li === 0 && check !== 0) {
    // And keep our best away from their checkers, out against their depth.
    for (let k = 0; k < 4; k++) mix[k] *= (1 - power);
    mix[2] += power * 0.55;
    mix[3] += power * 0.45;
  }
  const tot = mix.reduce((a, b) => a + b, 0);
  return tot > 0 ? mix.map((v) => v / tot) : [1, 0, 0, 0];
}

const ES_MINUTES = 47;      // even strength
const PP_MIN_PER = 1.7;     // ice time per power play
// How the two special-teams units split the work, as real clubs do.
const PP_UNIT_SPLIT = [0.65, 0.35];
const PK_UNIT_SPLIT = [0.58, 0.42];

function emptyBox(G, teamId) {
  const box = { teamId, g: 0, sog: 0, pim: 0, pp: 0, ppg: 0, hits: 0, blk: 0, fow: 0, fol: 0, players: {}, goalie: null, scorers: [] };
  // Farm and injured players are included so a stray id can never miss — only
  // players who actually take ice time are credited in applyGame.
  rosterOf(G, teamId, true).forEach((p) => {
    box.players[p.id] = p.pos === "G"
      ? { sa: 0, sv: 0, ga: 0, toi: 0, sosa: 0, sosv: 0, starts: 0, z: blankZones("G"), net: blankNet("G") }
      : { g: 0, a: 0, sog: 0, pim: 0, hit: 0, blk: 0, toi: 0, pm: 0, fow: 0, fol: 0, ppg: 0, shg: 0, gwg: 0,
          eng: 0, fights: 0, sos: 0, soa: 0, att: 0, miss: 0, blkd: 0,
          z: blankZones("S"), net: blankNet("S") };
  });
  return box;
}

/* Not every shot is the same shot. A point blast from a defenceman and a rush
   chance off the wing arrive at the goalie with very different odds, so the zone
   is picked first and it decides both who shoots and how stoppable it is. */
const SHOT_ZONES = [
  { key: "rush",  p: 0.22, save: -0.034, dBias: 0.22 },
  { key: "cycle", p: 0.52, save:  0.000, dBias: 0.50 },
  { key: "point", p: 0.26, save:  0.055, dBias: 3.40 },
];
/* Which zone a chance comes from is NOT a league constant — it's an argument
   between the two units on the ice, and it's the reason one club's shot map
   should look different from another's:
     - speed up front turns pucks into rush chances;
     - a defenceman who can shoot drags the play out to the point;
     - a quick, sound defensive unit denies the middle, which pushes the other
       side out to the point and takes the rush away.
   Without this every team's map was the same shape and only the volume moved. */
function pickZone(G, offIds, defIds) {
  const w = SHOT_ZONES.map((z) => z.p);
  if (offIds && defIds) {
    const off = offIds.map((id) => G.players[id]).filter(Boolean);
    const def = defIds.map((id) => G.players[id]).filter(Boolean);
    if (off.length && def.length) {
      const avg = (arr, k) => arr.reduce((s, p) => s + p.r[k], 0) / arr.length;
      const fwd = off.filter((p) => p.pos !== "D");
      const dmen = off.filter((p) => p.pos === "D");
      const speed = fwd.length ? avg(fwd, "spd") : 55;
      const hands = fwd.length ? (avg(fwd, "hnd") + avg(fwd, "pss")) / 2 : 55;
      const dShot = dmen.length ? avg(dmen, "sht") : 45;
      const oppDfn = avg(def, "dfn");
      const oppSpd = avg(def, "spd");
      const oppPhy = avg(def, "phy");
      // rush: our legs against theirs, and against a unit that's hard to beat
      w[0] *= clamp(1 + (speed - 55) * 0.022 - (oppSpd - 55) * 0.015 - (oppDfn - 55) * 0.016, 0.35, 2.4);
      // cycle: hanging onto it down low. NOT a leftover — if this isn't
      // modulated it pins the middle of every club's chart to ~50% and the
      // three zones never change rank, which is what made every map look alike.
      w[1] *= clamp(1 + (hands - 55) * 0.008 - (oppPhy - 55) * 0.006, 0.55, 1.6);
      // point: our defencemen's shot, and a defence that forces us outside
      w[2] *= clamp(1 + (dShot - 45) * 0.024 + (oppDfn - 55) * 0.019, 0.35, 2.4);
    }
  }
  const tot = w.reduce((a, b) => a + b, 0);
  let x = rnd(G) * tot;
  for (let i = 0; i < SHOT_ZONES.length; i++) { x -= w[i]; if (x <= 0) return SHOT_ZONES[i]; }
  return SHOT_ZONES[1];
}

// Who takes the shot in a given unit — weighted by shooting and hands, with
// defencemen far likelier to be the one firing from the point.
function shooterFrom(G, ids, dBias) {
  const ps = ids.map((id) => G.players[id]).filter(Boolean);
  if (!ps.length) return null;
  const bias = dBias == null ? 0.55 : dBias;
  // The exponent sets how concentrated scoring is. At 1.6 the league produced
  // 76-goal seasons, which the NHL has not seen since 1988.
  const wts = ps.map((p) => Math.pow(Math.max(1, ratingNow(p, "sht") * 0.7 + ratingNow(p, "hnd") * 0.3 - 20), 1.42) * (p.pos === "D" ? bias : 1));
  const tot = wts.reduce((a, b) => a + b, 0);
  let x = rnd(G) * tot;
  for (let i = 0; i < ps.length; i++) { x -= wts[i]; if (x <= 0) return ps[i]; }
  return ps[ps.length - 1];
}
// Assists go to the linemates who actually move the puck.
function assistsFrom(G, ids, scorerId) {
  const ps = ids.map((id) => G.players[id]).filter((p) => p && p.id !== scorerId);
  const out = [];
  if (!ps.length) return out;
  const roll = rnd(G);
  /* How many assists a goal carries. The NHL runs about 1.70 assists per goal:
     roughly 3% of goals are unassisted, a quarter carry one, and about seventy
     per cent carry two. The old 24/38/38 split averaged 1.14, which is why the
     league's assist leader finished BELOW its goal leader and nobody ever
     reached a hundred points. */
  const n = roll < 0.03 ? 0 : roll < 0.30 ? 1 : 2;
  const pool = ps.slice();
  for (let i = 0; i < n && pool.length; i++) {
    const wts = pool.map((p) => Math.pow(Math.max(1, p.r.pss - 15), 1.7));
    const tot = wts.reduce((a, b) => a + b, 0);
    let x = rnd(G) * tot, chosen = pool[pool.length - 1];
    for (let k = 0; k < pool.length; k++) { x -= wts[k]; if (x <= 0) { chosen = pool[k]; break; } }
    out.push(chosen.id);
    pool.splice(pool.indexOf(chosen), 1);
  }
  return out;
}

function resolveShots(G, ctx, shots, offIds, defIds, gid, strength) {
  const gq = goalieQuality(G, gid);
  // Save percentage lives in a believable band; a great goalie is ~.925. A tired
  // goalie leaks: a full fatigue load is worth about fifteen points of save
  // percentage, which is roughly what a goalie on his third start in four nights
  // actually looks like.
  const gp = G.players[gid];
  const tired = gp ? clamp(gp.fatigue, 0, 100) / 100 : 0;
  /* Goals per team-game is SOG x (1 - SV%), and all three have to land together.
     At .9032 the league produced 2.77 goals a night against a real 3.0-3.1 —
     shots and shooting percentage were both in band, but their product was low,
     which showed up as 239 shutouts a season against an NHL 90-190. */
  let base = 0.8948 + (gq - 55) * 0.0016 - tired * 0.015;
  if (strength === "pp") base -= 0.028;
  const gBox = ctx.gBox, sBox = ctx.sBox;
  if (!gBox.players[gid]) return;   // no dressed goaltender — nothing to resolve against
  const hole = gp ? goalieHole(gp) : null;
  const blockers = defIds.map((id) => G.players[id]).filter((p) => p && p.pos === "D");

  /* One attempt, one outcome. Each attempt is an independent event that either
     hits a shin pad, sails wide, or reaches the goalie — it is NOT one shot on
     goal with a blocked and a missed sibling invented around it, which is what
     this used to do and which meant a single chance produced up to three
     records. `shots` is the number expected to REACH the net, so the loop runs
     over the attempts needed to produce that many. */
  const canBlock = blockers.length > 0;
  const pBlock = canBlock ? 0.24 : 0;
  const pMiss = 0.21;
  const pOnGoal = 1 - pBlock - pMiss;
  const attempts = Math.round(shots / pOnGoal);

  for (let s = 0; s < attempts; s++) {
    const zone = pickZone(G, offIds, defIds);
    const shooter = shooterFrom(G, offIds, zone.dBias);
    if (!shooter || !sBox.players[shooter.id]) continue;
    const sh = sBox.players[shooter.id];

    // A record per attempt, kept only when somebody is going to look at it (the
    // user's club). The clock time is invented the same way the play-by-play's
    // is; the game, the opponent and the outcome are real.
    const log = ctx.shots;
    const rec = (r, cell) => {
      if (!log) return;
      log.push({ p: shooter.id, g: gid, off: sBox.teamId, def: gBox.teamId,
        t: rnd(G) * 60, z: zone.key, c: cell, r, st: strength });
    };

    sh.att++;
    const roll = rnd(G);
    if (roll < pBlock) {
      // Whose block it is. Uniform among whoever was on the ice made blocks a
      // pure function of ice time; a shot-blocking specialist should stand out.
      /* Role nudges who blocks, but the block LEADER is set by ice time, not by
         this: neutralising the weighting entirely still left the leader at 342.
         That is the top-pair-minutes problem, not a shot-blocking one. */
      let bw = blockers.map((x) => Math.max(0.2, roleTrait(x, "blk") * (1 + ((x.r.dfn || 50) - 50) * 0.005)));
      const bTot = bw.reduce((a, c) => a + c, 0);
      let bx = rnd(G) * bTot, b = blockers[blockers.length - 1];
      for (let i = 0; i < blockers.length; i++) { bx -= bw[i]; if (bx <= 0) { b = blockers[i]; break; } }
      if (ctx.oppBox.players[b.id]) { sh.blkd++; ctx.oppBox.players[b.id].blk++; rec("b", null); }
      else { sh.miss++; rec("m", null); }
      continue;
    }
    if (roll < pBlock + pMiss) { sh.miss++; rec("m", null); continue; }

    const cell = pickCell(G, shooter, gp);
    const exposed = hole && cell.key === hole.key ? 0.032 : 0;
    const quality = (shooter.r.sht - 55) * 0.0013 + (rnd(G) - 0.5) * 0.02;
    const saveP = clamp(base + zone.save + cell.save - exposed - quality, 0.55, 0.99);
    sBox.sog++; sh.sog++;
    gBox.players[gid].sa++;
    sh.z[zone.key].s++;
    sh.net[cell.key].a++;
    gBox.players[gid].z[zone.key].sa++;
    gBox.players[gid].net[cell.key].sa++;
    if (rnd(G) > saveP) {
      rec("g", cell.key);
      sh.z[zone.key].g++;
      sh.net[cell.key].g++;
      gBox.players[gid].net[cell.key].ga++;
      if (ctx.events) ctx.events.push({ t: rnd(G) * 60, kind: "goal", team: sBox.teamId, pid: shooter.id, zone: zone.key, cell: cell.key, strength });
      sBox.g++; sBox.players[shooter.id].g++;
      gBox.players[gid].ga++; gBox.ga = (gBox.ga || 0) + 1;
      if (strength === "pp") { sBox.ppg++; sBox.players[shooter.id].ppg++; }
      if (strength === "sh") sBox.players[shooter.id].shg++;
      const helpers = assistsFrom(G, offIds, shooter.id);
      helpers.forEach((id) => { if (sBox.players[id]) sBox.players[id].a++; });
      sBox.scorers.push({ id: shooter.id, a: helpers, strength });
      if (strength === "es") {
        offIds.forEach((id) => { if (sBox.players[id]) sBox.players[id].pm++; });
        defIds.forEach((id) => { if (ctx.oppBox.players[id]) ctx.oppBox.players[id].pm--; });
      }
    } else {
      rec("s", cell.key);
      gBox.players[gid].sv++;
      gBox.players[gid].z[zone.key].sv++;
      // Only the dangerous ones are worth narrating.
      if (ctx.events && zone.key === "rush" && rnd(G) < 0.28)
        ctx.events.push({ t: rnd(G) * 60, kind: "save", team: gBox.teamId, pid: gid, shooter: shooter.id, zone: zone.key });
    }
  }
}

/* Who starts in goal. A back-to-back, or a starter who's been run into the
   ground, is what gets the backup into a game — the depth chart alone never
   would. A backup much worse than the starter still doesn't play. */
function pickStarter(G, lines, rest) {
  const s = G.players[lines.G[0]], b = G.players[lines.G[1]];
  if (!s) return lines.G[1] != null ? lines.G[1] : lines.G[0];
  if (!b) return s.id;
  const restDays = rest == null ? 2 : rest;
  // A backup much worse than the starter still gets games — just later, when the
  // starter is genuinely run down rather than merely tired.
  const gap = s.ovr - b.ovr;
  const limit = gap > 14 ? 78 : 55;
  const worn = s.fatigue > limit || (restDays === 0 && s.fatigue > limit - 30);
  return worn ? b.id : s.id;
}

/* Three rounds and then sudden death, hands against reflexes. Shootout goals
   never count toward a skater's season total — only the team's score moves —
   so they're tracked separately as `sos`/`soa`. */
function runShootout(G, a, b, aLines, bLines, aGid, bGid) {
  const order = (lines) => lines.F.flat().map((id) => G.players[id]).filter(Boolean)
    .sort((x, y) => (y.r.hnd * 0.6 + y.r.sht * 0.4) - (x.r.hnd * 0.6 + x.r.sht * 0.4));
  const aS = order(aLines), bS = order(bLines);
  if (!aS.length || !bS.length) return rnd(G) < 0.5 ? a : b;
  const attempt = (sh, gid, box, gBox) => {
    const g = G.players[gid];
    const skill = sh.r.hnd * 0.6 + sh.r.sht * 0.4;
    const stop = g ? g.r.rfx * 0.6 + g.r.pos * 0.4 : 40;
    const scored = rnd(G) < clamp(0.33 + (skill - stop) * 0.006, 0.08, 0.72);
    if (box.players[sh.id]) { box.players[sh.id].soa++; if (scored) box.players[sh.id].sos++; }
    if (gBox.players[gid]) { gBox.players[gid].sosa++; if (!scored) gBox.players[gid].sosv++; }
    return scored;
  };
  let ag = 0, bg = 0;
  for (let r = 0; r < 3; r++) {
    if (attempt(aS[r % aS.length], bGid, a, b)) ag++;
    if (attempt(bS[r % bS.length], aGid, b, a)) bg++;
  }
  let r = 3, guard = 0;
  while (ag === bg && guard++ < 15) {
    const x = attempt(aS[r % aS.length], bGid, a, b);
    const y = attempt(bS[r % bS.length], aGid, b, a);
    if (x && !y) ag++; else if (y && !x) bg++;
    r++;
  }
  return ag === bg ? (rnd(G) < 0.5 ? a : b) : (ag > bg ? a : b);
}

function simGame(G, homeId, awayId, opts) {
  opts = opts || {};
  const R = rules(G);
  const hl = ensureLines(G, homeId), al = ensureLines(G, awayId);
  const home = emptyBox(G, homeId), away = emptyBox(G, awayId);
  const hG = pickStarter(G, hl, opts.homeRest), aG = pickStarter(G, al, opts.awayRest);
  home.goalie = hG; away.goalie = aG;
  // Events are only recorded when somebody is going to watch. The engine works
  // in aggregate per matchup, so each event gets a clock time and the whole log
  // is sorted at the end — the ordering is invented, the events are not.
  const ev = opts.events ? [] : null;
  // A per-shot record, kept only for the user's club so the log stays bounded.
  const shotLog = opts.log ? [] : null;

  const sides = [
    { box: home, opp: away, lines: hl, gid: hG, oppGid: aG, oppLines: al, isHome: true },
    { box: away, opp: home, lines: al, gid: aG, oppGid: hG, oppLines: hl, isHome: false },
  ];

  // ---- rivalry ----
  // A rivalry night is played harder by both sides: more push, more gloves off,
  // and a result the room feels for longer.
  const rivalNight = isRivalry(G, homeId, awayId);
  const rivalHeat = rivalNight ? 1.045 : 1;

  // ---- fighting ----
  // A fight is five minutes each and a small, real swing in who carries the play
  // afterwards. It never touches the scoreboard directly.
  const momentum = { [homeId]: 1, [awayId]: 1 };
  if (R.fighting && rnd(G) < (rivalNight ? 0.38 : 0.22)) {
    const enforcer = (tid) => {
      const pool = activeRoster(G, tid).filter((p) => p.pos !== "G")
        .sort((x, y) => y.r.phy * roleTrait(y, "fight") - x.r.phy * roleTrait(x, "fight")).slice(0, 5);
      if (!pool.length) return null;
      // Weighted even inside the shortlist — the enforcer answers most nights.
      const fw = pool.map((x) => Math.max(0.1, roleTrait(x, "fight")));
      const fTot = fw.reduce((a, c) => a + c, 0);
      let fx = rnd(G) * fTot;
      for (let i = 0; i < pool.length; i++) { fx -= fw[i]; if (fx <= 0) return pool[i]; }
      return pool[pool.length - 1];
    };
    const hf = enforcer(homeId), af = enforcer(awayId);
    if (hf && af && home.players[hf.id] && away.players[af.id]) {
      home.players[hf.id].pim += 5; away.players[af.id].pim += 5;
      home.players[hf.id].fights++; away.players[af.id].fights++;
      home.pim += 5; away.pim += 5;
      const hWon = rnd(G) < clamp(0.5 + (hf.r.phy - af.r.phy) * 0.01, 0.15, 0.85);
      momentum[hWon ? homeId : awayId] = 1.07;
      home.fight = { home: hf.id, away: af.id, winner: hWon ? hf.id : af.id };
      if (ev) ev.push({ t: rnd(G) * 60, kind: "fight", team: hWon ? homeId : awayId, pid: hWon ? hf.id : af.id, other: hWon ? af.id : hf.id });
    }
  }

  // ---- rest ----
  // The second night of a back-to-back costs a few percent of everything.
  const legs = { [homeId]: 1 - Math.max(0, 2 - (opts.homeRest == null ? 2 : opts.homeRest)) * 0.025,
                 [awayId]: 1 - Math.max(0, 2 - (opts.awayRest == null ? 2 : opts.awayRest)) * 0.025 };

  // ---- even strength, line matchup by line matchup ----
  // Chemistry is read and advanced once per team per game, before either side's
  // shots are resolved — a defending pair's continuity has to be known before the
  // attacking side that faces it gets its shot rate.
  const teamChemF = {}, teamChemD = {};
  sides.forEach((side) => {
    teamChemF[side.box.teamId] = lineChemistry(G.teams[side.box.teamId], side.lines);
    teamChemD[side.box.teamId] = pairChemistry(G.teams[side.box.teamId], side.lines);
  });
  sides.forEach((side) => {
    const chem = teamChemF[side.box.teamId];
    const oppChemD = teamChemD[side.opp.teamId];
    const myT = G.teams[side.box.teamId];
    const oppT = G.teams[side.opp.teamId];
    const fIce = iceTimeF(myT), myIce = iceTimeD(myT), oppIce = iceTimeD(oppT);
    side.lines.F.forEach((fLine, li) => {
      const mins = ES_MINUTES * fIce[li];
      // Which of THEIR lines this one sees. The default is line-for-line, but
      // last change bends it: at home a coach hides his top line from their
      // checkers and throws his checking line at their best.
      const oppMix = matchupMix(G, side, li, oppT);
      // Last change: at home, the top line sees soft pairs more often.
      side.oppLines.D.forEach((pair, pi) => {
        /* Their pairs play the split THEIR coach chose. Last change bends which
           pair our top line sees, but the shares still have to sum to one —
           scaling them raw handed the home side extra minutes, and hard-coding
           the bent values ignored the opposing coach entirely. */
        let share = oppIce[pi];
        if (side.isHome && li === 0) {
          const bent = oppIce.map((v, k) => v * HOME_TOP_LINE_BEND[k]);
          const bt = bent.reduce((a, b) => a + b, 0);
          share = bt > 0 ? bent[pi] / bt : share;
        }
        const m = mins * share;
        // Draw the opposing forward line from the matchup distribution.
        let ox = rnd(G), oi = oppMix.length - 1;
        for (let k = 0; k < oppMix.length; k++) { ox -= oppMix[k]; if (ox <= 0) { oi = k; break; } }
        const oppF = side.oppLines.F[oi] || side.oppLines.F[0];
        // The unit on the ice is five skaters, not three. Which of our own pairs
        // is out there is drawn by ice-time share — that's what puts defencemen
        // on the scoresheet at all, and it evens out across a season.
        let x = rnd(G), di = 0;
        for (let k = 0; k < myIce.length; k++) { x -= myIce[k]; if (x <= 0) { di = k; break; } }
        const myPair = side.lines.D[di] || side.lines.D[0];
        const unit = fLine.concat(myPair);
        const off = lineOff(G, fLine) * (1 + chem[li] * LINE_CHEM_PER_GAME);
        const def = unitDef(G, oppF, pair) * (1 + oppChemD[pi] * PAIR_CHEM_PER_GAME);
        // ~30 shots per 60 at even strength for an average team.
        const sys = systemOf(myT), oppSys = systemOf(oppT);
        // Our system pushes our own volume; theirs decides how much they allow.
        const rate = (30.5 / 60) * (off / def) * momentum[side.box.teamId] * legs[side.box.teamId]
          * sys.off * oppSys.def * rivalHeat;
        const shots = Math.max(0, Math.round(gauss(G, rate * m, Math.sqrt(Math.max(0.4, rate * m)) * 0.9)));
        resolveShots(G,
          { off, ppOff: off, sBox: side.box, gBox: side.opp, oppBox: side.opp, events: ev, shots: shotLog },
          shots, unit, pair.concat(oppF), side.oppGid, "es");
        // Everyone on the ice is on the ice for the whole shift — the minutes
        // are not split between linemates.
        fLine.forEach((id) => { if (side.box.players[id]) side.box.players[id].toi += m; });
        pair.forEach((id) => { if (side.opp.players[id]) side.opp.players[id].toi += m; });
      });
    });
  });

  // ---- penalties and special teams ----
  sides.forEach((side) => {
    const drawn = Math.max(0, Math.round(gauss(G, 3.1, 1.2)));
    side.opp.pim += drawn * 2;
    side.box.pp += drawn;
    const skaters = activeRoster(G, side.opp.teamId).filter((p) => p.pos !== "G");
    /* Who takes the penalty. This used to be a uniform draw, which is why the
       league's penalty-minute leader finished on 84 — everyone took the same
       number. Weighting it by role gives a club its repeat offenders. */
    const boxWt = skaters.map((p) => Math.max(0.15, roleTrait(p, "pim")));
    const boxTot = boxWt.reduce((a, b) => a + b, 0);
    const drawOffender = () => {
      let x = rnd(G) * boxTot;
      for (let i = 0; i < skaters.length; i++) { x -= boxWt[i]; if (x <= 0) return skaters[i]; }
      return skaters[skaters.length - 1];
    };
    for (let i = 0; i < drawn && skaters.length; i++) {
      const off = drawOffender();
      if (side.opp.players[off.id]) side.opp.players[off.id].pim += 2;
      if (ev) ev.push({ t: rnd(G) * 60, kind: "penalty", team: side.opp.teamId, pid: off.id });
    }
    /* BOTH units, not just the first. Running the whole power play through PP1
       and the whole kill through PK1 handed anyone on both an extra eleven
       minutes a night — which is where a 33-minute top pair came from, and why
       the league's shot-blocking leader sat 50% clear of the field. The second
       units have always existed in `lines.PP`/`lines.PK`; nothing ever used
       them. Real clubs split roughly 65/35 on the power play and 58/42 on the
       kill. */
    const ppUnits = [side.lines.PP[0], side.lines.PP[1]]
      .filter((u) => u && u.length);
    const pkUnits = [side.oppLines.PK[0], side.oppLines.PK[1]]
      .filter((u) => u && u.length);
    const ppSets = ppUnits.length ? ppUnits : [side.lines.F[0]];
    const pkSets = pkUnits.length ? pkUnits : [side.oppLines.D[0]];
    const ppShare = ppSets.length > 1 ? PP_UNIT_SPLIT : [1];
    const pkShare = pkSets.length > 1 ? PK_UNIT_SPLIT : [1];
    const ppC = coachOf(G.teams[side.box.teamId]), pkC = coachOf(G.teams[side.opp.teamId]);
    const totalPP = drawn * PP_MIN_PER;
    let firstPk = pkSets[0];
    ppSets.forEach((unit, ui) => {
      const m = totalPP * ppShare[ui];
      if (m <= 0) return;
      // The kill rotates on its own schedule, so pair unit i against kill unit i.
      const pkUnit = pkSets[Math.min(ui, pkSets.length - 1)];
      const rate = (52 / 60) * (lineOff(G, unit) / unitDef(G, pkUnit, side.oppLines.D[0]))
        * (1 + (ppC.pp - 55) * 0.0035) * (1 - (pkC.pk - 55) * 0.0030);
      const shots = Math.max(0, Math.round(gauss(G, rate * m, Math.sqrt(Math.max(0.4, rate * m)))));
      resolveShots(G, { off: 1, ppOff: 1, sBox: side.box, gBox: side.opp, oppBox: side.opp, events: ev, shots: shotLog },
        shots, unit, pkUnit, side.oppGid, "pp");
      unit.forEach((id) => { if (side.box.players[id]) side.box.players[id].toi += m; });
    });
    // The kill's minutes follow its OWN split, not the power play's.
    pkSets.forEach((pkUnit, ki) => {
      const m = totalPP * (pkShare[ki] != null ? pkShare[ki] : 0);
      pkUnit.forEach((id) => { if (side.opp.players[id]) side.opp.players[id].toi += m; });
    });
    // Shorthanded chances are rare but real.
    if (rnd(G) < 0.16 * drawn) {
      resolveShots(G, { off: 1, ppOff: 1, sBox: side.opp, gBox: side.box, oppBox: side.box, events: ev, shots: shotLog },
        1, firstPk, ppSets[0], side.gid, "sh");
    }
  });

  // ---- faceoffs, hits, blocks ----
  sides.forEach((side) => {
    const cs = side.lines.F.map((l) => G.players[l[1]]).filter(Boolean);
    const oppCs = side.oppLines.F.map((l) => G.players[l[1]]).filter(Boolean);
    const my = cs.reduce((s, p) => s + p.r.fo, 0) / Math.max(1, cs.length);
    const th = oppCs.reduce((s, p) => s + p.r.fo, 0) / Math.max(1, oppCs.length);
    const total = 30;
    const winP = clamp(0.5 + (my - th) * 0.006, 0.3, 0.7);
    let won = 0;
    for (let i = 0; i < total; i++) if (rnd(G) < winP) won++;
    side.box.fow += won; side.box.fol += total - won;
    cs.forEach((p, i) => {
      const share = Math.round(total * LINE_TOI[i]);
      const w = Math.round(share * winP);
      side.box.players[p.id].fow += w; side.box.players[p.id].fol += share - w;
    });
    // Hits are their own thing. Blocks are NOT generated here — they come out of
    // real shot attempts in resolveShots, so a shot-blocking defenceman's total
    // reflects shots that were actually taken at him.
    activeRoster(G, side.box.teamId).filter((p) => p.pos !== "G").forEach((p) => {
      // Tuned to the NHL's ~21 hits a team a night. The clamp at zero pulls the
      // mean up, so the divisor is larger than the target rate implies.
      // The divisor absorbs the role multipliers, whose league-wide weighted mean
      // is about 1.19 — scaling hits by role without it inflated the league rate.
      const h = Math.round(Math.max(0, gauss(G, (p.r.phy / 62) * roleTrait(p, "hit"), 1)));
      side.box.players[p.id].hit += h;
      side.box.hits += h;
    });
  });

  // ---- the last two minutes ----
  // Down one, the trailing side pulls its goalie. Six on five is a genuine
  // chance to tie and a bigger chance to concede into the empty net — and an
  // empty-net goal has no goalie behind it, so no save opportunity is charged.
  if (Math.abs(home.g - away.g) === 1) {
    const trailing = home.g < away.g ? home : away;
    const leading = trailing === home ? away : home;
    const tLines = trailing === home ? hl : al;
    const lLines = leading === home ? hl : al;
    const roll = rnd(G);
    if (roll < 0.17) {
      const unit = tLines.PP[0].length ? tLines.PP[0] : tLines.F[0];
      resolveShots(G, { sBox: trailing, gBox: leading, oppBox: leading, events: ev, shots: shotLog },
        1, unit, [], leading.goalie, "en6");
    } else if (roll < 0.45) {
      const sc = shooterFrom(G, lLines.F[0], 0.3);
      if (sc && leading.players[sc.id]) {
        leading.g++; leading.sog++;
        // No goalie, so no placement is recorded — an empty net has no corners.
        leading.players[sc.id].g++; leading.players[sc.id].sog++;
        leading.players[sc.id].eng++; leading.players[sc.id].att++;
        const helpers = assistsFrom(G, lLines.F[0], sc.id);
        helpers.forEach((id) => { if (leading.players[id]) leading.players[id].a++; });
        leading.scorers.push({ id: sc.id, a: helpers, strength: "en" });
        leading.eng = (leading.eng || 0) + 1;
        if (ev) ev.push({ t: 58 + rnd(G) * 2, kind: "goal", team: leading.teamId, pid: sc.id, zone: "empty", strength: "en" });
        // Its own outcome code: a real attempt, but at a net nobody was in.
        if (shotLog) shotLog.push({ p: sc.id, g: null, off: leading.teamId, def: trailing.teamId,
          t: 58 + rnd(G) * 2, z: "empty", c: null, r: "e", st: "en" });
      }
    }
  }

  // ---- overtime ----
  let ot = false, so = false;
  if (home.g === away.g) {
    if (R.otFormat === "none") { /* a tie stands */ }
    else {
      ot = true;
      const hS = lineOff(G, hl.F[0]) / unitDef(G, al.F[0], al.D[0]);
      const aS = lineOff(G, al.F[0]) / unitDef(G, hl.F[0], hl.D[0]);
      const pHome = clamp(0.5 + (hS - aS) * 0.55 + 0.02, 0.2, 0.8);
      // In the playoffs, and whenever there's no shootout to fall back on, OT
      // runs until somebody actually scores.
      const decided = opts.playoff || !R.shootout ? true : rnd(G) < 0.62;
      const homeWins = rnd(G) < pHome;
      const winner = homeWins ? home : away, loser = homeWins ? away : home;
      if (decided) {
        const lines = homeWins ? hl : al;
        let guard = 0;
        const otEv = ev ? [] : null;
        while (winner.g <= loser.g && guard++ < 60) {
          resolveShots(G, { off: 1, ppOff: 1, sBox: winner, gBox: loser, oppBox: loser, events: otEv, shots: shotLog },
            1, lines.F[0], [], homeWins ? aG : hG, "es");
        }
        // Whatever it took to end it, only the winner is on the clock in OT.
        if (ev && otEv) otEv.filter((e) => e.kind === "goal").slice(-1)
          .forEach((e) => ev.push({ ...e, t: 60 + rnd(G) * 5, ot: true }));
      }
      if (winner.g <= loser.g) {
        // The shootout is the one goal nobody is credited with, exactly as in
        // real bookkeeping: the team's score goes up, no skater's total does.
        so = true;
        const soWinner = R.shootout ? runShootout(G, home, away, hl, al, hG, aG) : winner;
        soWinner.g++;
      }
    }
  }

  // Goalie minutes and the decision.
  if (home.players[hG]) home.players[hG].toi += 60;
  if (away.players[aG]) away.players[aG].toi += 60;
  if (ev && so) ev.push({ t: 65, kind: "shootout", team: home.g > away.g ? homeId : awayId });
  const res = {
    home: homeId, away: awayId, hg: home.g, ag: away.g, ot, so,
    boxes: { [homeId]: home, [awayId]: away },
    events: ev ? ev.sort((a, b) => a.t - b.t) : null,
    shots: shotLog,
  };

}

/* --------------------------- writing a result down ------------------------- */

function applyGame(G, res, opts) {
  opts = opts || {};
  const R = rules(G);
  const H = G.teams[res.home], A = G.teams[res.away];
  const homeWon = res.hg > res.ag;
  const tie = res.hg === res.ag;

  /* The game-winning goal: the one that put the winner ahead for good — his
     (loser's total + 1)-th goal, which is exactly how the NHL scores it. The
     field has existed since the first build, is listed in the record book, and
     was never once incremented, so every club's GWG leader read zero forever.
     A shootout winner is deliberately credited to nobody, so nobody gets it. */
  if (!tie && !res.so) {
    const winId = homeWon ? res.home : res.away;
    const lost = homeWon ? res.ag : res.hg;
    const gw = (res.boxes[winId].scorers || [])[lost];
    if (gw && res.boxes[winId].players[gw.id]) res.boxes[winId].players[gw.id].gwg = 1;
  }

  [res.home, res.away].forEach((tid) => {
    const t = G.teams[tid];
    const box = res.boxes[tid];
    const gf = tid === res.home ? res.hg : res.ag;
    const ga = tid === res.home ? res.ag : res.hg;
    if (!opts.playoff) {
      t.gp++; t.gf += gf; t.ga += ga;
      const won = gf > ga;
      if (tie) { t.otl++; t.pts += 1; }
      else if (won) { t.w++; t.pts += 2; t.streak = t.streak >= 0 ? t.streak + 1 : 1; }
      else if ((res.ot || res.so) && R.otLoserPoint) { t.otl++; t.pts += 1; t.streak = t.streak <= 0 ? t.streak - 1 : -1; }
      else { t.l++; t.streak = t.streak <= 0 ? t.streak - 1 : -1; }
      t.l10.push(won ? "W" : (res.ot || res.so) ? "O" : "L");
      if (t.l10.length > 10) t.l10.shift();
    }

    Object.entries(box.players).forEach(([pid, s]) => {
      const p = G.players[pid];
      if (!p) return;
      // The box carries the whole organisation so lookups can't miss; only the
      // players who took a shift are credited with a game.
      if (s.toi <= 0) return;
      // Season totals, and — in the regular season — the same line again
      // against the club he was playing for at the time. That's what lets a
      // traded player's year read "40 with Hartford, 22 with Albany" instead of
      // silently crediting the whole thing to wherever he ended up.
      const dest = opts.playoff ? (p.po = p.po || blankStats(p.pos)) : p.season;
      const targets = opts.playoff ? [dest] : [dest, stintFor(p, tid)];
      targets.forEach((d) => {
        d.gp++; d.toi += s.toi;
        if (p.pos === "G") {
          d.sa += s.sa; d.sv += s.sv; d.ga += s.ga; d.starts++;
          d.sosa += s.sosa || 0; d.sosv += s.sosv || 0;
          if (s.ga === 0 && s.sa > 0) d.so++;
          const won = gf > ga;
          if (res.so) { if (won) d.sow++; else d.sol++; }
          if (won) d.w++;
          else if ((res.ot || res.so) && R.otLoserPoint) d.otl++;
          else d.l++;
        } else {
          d.g += s.g; d.a += s.a; d.sog += s.sog; d.pim += s.pim;
          d.hit += s.hit; d.blk += s.blk; d.pm += s.pm;
          d.fow += s.fow; d.fol += s.fol; d.ppg += s.ppg; d.shg += s.shg; d.gwg += s.gwg || 0;
          d.eng += s.eng || 0; d.fights += s.fights || 0;
          d.sos += s.sos || 0; d.soa += s.soa || 0;
          d.att += s.att || 0; d.miss += s.miss || 0; d.blkd += s.blkd || 0;
        }
      });
      addZones(dest, s.z);
      addNet(dest, s.net);
      // A goalie's night costs far more than a skater's shift — that's what
      // eventually forces the backup into the net. For skaters it's minutes
      // above a normal night that wear them down; a fourth-liner recovers.
      p.fatigue = clamp(p.fatigue + (p.pos === "G" ? 14 : (s.toi - 12) / 60 * 10), 0, 100);
      // Rust burns off by PLAYING, not by the calendar turning over — a man
      // sitting in the press box gets no closer to being himself.
      if (p.rust > 0 && !opts.playoff) { p.rust--; if (p.rust === 0) p.rustFrom = 0; }
      else if (p.rust > 0) p.rust--;
    });
  });

  rollInjuries(G, res);
  recordLogs(G, res, opts);
  G.results.push({
    day: G.day, home: res.home, away: res.away, hg: res.hg, ag: res.ag,
    ot: res.ot, so: res.so, playoff: !!opts.playoff,
    scorers: [].concat(res.boxes[res.home].scorers.map((s) => ({ ...s, t: res.home })),
                       res.boxes[res.away].scorers.map((s) => ({ ...s, t: res.away }))),
  });
  if (G.results.length > 1400) G.results.splice(0, 400);
  return res;
}

/* --------------------------------- the logs -------------------------------
 * A record of every shot and every game — but only for the user's club, which
 * is the only one anybody inspects. Doing it league-wide would add roughly a
 * megabyte and a half to a save for data nobody opens.
 * ------------------------------------------------------------------------- */

const SHOT_LOG_MAX = 1400;

function recordLogs(G, res, opts) {
  G.shotLog = G.shotLog || {};

  const day = G.day, po = !!(opts && opts.playoff);

  (res.shots || []).forEach((s) => {
    const shooter = G.players[s.p], keeper = G.players[s.g];
    const push = (pid, role, opp) => {
      const arr = (G.shotLog[pid] = G.shotLog[pid] || []);
      arr.push({ d: day, o: opp, t: Math.round(s.t * 10) / 10, z: s.z, c: s.c, r: s.r, st: s.st, role, po });
      if (arr.length > SHOT_LOG_MAX) arr.splice(0, arr.length - SHOT_LOG_MAX);
    };
    if (shooter && shooter.teamId === G.userTeam) push(s.p, "s", s.def);
    // A goalie only ever faced the ones that got to him.
    if (s.c && keeper && keeper.teamId === G.userTeam) push(s.g, "g", s.off);
  });

  [res.home, res.away].forEach((tid) => {
    if (tid !== G.userTeam) return;
    const box = res.boxes[tid];
    const opp = tid === res.home ? res.away : res.home;
    const gf = tid === res.home ? res.hg : res.ag;
    const ga = tid === res.home ? res.ag : res.hg;
    Object.entries(box.players).forEach(([pid, s]) => {
      if (s.toi <= 0) return;
      const p = G.players[pid];
      if (!p) return;
      const arr = (G.gameLog[pid] = G.gameLog[pid] || []);
      arr.push(p.pos === "G"
        ? { d: day, o: opp, gf, ga, sa: s.sa, sv: s.sv, toi: Math.round(s.toi), po }
        : { d: day, o: opp, gf, ga, g: s.g, a: s.a, sog: s.sog, pm: s.pm, toi: Math.round(s.toi * 10) / 10, po });
      if (arr.length > GAME_LOG_MAX) arr.splice(0, arr.length - GAME_LOG_MAX);
    });
  });

}

/* Injuries carry a KIND as well as a length, because they don't all cost the
   same thing on the way back: a knee takes a skater's legs, a shoulder takes
   his shot, a concussion takes everything for a while. The fourth field names
   the rating the rehab bites hardest. */
const INJURIES = [
  ["upper body", 3, 12, "hnd"], ["lower body", 4, 16, "spd"], ["groin", 6, 22, "spd"],
  ["concussion", 10, 40, null], ["shoulder", 12, 45, "sht"], ["knee", 20, 70, "spd"],
  ["broken hand", 14, 35, "hnd"], ["ankle", 8, 26, "spd"],

/* Coming back is not a switch. A player who has missed two months is in the
   lineup before he is himself again, and the fortnight where he looks a step
   off is part of the cost of the injury — it used to vanish the instant the
   counter hit zero.

   clock injuries do. Effectiveness climbs back linearly across it. */
const REHAB_MIN_GAMES = 8;      // shorter than this and he just plays
const REHAB_RATIO = 0.42;       // rehab length as a share of time missed

   rating a rusty player has, so it moves league-wide rates too — at 0.16 the
   league's save percentage fell almost a full point because returning goalies
   dragged the average down. */

/* How much of himself he is right now, 0.84–1. Everything that reads a rating

   rather than only on the scoresheet. (Not `formOf` — that name is already the

}

  [res.home, res.away].forEach((tid) => {
    rosterOf(G, tid).forEach((p) => {
      if (p.inj > 0) return;
      const risk = 0.0022 * mult * (1 + (70 - p.r.dur) / 90) * (1 + p.fatigue / 240);
      if (rnd(G) < risk) {
        const [desc, lo, hi, hurts] = pick(G, INJURIES);
        p.inj = ri(G, lo, hi);
        p.injDesc = desc;
        p.rustKey = hurts;
        p.injGames = p.inj;
        p.rust = 0; p.rustFrom = 0;

function news(G, text, kind) {
  G.news.unshift({ day: G.day, year: G.year, text, kind: kind || "info" });
  if (G.news.length > 120) G.news.pop();
}

/* --------------------------------- one day -------------------------------- */

function simDay(G) {
  if (G.phase !== "regular") return G;
  const day = G.schedule[G.day];
  if (!day) { endRegularSeason(G); return G; }
  if (!G.lastPlayed) G.lastPlayed = new Array(G.teams.length).fill(-9);
  const playedToday = new Set();
  day.forEach((fx) => {
    if (fx.played) return;
    const mine = fx.home === G.userTeam || fx.away === G.userTeam;
    const res = simGame(G, fx.home, fx.away, {
      homeRest: restFor(G, fx.home), awayRest: restFor(G, fx.away), events: mine, log: mine,
    });
    applyGame(G, res);
    fx.played = true; fx.hg = res.hg; fx.ag = res.ag; fx.ot = res.ot; fx.so = res.so;
    playedToday.add(fx.home); playedToday.add(fx.away);
    // Only the latest of the user's games is kept — a full season of play-by-play
    // would dwarf everything else in the save.
    if (mine) G.lastGame = { day: G.day, home: fx.home, away: fx.away, hg: res.hg, ag: res.ag,
      ot: res.ot, so: res.so, events: res.events || [], boxes: res.boxes };
  });
  playedToday.forEach((tid) => { G.lastPlayed[tid] = G.day; });
  processWaivers(G);
  // The affiliates play the mirrored fixtures, so every farm game has a real opponent.
  simFarmDay(G, G.day);
  checkMilestones(G);
  // Clubs ring about listed players every few days rather than instantly.
  if ((G.block || []).length && G.day % 5 === 0) generateOffers(G);
  if (G.day === deadlineDay(G)) { aiDeadlineMoves(G); news(G, "The trade deadline has passed.", "info"); }
  if (G.day === G.allStarDay && !G.allStar) runAllStar(G);

  // Recovery. Injuries are quoted in GAMES, so they only tick down for clubs
  // that actually played — an injury doesn't heal on an off day. Fatigue does.
  playersOf(G).forEach((p) => {
    if (p.inj > 0 && p.teamId != null && playedToday.has(p.teamId)) {
      p.inj--;
      if (p.inj === 0) {
        // He's available again, but a long absence leaves a ramp behind it.
        const back = rehabFor(p.injGames || 0);
        if (back > 0) {
          p.rust = back; p.rustFrom = back;
          if (p.teamId === G.userTeam) {
            news(G, `${fullName(p)} is back, and will need a few weeks to look himself again.`, "info");
          }
        }
        p.injDesc = ""; p.injGames = 0;
        G.teams[p.teamId].lines = null;
      }
    }
    p.fatigue = clamp(p.fatigue - (p.pos === "G" ? 4.2 : 0.8), 0, 100);
  });
  G.day++;
  if (G.day >= G.schedule.length) endRegularSeason(G);
  return G;
}
function simDays(G, n) { for (let i = 0; i < n && G.phase === "regular"; i++) simDay(G); return G; }

/* ------------------------------- standings -------------------------------- */

function standings(G, filterFn) {
  return G.teams
    .filter(filterFn || (() => true))
    .slice()
    .sort((a, b) => b.pts - a.pts || (b.w - a.w) || (b.gf - b.ga) - (a.gf - a.ga) || b.gf - a.gf);
}
function divStandings(G, div) { return standings(G, (t) => t.div === div); }
function confStandings(G, conf) { return standings(G, (t) => t.conf === conf); }

/* Playoff field. Divisional format is the interesting one: three from each
   division plus two conference wildcards. */
function playoffField(G, conf) {
  if (ruleValue(G, "playoffFormat") === "seeded") {
    return confStandings(G, conf).slice(0, 8).map((t, i) => ({ team: t, seed: i + 1 }));
  }
  const divs = DIVS.map((_, i) => i).filter((d) => DIV_CONF[d] === conf);
  const top = [], rest = [];
  divs.forEach((d) => {
    const s = divStandings(G, d);
    s.slice(0, 3).forEach((t, i) => top.push({ team: t, div: d, divRank: i + 1 }));
    s.slice(3).forEach((t) => rest.push(t));
  });
  const wc = rest.sort((a, b) => b.pts - a.pts || b.w - a.w).slice(0, 2);
  return { top, wc, divs, out: rest.slice(2) };
}

/* ---------------------------- the playoff line -----------------------------
 * The standings knew who was in the field — `playoffField` has always decided
 * the bracket — but the table never said so, which made the one number anybody
 * actually reads during a season invisible: where the cutoff is.
 *
 * This turns the field into a per-club verdict the table can render. `label` is
 * the berth as a fan would say it (A1, WC2, or a plain seed), `bubble` is the
 * last club currently holding a place and `firstOut` the one that would take it
 * — those two are the whole story of a playoff race, so they get their own
 * marks rather than being left as "in" and "out" like everyone else.
 * ------------------------------------------------------------------------- */
const DIV_TAG = ["A", "M", "C", "P"];
function playoffBerths(G) {
  const map = {};
  [0, 1].forEach((conf) => {
    if (ruleValue(G, "playoffFormat") === "seeded") {
      const s = confStandings(G, conf);
      s.slice(0, 8).forEach((t, i) => {
        map[t.id] = { in: true, label: `${i + 1}`, seed: i + 1, bubble: i === 7 };
      });
      if (s[8]) map[s[8].id] = { in: false, label: "9th", firstOut: true };
      return;
    }
    const { top, wc, out } = playoffField(G, conf);
    top.forEach((x) => {
      map[x.team.id] = {
        in: true, label: `${DIV_TAG[x.div] || "?"}${x.divRank}`,
        seed: x.divRank, divRank: x.divRank, bubble: x.divRank === 3,
      };
    });
    wc.forEach((t, i) => {
      map[t.id] = { in: true, label: `WC${i + 1}`, seed: 4 + i, wildcard: true, bubble: i === wc.length - 1 };
    });
    // Everyone still chasing a wildcard, nearest first.
    (out || []).forEach((t, i) => {
      map[t.id] = { in: false, label: i === 0 ? "1st out" : `${i + 1} out`, firstOut: i === 0 };
    });
  });
  return map;
}

/* ------------------------------ clinching ---------------------------------
 * Who is mathematically safe, and who is mathematically done.
 *
 * Rather than reason about the divisional format's cases — three per division
 * plus two wildcards, where a club can miss on points and still get in on
 * division rank — this asks `playoffField` itself, on a hypothetical table:
 *
 *   CLINCHED: give every rival every point still available to it, freeze this
 *   club where it is, and break every tie against it. If it is STILL in the
 *   field in that table, nothing that can still happen can put it out.
 *
 *   ELIMINATED: the mirror image. Give this club every remaining point and win
 *   it every tie, leave everyone else where they are. If it still misses, it
 *   cannot get in.
 *
 * Both are conservative — rivals play each other, so they cannot all win out —
 * which is the right direction for a guarantee. And because the verdict comes
 * from the same function that builds the bracket, the two can never disagree
 * about what a berth is.
 * ------------------------------------------------------------------------- */
function shadowTable(G, ptsOf) {
  return { ...G, teams: G.teams.map((t) => ({ ...t, pts: ptsOf(t) })) };
}
function inFieldOf(shadow, teamId) {
  const conf = shadow.teams[teamId].conf;
  if (ruleValue(shadow, "playoffFormat") === "seeded")
    return playoffField(shadow, conf).some((x) => x.team.id === teamId);
  const { top, wc } = playoffField(shadow, conf);
  return top.some((x) => x.team.id === teamId) || wc.some((t) => t.id === teamId);

function clinchState(G) {
  const out = {};
  const len = ruleValue(G, "seasonLen");
  const left = (t) => Math.max(0, len - (t.gp || 0));
  // Nothing to clinch before a game is played, and nothing left to say once
  // every game has been.
  if (!G.teams.some((t) => t.gp > 0) || !G.teams.some((t) => left(t) > 0)) return out;

  G.teams.forEach((t) => {
    // Worst case for this club: everyone else wins out and takes every tie.
    const worst = shadowTable(G, (u) => (u.id === t.id ? u.pts : u.pts + left(u) * 2 + 0.5));
    // Best case: this club wins out and takes every tie.
    const best = shadowTable(G, (u) => (u.id === t.id ? u.pts + left(u) * 2 + 0.5 : u.pts));
    const safe = inFieldOf(worst, t.id);
    const alive = inFieldOf(best, t.id);

    let mark = null;
    if (safe) {
      mark = "x";   // a berth, by whatever route
      if (ruleValue(G, "playoffFormat") !== "seeded") {
        // Sharper statements, where they're true: the division, or a top-three
        // place in it (which is a berth that owes nothing to the wildcard race).
        const rivals = G.teams.filter((u) => u.div === t.div && u.id !== t.id);
        const canPass = rivals.filter((u) => u.pts + left(u) * 2 >= t.pts).length;
        if (canPass === 0) mark = "z";
        else if (canPass <= 2) mark = "y";
      }
    }
    out[t.id] = { mark, eliminated: !alive };
  });
