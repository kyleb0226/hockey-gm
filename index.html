/* -------------------------------- offseason ------------------------------- */

/* ------------------------------- draft board -------------------------------
 * You never see a prospect's true rating — only your read of him, with a band
 * that narrows when you spend scouting on him. All thirty-two clubs work off
 * their own noisy reads, so the board is something to have an opinion about
 * rather than a ranked list everybody already agrees on.
 * ------------------------------------------------------------------------- */

/* ------------------------------ the draft order ----------------------------
 * The draft used to be a board of available prospects and a reverse-order log
 * of what had already gone. What it never showed was the ORDER — who is on the
 * clock, who is coming up, and which of those picks belong to somebody other
 * than the club that earned them. That's the thing you actually read a draft
 * off: not "who's left" but "how many good ones survive until my turn".
 * ------------------------------------------------------------------------- */
function draftOrderRows(G) {
  if (!G.draftOrder || !G.draftOrder.length) return [];
  const total = draftPicksTotal(G);
  const made = {};
  (G.draftLog || []).forEach((d) => { made[d.pick - 1] = d; });
  const rows = [];
  for (let i = 0; i < total; i++) {
    const orig = G.draftOrder[i % G.teams.length];
    rows.push({
      i, pick: i + 1, round: Math.floor(i / G.teams.length) + 1,
      orig, owner: pickOwner(G, i), made: made[i] || null,
    });
  }
  return rows;
}

/* A deal for one thing: an upcoming pick, or a player somebody just took.
 *
 * It is the ordinary trade machinery pointed at a single target — `evalTrade`
 * decides, `doTrade` executes — rather than a second, looser set of rules that
 * happens to live on the draft screen. What it changes is the WORK: you don't
 * have to leave the draft, find the club in a dropdown and hunt for the asset
 * while the clock runs. Only picks and prospects can go the other way, which is
 * the honest scope of a draft-day deal and keeps you from accidentally
 * dismantling your NHL roster with two clicks. */
function DraftDealModal({ G, setG, notify, target, onClose }) {
  const [mine, setMine] = useState([]);
  const [myPicks, setMyPicks] = useState([]);
  const other = target.owner;
  const pkId = (pk) => `${pk.year}-${pk.round}-${pk.orig}`;
  const offerPicks = tradablePicks(G, G.userTeam).filter((pk) => !(target.kind === "pick"
    && pk.year === target.pk.year && pk.round === target.pk.round && pk.orig === target.pk.orig));
  // Your NHL roster is deliberately not on the table here.
  const offerPlayers = rosterOf(G, G.userTeam, true).filter((p) => p.farm)
    .sort((a, b) => (b.pot + b.ovr) - (a.pot + a.ovr));

  const theirPlayers = target.kind === "player" ? [target.pid] : [];
  const theirPicks = target.kind === "pick" ? [target.pk] : [];
  const selPicks = offerPicks.filter((pk) => myPicks.includes(pkId(pk)));
  const ev = evalTrade(G, G.userTeam, mine, selPicks, other, theirPlayers, theirPicks);
  const toggle = (list, set, id) => set(list.includes(id) ? list.filter((x) => x !== id) : list.concat(id));

  const send = () => {
    const g2 = migrate(JSON.parse(JSON.stringify(G)));
    const r = doTrade(g2, G.userTeam, mine, selPicks, other, theirPlayers, theirPicks);
    if (!r.ok) { notify(r.why || "they said no"); return; }
    setG(g2);
    notify(target.kind === "pick"
      ? `Acquired ${G.teams[other].abbr}'s ${target.pk.year} round ${target.pk.round} pick.`
      : `Acquired ${fullName(G.players[target.pid])}.`);
    onClose();
  };

  const title = target.kind === "pick"
    ? `Trade for pick ${target.pick} — ${G.teams[other].city} ${G.teams[other].name}`
    : `Trade for ${fullName(G.players[target.pid])}`;

  return (
    <Modal wide title={title} onClose={onClose}>
      <div className="space-y-3">
        <div className={`${card} p-3 text-sm`}>
          <span className="text-slate-400">You get: </span>
          {target.kind === "pick"
            ? <b>{target.pk.year} round {target.pk.round}{target.orig !== other
                ? ` (originally ${G.teams[target.orig].abbr})` : ""} — pick {target.pick} overall</b>
            : <b>{fullName(G.players[target.pid])} · {G.players[target.pid].pos} · taken {target.pick} overall</b>}
        </div>

        <Section title="What you're offering" className="max-h-72 overflow-y-auto">
          <div className="p-2 space-y-0.5">
            {offerPicks.length ? <div className="text-[11px] uppercase tracking-wide text-slate-500 px-2">Picks</div> : null}
            {offerPicks.map((pk) => {
              const L = pickLabel(G, pk, G.userTeam);
              return (
                <label key={pkId(pk)} className={`flex items-center gap-2 px-2 py-1 rounded text-sm cursor-pointer
                  ${myPicks.includes(pkId(pk)) ? "bg-sky-900/50" : "hover:bg-[#16223a]"}`}>
                  <input type="checkbox" checked={myPicks.includes(pkId(pk))}
                    onChange={() => toggle(myPicks, setMyPicks, pkId(pk))} />
                  <span className="flex-1 truncate">{L.text}</span>
                  {L.note ? <span className={`text-[11px] ${L.tone}`}>{L.note}</span> : null}
                  <span className="text-slate-500 tnum text-xs w-10 text-right">{pickValue(G, pk).toFixed(1)}</span>
                </label>
              );
            })}
            {offerPlayers.length ? <div className="text-[11px] uppercase tracking-wide text-slate-500 px-2 pt-2">Prospects</div> : null}
            {offerPlayers.map((p) => (
              <label key={p.id} className={`flex items-center gap-2 px-2 py-1 rounded text-sm cursor-pointer
                ${mine.includes(p.id) ? "bg-sky-900/50" : "hover:bg-[#16223a]"}`}>
                <input type="checkbox" checked={mine.includes(p.id)} onChange={() => toggle(mine, setMine, p.id)} />
                <PosBadge pos={p.pos} />
                <span className="flex-1 truncate">{shortName(p)} <span className="text-slate-500">({p.age})</span></span>
                <span className="text-slate-400 tnum text-xs">{p.ovr} → {p.pot}</span>
              </label>
            ))}
            {!offerPicks.length && !offerPlayers.length
              ? <div className="px-2 py-3 text-sm text-slate-500">You have nothing to offer but your roster.</div> : null}
          </div>
        </Section>

        <div className={`${card} p-3 flex flex-wrap items-center gap-3`}>
          <span className={`text-sm ${ev.ok ? "text-emerald-300" : "text-amber-300"}`}>
            {ev.ok ? "They'd do that." : (ev.why || "they want more back")}
          </span>
          {ev.aVal != null ? (
            <span className="text-xs text-slate-500 tnum">your side {ev.aVal} · theirs {ev.bVal}</span>
          ) : null}
          <span className="flex-1" />
          <button className={btnGhost} onClick={onClose}>Cancel</button>
          <button className={btnPri} disabled={!ev.ok} onClick={send}>Make the trade</button>
        </div>
      </div>
    </Modal>
  );
}

function DraftBoard({ G, setG, notify, openPlayer }) {
  const [posFilter, setPosFilter] = useState("ALL");
  const [onlyUnseen, setOnlyUnseen] = useState(false);
  const [onlyStars, setOnlyStars] = useState(false);
  const [deal, setDeal] = useState(null);
  const upd = (fn) => { const g2 = migrate(JSON.parse(JSON.stringify(G))); const r = fn(g2); setG(g2); return r; };

  const total = draftPicksTotal(G);
  const onClock = G.draftClass.length && G.draftPick < total ? pickOwner(G, G.draftPick) : null;
  const round = Math.floor(G.draftPick / G.teams.length) + 1;
  const mine = onClock === G.userTeam;
  const proj = useMemo(() => draftProjection(G), [G]);
  const stars = starList(G);
  const [orderRound, setOrderRound] = useState(round);
  const orderRows = useMemo(() => draftOrderRows(G), [G]);

  // What the organisation is actually short of, so the board can flag it.
  const org = rosterOf(G, G.userTeam, true);
  const need = {};
  [["C", 5], ["LW", 5], ["RW", 5], ["D", 8], ["G", 3]].forEach(([pos, want]) => {
    const have = org.filter((p) => p.pos === pos && p.age < 30).length;
    if (have < want) need[pos] = want - have;
  });

  let board = G.draftClass.map((id) => G.players[id]).filter(Boolean);
  if (posFilter !== "ALL") board = board.filter((p) => p.pos === posFilter);
  if (onlyUnseen) board = board.filter((p) => p.scout && p.scout.fog > 0.45);
  if (onlyStars) board = board.filter((p) => stars.includes(p.id));

  const myPicks = [];
  for (let i = G.draftPick; i < total && myPicks.length < 4; i++) {
    if (pickOwner(G, i) === G.userTeam) myPicks.push(i + 1);
  }

  return (
    <div className="space-y-3">
      <div className={`${card} p-3 space-y-3`}>
        <div className="flex flex-wrap items-center gap-x-4 gap-y-2">
          <div className="text-sm">
            <span className="text-slate-400">Round {round} · pick </span>
            <span className="font-semibold">{Math.min(G.draftPick + 1, total)}</span>
            <span className="text-slate-500"> of {total}</span>
          </div>
          <div className="text-sm">
            {onClock != null
              ? <span className={mine ? "text-sky-300 font-medium" : "text-slate-400"}>
                  {mine ? "You're on the clock" : `${G.teams[onClock].city} ${G.teams[onClock].name} on the clock`}
                </span>
              : <span className="text-slate-400">The draft is complete.</span>}
          </div>
          <div className="text-sm">
            <span className="text-slate-400">Scouting </span>
            <span className={G.scoutPoints > 0 ? "text-emerald-300 font-semibold" : "text-slate-500"}>
              {G.scoutPoints || 0}
            </span>
            <span className="text-slate-500"> left</span>
          </div>
          <div className="flex-1" />
          {/* One pick at a time, because the run before your turn is the part
              worth watching. Disabled on your own clock — there is nothing to
              advance until you pick. */}
          <button className={btnGhost} disabled={mine || onClock == null}
            onClick={() => upd((g) => draftOnePick(g))}>Next pick</button>
          <button className={btnGhost} onClick={() => upd((g) => autoDraft(g, true))}>Sim to my pick</button>
          <button className={btnPri} onClick={() => upd((g) => { autoDraft(g, false); g.offseasonStep = "fa"; })}>
            Auto the rest
          </button>
        </div>
        <div className="flex flex-wrap items-center gap-x-4 gap-y-1 text-xs text-slate-400">
          {myPicks.length ? <span>Your next picks: <span className="text-slate-200">{myPicks.join(", ")}</span></span> : null}
          {Object.keys(need).length
            ? <span>Thin at <span className="text-amber-300">{Object.keys(need).join(", ")}</span></span>
            : <span>No glaring holes in the organisation.</span>}
        </div>
        {stars.length ? (
          <div className="flex flex-wrap items-center gap-2 text-xs border-t border-[#1e2b45] pt-2">
            <span className="text-slate-400">Your list</span>
            <span className="text-slate-600">— auto-draft goes down it in order</span>
            {stars.map((id, i) => {
              const p = G.players[id];
              const pr = proj.byId[id];
              return (
                <span key={id} className="inline-flex items-center gap-1 px-1.5 py-0.5 rounded
                  bg-amber-500/15 border border-amber-500/40 text-amber-200">
                  <span className="text-amber-400/70 tnum">{i + 1}.</span>
                  <button className="hover:underline" onClick={() => openPlayer(id)}>{p ? shortName(p) : "?"}</button>
                  {pr ? <span className={`tnum ${pr.risk > 0.6 ? "text-rose-300" : pr.risk > 0.35 ? "text-amber-300" : "text-emerald-300"}`}
                    title="where he's expected to go">~{pr.at}</span> : null}
                  <button className="text-amber-400/60 hover:text-rose-300"
                    onClick={() => upd((g) => toggleStar(g, id))} title="remove from your list">×</button>
                </span>
              );
            })}
          </div>
        ) : null}
      </div>

      {/* The order itself: who has picked, what they took, and who is coming. */}
      <Section title="Draft order"
        right={
          <div className="flex gap-1">
            {Array.from({ length: DRAFT_ROUNDS }, (_, i) => i + 1).map((r) => (
              <button key={r} onClick={() => setOrderRound(r)}
                className={`text-[11px] px-1.5 py-0.5 rounded ${orderRound === r
                  ? "bg-sky-500/25 text-sky-200" : "text-slate-500 hover:text-slate-300"}`}>R{r}</button>
            ))}
          </div>
        }>
        <div className="max-h-80 overflow-y-auto">
          {orderRows.filter((r) => r.round === orderRound).map((r) => {
            const took = r.made ? G.players[r.made.pid] : null;
            const isNow = r.i === G.draftPick;
            const traded = r.owner !== r.orig;
            return (
              <div key={r.i} className={`flex items-center gap-2 px-3 py-1 border-b border-[#16223a] last:border-0 text-sm
                ${isNow ? "bg-sky-900/40" : r.owner === G.userTeam ? "bg-sky-950/30" : ""}`}>
                <span className="w-8 text-slate-500 tnum text-xs">{r.pick}</span>
                <span className="w-24 shrink-0 truncate text-xs">
                  <span className={r.owner === G.userTeam ? "text-sky-300 font-medium" : "text-slate-300"}>
                    {G.teams[r.owner].abbr}
                  </span>
                  {traded ? <span className="text-slate-600"> ←{G.teams[r.orig].abbr}</span> : null}
                </span>
                {took ? (
                  <>
                    <PosBadge pos={took.pos} />
                    <button className="flex-1 text-left truncate hover:text-sky-300"
                      onClick={() => openPlayer(took.id)}>{fullName(took)}</button>
                    {r.owner !== G.userTeam ? (
                      <button className="text-[11px] text-sky-400 hover:underline"
                        onClick={() => setDeal({ kind: "player", pid: took.id, owner: r.owner, pick: r.pick, orig: r.orig })}>
                        trade for
                      </button>
                    ) : <span className="text-[11px] text-slate-600">yours</span>}
                  </>
                ) : isNow ? (
                  <span className="flex-1 text-sky-300 text-xs">on the clock</span>
                ) : (
                  <>
                    <span className="flex-1 text-slate-600 text-xs">upcoming</span>
                    {r.owner !== G.userTeam && r.round <= PICK_ROUNDS ? (
                      <button className="text-[11px] text-sky-400 hover:underline"
                        onClick={() => setDeal({ kind: "pick", owner: r.owner, pick: r.pick, orig: r.orig,
                          pk: { year: G.year, round: r.round, orig: r.orig, owner: r.owner } })}>
                        trade for
                      </button>
                    ) : null}
                  </>
                )}
              </div>
            );
          })}
          {!orderRows.length ? <div className="px-3 py-4 text-sm text-slate-500">No order yet.</div> : null}
        </div>
      </Section>

      <div className="flex flex-wrap gap-2">
        {["ALL", "C", "LW", "RW", "D", "G"].map((k) => (
          <button key={k} className={posFilter === k ? btnPri : btnGhost} onClick={() => setPosFilter(k)}>{k}</button>
        ))}
        <button className={onlyUnseen ? btnPri : btnGhost} onClick={() => setOnlyUnseen(!onlyUnseen)}>
          Unscouted only
        </button>
        <button className={onlyStars ? btnPri : btnGhost} onClick={() => setOnlyStars(!onlyStars)}>
          ★ My list{stars.length ? ` (${stars.length})` : ""}
        </button>
      </div>

      <Section title={`Board — ${board.length} available`}>
        <SortTable min={1000} rows={board} initial="val" rowKey={(p) => p.id}
          onRow={(p) => openPlayer(p.id)}
          rowCls={(p) => (need[p.pos] ? "bg-amber-950/20" : "")}
          cols={[
            { key: "star", label: "★", thCls: "w-6",
              get: (p) => (stars.includes(p.id) ? 1 : 0),
              cell: (p) => (
                <button className={stars.includes(p.id) ? "text-amber-300" : "text-slate-700 hover:text-slate-400"}
                  title={stars.includes(p.id) ? "on your list" : "add to your list"}
                  onClick={(e) => { e.stopPropagation(); upd((g) => toggleStar(g, p.id)); }}>★</button>
              ) },
            { key: "name", label: "Prospect", get: (p) => p.ln,
              cell: (p) => <span className="whitespace-nowrap">{fullName(p)}</span> },
            { key: "pos", label: "Pos", get: (p) => POS.indexOf(p.pos),
              cell: (p) => <span className="flex items-center gap-1"><PosBadge pos={p.pos} />
                {need[p.pos] ? <span className="text-[10px] text-amber-400" title="you're thin here">need</span> : null}</span> },
            { key: "ovr", label: "Ovr", get: (p) => scoutedOvr(p), cls: "font-semibold",
              cell: (p) => <span>{scoutedOvr(p)}<span className="text-slate-500 text-xs">
                {scoutBand(p) ? ` ±${scoutBand(p)}` : ""}</span></span> },
            { key: "pot", label: "Ceiling", get: (p) => scoutedPot(p), cls: "text-slate-300",
              cell: (p) => <span>{scoutedPot(p)}<span className="text-slate-500 text-xs">
                {scoutBand(p) ? ` ±${Math.round(scoutBand(p) * 1.3)}` : ""}</span></span> },
            { key: "style", label: "Style", get: (p) => p.style || "", cls: "text-slate-400 text-xs" },
            { key: "junior", label: "From", get: (p) => p.junior || "", cls: "text-slate-500 text-xs" },
            { key: "seen", label: "Report", get: (p) => -(p.scout ? p.scout.fog : 0), cls: "text-xs",
              cell: (p) => <span className={p.scout && p.scout.fog <= 0.2 ? "text-emerald-400" : "text-slate-400"}>
                {scoutLabel(p)}</span> },
            /* Where the league is expected to take him, against where you pick
               next. This is the sniping column: green means he should still be
               there, red means take him now or lose him. */
            { key: "proj", label: "Goes", get: (p) => -((proj.byId[p.id] || {}).at || 999), cls: "text-xs",
              cell: (p) => {
                const pr = proj.byId[p.id];
                if (!pr) return <span className="text-slate-600">—</span>;
                const tone = proj.myNext == null ? "text-slate-400"
                  : pr.risk > 0.6 ? "text-rose-400" : pr.risk > 0.35 ? "text-amber-300" : "text-emerald-400";
                return (
                  <span className={`tnum ${tone}`}
                    title={proj.myNext == null ? "you have no picks left"
                      : pr.slack >= 0 ? `expected to last ${pr.slack} picks past your turn at ${proj.myNext}`
                      : `expected gone ${-pr.slack} picks before your turn at ${proj.myNext}`}>
                    ~{pr.at}
                  </span>
                );
              } },
            { key: "val", label: "", get: (p) => draftValue(p), cell: (p) => (
              <span className="flex gap-2 justify-end">
                <button className="text-xs text-emerald-400 hover:underline disabled:opacity-30"
                  disabled={!G.scoutPoints || (p.scout && p.scout.fog <= 0.06)}
                  onClick={(e) => { e.stopPropagation(); const r = upd((g) => scoutProspect(g, p.id));
                    if (r && !r.ok) notify(r.why); }}>scout</button>
                {mine ? (
                  /* Make the pick and STOP. It used to run straight on to your
                     next turn, which threw away the whole point of sitting in
                     the room: you couldn't watch the run, you couldn't trade up
                     into it, and by the time you saw the board again the man
                     you were weighing had gone. Advancing is now its own
                     button. */
                  <button className="text-xs text-sky-400 hover:underline"
                    onClick={(e) => {
                      e.stopPropagation();
                      upd((g) => {
                        draftPlayer(g, p.id);
                        // Making the last pick by hand still has to end the
                        // draft; `draftPlayer` only makes a selection.
                        if (!g.draftClass.length || g.draftPick >= draftPicksTotal(g)) {
                          closeDraft(g); g.offseasonStep = "fa";
                        }
                      });
                    }}>
                    draft
                  </button>
                ) : null}
              </span>
            ) },
          ]} empty={onlyStars ? "Nothing on your list is still available." : "The board is empty."} />
      </Section>

      {deal ? <DraftDealModal G={G} setG={setG} notify={notify} target={deal} onClose={() => setDeal(null)} /> : null}

      {G.draftLog && G.draftLog.length ? (
        <Section title="Picks so far">
          <div className="max-h-64 overflow-y-auto">
            {G.draftLog.slice().reverse().slice(0, 60).map((d, i) => {
              const p = G.players[d.pid];
              return (
                <div key={i} className={`flex items-center gap-3 px-3 py-1 border-b border-[#16223a] last:border-0 text-sm
                  ${d.teamId === G.userTeam ? "bg-sky-950/30" : ""}`}>
                  <span className="w-16 text-slate-500 tnum text-xs">R{d.round} · {d.pick}</span>
                  <span className="w-12 text-slate-400 text-xs">{G.teams[d.teamId].abbr}</span>
                  {p ? <>
                    <PosBadge pos={p.pos} />
                    <button className="flex-1 text-left hover:text-sky-300" onClick={() => openPlayer(d.pid)}>
                      {fullName(p)}
                    </button>
                    <span className="text-slate-500 text-xs">{p.style}</span>
                  </> : <span className="flex-1 text-slate-600">—</span>}
                </div>
              );
            })}
          </div>
        </Section>
      ) : null}
    </div>
  );
}

function OffseasonTab({ G, setG, notify, openPlayer }) {
  // Derived from the phase, not from a stored field — otherwise a finished
  // rollover leaves a stale draft board on screen.
  const step = G.phase !== "offseason" ? "done" : (G.offseasonStep || "review");
  const upd = (fn) => { const g2 = migrate(JSON.parse(JSON.stringify(G))); fn(g2); setG(g2); };
  const A = G.awards;
  const nm = (id) => (id != null && G.players[id] ? fullName(G.players[id]) : "—");
  const onClock = G.draftPick != null && G.draftClass.length ? pickOwner(G, G.draftPick) : null;

  const stage = offseasonStage(G);
  const act = offseasonAction(G);
  const stepIdx = { review: 0, draft: 1, draftDone: 1, fa: 2 }[stage];

  return (
    <div className="space-y-3">
      {/* Where you are, what's next, and the button to do it — all above the
          fold, because hunting for it down the page was the whole complaint. */}
      {act ? (
        <div className={`${card} p-3 space-y-3`}>
          <div className="flex items-center gap-2 text-xs">
            {OFFSEASON_STEPS.map((s, i) => (
              <React.Fragment key={s.key}>
                {i ? <span className="text-slate-600">→</span> : null}
                <span className={i === stepIdx ? "text-sky-300 font-medium"
                  : i < stepIdx ? "text-slate-400" : "text-slate-600"}>
                  {i < stepIdx ? "✓ " : ""}{s.label}
                </span>
              </React.Fragment>
            ))}
          </div>
          <div className="flex flex-wrap items-center gap-3">
            <button className={`${btnPri} py-2`} onClick={() => upd((g) => doOffseasonStep(g))}>
              {act.label}
            </button>
            <div className="text-sm text-slate-400">
              {stage === "review" ? "Look over the awards, then start the draft."
                : stage === "draft" ? (act.onClock
                  ? "You're on the clock — take the best available, or pick from the board below."
                  : "Simming to your next pick.")
                : stage === "draftDone" ? "The draft is done. Free agency is next."
                : "Sign who you want, then roll the season over. Nothing else is waiting on you."}
            </div>
            <div className="flex-1" />
            <div className="text-xs text-slate-500">press <kbd className="px-1 py-0.5 bg-[#18243c] rounded border border-[#243250]">n</kbd></div>
          </div>
        </div>
      ) : null}

      <Section title={`${G.year} awards`} className="p-3">
        {A ? (
          <div className="grid sm:grid-cols-2 gap-x-4 gap-y-3 text-sm pt-1">
            {["mvp", "scoring", "goals", "defence", "goalie", "rookie"].map((k) => {
              const ballotRows = (A.votes && A.votes[k]) || [];
              /* A counting title is won on the NUMBER, not on a vote, so it is
                 shown and measured as one: bars in proportion to the leader's
                 total, and the total itself in the margin. The share a ballot
                 computes is meaningless here — it's a shifted score built to
                 make close votes readable, and printing it beside a scoring
                 race said 31% of a man who led the league in points. */
              const counted = k === "scoring" || k === "goals";
              const unit = k === "scoring" ? "pts" : "g";
              const top = ballotRows.length ? (ballotRows[0].val || 0) : 0;
              const width = (v) => (counted
                ? (top > 0 ? Math.round(((v.val || 0) / top) * 100) : 0)
                : Math.round(v.share * 100));
              return (
                <div key={k} className="space-y-1">
                  <div>
                    <span className="text-slate-400">{AWARD_LABEL[k]} </span>
                    {A[k] != null && G.players[A[k]]
                      ? <button className="font-medium hover:text-sky-300" onClick={() => openPlayer(A[k])}>{nm(A[k])}</button>
                      : "—"}
                    {counted && top ? <span className="text-slate-500 text-xs"> · {top} {unit}</span> : null}
                  </div>
                  {ballotRows.length > 1 ? (
                    <div className="space-y-0.5">
                      {ballotRows.map((v) => (
                        <div key={v.id} className="flex items-center gap-2">
                          <button className="w-40 truncate text-left text-xs text-slate-300 hover:text-sky-300"
                            onClick={() => openPlayer(v.id)}>{nm(v.id)}</button>
                          <div className="flex-1 h-1.5 bg-[#0d1728] rounded overflow-hidden border border-[#1e2b45]">
                            <div className={`h-full ${counted ? "bg-emerald-500" : "bg-sky-500"}`}
                              style={{ width: `${width(v)}%` }} />
                          </div>
                          <span className="w-12 text-right text-[11px] tnum text-slate-400">
                            {/* A save made before ballots carried their raw
                                score has no number to show; the share is still
                                right for the vote awards. */}
                            {counted
                              ? (v.val != null ? `${Math.round(v.val)} ${unit}` : "—")
                              : `${Math.round(v.share * 100)}%`}
                          </span>
                        </div>
                      ))}
                    </div>
                  ) : null}
                </div>
              );
            })}
          </div>
        ) : <div className="text-slate-500 text-sm">—</div>}
      </Section>

      {step === "done" ? (
        <div className={`${card} p-3 text-sm text-slate-400`}>
          The {G.year} season is under way. The draft and free agency open again once the Cup is decided.
        </div>
      ) : null}

      {step === "draft" ? <DraftBoard G={G} setG={setG} notify={notify} openPlayer={openPlayer} /> : null}

      {step === "fa" ? <FreeAgencyTab G={G} setG={setG} notify={notify} openPlayer={openPlayer} /> : null}
    </div>
  );
}

function RulesModal({ G, setG, onClose }) {
  const upd = (k, v) => { const g2 = migrate(JSON.parse(JSON.stringify(G))); setRule(g2, k, v); setG(g2); };
  const Row = ({ label, hint, children }) => (
    <div className="flex items-start justify-between gap-3 py-2 border-b border-[#1e2b45]">
      <div><div className="text-sm">{label}</div><div className="text-xs text-slate-500">{hint}</div></div>
      <div className="shrink-0">{children}</div>
    </div>
  );
  const Sel = ({ k, opts }) => (
    <select className="bg-[#0d1728] border border-[#243250] rounded px-2 py-1 text-sm"
      value={String(ruleValue(G, k))} onChange={(e) => {
        const v = e.target.value;
        upd(k, v === "true" ? true : v === "false" ? false : isNaN(+v) || v === "" ? v : +v);
      }}>
      {opts.map(([v, l]) => <option key={String(v)} value={String(v)}>{l}</option>)}
    </select>
  );
  return (
    <Modal title="League rules" onClose={onClose}>
      <Row label="Season length" hint="takes effect next season"><Sel k="seasonLen" opts={[[82, "82"], [56, "56"], [41, "41"]]} /></Row>
      <Row label="Loser point" hint="a point for losing past regulation"><Sel k="otLoserPoint" opts={[[true, "On"], [false, "Off"]]} /></Row>
      <Row label="Overtime" hint="3-on-3, 5-on-5, or let it be a tie"><Sel k="otFormat" opts={[["3on3", "3-on-3"], ["5on5", "5-on-5"], ["none", "Ties"]]} /></Row>
      <Row label="Shootout" hint="decides what overtime doesn't"><Sel k="shootout" opts={[[true, "On"], [false, "Off"]]} /></Row>
      <Row label="Fighting" hint="five each, and a swing in momentum"><Sel k="fighting" opts={[[true, "On"], [false, "Off"]]} /></Row>
      <Row label="Playoff format" hint="takes effect next season"><Sel k="playoffFormat" opts={[["divisional", "Divisional + wildcards"], ["seeded", "Seeded 1–8"]]} /></Row>
      <Row label="Series length" hint="takes effect next season"><Sel k="seriesLen" opts={[[7, "Best of 7"], [5, "Best of 5"]]} /></Row>
      <Row label="Hard cap" hint="off means the cap is advisory"><Sel k="hardCap" opts={[[true, "On"], [false, "Off"]]} /></Row>
      <Row label="Cap amount" hint="$M per club"><Sel k="capAmount" opts={[[75, "$75M"], [88, "$88M"], [105, "$105M"]]} /></Row>
      <Row label="Retained salary" hint="keep part of a contract you trade away"><Sel k="retainedSalary" opts={[[true, "On"], [false, "Off"]]} /></Row>
      <Row label="Injuries" hint="how often bodies break"><Sel k="injuries" opts={[["low", "Low"], ["normal", "Normal"], ["high", "High"]]} /></Row>
      {G.pendingRules && Object.keys(G.pendingRules).length ? (
        <div className="mt-3 text-xs text-amber-400">
          Staged for next season: {Object.keys(G.pendingRules).join(", ")}
        </div>
      ) : null}
    </Modal>
  );
}

/* The deadline as a window you can work, rather than a line in the news feed
   after it has already happened. Everything here is what the engine actually
   decides — buyers and sellers come from the same split `aiDeadlineMoves` uses,
   and the asking price is the pick it genuinely pays. */
function DeadlineTab({ G, go, openPlayer, openTeam }) {
  if (G.phase !== "regular") {
    return (
      <div className={`${card} p-4 text-sm text-slate-400`}>
        The deadline only means anything during the season.
      </div>
    );
  }
  const b = deadlineBoard(G);
  const nm = (id) => `${G.teams[id].city} ${G.teams[id].name}`;
  return (
    <div className="space-y-3">
      <div className="grid grid-cols-2 sm:grid-cols-4 gap-2">
        <Stat label="Deadline" value={b.days > 0 ? `${b.days}d` : "passed"}
          sub={b.open ? "trades open" : "trades shut"}
          tone={b.days > 0 && b.days <= 10 ? "text-amber-300" : b.open ? "" : "text-rose-400"} />
        <Stat label="You are" value={b.youBuy ? "Buying" : "Selling"}
          sub={`${ordinal(b.myRank)} in the league`}
          tone={b.youBuy ? "text-emerald-300" : "text-amber-300"} />
        <Stat label="On the market" value={b.rentals.length} sub="rentals available" />
        <Stat label="Your rentals" value={b.myRentals.length} sub="expiring, 27+" />
      </div>

      <div className={`${card} p-3 text-sm text-slate-300`}>
        {b.youBuy
          ? "You're in the race. A rental costs a pick and walks in July — you're buying months, not years."
          : "You're out of it. The men below are worth more to a contender in March than they are to you in October."}
      </div>

      <Section title={b.youBuy ? "Available — what a contender pays" : "Available around the league"}
        right={<span className="text-xs text-slate-400">asking price is the pick the AI actually pays</span>}>
        <SortTable key="deadline-rentals" min={720} rowKey={(r) => r.p.id} rows={b.rentals}
          initial="ovr" onRow={(r) => openPlayer(r.p.id)}
          empty="Nobody worth renting is available."
          cols={[
            { key: "n", label: "Player", get: (r) => fullName(r.p),
              cell: (r) => <span className="whitespace-nowrap">{fullName(r.p)}{r.blocked
                ? <span className="ml-1 text-[10px] px-1 rounded bg-amber-900 text-amber-200">NTC</span> : null}</span> },
            { key: "from", label: "From", get: (r) => G.teams[r.from].abbr,
              cell: (r) => <button className="text-xs text-slate-400 hover:text-sky-300"
                onClick={(e) => { e.stopPropagation(); openTeam(r.from); }}>{G.teams[r.from].abbr}</button> },
            { key: "pos", label: "Pos", get: (r) => r.p.pos, cell: (r) => <PosBadge pos={r.p.pos} /> },
            { key: "age", label: "Age", get: (r) => r.p.age, asc: true },
            { key: "ovr", label: "Ovr", get: (r) => r.p.ovr, cell: (r) => <b>{r.p.ovr}</b> },
            { key: "pts", label: "Pts", get: (r) => pts(r.p.season) },
            { key: "cap", label: "Cap", get: (r) => r.p.contract.amt, cell: (r) => `$${r.p.contract.amt}M` },
            { key: "ask", label: "Asking", get: (r) => -r.round,
              cell: (r) => <span className={r.round === 1 ? "text-rose-300" : "text-slate-300"}>
                {r.blocked ? "won't waive" : `${ordinal(r.round)}-round pick`}</span> },
          ]} />
      </Section>

      {b.myRentals.length ? (
        <Section title="Yours, expiring"
          right={<span className="text-xs text-slate-400">what you could get for them</span>} className="p-3">
          <div className="space-y-1 pt-1 text-sm">
            {b.myRentals.map((r) => (
              <div key={r.p.id} className="flex items-center gap-2 flex-wrap cursor-pointer hover:text-sky-300"
                onClick={() => openPlayer(r.p.id)}>
                <PosBadge pos={r.p.pos} />
                <span className="flex-1">{shortName(r.p)} <span className="text-slate-500">({r.p.age}, {r.p.ovr})</span></span>
                <span className="text-xs text-slate-400">${r.p.contract.amt}M · {r.p.contract.yrs}y left</span>
                <span className="text-xs">{r.blocked ? <span className="text-amber-300">no-trade clause</span>
                  : <span className="text-emerald-300">worth a {ordinal(r.round)}</span>}</span>
              </div>
            ))}
          </div>
          <button className={`${btnGhost} mt-2`} onClick={() => go("trade")}>Open the trade screen</button>
        </Section>
      ) : null}

      <div className="grid sm:grid-cols-2 gap-3">
        {[["Buyers", b.buyers, "text-emerald-300"], ["Sellers", b.sellers, "text-amber-300"]].map(([label, ids, tone]) => (
          <Section key={label} title={label}
            right={<span className={`text-xs ${tone}`}>{ids.length} clubs</span>} className="p-3">
            <div className="space-y-0.5 pt-1 text-xs">
              {ids.map((id) => (
                <div key={id} className={`flex gap-2 ${id === G.userTeam ? "text-sky-300" : "text-slate-300"}`}>
                  <button className="flex-1 text-left hover:text-sky-300" onClick={() => openTeam(id)}>{nm(id)}</button>
                  <span className="tnum text-slate-500">{G.teams[id].pts} pts</span>
                </div>
              ))}
            </div>
          </Section>
        ))}
      </div>
    </div>
  );
}

const TABS = [
  { key: "home", label: "Home", group: "Club" },
  { key: "roster", label: "Roster", group: "Club" },
  { key: "lines", label: "Lines", group: "Club" },
  { key: "room", label: "Room", group: "Club" },
  { key: "game", label: "Game", group: "Club" },
  { key: "schedule", label: "Schedule", group: "League" },
  { key: "standings", label: "Standings", group: "League" },
  { key: "stats", label: "Stats", group: "League" },
  { key: "analytics", label: "Shot maps", group: "League" },
  { key: "playoffs", label: "Playoffs", group: "League" },
  { key: "allstar", label: "All-Star", group: "League" },
  { key: "trade", label: "Trade", group: "Market" },
  { key: "deadline", label: "Deadline", group: "Market" },
  { key: "fa", label: "Free agents", group: "Market" },
  { key: "offseason", label: "Offseason", group: "Market" },
  { key: "records", label: "Records", group: "History" },
  { key: "hall", label: "Hall of Fame", group: "History" },
  { key: "history", label: "History", group: "History" },
];
const GROUPS = ["Club", "League", "Market", "History"];

function CommandPalette({ G, onClose, go, openPlayer, openTeam }) {
  const [q, setQ] = useState("");
  const ref = useRef(null);
  useEffect(() => { if (ref.current && ref.current.focus) ref.current.focus(); }, []);
  const ql = q.trim().toLowerCase();
  const hits = useMemo(() => {
    const out = [];
    TABS.forEach((t) => {
      if (!ql || t.label.toLowerCase().includes(ql)) out.push({ kind: "tab", label: t.label, sub: t.group, go: () => go(t.key) });
    });
    if (ql.length >= 2) {
      G.teams.forEach((t) => {
        if (`${t.city} ${t.name} ${t.abbr}`.toLowerCase().includes(ql))
          out.push({ kind: "club", label: `${t.city} ${t.name}`, sub: `${CONFS[t.conf]} · ${DIVS[t.div]}`, go: () => openTeam(t.id) });
      });
      playersOf(G).forEach((p) => {
        if (out.length > 60 || p.retired) return;
        if (fullName(p).toLowerCase().includes(ql))
          out.push({ kind: "player", label: fullName(p), sub: `${p.pos} · ${p.ovr} ovr · ${p.teamId != null ? G.teams[p.teamId].abbr : "FA"}`, go: () => openPlayer(p.id) });
      });
    }
    return out.slice(0, 40);
  }, [ql, G]);

  return (
    <div className="fixed inset-0 bg-black/70 flex items-start justify-center p-4 pt-20 z-50" onClick={onClose}>
      <div className={`${card} w-full max-w-lg overflow-hidden`} onClick={(e) => e.stopPropagation()}>
        <input ref={ref} className="w-full bg-transparent px-4 py-3 outline-none border-b border-[#1e2b45]"
          placeholder="Jump to a screen, club or player…" value={q} onChange={(e) => setQ(e.target.value)}
          onKeyDown={(e) => { if (e.key === "Enter" && hits[0]) { hits[0].go(); onClose(); } }} />
        <div className="max-h-80 overflow-y-auto">
          {hits.map((h, i) => (
            <button key={i} className="w-full flex items-center gap-3 px-4 py-2 text-left text-sm hover:bg-[#16223a]"
              onClick={() => { h.go(); onClose(); }}>
              <span className="flex-1">{h.label}</span>
              <span className="text-xs text-slate-500">{h.sub}</span>
            </button>
          ))}
          {!hits.length ? <div className="px-4 py-4 text-sm text-slate-500">Nothing matches.</div> : null}
        </div>
      </div>
    </div>
  );
}

/* ----------------------------------- app ---------------------------------- */

function App() {
  const [G, setG] = useState(null);
  const [tab, setTab] = useState("home");
  const [group, setGroup] = useState("Club");
  const [slot, setSlot] = useState(0);
  const [showRules, setShowRules] = useState(false);
  const [showSlots, setShowSlots] = useState(false);
  const [palette, setPalette] = useState(false);
  const [player, setPlayer] = useState(null);
  const [club, setClub] = useState(null);
  const [toast, setToast] = useState(null);
  const [busy, setBusy] = useState(false);

  useEffect(() => { if (G) saveGame(G, slot); }, [G, slot]);
  useEffect(() => {
    if (!toast) return;
    const id = setTimeout(() => setToast(null), 3200);
    return () => clearTimeout(id);
  }, [toast]);

  const go = useCallback((k) => {
    setTab(k);
    const t = TABS.find((x) => x.key === k);
    if (t) setGroup(t.group);
  }, []);
  const notify = useCallback((m) => setToast(m), []);

  const start = (opts) => {
    if (opts.load != null) {
      Promise.resolve(loadGame(opts.load)).then((g) => { if (g) { setSlot(opts.load); setG(g); } });
      return;
    }
    // The seed comes from the club picker, so the league he previewed is the
    // league he gets. Without it the preview would be a different world.
    const g = newGame(opts.team, { difficulty: opts.difficulty, rules: opts.rules, seed: opts.seed, start: opts.start });
    const free = [0, 1, 2].find((s) => !slotMeta(s));
    setSlot(free != null ? free : 0);
    setG(g);
  };

  const advance = useCallback((n) => {
    if (!G || busy) return;
    setBusy(true);
    const g2 = migrate(JSON.parse(JSON.stringify(G)));
    if (g2.phase === "regular") simDays(g2, n);
    else if (g2.phase === "playoffs") simPlayoffRound(g2);
    setG(g2);
    setBusy(false);
    if (g2.phase === "playoffs" && G.phase === "regular") go("playoffs");
    if (g2.phase === "offseason" && G.phase !== "offseason") go("offseason");
  }, [G, busy, go]);

  // Keyboard: d for a day, w for a week, ⌘K or ? for the palette.
  useEffect(() => {
    const onKey = (e) => {
      const el = e.target;
      const typing = el && (el.tagName === "INPUT" || el.tagName === "SELECT" || el.tagName === "TEXTAREA" || el.isContentEditable);
      if ((e.key === "k" || e.key === "K") && (e.metaKey || e.ctrlKey)) { e.preventDefault(); setPalette(true); return; }
      if (typing) return;
      if (e.key === "?") { e.preventDefault(); setPalette(true); return; }
      if (!G) return;
      // `n` always does whatever the header's primary button does, whatever
      // phase you're in — one key to move things along.
      if (e.key === "n") {
        e.preventDefault();
        if (G.phase === "offseason") {
          const g2 = migrate(JSON.parse(JSON.stringify(G)));
          doOffseasonStep(g2);
          setG(g2);
          go("offseason");
        } else if (G.phase === "playoffs") {
          const g2 = migrate(JSON.parse(JSON.stringify(G)));
          simPlayoffDay(g2);
          setG(g2);
          if (g2.phase === "offseason") go("offseason");
        } else advance(1);
        return;
      }
      if (G.phase !== "regular") return;
      if (e.key === "d") { e.preventDefault(); advance(1); }
      if (e.key === "w") { e.preventDefault(); advance(7); }
    };
    document.addEventListener("keydown", onKey);
    return () => document.removeEventListener("keydown", onKey);
  }, [G, advance]);

  if (!G) return <Splash onStart={start} />;
  // Sacked. Nothing else in the game is reachable until you take another job.
  if (G.fired) {
    return <FiredScreen G={G} onTake={(id) => {
      const g2 = migrate(JSON.parse(JSON.stringify(G)));
      takeJob(g2, id);
      setG(g2);
    }} />;
  }
  const t = G.teams[G.userTeam];
  const visible = TABS.filter((x) => x.group === group);

  return (
    <div className="min-h-screen pb-10">
      <div className="sticky top-0 z-40 bg-[#0b1220]/95 backdrop-blur border-b border-[#1e2b45]">
        <div className="max-w-6xl mx-auto px-3 py-2 flex items-center gap-2 sm:gap-3 flex-wrap">
          <button className="font-semibold truncate hover:text-sky-300 flex items-center gap-2"
            onClick={() => setClub(G.userTeam)}>
            <span className="w-1.5 h-5 rounded-sm inline-block shrink-0"
              style={{ background: clubColour(t)[0], borderTop: `3px solid ${clubColour(t)[1]}` }} />
            {t.city} <span className="text-sky-400">{t.name}</span>
          </button>
          <div className="text-xs text-slate-400 whitespace-nowrap">{G.year} · {t.w}-{t.l}-{t.otl} · {t.pts} pts</div>
          <div className="flex-1" />
          <div className="flex items-center gap-1.5 sm:gap-2 flex-wrap">
            {G.phase === "regular" ? (
              <>
                <button className={btnGhost} onClick={() => advance(1)} disabled={busy} title="d">Day</button>
                <button className={btnGhost} onClick={() => advance(7)} disabled={busy} title="w">Week</button>
                <button className={btnPri} onClick={() => advance(G.schedule.length)} disabled={busy}>Sim season</button>
              </>
            ) : null}
            {G.phase === "playoffs" ? (
              <>
                <button className={btnPri} disabled={busy} title="n" onClick={() => {
                  const g2 = migrate(JSON.parse(JSON.stringify(G)));
                  simPlayoffDay(g2); setG(g2);
                  if (g2.phase === "offseason") go("offseason");
                }}>Play game</button>
                <button className={btnGhost} onClick={() => advance(1)} disabled={busy}>Play round</button>
              </>
            ) : null}
            {G.phase === "offseason" && offseasonAction(G) ? (
              <button className={btnPri} disabled={busy} title="n" onClick={() => {
                const g2 = migrate(JSON.parse(JSON.stringify(G)));
                doOffseasonStep(g2);
                setG(g2);
                go("offseason");
              }}>{offseasonAction(G).label}</button>
            ) : null}
            <button className={btnGhost} onClick={() => setPalette(true)} title="⌘K">⌘K</button>
            <button className={btnGhost} onClick={() => setShowSlots(true)}>💾</button>
            <button className={btnGhost} onClick={() => setShowRules(true)}>📋</button>
          </div>
        </div>
        <div className="max-w-6xl mx-auto px-3 pb-1 flex gap-1 overflow-x-auto">
          {GROUPS.map((g) => (
            <button key={g} onClick={() => { setGroup(g); const first = TABS.find((x) => x.group === g); if (first) setTab(first.key); }}
              className={`px-3 py-1 rounded-lg text-xs uppercase tracking-wide whitespace-nowrap
                ${group === g ? "bg-[#22314f] text-slate-100" : "text-slate-500 hover:text-slate-300"}`}>{g}</button>
          ))}
        </div>
        <div className="max-w-6xl mx-auto px-3 pb-2 flex gap-1 overflow-x-auto">
          {visible.map((x) => (
            <button key={x.key} onClick={() => setTab(x.key)}
              className={`px-3 py-1 rounded-lg text-sm whitespace-nowrap ${tab === x.key ? "bg-sky-600 text-white" : "text-slate-300 hover:bg-[#18243c]"}`}>
              {x.label}
            </button>
          ))}
        </div>
      </div>

      <div className="max-w-6xl mx-auto p-3">
        {tab === "home" && <HomeTab G={G} setG={setG} go={go} openPlayer={setPlayer} />}
        {tab === "roster" && <RosterTab G={G} setG={setG} openPlayer={setPlayer} notify={notify} />}
        {tab === "lines" && <LinesTab G={G} setG={setG} />}
        {tab === "room" && <RoomTab G={G} setG={setG} openPlayer={setPlayer} notify={notify} />}
        {tab === "game" && <GameTab G={G} openPlayer={setPlayer} />}
        {tab === "schedule" && <ScheduleTab G={G} openTeam={setClub} />}
        {tab === "standings" && <StandingsTab G={G} openTeam={setClub} />}
        {tab === "stats" && <StatsTab G={G} openPlayer={setPlayer} />}
        {tab === "analytics" && <AnalyticsTab G={G} openTeam={setClub} />}
        {tab === "playoffs" && <PlayoffsTab G={G} setG={setG} openPlayer={setPlayer} />}
        {tab === "allstar" && <AllStarTab G={G} openPlayer={setPlayer} />}
        {tab === "trade" && <TradeTab G={G} setG={setG} notify={notify} openPlayer={setPlayer} />}
        {tab === "deadline" && <DeadlineTab G={G} go={go} openPlayer={setPlayer} openTeam={setClub} />}
        {tab === "fa" && <FreeAgencyTab G={G} setG={setG} notify={notify} openPlayer={setPlayer} />}
        {tab === "offseason" && <OffseasonTab G={G} setG={setG} notify={notify} openPlayer={setPlayer} />}
        {tab === "records" && <RecordsTab G={G} openPlayer={setPlayer} />}
        {tab === "hall" && <HallTab G={G} openPlayer={setPlayer} />}
        {tab === "history" && <HistoryTab G={G} openPlayer={setPlayer} openTeam={setClub} />}
      </div>

      {toast ? (
        <div className="fixed bottom-4 left-1/2 -translate-x-1/2 bg-[#18243c] border border-[#243250] px-4 py-2 rounded-lg text-sm shadow-lg z-50">
          {toast}
        </div>
      ) : null}

      {showRules ? <RulesModal G={G} setG={setG} onClose={() => setShowRules(false)} /> : null}
      {palette ? <CommandPalette G={G} go={go} openPlayer={setPlayer} openTeam={setClub} onClose={() => setPalette(false)} /> : null}
      {player != null ? <PlayerModal G={G} pid={player} onClose={() => setPlayer(null)} /> : null}
      {club != null ? <ClubModal G={G} teamId={club} onClose={() => setClub(null)} openPlayer={(id) => { setClub(null); setPlayer(id); }} /> : null}
      {showSlots ? (
        <Modal title="Save slots" onClose={() => setShowSlots(false)}>
          <div className="space-y-2">
            <div className="text-sm text-slate-400">
              You're playing slot {slot + 1}. Saves live in IndexedDB and fall back to local storage.
            </div>
            {[0, 1, 2].map((s) => (
              <div key={s} className="flex items-center gap-2">
                <div className="flex-1"><SlotCard slot={s} meta={slotMeta(s)}
                  onLoad={(x) => { Promise.resolve(loadGame(x)).then((g) => { if (g) { setSlot(x); setG(g); setShowSlots(false); } }); }}
                  onDelete={(x) => { deleteSlot(x); setShowSlots(false); }} /></div>
                {s !== slot ? <button className={btnGhost} onClick={() => { setSlot(s); saveGame(G, s); notify(`Now saving to slot ${s + 1}.`); }}>Save here</button> : null}
              </div>
            ))}
          </div>
        </Modal>
      ) : null}
    </div>
  );
}

if (typeof document !== "undefined" && document.getElementById && document.getElementById("root")) {
  ReactDOM.createRoot(document.getElementById("root")).render(<App />);
}
</script>

<script>
  /* The classic runtime is required — the default preset emits an ESM import
   * that breaks inside a non-module inline script.
   *
   * Transpiling ~5,000 lines on every load is fine on a laptop and painful on a
   * phone, so the compiled output is cached in localStorage under a hash of the
   * source. Change the source and the hash changes, so it recompiles by itself —
   * there's nothing to remember to bump.
   */
  (function () {
    var src = document.getElementById("app-src").textContent;
    var h = 5381;
    for (var i = 0; i < src.length; i++) h = ((h * 33) ^ src.charCodeAt(i)) >>> 0;
    var key = "pgmh:build:" + h.toString(36) + ":" + src.length;
    var out = null;
    try { out = localStorage.getItem(key); } catch (e) {}
    if (!out) {
      out = Babel.transform(src, { presets: [["react", { runtime: "classic" }]] }).code;
      try {
        // Drop any older build before writing, so this never accumulates.
        for (var k = localStorage.length - 1; k >= 0; k--) {
          var name = localStorage.key(k);
          if (name && name.indexOf("pgmh:build:") === 0 && name !== key) localStorage.removeItem(name);
        }
        localStorage.setItem(key, out);
      } catch (e) { /* quota — recompiling each load still works */ }
    }
    (0, eval)(out);
    if ("serviceWorker" in navigator && location.protocol !== "file:") {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("sw.js").catch(function () {});
      });
    }
  })();
</script>
