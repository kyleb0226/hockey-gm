/* ------------------------------ the net grid -------------------------------
 * The goal seen from the shooter's side, nine cells, the same idea as a penalty
 * placement chart. For a skater the shading is where he puts the puck and the
 * number is how often it goes in from there. For a goalie the shading is where
 * he gets beaten and the number is what he stops.
 * ------------------------------------------------------------------------- */

/* Deterministic scatter so dots don't jump around between renders. Same PRNG as
   the engine, but pure — it takes a seed instead of mutating one. */
function jitter(seed) {
  let t = (seed + 0x6d2b79f5) | 0;
  t = Math.imul(t ^ (t >>> 15), t | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
// Place n dots inside a box, at genuinely random positions rather than on a
// grid. Two reasons: a lattice reads as fake, and laying dots out in index
// order would put every goal in the top-left corner of its cell, since the
// records arrive grouped. `spill` lets a shot sit across a gridline — the cell
// is only how the shot was counted, not a wall the puck can't cross — and
// `bounds` keeps it inside the net. Overlap is fine and expected.
function spotAt(x0, y0, w, h, seed, spill, bounds) {
  const o = spill || 0;
  let x = x0 - o + jitter(seed * 2) * (w + o * 2);
  let y = y0 - o + jitter(seed * 2 + 1) * (h + o * 2);
  if (bounds) { x = clamp(x, bounds[0], bounds[2]); y = clamp(y, bounds[1], bounds[3]); }
  return [x, y];
}
function scatter(n, x0, y0, w, h, seed, spill, bounds) {
  const out = [];
  for (let i = 0; i < n; i++) out.push(spotAt(x0, y0, w, h, seed + i, spill, bounds));
  return out;
}
/* Placement inside a CELL tapers toward its edges and bleeds into its
   neighbours. Spreading dots uniformly across the cell rectangle makes the
   nine buckets legible as nine boxes — where a dense cell abuts a sparse one
   the density jumps at the line, which is most obvious around centre mass. A
   sum of two uniforms is a cheap triangular distribution: peaked in the middle
   of the cell, thinning to nothing at the edges, so adjacent cells blend and
   the whole thing reads as one cloud. The cell is still where the shot was
   counted; it just isn't drawn as a wall. */
function spotSoft(x0, y0, w, h, seed, bounds) {
  const tri = (a, b) => (jitter(a) + jitter(b)) / 2;
  const s = seed * 4;
  let x = x0 + w / 2 + (tri(s, s + 1) - 0.5) * w * 1.7;
  let y = y0 + h / 2 + (tri(s + 2, s + 3) - 0.5) * h * 1.7;
  if (bounds) { x = clamp(x, bounds[0], bounds[2]); y = clamp(y, bounds[1], bounds[3]); }
  return [x, y];
}
/* A dot's position belongs to the SHOT, not to its index in a list. Seeding off
   the record's game day and clock time means two charts can never line up: with
   an index seed, dot #1 of a club's own map and dot #1 of the map it concedes
   landed on the same pixel, so the two charts looked like the same shots with
   different colours and one just ran longer. */
const shotSeed = (r, k) => Math.abs(r.d * 7919 + Math.round(r.t * 97) * 31 + (r.c ? r.c.charCodeAt(0) * 13 : 0) + k);
// The net opening, so a spilled dot can straddle a line but not leave the goal.
const NET_BOUNDS = [42, 32, 218, 148];

const CELL_LABEL = {};
NET_CELLS.forEach((c) => { CELL_LABEL[c.key] = c.label; });
const OUTCOME_LABEL = { g: "goal", s: "saved", m: "off target", b: "blocked", e: "empty net" };
const DOT_FILL = { g: "#fb7185", s: "#38bdf8", e: "#c084fc", b: "#f59e0b" };

function NetGrid({ net, mode, hole, view, extra, seed, shots, teams }) {
  // Heat is volume: where a skater shoots, or where a goalie gets beaten.
  const vol = NET_CELLS.map((c) => (mode === "G" ? net[c.key].ga : net[c.key].a));
  const total = vol.reduce((a, b) => a + b, 0);
  // The footer is the outcome, which is a different number from the heat for a
  // skater — his shots are the volume, his goals are the result.
  const faced = NET_CELLS.reduce((s, c) => s + (mode === "G" ? net[c.key].sa : net[c.key].a), 0);
  const scored = NET_CELLS.reduce((s, c) => s + (mode === "G" ? net[c.key].ga : net[c.key].g), 0);
  if (!faced) return <div className="text-sm text-slate-500 px-1 py-3">Nothing on net yet.</div>;

  const dots = view === "dots";
  // The net sits inside a margin so off-target shots have somewhere to land.
  const X = [40, 100, 160, 220], Y = [30, 70, 110, 150];
  const hue = mode === "G" ? 6 : 205;   // beaten = red, scoring = blue
  /* Every chart gets its own salt. Two NetGrids that shared one produced dots in
     identical positions — a club's own map and the map it conceded looked like
     the same shots recoloured, with one simply running longer. The mode is in
     the salt so "what we shoot" and "what we allow" can never coincide even when
     they're drawn for the same club from the same aggregate counts. */
  const sd = (seed || 1) * 977 + (mode === "G" ? 524287 : 0);

  /* One shot, one dot — always. A chart that collapses fourteen shots into a
     single dot is a bar chart wearing a disguise. When a cell gets crowded the
     DOTS shrink; they never merge. Overlap is expected and fine. */
  const cellShots = NET_CELLS.map((c) => (mode === "G" ? net[c.key].sa : net[c.key].a));
  const busiest = Math.max(1, ...cellShots);
  const CELL_AREA = 60 * 40;
  const dotR = clamp(0.45 * Math.sqrt(CELL_AREA / busiest), 0.42, 2.6);
  const miss = (extra && extra.miss) || 0;
  const blkd = (extra && extra.blkd) || 0;

  // A real per-shot log beats the synthesized cloud whenever we have one.
  const real = shots && shots.length ? shots : null;
  const clock = (t) => {
    const per = Math.min(3, Math.floor(t / 20)), inPer = t - per * 20;
    const m = Math.floor(inPer), s = Math.round((inPer - m) * 60);
    return t >= 60 ? `OT ${Math.floor(t - 60)}:${String(s).padStart(2, "0")}`
      : `P${per + 1} ${m}:${String(s).padStart(2, "0")}`;
  };
  const tip = (r) => [
    teams && r.o != null ? `vs ${teams[r.o].abbr}` : null,
    `day ${r.d + 1}`, clock(r.t), r.z !== "empty" ? r.z : null,
    r.c ? CELL_LABEL[r.c] : null,
    OUTCOME_LABEL[r.r] + (r.st === "pp" ? " (PP)" : r.st === "sh" ? " (SH)" : ""),
  ].filter(Boolean).join(" · ");

  const Dot = ({ p, fill, stroke, r, title }) => (
    <circle cx={p[0]} cy={p[1]} r={r || 2.6} fill={fill || "none"}
      stroke={stroke || "none"} strokeWidth="0.9" opacity={fill ? 0.82 : 1}>
      {title ? <title>{title}</title> : null}
    </circle>
  );

  // Bucket the log so each record lands where it actually went.
  const buckets = {};
  const offNet = [], blocked = [], emptied = [];
  if (real) {
    NET_KEYS.forEach((k) => { buckets[k] = []; });
    real.forEach((r) => {
      if (r.r === "m") offNet.push(r);
      else if (r.r === "b") blocked.push(r);
      else if (r.r === "e") emptied.push(r);
      else if (r.c && buckets[r.c]) buckets[r.c].push(r);
    });
  }

  return (
    <div className="space-y-2">
      <svg viewBox="0 0 260 214" className="w-full max-w-sm mx-auto block">
        <rect x="0" y="0" width="260" height="214" rx="6" fill="#0d1728" />
        {/* mesh inside the opening */}
        {[...Array(10)].map((_, i) => (
          <line key={`v${i}`} x1={40 + i * 20} y1="30" x2={40 + i * 20} y2="150" stroke="#1b2942" strokeWidth="1" />
        ))}
        {[...Array(7)].map((_, i) => (
          <line key={`h${i}`} x1="40" y1={30 + i * 20} x2="220" y2={30 + i * 20} stroke="#1b2942" strokeWidth="1" />
        ))}

        {NET_CELLS.map((c, i) => {
          const share = total ? vol[i] / total : 0;
          const shots = mode === "G" ? net[c.key].sa : net[c.key].a;
          const goals = mode === "G" ? net[c.key].ga : net[c.key].g;
          const rate = shots ? (mode === "G" ? (shots - goals) / shots : goals / shots) : null;
          const isHole = hole && hole.key === c.key;
          const x0 = X[c.col], y0 = Y[c.row], w = X[c.col + 1] - x0, h = Y[c.row + 1] - y0;
          const recs = real ? buckets[c.key] : null;
          const nG = goals, nS = shots - goals;
          const count = recs ? recs.length : nG + nS;
          const pts = !dots ? []
            : recs ? recs.map((r, k) => spotSoft(x0, y0, w, h, sd + shotSeed(r, k), NET_BOUNDS))
            : Array.from({ length: count }, (_, k) => spotSoft(x0, y0, w, h, sd + i * 131 + k, NET_BOUNDS));
          return (
            <g key={c.key}>
              <rect x={x0} y={y0} width={w} height={h}
                fill={dots ? "rgba(13,23,40,0.35)" : `hsla(${hue}, 80%, 55%, ${0.08 + share * 0.75})`}
                stroke={isHole ? "#f59e0b" : "#243250"} strokeWidth={isHole ? 2 : 1} />
              {dots ? pts.map((p, k) => (
                <Dot key={k} p={p} r={dotR}
                  fill={recs ? DOT_FILL[recs[k].r] : (k < nG ? "#fb7185" : "#38bdf8")}
                  title={recs ? tip(recs[k]) : null} />
              )) : (
                <>
                  <text x={x0 + w / 2} y={y0 + h / 2 - 1} textAnchor="middle" fontSize="13"
                    fontWeight="700" className="fill-slate-100">
                    {rate == null ? "—" : `${(rate * 100).toFixed(0)}%`}
                  </text>
                  <text x={x0 + w / 2} y={y0 + h / 2 + 10} textAnchor="middle" fontSize="7" className="fill-slate-400">
                    {goals} of {shots}
                  </text>
                </>
              )}
            </g>
          );
        })}

        {/* off target: over the bar and wide of the posts */}
        {dots && (real ? offNet.length : miss) ? (() => {
          const n = real ? offNet.length : miss;
          const over = Math.round(n * 0.4), side = n - over;
          // Three bands, each an independent draw, every dot salted by the chart
          // and by the shot it belongs to.
          const bands = [[over, 44, 5, 172, 16, 991], [Math.ceil(side / 2), 5, 32, 26, 116, 992],
            [Math.floor(side / 2), 228, 32, 26, 116, 993]];
          let idx = 0;
          const out = [];
          bands.forEach(([cnt, x, y, bw, bh, tag]) => {
            for (let k = 0; k < cnt; k++, idx++) {
              const r = real ? offNet[idx] : null;
              out.push({ p: spotAt(x, y, bw, bh, sd + tag + (r ? shotSeed(r, idx) : idx * 137), 3), r });
            }
          });
          return out.map((d, k) => (
            <Dot key={`m${k}`} p={d.p} r={dotR} stroke="#64748b" title={d.r ? tip(d.r) : null} />
          ));
        })() : null}

        {/* empty-netters: no goalie, so no corner to pick */}
        {dots && real && emptied.length
          ? emptied.map((r, k) => (
            <Dot key={`e${k}`} r={dotR} fill="#c084fc" title={tip(r)}
              p={spotAt(96, 76, 68, 48, sd + 995 + shotSeed(r, k), 4, NET_BOUNDS)} />
          )) : null}

        {/* blocked: never got there at all */}
        {dots && (real ? blocked.length : blkd) ? (
          <>
            <text x="130" y="176" textAnchor="middle" fontSize="7" className="fill-slate-500">BLOCKED</text>
            {(real ? blocked : new Array(blkd).fill(null)).map((r, k) => (
              <Dot key={`b${k}`} r={dotR} fill="#f59e0b" title={r ? tip(r) : null}
                p={spotAt(30, 180, 200, 26, sd + 994 + (r ? shotSeed(r, k) : k * 151), 3)} />
            ))}
          </>
        ) : null}

        {/* posts, crossbar and goal line */}
        <rect x="34" y="24" width="6" height="132" fill="#dc2626" />
        <rect x="220" y="24" width="6" height="132" fill="#dc2626" />
        <rect x="34" y="24" width="192" height="6" fill="#dc2626" />
        <rect x="30" y="156" width="200" height="4" fill="#1e2b45" />
      </svg>

      {dots ? (
        <div className="flex flex-wrap items-center gap-x-4 gap-y-1 text-xs px-1">
          <span className="flex items-center gap-1.5"><span className="w-2.5 h-2.5 rounded-full bg-rose-400 inline-block" />
            <span className="text-slate-300">Goal</span></span>
          <span className="flex items-center gap-1.5"><span className="w-2.5 h-2.5 rounded-full bg-sky-400 inline-block" />
            <span className="text-slate-300">Saved</span></span>
          {miss ? <span className="flex items-center gap-1.5">
            <span className="w-2.5 h-2.5 rounded-full border border-slate-500 inline-block" />
            <span className="text-slate-300">Off target</span></span> : null}
          {blkd ? <span className="flex items-center gap-1.5"><span className="w-2.5 h-2.5 rounded-full bg-amber-500 inline-block" />
            <span className="text-slate-300">Blocked</span></span> : null}
          {real && emptied.length ? <span className="flex items-center gap-1.5">
            <span className="w-2.5 h-2.5 rounded-full bg-purple-400 inline-block" />
            <span className="text-slate-300">Empty net</span></span> : null}
          <span className="text-slate-500">
            {real ? `${real.length} shots · hover for the game` : `${faced + miss + blkd} shots, one dot each`}
          </span>
        </div>
      ) : null}

      <div className="flex items-center justify-between text-xs text-slate-400 px-1">
        <span>{dots ? (real ? "every shot, as it happened" : "every shot, placed") : mode === "G" ? "shaded where goals get through" : "shaded by shot volume"}</span>
        <span className="tnum">{mode === "G" ? `${scored} allowed on ${faced}` : `${scored} goals on ${faced}`}</span>
      </div>
      {hole ? (
        <div className="text-xs text-amber-400 px-1">Weak spot: {hole.label} (outlined).</div>
      ) : null}
    </div>
  );
}

/* On goal, wide, or into a shin pad. */
function AttemptBar({ s }) {
  const total = s.att || 0;
  if (!total) return null;
  const parts = [
    { label: "On goal", v: s.sog, c: "bg-sky-500" },
    { label: "Missed", v: s.miss, c: "bg-slate-500" },
    { label: "Blocked", v: s.blkd, c: "bg-amber-600" },
  ];
  return (
    <div className="space-y-1.5">
      <div className="flex h-3 rounded overflow-hidden border border-[#1e2b45]">
        {parts.map((p) => (
          <div key={p.label} className={p.c} style={{ width: `${(p.v / total) * 100}%` }} title={`${p.label}: ${p.v}`} />
        ))}
      </div>
      <div className="flex justify-between text-xs">
        {parts.map((p) => (
          <span key={p.label} className="text-slate-400">
            {p.label} <span className="text-slate-200 tnum">{p.v}</span>
            <span className="text-slate-500"> ({total ? Math.round((p.v / total) * 100) : 0}%)</span>
          </span>
        ))}
      </div>
      <div className="text-xs text-slate-500">{total} attempts</div>
    </div>
  );
}

/* A bar per game, so a hot streak and a cold one look different at a glance. */
function FormBars({ log, mode }) {
  if (!log || !log.length) return null;
  const val = (r) => (mode === "G" ? (r.sa ? r.sv / r.sa : 0) : (r.g || 0) + (r.a || 0));
  const vals = log.map(val);
  const max = Math.max(...vals, mode === "G" ? 1 : 1);
  const min = mode === "G" ? Math.min(...vals.filter((v) => v > 0), 0.8) : 0;
  const recent = log.slice(-40);
  return (
    <div className="space-y-1.5">
      <div className="flex items-end gap-[2px] h-12">
        {recent.map((r, i) => {
          const v = val(r);
          const h = mode === "G"
            ? clamp(((v - min) / Math.max(0.001, max - min)) * 100, 6, 100)
            : clamp((v / Math.max(1, max)) * 100, 4, 100);
          const win = r.gf > r.ga;
          return (
            <div key={i} className="flex-1 rounded-t"
              style={{ height: `${h}%`, background: win ? "#38bdf8" : "#475569", minWidth: 3 }}
              title={`day ${r.d + 1} · ${mode === "G" ? `${r.sv}/${r.sa}` : `${r.g}G ${r.a}A`} · ${r.gf}–${r.ga}`} />
          );
        })}
      </div>
      <div className="text-xs text-slate-500">
        last {recent.length} games · {mode === "G" ? "save percentage" : "points"} · blue is a win
      </div>
    </div>
  );
}

/* --------------------------------- honours ---------------------------------
 * Rings first, because that's how a career is actually measured, then the
 * individual awards grouped rather than listed one line per year — three MVPs
 * should read as "×3", not as three separate rows you have to count.
 * ------------------------------------------------------------------------- */

function TrophyCase({ G, p }) {
  const rings = p.rings || [];
  const stars = p.allStars || [];
  const byAward = {};
  (p.trophies || []).forEach((t) => {
    (byAward[t.award] = byAward[t.award] || []).push(t.year);
  });
  const awards = Object.entries(byAward).sort((a, b) => b[1].length - a[1].length);
  if (!rings.length && !stars.length && !awards.length) return null;

  return (
    <Section title="Trophy case" className="p-3">
      <div className="space-y-3 pt-1">
        {rings.length ? (
          <div>
            <div className="flex items-baseline gap-2">
              <span className="text-2xl font-bold text-amber-300 tnum">{rings.length}</span>
              <span className="text-sm text-slate-300">
                Cup{rings.length === 1 ? "" : "s"}
              </span>
            </div>
            <div className="flex flex-wrap gap-1.5 mt-1.5">
              {rings.map((r, i) => (
                <span key={i}
                  title={`${r.year} · ${G.teams[r.t] ? G.teams[r.t].city + " " + G.teams[r.t].name : ""}`}
                  className="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-xs
                    bg-amber-500/15 border border-amber-500/40 text-amber-200">
                  <span className="w-2 h-2 rounded-full border-2 border-amber-300 inline-block" />
                  {r.year}{G.teams[r.t] ? ` ${G.teams[r.t].abbr}` : ""}
                </span>
              ))}
            </div>
          </div>
        ) : null}

        {awards.length ? (
          <div className="space-y-1">
            {awards.map(([k, years]) => (
              <div key={k} className="flex items-baseline gap-2 text-sm">
                <span className="text-slate-200">{AWARD_LABEL[k] || k}</span>
                {years.length > 1 ? <span className="text-sky-300 font-semibold">×{years.length}</span> : null}
                <span className="text-slate-500 text-xs">{years.slice().sort().join(", ")}</span>
              </div>
            ))}
          </div>
        ) : null}

        {stars.length ? (
          <div className="flex items-baseline gap-2 text-sm">
            <span className="text-slate-200">All-Star</span>
            {stars.length > 1 ? <span className="text-sky-300 font-semibold">×{stars.length}</span> : null}
            <span className="text-slate-500 text-xs">{stars.slice().sort().join(", ")}</span>
          </div>
        ) : null}
      </div>
    </Section>
  );
}

/* ------------------------------- player page ------------------------------ */

/* What a scout could actually tell you about the man in the other net: how he's
   playing, how hard he's been worked, and — only once there's enough evidence to
   say so — where the pucks have been going in. */
function GoalieReport({ G, p }) {
  const r = goalieReport(G, p);
  const pct = (v) => `${(v * 100).toFixed(1)}`;
  const cellNote = (c, verb, tone) => (
    <span className={tone}>
      {verb} <b>{c.cell.label}</b>
      <span className="text-slate-500"> ({c.ga} on {c.sa}, {pct(c.rate)}%)</span>
    </span>
  );
  return (
    <div className="space-y-1.5">
      <div className="text-sm">
        <span className="text-slate-400">Likely starter </span>
        {fullName(p)}
        <span className="text-slate-500"> ({p.ovr} ovr, {r.fresh}% fresh)</span>
      </div>
      {r.starts ? (
        <div className="text-xs text-slate-400 flex flex-wrap gap-x-3 gap-y-1">
          <span>{r.starts} start{r.starts === 1 ? "" : "s"}</span>
          <span className="tnum">{pct(r.sv)} SV%</span>
          <span className="tnum">{r.gaa.toFixed(2)} GAA</span>
          <span className="tnum">{r.sa} shots faced</span>
        </div>
      ) : (
        <div className="text-xs text-slate-500">Hasn't played yet this season — nothing to go on.</div>
      )}
      {r.confidence < 0.4 && r.starts ? (
        <div className="text-xs text-slate-500">
          Too early to read him — {r.sa} shots isn't a pattern yet.
        </div>
      ) : r.soft || r.strong ? (
        <div className="text-xs space-y-0.5">
          {r.soft ? <div>{cellNote(r.soft, "Beaten most", "text-amber-300")}</div> : null}
          {r.strong ? <div>{cellNote(r.strong, "Rarely beaten", "text-emerald-300")}</div> : null}
        </div>
      ) : r.starts ? (
        <div className="text-xs text-slate-500">No clear weakness in the numbers — he's been even all over.</div>
      ) : null}
    </div>
  );
}

/* Where he came from, in one line. A founding player gets nothing rather than a
   claim the save can't support — see `draftOrigin`. */
function DraftLine({ G, p }) {
  const d = draftOrigin(G, p);
  if (!d) return null;
  if (d.kind === "undrafted") {
    return (
      <div className={`${card} px-3 py-2 text-xs text-slate-400`}>
        <span className="text-slate-500">Draft </span>
        Undrafted — signed as a free agent
      </div>
    );
  }
  /* First overall is worth saying out loud; so is the fact that a man is still
     with the club that took him, which most players aren't. */
  const headline = d.pick === 1 ? "1st overall" : `${ordinal(d.pick)} overall`;
  return (
    <div className={`${card} px-3 py-2 text-xs`}>
      <span className="text-slate-500">Drafted </span>
      <span className="text-slate-200 font-medium">{d.year}</span>
      <span className="text-slate-400"> · round {d.round}, </span>
      <span className={d.pick <= 5 ? "text-emerald-300 font-medium" : "text-slate-200"}>{headline}</span>
      {d.by ? (
        <>
          <span className="text-slate-400"> by </span>
          <span className="text-slate-200">{d.by.city} {d.by.name}</span>
          {d.stayed ? <span className="text-sky-300"> — never left</span> : null}
        </>
      ) : null}
      {d.junior ? <span className="text-slate-500"> · out of {d.junior}</span> : null}
    </div>
  );
}

function RatingBar({ label, v }) {
  return (
    <div className="flex items-center gap-2">
      <div className="w-10 text-[11px] uppercase text-slate-400">{label}</div>
      <div className="flex-1 h-2 bg-[#0d1728] rounded overflow-hidden border border-[#1e2b45]">
        <div className="h-full bg-sky-500" style={{ width: `${clamp(v, 0, 99)}%` }} />
      </div>
      <div className="w-7 text-right tnum text-xs text-slate-300">{v}</div>
    </div>
  );
}

/* Point shares as a number AND a bar, because the number alone doesn't say
   whether 6.8 was a good year. `split` draws the offensive and defensive halves
   in the same two colours the OPS and DPS columns use, so one glance says both
   how big the season was and what it was made of. A negative total — a real
   result for a fourth-liner who was on for nothing but goals against — draws
   nothing rather than an inverted bar, and keeps its minus sign on the number.
   Bars are clamped at the peak, never wider than the track. */
function ShareBar({ v, max, split }) {
  const val = v || 0;
  const width = (n) => `${clamp((n / Math.max(1, max)) * 100, 0, 100)}%`;
  return (
    <div className="flex items-center gap-1.5">
      <span className="tnum w-8 text-right text-slate-200">{val.toFixed(1)}</span>
      <div className="w-14 h-1.5 bg-[#0d1728] rounded overflow-hidden border border-[#1e2b45] flex">
        {val <= 0 ? null : split ? (
          <>
            <div className="h-full bg-sky-500" style={{ width: width(Math.max(0, split[0])) }} />
            <div className="h-full bg-emerald-500" style={{ width: width(Math.max(0, split[1])) }} />
          </>
        ) : <div className="h-full bg-sky-500" style={{ width: width(val) }} />}
      </div>
    </div>
  );
}

/* A young player's season is either developing him or wasting him, and until
   this existed the only way to find out was to hit the rollover and compare
   ratings — by which point the year is gone. This says it while there is still
   time to send him down or give him the minutes. */
function DevelopmentNote({ G, p }) {
  const weight = devAgeWeight(p.age);
  if (weight <= 0 || p.retired) return null;
  const nGp = (p.season && p.season.gp) || 0;
  const fGp = (p.farmSeason && p.farmSeason.gp) || 0;
  // A prospect who hasn't dressed anywhere while his club plays on is the
  // loudest case of all, so don't go quiet on him — only stay quiet before the
  // season has actually started.
  const clubGp = p.teamId != null && G.teams[p.teamId] ? G.teams[p.teamId].gp : 0;
  if (!nGp && !fGp && !clubGp) return null;
  const room = farmRoom(G, p);
  const env = devEnvironment(p, p.season, p.farmSeason, room);
  const read = nhlDevRead(p, p.season);
  const band =
    env >= DEV_FARM * 1.5 ? { t: "Thriving", bar: "bg-emerald-500", tone: "text-emerald-300" } :
    env >= DEV_FARM ? { t: "Developing well", bar: "bg-sky-500", tone: "text-sky-300" } :
    env >= DEV_FARM * 0.5 ? { t: "Getting by", bar: "bg-amber-500", tone: "text-amber-300" } :
    { t: "Going to waste", bar: "bg-rose-500", tone: "text-rose-300" };
  // Why it reads the way it does, in the terms the player actually controls.
  const why = [];
  if (nGp) {
    const mins = p.season.toi / nGp;
    why.push(p.pos === "G"
      ? `${nGp} start${nGp === 1 ? "" : "s"} at ${(svPct(p.season) * 100).toFixed(1)} SV%`
      : `${nGp} NHL game${nGp === 1 ? "" : "s"} at ${mins.toFixed(1)} min`);
  }
  if (fGp) {
    // Say what KIND of farm season it is, not just how many games — the room is
    // worth real progression now, and it's a thing the user can act on.
    const edge = room ? room.pct - room.mean : 0;
    const kind = !room ? "" : room.title ? ", champions" : edge > 0.06 ? ", a winning side"
      : edge < -0.06 ? ", a losing side" : "";
    why.push(`${fGp} on the farm${kind}`);
  }
  if (!nGp && !fGp) why.push(`no games · his club has played ${clubGp}`);
  // Order matters: "in over his head" is only true of a player drowning in BIG
  // minutes. A third-liner who isn't scoring is a different problem, and telling
  // the user to cut his ice time would be the wrong call.
  const advice = !nGp && !fGp
      ? "He hasn't dressed all season — that's a year of his development gone. Play him or send him down."
    : !nGp ? "Farm minutes are steady, if unspectacular."
    : read.role < 0.35 ? "He isn't playing enough to learn anything — more ice time, or send him down."
    : read.perf < -0.35 && read.role >= 0.7 ? "He's in over his head at these minutes."
    : read.perf < -0.35 ? "He isn't holding his own in this role — he'd learn more on the farm."
    : env >= DEV_FARM ? "These are the minutes that make a player."
    : "A bigger role would be worth more to him than this.";
  return (
    <Section title="Development" className="p-3 space-y-2"
      right={<span className={`text-xs ${band.tone}`}>{band.t}</span>}>
      <div className="pt-1 space-y-2">
        <div className="h-2 bg-[#0d1728] rounded overflow-hidden border border-[#1e2b45]">
          <div className={`h-full ${band.bar}`} style={{ width: `${clamp((env / DEV_NHL_HI) * 100, 2, 100)}%` }} />
        </div>
        <div className="text-xs text-slate-400">{why.join(" · ")}</div>
        <div className="text-xs text-slate-300">{advice}</div>
        {weight < 1 ? (
          <div className="text-[11px] text-slate-500">
            At {p.age} this matters less than it used to — development is mostly settled by 26.
          </div>
        ) : null}
      </div>
    </Section>
  );
}

function PlayerModal({ G, pid, onClose, onGo }) {
  const [netView, setNetView] = useState("dots");
  const p = G.players[pid];
  if (!p) return null;
  const isG = p.pos === "G";
  const t = p.teamId != null ? G.teams[p.teamId] : null;
  const keys = isG ? GOALIE_KEYS : SKATER_KEYS;
  const career = (p.career || []);
  const totals = career.reduce((a, c) => {
    Object.keys(c).forEach((k) => { if (typeof c[k] === "number" && k !== "year" && k !== "teamId") a[k] = (a[k] || 0) + c[k]; });
    return a;
  }, {});
  const cShares = careerShares(p);
  /* Every bar in the table is drawn against his OWN best season, not a league
     scale — the question a career table answers is which of his years was the
     big one, and a fixed scale makes a fourth-liner's whole career one flat
     line. Floored so a modest career doesn't render as a full bar every row. */
  const psPeak = Math.max(4, ...career.map((c) => lineShares(c).ps));

/* Picking a club used to be the one decision in the game made with no
   information at all — a dropdown of thirty-two names. This shows the actual
   league you're about to manage.
 *
 * It is a REAL league, not a mock-up: `newGame` never reads `userTeam` or
 * `difficulty` while generating the world, only the seed, so a preview built on
 * seed S is exactly the league you get when you start a career on seed S. The
 * seed is threaded through to `onStart` to keep that promise — change that and
 * the preview becomes a lie. */
// 1st/2nd/3rd/4th … and the teens, which are the case a naive version gets
// wrong: 11th, 12th, 13th, and then 21st again.
function ordinal(n) {
  const rem100 = n % 100, rem10 = n % 10;
  const suffix = rem100 >= 11 && rem100 <= 13 ? "th"
    : rem10 === 1 ? "st" : rem10 === 2 ? "nd" : rem10 === 3 ? "rd" : "th";
  return `${n}${suffix}`;
}

function clubSummary(G, teamId) {
  const nhl = rosterOf(G, teamId);
  const org = rosterOf(G, teamId, true);
  const sorted = nhl.slice().sort((a, b) => b.ovr - a.ovr);
  const young = org.filter((p) => p.age <= 23);
  const rating = teamStrength(G, teamId);
  return {
    t: G.teams[teamId], id: teamId, rating,
    best: sorted[0],
    goalie: nhl.filter((p) => p.pos === "G").sort((a, b) => b.ovr - a.ovr)[0],
    age: nhl.length ? nhl.reduce((s, p) => s + p.age, 0) / nhl.length : 0,
    space: capSpace(G, teamId),
    // The gap between what a club is now and what's coming is what separates a
    // rebuild worth taking from a contender about to fall off a cliff.
    prospects: young.length,
    future: young.length ? Math.round(young.reduce((s, p) => s + p.pot, 0) / young.length) : 0,
    coach: coachOf(G.teams[teamId]),
    /* Quartiles MEASURED off generated worlds (256 clubs over 8 seeds): the
       spread runs 50–79 with a median of 65 and quartiles at 61/65/68. Guessed
       thresholds had every club in the league reading "Contender".
       RE-MEASURE THESE whenever team generation changes — narrowing the tier
       spread moved every one of them. */
    outlook: rating >= 68 ? { t: "Contender", c: "text-emerald-300" }
      : rating >= 65 ? { t: "Playoff side", c: "text-sky-300" }
      : rating >= 61 ? { t: "Bubble", c: "text-slate-300" }
      : { t: "Rebuild", c: "text-amber-300" },
  };
}

function ClubRosterPreview({ G, teamId, openPlayer }) {
  const org = rosterOf(G, teamId, true).slice().sort((a, b) => (a.farm ? 1 : 0) - (b.farm ? 1 : 0) || b.ovr - a.ovr);
  return (
    <SortTable min={560} rowKey={(p) => p.id} onRow={openPlayer ? (p) => openPlayer(p.id) : undefined}

        { key: "n", label: "Player", get: (p) => fullName(p),

        { key: "age", label: "Age", get: (p) => p.age, asc: true },

}

/* -------------------------------- roster ---------------------------------- */

// Points in the last stretch, used for the hot/cold flag.
function formOf(G, p) {
  if (!p.season.gp) return 0;
  return pts(p.season) / p.season.gp;
}
/* -------------------------------- honours ---------------------------------
 * A name on a table is just a name. These marks say, wherever the player turns
 * up, that the league is currently arguing about him: a filled star for a
 * trophy won, a hollow one for a place on a ballot, and a chip for an All-Star
 * selection.
 *
 * THE BALLOTS ARE COMPUTED LIVE DURING THE SEASON. Awards are only decided at
 * `endRegularSeason`, so keying this off `G.awards` alone would mean the marks
 * appeared the moment they stopped being interesting — the whole point is to
 * see who is in the running in February. `voteAwards` is pure (no `rnd`, no
 * mutation), so running it from a render is safe; it is the SAME function that
 * decides the real thing in April, so a name marked as leading the Hart is
 * leading the actual Hart ballot, not a lookalike.
 *
 * Cached in a WeakMap keyed on `G` itself. Every state change replaces `G` with
 * a fresh deep clone, so the cache invalidates on its own and can never serve a
 * stale ballot — and one pass over the league is shared by every row on screen
 * instead of being redone per name.
 * ------------------------------------------------------------------------- */
const BALLOT_CACHE = new WeakMap();
const HONOUR_MIN_GP = 20;   // before this a "leader" is just whoever started hot

function seasonBallots(G) {
  // Once the vote is real, it IS the answer.
  if (G.awards && G.awards.votes) return { votes: G.awards.votes, winners: G.awards, live: false };
  if (!G.teams.some((t) => (t.gp || 0) >= HONOUR_MIN_GP)) return null;
  const hit = BALLOT_CACHE.get(G);
  if (hit !== undefined) return hit;
  let out = null;
  try {
    const A = voteAwards(G, awardPool(G), G.year);
    out = { votes: A.votes, winners: A, live: true };
  } catch (e) { out = null; }
  BALLOT_CACHE.set(G, out);
  return out;
}

/* What this player is up for, right now. Returns null when there's nothing to
   say, so callers can render nothing without a wrapper. */
function honoursOf(G, p) {
  if (!p || p.retired) return null;
  const B = seasonBallots(G);
  const won = [], up = [];
  if (B) {
    Object.entries(B.votes || {}).forEach(([k, rows]) => {
      if (!rows.some((v) => v.id === p.id)) return;
      if (B.winners[k] === p.id) won.push(k); else up.push(k);
    });
  }
  const allStar = (p.allStars || []).includes(G.year);
  if (!won.length && !up.length && !allStar) return null;
  return { won, up, allStar, live: !!(B && B.live) };
}

function HonourMark({ G, p }) {
  const h = honoursOf(G, p);
  if (!h) return null;
  const name = (k) => AWARD_LABEL[k] || k;
  return (
    <>
      {h.won.length ? (
        <span className="ml-1 text-[10px] text-amber-300"
          title={`${h.live ? "leading" : "won"}: ${h.won.map(name).join(", ")}`}>
          ★{h.won.length > 1 ? h.won.length : ""}
        </span>
      ) : null}
      {h.up.length ? (
        <span className="ml-1 text-[10px] text-sky-400"
          title={`${h.live ? "in the running" : "on the ballot"}: ${h.up.map(name).join(", ")}`}>
          ☆{h.up.length > 1 ? h.up.length : ""}
        </span>
      ) : null}
      {h.allStar ? (
        <span className="ml-1 text-[9px] px-1 rounded bg-sky-500/20 text-sky-300 align-middle"
          title={`All-Star, ${G.year}`}>AS</span>
      ) : null}
    </>
  );
}

function HotCold({ G, p }) {
  const rate = formOf(G, p);
  if (!p.season.gp || p.season.gp < 5) return null;
  if (rate >= 0.9) return <span className="ml-1.5 text-[10px] text-orange-300" title="on a tear">🔥</span>;
  if (rate <= 0.18) return <span className="ml-1.5 text-[10px] text-sky-300" title="ice cold">❄</span>;
  return null;
}

/* The affiliate as a club you follow rather than a spreadsheet that ticks over:
   where it sits, who's carrying it, and what it's playing for. */
/* Your affiliate's season as a set of games rather than a points total: what
   it just played, what it plays next, and how the rest of the league did last
   night. The fixtures aren't stored anywhere — the farm mirrors the parent
   schedule, so they're read straight off `G.schedule`. */
function FarmGames({ G }) {
  const mine = G.teams[G.userTeam];
  const log = (mine.farmLog || []).slice().reverse();
  const next = farmFixtures(G, G.userTeam, 5);
  const night = G.farmDay;
  const res = (r) => (r.gf > r.ga ? "W" : r.so ? "SOL" : r.ot ? "OTL" : "L");
  const tone = (r) => (r.gf > r.ga ? "text-emerald-400" : r.ot || r.so ? "text-amber-300" : "text-rose-400");
  return (
    <div className="space-y-3">
      <Section title="Results" right={<span className="text-xs text-slate-500">{log.length} played</span>}>
        {log.length ? (
          <div className="max-h-72 overflow-y-auto">
            {log.map((r, i) => (
              <div key={i} className="flex items-center gap-2 px-3 py-1.5 border-b border-[#16223a] last:border-0 text-sm">
                <span className="text-slate-500 tnum w-12 text-xs">Day {r.d + 1}</span>
                <span className={`w-9 font-semibold text-xs ${tone(r)}`}>{res(r)}</span>
                <span className="flex-1 truncate">

                </span>

                {r.so ? <span className="text-[10px] text-slate-500">SO</span>

      <Section title="Coming up" className="p-3">
        <div className="pt-1 space-y-1">
          {next.length ? next.map((f, i) => (
            <div key={i} className="flex items-center gap-2 text-sm">
              <span className="text-slate-500 tnum w-12 text-xs">Day {f.d + 1}</span>
              <span className="flex-1 truncate">
                <span className="text-slate-500">{f.home ? "vs" : "at"} </span>
                {G.teams[f.opp].city} {G.teams[f.opp].name}
              </span>
              <span className="tnum text-xs text-slate-500">{farmRec(G.teams[f.opp]).pts} pts</span>
            </div>
          )) : <div className="text-sm text-slate-500">No fixtures left this season.</div>}
        </div>
      </Section>

      {night && night.games.length ? (
        <Section title={`Around the league — day ${night.day + 1}`} className="p-3">
          <div className="pt-1 grid sm:grid-cols-2 gap-x-4 gap-y-1">
            {night.games.map((g, i) => (
              <div key={i} className={`flex items-center gap-2 text-xs
                ${g.h === G.userTeam || g.a === G.userTeam ? "text-sky-300" : "text-slate-400"}`}>
                <span className="flex-1 truncate">{G.teams[g.a].abbr} at {G.teams[g.h].abbr}</span>
                <span className="tnum">{g.ag}–{g.hg}</span>
                <span className="w-5 text-[10px] text-slate-500">{g.so ? "SO" : g.ot ? "OT" : ""}</span>
              </div>
            ))}
          </div>
        </Section>
      ) : null}
    </div>
  );
}

function FarmLeaguePanel({ G, openPlayer }) {
  const [view, setView] = useState("squad");
  const mine = G.teams[G.userTeam];
  const rec = farmRec(mine);
  const table = farmStandings(G);
  const rank = table.findIndex((t) => t.id === G.userTeam) + 1;
  const squad = rosterOf(G, G.userTeam, true).filter((p) => p.farm);
  const pts = (p) => (p.farmSeason ? (p.farmSeason.g || 0) + (p.farmSeason.a || 0) : 0);
  // League-wide, so you can see whether your prospect is actually any good or
  // just the best of a bad affiliate.
  const leaders = playersOf(G)
    .filter((p) => p.farm && p.farmSeason && p.farmSeason.gp > 0 && p.pos !== "G")
    .sort((a, b) => pts(b) - pts(a) || b.farmSeason.g - a.farmSeason.g).slice(0, 10);
  const cup = G.farmCup;

  return (
    <div className="space-y-3">
      <div className="grid grid-cols-2 sm:grid-cols-4 gap-2">
        <Stat label="Affiliate" value={`${rec.w}-${rec.l}-${rec.otl}`} sub={`${rec.pts} pts`} />
        <Stat label="In the table" value={rank ? ordinal(rank) : "—"} sub={`of ${G.teams.length}`} />
        <Stat label="Goals" value={`${rec.gf}–${rec.ga}`} sub={rec.gp ? `${(rec.gf / rec.gp).toFixed(2)} per game` : "no games yet"} />
        <Stat label="Farm titles" value={mine.farmCups || 0}
          sub={cup && cup.champion === G.userTeam ? "champions this year" : "all time"} />
      </div>

      {cup ? (
        <Section title={`${cup.year} farm championship`}
          right={<span className={`text-xs ${cup.champion === G.userTeam ? "text-emerald-300" : "text-slate-400"}`}>
            {G.teams[cup.champion].city} {G.teams[cup.champion].name}
          </span>} className="p-3">
          <div className="pt-1 space-y-1">
            {cup.rounds.map((rd, i) => (
              <div key={i} className="text-xs text-slate-400">
                <span className="text-slate-500">{["Quarter-finals", "Semi-finals", "Final"][i] || `Round ${i + 1}`}: </span>
                {rd.map((s) => `${G.teams[s.winner].abbr} over ${G.teams[s.winner === s.hi ? s.lo : s.hi].abbr}`).join(" · ")}
              </div>
            ))}
          </div>
        </Section>
      ) : null}

      <div className="flex gap-2 flex-wrap">
        {[["squad", "Your prospects"], ["games", "Games"], ["table", "Farm table"], ["leaders", "Scoring leaders"]].map(([k, label]) => (
          <button key={k} className={view === k ? btnPri : btnGhost} onClick={() => setView(k)}>{label}</button>
        ))}
      </div>

      {view === "squad" ? (
        <Section title="Prospect development" className="p-3">
          <div className="space-y-1 pt-1">
            {squad.length ? squad.slice().sort((a, b) => b.pot - a.pot).map((p) => (
              <div key={p.id} className="flex items-center gap-2 text-sm cursor-pointer hover:text-sky-300"
                onClick={() => openPlayer(p.id)}>
                <PosBadge pos={p.pos} />
                <span className="flex-1 truncate">{shortName(p)} <span className="text-slate-500">({p.age})</span></span>
                <span className="tnum text-slate-400">{p.ovr} → {p.pot}</span>
                <span className="tnum text-slate-500 w-28 text-right">
                  {!p.farmSeason ? "—" : p.pos === "G"
                    ? `${p.farmSeason.w || 0}-${p.farmSeason.l || 0}${p.farmSeason.sa ? ` ${((p.farmSeason.sv / p.farmSeason.sa) * 100).toFixed(1)}` : ""}`
                    : `${p.farmSeason.gp}gp ${p.farmSeason.g}G ${p.farmSeason.a}A`}
                </span>
                {prospectReady(G, p) ? <span className="text-emerald-400 text-xs">ready</span> : null}
              </div>
            )) : <div className="text-sm text-slate-500">Nobody on the farm.</div>}
          </div>
        </Section>
      ) : view === "games" ? (
        <FarmGames G={G} />
      ) : view === "table" ? (
        <Section>
          {/* keyed per view: React reuses one SortTable across these branches,
              and its remembered sort column carried over to a table that has no
              such column — which silently fell back to sorting by name. */}
          <SortTable key="farm-table" min={620} rowKey={(t) => t.id} rows={table} initial="pts"
            rowCls={(t) => (t.id === G.userTeam ? "bg-sky-950/50" : "")}
            cols={[
              { key: "club", label: "Affiliate", get: (t) => `${t.city} ${t.name}`,
                cell: (t) => <span className="whitespace-nowrap">{t.city} {t.name}</span> },
              { key: "gp", label: "GP", get: (t) => farmRec(t).gp },
              { key: "w", label: "W", get: (t) => farmRec(t).w },

              { key: "otl", label: "OTL", get: (t) => farmRec(t).otl },
              { key: "pts", label: "Pts", get: (t) => farmRec(t).pts, cell: (t) => <b>{farmRec(t).pts}</b> },
              { key: "gf", label: "GF", get: (t) => farmRec(t).gf },

      ) : (
        <Section>
          <SortTable key="farm-leaders" min={560} rowKey={(p) => p.id} rows={leaders} initial="p"
            onRow={(p) => openPlayer(p.id)}
            rowCls={(p) => (p.teamId === G.userTeam ? "bg-sky-950/50" : "")}
            cols={[
              { key: "n", label: "Player", get: (p) => fullName(p),
                cell: (p) => <span className="whitespace-nowrap">{fullName(p)}</span> },
              { key: "tm", label: "Affiliate", get: (p) => (p.teamId != null ? G.teams[p.teamId].abbr : ""),
                cls: "text-slate-400" },
              { key: "pos", label: "Pos", get: (p) => p.pos, cell: (p) => <PosBadge pos={p.pos} /> },
              { key: "age", label: "Age", get: (p) => p.age, asc: true },
              { key: "gp", label: "GP", get: (p) => p.farmSeason.gp },
              { key: "g", label: "G", get: (p) => p.farmSeason.g },
              { key: "a", label: "A", get: (p) => p.farmSeason.a },
              { key: "p", label: "P", get: (p) => pts(p), cell: (p) => <b>{pts(p)}</b> },
            ]} empty="No scoring yet." />
        </Section>
      )}
    </div>
  );
}

function RosterTab({ G, setG, openPlayer, notify }) {
  const [showFarm, setShowFarm] = useState(false);
  const upd = (fn) => { const g2 = migrate(JSON.parse(JSON.stringify(G))); const r = fn(g2); setG(g2); return r; };
  const roster = rosterOf(G, G.userTeam, true).filter((p) => (showFarm ? p.farm : !p.farm));
  const hit = capHit(G, G.userTeam), space = capSpace(G, G.userTeam);
  const dead = retainedBy(G, G.userTeam);

  const move = (p) => {
    if (p.farm) {
      const r = upd((g) => recall(g, p.id));
      notify(r.ok ? `${fullName(p)} recalled.` : r.why);
    } else {
      const r = upd((g) => sendDown(g, p.id));
      notify(!r.ok ? r.why : `${fullName(p)} sent to the farm.`);
    }
  };

  const cut = (p) => {
    const cost = releaseCost(G, p.id);
    if (!window.confirm(
      `Release ${fullName(p)}?\n\nHe goes on waivers first — another club can claim him and take the contract. `
      + `If he clears, he's a free agent and you carry $${cost}M in dead cap for ${Math.max(1, p.contract.yrs)} more year`
      + `${Math.max(1, p.contract.yrs) === 1 ? "" : "s"}.`)) return;
    const r = upd((g) => releasePlayer(g, p.id));
    notify(r.ok ? `${fullName(p)} placed on waivers for release.` : r.why);
  };

  /* Ending a fringe contract outright. No waivers, so the roster spot is free
     immediately — which is the whole point when the reason you're doing it is
     that you have no room. */
  const letGo = (p) => {
    const inSeason = G.phase === "regular" || G.phase === "playoffs";
    const cost = releaseCost(G, p.id);
    const yrs = Math.max(1, p.contract.yrs);
    if (!window.confirm(
      `Cut ${fullName(p)}?\n\nHis contract ends now and he goes straight into the free-agent pool — `
      + `no waivers, and the roster spot is free immediately.\n\n`
      + (inSeason
        ? `You'll carry $${cost}M in dead cap for ${yrs} more year${yrs === 1 ? "" : "s"}.`
        : `It's the offseason, so this costs you nothing.`))) return;
    const r = upd((g) => terminateContract(g, p.id));
    notify(r.ok
      ? (r.dead ? `${fullName(p)} cut — $${r.dead}M dead for ${r.yrs} year${r.yrs === 1 ? "" : "s"}.`
                : `${fullName(p)} cut.`)
      : r.why);
  };

  // Re-signing your own. The ask is the loyalty-discounted number, so this is
  // simply "meet it" — haggling lives in the negotiation screen for free agents.
  const resign = (p, yrs) => {
    const ask = extensionAsk(G, p.id, G.userTeam, yrs);
    const r = upd((g) => extendPlayer(g, p.id, ask, yrs));
    notify(r.ok ? `${fullName(p)} re-signed — $${ask}M × ${yrs}.` : (r.why || "he said no"));
  };
  const expiring = rosterOf(G, G.userTeam, true).filter((p) => canExtend(G, p))
    .sort((a, b) => b.ovr - a.ovr);

  const cols = [
    { key: "name", label: "Player", get: (p) => p.ln, min: 1,
      cell: (p) => (
        <span className="whitespace-nowrap">
          {fullName(p)}
          {p.inj <= 0 && p.rust > 0
            ? <span className="ml-1 text-[10px] text-amber-400" title={`Back from injury — ${p.rust} games to full sharpness`}>rusty</span>
            : null}
          <HotCold G={G} p={p} />
          <HonourMark G={G} p={p} />
          {hasNtc(p) ? <span className="ml-1.5 text-[10px] text-amber-300" title="no-trade clause">NTC</span> : null}
          {p.inj > 0 ? <span className="ml-1.5 text-[10px] text-rose-400">INJ {p.inj}</span> : null}
          {(G.waivers || []).some((w) => w.pid === p.id) ? <span className="ml-1.5 text-[10px] text-sky-300">on waivers</span> : null}
        </span>
      ) },
    { key: "pos", label: "Pos", get: (p) => POS.indexOf(p.pos), cell: (p) => <PosBadge pos={p.pos} /> },
    { key: "age", label: "Age", get: (p) => p.age },
    { key: "ovr", label: "Ovr", get: (p) => p.ovr, cls: "font-semibold" },
    { key: "pot", label: "Pot", get: (p) => p.pot, cls: "text-slate-400" },
    { key: "gp", label: "GP", get: (p) => p.season.gp },
    { key: "g", label: "G", get: (p) => (p.pos === "G" ? p.season.w : p.season.g),
      cell: (p) => (p.pos === "G" ? p.season.w : p.season.g) },
    { key: "a", label: "A", get: (p) => (p.pos === "G" ? p.season.so : p.season.a),
      cell: (p) => (p.pos === "G" ? p.season.so : p.season.a) },
    { key: "p", label: "P / SV%", get: (p) => (p.pos === "G" ? svPct(p.season) * 100 : pts(p.season)),
      cls: "font-semibold",
      cell: (p) => (p.pos === "G" ? (p.season.sa ? (svPct(p.season) * 100).toFixed(1) : "—") : pts(p.season)) },
    { key: "pm", label: "+/-", get: (p) => (p.pos === "G" ? 0 : p.season.pm),
      cell: (p) => (p.pos === "G" ? "—" : `${p.season.pm > 0 ? "+" : ""}${p.season.pm}`) },
    { key: "cap", label: "Cap", get: (p) => effectiveCap(G, p), cell: (p) => `$${effectiveCap(G, p)}M` },
    { key: "yrs", label: "Yrs", get: (p) => p.contract.yrs },
    { key: "act", label: "", get: () => 0, cell: (p) => (
      <button className="text-xs text-sky-400 hover:underline"
        onClick={(e) => { e.stopPropagation(); move(p); }}>
        {p.farm ? "Recall" : "Send down"}
      </button>
    ) },
    /* Two different things, and conflating them is what made the bottom of a
       roster impossible to clear. Waivers are for a player somebody else might
       want; a fringe contract can just be ended. */
    { key: "cut", label: "", get: () => 0, cell: (p) => (
      canTerminate(G, p) ? (
        <button className={`${btnGhost} text-xs px-2 py-1 text-rose-300 hover:text-rose-200 whitespace-nowrap`}
          title={`End his contract outright — no waivers, the spot is free straight away${
            G.phase === "regular" || G.phase === "playoffs"
              ? `, and you carry $${releaseCost(G, p.id)}M dead for ${Math.max(1, p.contract.yrs)} year${Math.max(1, p.contract.yrs) === 1 ? "" : "s"}`
              : " and it costs nothing in the offseason"}`}
          onClick={(e) => { e.stopPropagation(); letGo(p); }}>
          Cut
        </button>
      ) : (
        <button className={`${btnGhost} text-xs px-2 py-1 text-rose-300 hover:text-rose-200`}
          title="He's paid too much to simply cut — he has to clear waivers first"
          onClick={(e) => { e.stopPropagation(); cut(p); }}>
          Release
        </button>
      )
    ) },
  ];

  return (
    <div className="space-y-3">
      <div className="grid grid-cols-2 sm:grid-cols-4 gap-2">
        <Stat label="Cap hit" value={`$${hit}M`} sub={`of $${rules(G).capAmount}M`} />
        <Stat label="Cap space" value={`$${space}M`} tone={space < 0 ? "text-rose-400" : ""}
          sub={dead.length ? `$${round1(dead.reduce((s, r) => s + r.amt, 0))}M retained` : "available"} />
        <Stat label="Roster" value={rosterOf(G, G.userTeam).length} sub={`max ${ROSTER_MAX}`} />
        <Stat label="Team rating" value={teamStrength(G, G.userTeam)} sub="top 18 average" />
      </div>
      <div className="flex gap-2 flex-wrap">
        <button className={showFarm ? btnGhost : btnPri} onClick={() => setShowFarm(false)}>NHL roster</button>
        <button className={showFarm ? btnPri : btnGhost} onClick={() => setShowFarm(true)}>
          Farm{rosterOf(G, G.userTeam, true).filter((p) => p.farm && prospectReady(G, p)).length
            ? ` · ${rosterOf(G, G.userTeam, true).filter((p) => p.farm && prospectReady(G, p)).length} ready` : ""}
        </button>
      </div>
      {expiring.length ? (
        <Section title="Contract talks"
          right={<span className="text-xs text-slate-400">
            {expiring.filter((p) => p.contract.yrs <= 1).length} expiring
            {expiring.filter((p) => p.contract.yrs > 1).length
              ? ` · ${expiring.filter((p) => p.contract.yrs > 1).length} open early` : ""}
          </span>}
          className="p-3">
          <div className="space-y-1.5 pt-1">
            <div className="text-xs text-slate-500">
              Re-sign them now and they stay. Let them run out and they hit the market with everyone else.
              You can open talks with {EXTEND_EARLY_MAX} years still to run — but a player being asked to tear
              up a signed deal charges about {Math.round(EXTEND_EARLY_PREMIUM * 100)}% more for every year he
              gives up. The buttons are the TOTAL length of the new deal.
            </div>
            {expiring.map((p) => {
              const left = p.contract.yrs;
              const early = extendEarlyYears(p);
              /* Only terms that actually extend him. Offering a man with three
                 years left a "2 year" deal is a pay cut in disguise, and
                 `extendPlayer` refuses it anyway. */
              const terms = [2, 4, 6].filter((y) => y > left);
              return (
                <div key={p.id} className="flex items-center gap-2 text-sm flex-wrap">
                  <PosBadge pos={p.pos} />
                  <span className="cursor-pointer hover:text-sky-300" onClick={() => openPlayer(p.id)}>
                    {shortName(p)} <span className="text-slate-500">({p.age}, {p.ovr})</span>
                  </span>
                  {p.farm ? <span className="text-[10px] text-slate-500">farm</span> : null}
                  <span className={`text-[10px] ${left <= 1 ? "text-amber-300" : "text-slate-500"}`}>
                    {left <= 1 ? "expiring" : `${left}y left · +${Math.round(early * EXTEND_EARLY_PREMIUM * 100)}% early`}
                  </span>
                  <span className="flex-1" />
                  <span className="text-[10px] text-slate-600">${effectiveCap(G, p)}M now</span>
                  {terms.map((y) => (
                    <button key={y} className={`${btnGhost} text-xs px-2 py-1 whitespace-nowrap`}
                      title={`${y} years in total — ${y - left} new on top of the ${left} he has left`}
                      onClick={() => resign(p, y)}>
                      {y}y · ${extensionAsk(G, p.id, G.userTeam, y)}M
                    </button>
                  ))}
                </div>
              );
            })}
          </div>
        </Section>
      ) : null}
      {dead.length ? (
        <div className={`${card} p-3 text-sm`}>
          <span className="text-slate-400">Money owed to players elsewhere: </span>
          {dead.map((r) => `${G.players[r.pid] ? shortName(G.players[r.pid]) : "?"} $${r.amt}M (${r.yrs}y${r.dead ? ", released" : " retained"})`).join(" · ")}
        </div>
      ) : null}
      <Section>
        <SortTable min={860} cols={cols} rows={roster} initial="ovr" rowKey={(p) => p.id}
          onRow={(p) => openPlayer(p.id)}
          rowCls={(p) => (prospectReady(G, p) && p.farm ? "bg-emerald-950/30" : "")}
          empty={showFarm ? "Nobody on the farm." : "No players."} />
      </Section>
      {showFarm ? <FarmLeaguePanel G={G} openPlayer={openPlayer} /> : null}
    </div>
  );
}
